    async function loadOdptLines(name) {
      const k = placeKey(name);
      if (!k || k in odptLineIdx) return odptLineIdx[k];
      odptLineIdx[k] = [];                     // 二重に引かない
      try {
        const sts = await ttStationsByName(name);
        const out = [];
        for (const s2 of (sts || []).slice(0, 12)) {
          const rw = await ttRailway(s2.railway);
          if (rw && rw.title && !out.includes(rw.title)) out.push(rw.title);

      } catch { odptLineIdx[k] = []; }

    /* ---- バス停を通る系統 ----

    const busLineIdx = reactive({});           // 停留所名 → 系統名の配列
    /* その停留所を通る系統。時刻表データ（都営など）＋徳島のバス停データ */
    function busRoutesAt(name) {
      const out = (busLineIdx[placeKey(name)] || []).slice();
      tbStops(name).forEach(r => r.routes.forEach(l => {

    async function loadBusRoutes(name) {
      const k = placeKey(name);

      busLineIdx[k] = [];

          for (const pid of (pole.routes || []).slice(0, 24)) {

            /* その乗り場が終点の系統は、ここからは乗れない */
            const at = r.order.findIndex(x => x.id === pole.id);

    function busRouteName(title) {
      const t = String(title || '').trim();
      if (!t) return '';
      const m = t.match(/^([^\s\[（(]+)/);

    }

    /* ふたつの路線がつながっている駅（直通の乗り入れ口）を探す。

    function junctionOf(lineA, lineB) {
      const a = railIdx.line[lineA], b = railIdx.line[lineB];
      if (!a || !b || !a.length || !b.length) return '';
      const setB = new Set(b);
      /* 端の駅から見ていくと、乗り入れ口に当たりやすい */
      for (const nm of [a[a.length - 1], a[0], ...a]) if (setB.has(nm)) return nm;
      return '';
    }
    /* 次の駅が乗っている路線のうち、いまの路線とつながっているもの */
    function throughTo(apiA, nextLines) {
      for (const l of (nextLines || [])) {
        const j = junctionOf(apiA, l);
        if (j) return { line: l, junction: j };
      }
      return null;
    }

    /* ---- 2点間の距離（km）と、速さの上限 ---- */
    function distKm(a, b) {
      if (!a || !b) return null;
      const R = 6371, rad = Math.PI / 180;
      const dLat = (b.y - a.y) * rad, dLon = (b.x - a.x) * rad;
      const s1 = Math.sin(dLat / 2) ** 2 +
        Math.cos(a.y * rad) * Math.cos(b.y * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(s1)));
    }
    const SPEED_MAX = { walk: 9, bus: 95, taxi: 100, car: 120, ship: 70, plane: 950, train: 200 };
    const speedLimit = (ev, line) => (ev && ev.type === 'train' && /新幹線/.test(line || '')) ? 360 : (SPEED_MAX[ev && ev.type] || 200);

    /* ---- 経路に必要なデータをまとめて引く（入力のたびに走る） ---- */
    let netLoadTimer = 0;
    function refreshRailData() {
      clearTimeout(netLoadTimer);
      netLoadTimer = setTimeout(async () => {
        netState.warming = true;
        try {
        const names = new Set(), lines = new Set();
        state.days.forEach(d => d.events.forEach(e => routeStops(e).forEach(st => {
          if (st.name) names.add(st.name.trim());
        })));
        for (const n of names) {
          const info = await loadStation(n);
          if (info && info.lines) info.lines.forEach(l => lines.add(l));
        }
        /* 時刻表データ側の路線名も引く（駅データに無い新しい路線を拾うため） */
        for (const n of names) await loadOdptLines(n);
        /* バスの移動は、停留所を通る系統を引いておく */
        const busNames = new Set();
        state.days.forEach(d => d.events.forEach(e => {
          if (e.type !== 'bus') return;
          routeStops(e).forEach(st => { if (st.name) busNames.add(st.name.trim()); });
        }));
        for (const n of busNames) await loadBusRoutes(n);
        /* 「移動が入っていない」の判定に使う、地点の座標 */
        const places = new Set();
        state.days.forEach(d => d.events.forEach(e => {
          ['start', 'end'].forEach(w => { const p = placeOf(e, w); if (p) places.add(p); });
        }));
        /* 予定の場所は、ひとつ前に決まった地点を手がかりにする。
           同じ名前のチェーン店・施設が各地にあるので、近いものが選ばれるようにする */
        let hint = null;
        for (const p of places) {
          if (!(placeKey(p) in railIdx.place)) await loadPlace(p, hint);
          const pos = placePos(p);
          if (pos) hint = pos;
        }
        /* 経路の駅・停留所そのものも、駅データに無ければ地図で引く。
           バス停は同じ名前が全国にあるので（医学部前・市役所前…）、
           となりの地点を手がかりに、その周りだけを探す。
           前から一度・後ろから一度たどるので、先頭が曖昧でも次の地点から決まる */
        for (const d of state.days) {
          for (const e of d.events) {
            const stops = routeStops(e).filter(st => st.name);
            if (stops.length < 1) continue;
            const known = (nm) => { const i2 = stationInfo(nm); return !!(i2 && i2.found); };
            const walk = async (list) => {
              let hint = null;
              for (const st of list) {
                const nm = st.name.trim();
                if (known(nm)) { const p = posNear(nm, hint); if (p) hint = p; continue; }
                const cur = placePos(nm);
                /* まだ引いていない、または「となりから遠い」ときだけ引き直す */
                const far = cur && hint && (distKm(hint, cur) || 0) > 60;
                if (!(placeKey(nm) in railIdx.place) || far) await loadPlace(nm, hint);
                const p = posNear(nm, hint);
                if (p) hint = p;
              }
            };
            await walk(stops);
            await walk(stops.slice().reverse());
          }
        }
        /* 実際に使われている路線だけ、駅の並びを引く */
        const used = new Set();
        state.days.forEach(d => d.events.forEach(e => {
          const stops = routeStops(e);
          stops.forEach((st, si) => {
            if (!st.line || !st.name) return;
            const info = stationInfo(st.name);
            const api = info && matchLine(st.line, info.lines);
            if (api) { used.add(api); return; }
            /* この駅では当たらないとき、次の駅の路線も見る（駅名の登録違いを拾うため） */
            const nx = stops[si + 1] && stationInfo(stops[si + 1].name);
            const apiB = nx && matchLine(st.line, nx.lines);
            if (apiB) used.add(apiB);
          });
        }));
        /* 直通（路線が変わるが乗換なし）を見分けるため、
           「次の駅が乗っている路線」も少しだけ引いておく */
        const extra = new Set();
        state.days.forEach(d => d.events.forEach(e => {
          const stops = routeStops(e);
          stops.forEach((st, si) => {
            const next = stops[si + 1];
            if (!st.line || !st.name || !next || !next.name) return;
            const info = stationInfo(st.name), nx = stationInfo(next.name);
            if (!info || !info.found || !nx || !nx.found) return;
            const api = matchLine(st.line, info.lines);
            if (!api) return;
            const seq = railIdx.line[api];
            if (seq && seq.includes(nx.name)) return;        // そのまま行けるなら要らない
            nx.lines.slice(0, 3).forEach(l => extra.add(l));
          });
        }));
        for (const l of extra) if (!railIdx.line[l]) await loadLine(l);
        for (const l of used) await loadLine(l);
        } finally { netState.warming = false; }
      }, 500);
    }

    /* ================= 所要時間の目安（地図の経路から） =================
       時刻表のない移動（徒歩・車・タクシー・自転車）は、地図の経路から
       だいたいの所要時間を出す。無料・登録不要のものだけを使う。
         Valhalla（FOSSGIS）… 徒歩/車/自転車/タクシー
         OSRM（デモ）      … 車（Valhallaが応えないときの控え）
       あくまで「目安」なので、出した値は手で直せる
       ------------------------------------------------------ */
    const VALHALLA = 'https://valhalla1.openstreetmap.de/route';
    const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
    /* カテゴリ → 地図側の乗り物 */
    const COSTING = { walk: 'pedestrian', taxi: 'taxi', car: 'auto', bus: 'bus', bicycle: 'bicycle' };
    /* 目安を出す並び（この順にチップで出す） */
    const EST_MODES = [
      { key: 'walk', costing: 'pedestrian', label: '徒歩', icon: 'fa-person-walking' },
      { key: 'bicycle', costing: 'bicycle', label: '自転車', icon: 'fa-bicycle' },
      { key: 'car', costing: 'auto', label: '車', icon: 'fa-car-side' },
      { key: 'taxi', costing: 'taxi', label: 'タクシー', icon: 'fa-taxi' },
      { key: 'bus', costing: 'bus', label: 'バス', icon: 'fa-bus' },
    ];
    const routeIdx = reactive({});                 // 'from|to|costing' → {min, km} / null
    const estState = reactive({ busy: 0, forKey: '' });

    /* 経路サービスが混んでいる／止まっているときは、しばらく聞きに行かない。
       毎回だめな先へ問い合わせると、待たされるだけで待ち時間が伸びるため */
    const svcDown = {};                            // URL → 休ませ終わる時刻
    const svcMiss = {};                            // URL → 続けて失敗した回数
    const svcOk = (u) => !(svcDown[u] && Date.now() < svcDown[u]);
    function svcMark(u, good) {
      if (good) { svcMiss[u] = 0; delete svcDown[u]; return; }
      svcMiss[u] = (svcMiss[u] || 0) + 1;
      /* 1回こけたら少しだけ間を置く（続けて何度も待たされないように）。
         それでもだめなら、しばらく諦めて見当のほうを出す */
      svcDown[u] = Date.now() + (svcMiss[u] >= 2 ? 10 * 60 * 1000 : 90 * 1000);
    }

    /* 乗り物ごとに、聞くだけ無駄な距離（直線）。無理な問い合わせはしない */
    const EST_MAX_KM = { pedestrian: 30, bicycle: 100, auto: 800, taxi: 800, bus: 800 };
    async function routeEstimate(fromPos, toPos, costing) {
      if (!fromPos || !toPos) return null;
      const key = [fromPos.y.toFixed(4), fromPos.x.toFixed(4), toPos.y.toFixed(4), toPos.x.toFixed(4), costing].join(',');
      if (key in routeIdx) return routeIdx[key];
      const straight = distKm(fromPos, toPos);
      if (straight !== null && straight > (EST_MAX_KM[costing] || 800)) { routeIdx[key] = null; return null; }
      const body = { locations: [{ lat: fromPos.y, lon: fromPos.x }, { lat: toPos.y, lon: toPos.x }], costing };
      estState.busy++;
      try {
        let v = null;
        if (svcOk(VALHALLA)) {
          v = await netGet('rt:' + key, VALHALLA + '?json=' + encodeURIComponent(JSON.stringify(body)), (j) => {
            const sm = j && j.trip && j.trip.summary;
            return sm ? { min: Math.max(1, Math.round(sm.time / 60)), km: Math.round(sm.length * 10) / 10 } : null;
          }, 7000);
          svcMark(VALHALLA, !!v);
        }
        if (!v && (costing === 'auto' || costing === 'taxi' || costing === 'bus') && svcOk(OSRM)) {
          /* 車の道のりは、控えの経路サービスでも出せる。バスもこれで見当をつける */
          const u = OSRM + fromPos.x + ',' + fromPos.y + ';' + toPos.x + ',' + toPos.y + '?overview=false';
          const d = await netGet('rt2:' + key, u, (j) => {
            const r = j && j.routes && j.routes[0];
            return r ? { min: Math.max(1, Math.round(r.duration / 60)), km: Math.round(r.distance / 100) / 10 } : null;
          }, 7000);
          svcMark(OSRM, !!d);
          /* バスは停まりながら走るので、車の時間より長めに見る */
          if (d) v = (costing === 'bus') ? { min: Math.max(1, Math.round(d.min * 1.5)), km: d.km, rough: true } : d;
        }
        /* 経路サービスが混んでいて答えないときは、直線距離からのざっくり見当を出す。
           何も出さないより役に立つので、「およそ」と分かる形で渡す */
        if (!v && straight !== null) {
          const KMH = { pedestrian: 4.5, bicycle: 13, auto: 25, taxi: 25, bus: 18 };
          const road = straight * 1.3;               // 道は直線より遠回りになる
          const kmh = KMH[costing] || 20;
          v = { min: Math.max(1, Math.round(road / kmh * 60)), km: Math.round(road * 10) / 10, rough: true };
        }
        routeIdx[key] = v || null;
        return routeIdx[key];
      } finally { estState.busy--; }
    }

    /* 2つの地点名から、乗り物ごとの目安をまとめて出す */
    const estimates = reactive({ key: '', from: '', to: '', list: [], loading: false, error: '' });
    let estTimer = 0;
    function requestEstimates(fromName, toName, only) {
      const a = String(fromName || '').trim(), b = String(toName || '').trim();
      const key = a + '→' + b + '|' + (only || '');
      if (!a || !b || a === b) { estimates.key = ''; estimates.list = []; return; }
      if (estimates.key === key && (estimates.list.length || estimates.loading)) return;
      estimates.key = key; estimates.from = a; estimates.to = b;
      estimates.list = []; estimates.error = ''; estimates.loading = true;
      clearTimeout(estTimer);
      estTimer = setTimeout(async () => {
        try {
          const [pa, pb] = [await loadPlace(a), await loadPlace(b)];
          if (estimates.key !== key) return;
          if (!pa || !pb) { estimates.error = '地点が地図で見つからないので、目安は出せません'; return; }
          const modes = only ? EST_MODES.filter(m => m.key === only) : EST_MODES;
          const out = [];
          for (const m of modes) {
            const v = await routeEstimate(pa, pb, m.costing);
            if (estimates.key !== key) return;
            if (v) out.push(Object.assign({}, m, v));
            estimates.list = out.slice();
          }
          if (!out.length) estimates.error = '経路が見つかりませんでした（手で入れてください）';
        } catch (e) {
          estimates.error = '目安を出せませんでした';
        } finally {
          if (estimates.key === key) estimates.loading = false;
        }
      }, 350);
    }
    /* 「A → B」や経路から、区間の両端を取り出す */
    function endsOf(ev) {
      if (!ev) return null;
      const a = placeOf(ev, 'start'), b = placeOf(ev, 'end');
      return (a && b && a !== b) ? { a, b } : null;
    }
    const estFor = (key) => estimates.list.find(m => m.key === key) || null;
    /* 目安から終了時刻を決める（開始時刻＋所要） */
    function applyEstimate(ev, mins) {
      if (!ev || !ev.startTime || !mins) return;
      const t = toMin(ev.startTime) + mins;
      ev.endTime = String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    }

    /* ================= 時刻表データ（ODPT） =================
       公共交通オープンデータセンター。トークン無しでも都営（東京都交通局）は全件引ける。
       無料のトークンを設定に入れると、JR東日本・東京メトロ・私鉄各社まで広がる。
         odpt:Station          駅（dc:title で日本語名から引ける）
         odpt:Railway          路線（odpt:stationOrder に駅の並びが入っている）
         odpt:StationTimetable 駅の時刻表（発車時刻・行先・種別・番線※事業者による）
         odpt:TrainTimetable   列車ごとの各駅の時刻（到着時刻の割り出しに使う）
       番線は入っていない事業者・駅が多いので、無いことを前提に組む
       ------------------------------------------------------ */
    const ODPT_PUBLIC = 'https://api-public.odpt.org/api/v4/';
    const ODPT_KEYED = 'https://api.odpt.org/api/v4/';
    const LS_ODPT = 'odpt_token_v1';
    const ttState = reactive({
      token: (() => { try { return localStorage.getItem(LS_ODPT) || ''; } catch { return ''; } })(),
      busy: 0, ok: null, lastError: '', lastCheck: '',
    });
    watch(() => ttState.token, (v) => { try { localStorage.setItem(LS_ODPT, v || ''); } catch {} });

    function odptUrl(type, params) {
      const q = new URLSearchParams(params || {});
      if (ttState.token) q.set('acl:consumerKey', ttState.token);
      return (ttState.token ? ODPT_KEYED : ODPT_PUBLIC) + type + '?' + q.toString();
    }
    /* 時刻表はダイヤ改正があるので、駅・路線より短めに持つ */
    async function odptGet(type, params, ttlDays = 30) {
      const key = 'tt:' + (ttState.token ? 'k' : 'p') + ':' + type + ':' +
                  new URLSearchParams(params || {}).toString();
      const hit = netCache[key];
      if (hit && (Date.now() - hit.t) < ttlDays * 24 * 3600 * 1000) return hit.v;
      if (!netState.enabled) return hit ? hit.v : null;
      ttState.busy++;
      try {
        const v = await netGet(key, odptUrl(type, params), (j) => (Array.isArray(j) ? j : []));
        if (v) { ttState.ok = true; ttState.lastError = ''; }
        return v;
      } catch (e) {
        ttState.ok = false; ttState.lastError = String((e && e.message) || e);
        return hit ? hit.v : null;
      } finally { ttState.busy--; }
    }

    const jaOf = (o, k) => (o && o[k] && (o[k].ja || o[k])) || '';
    const idTail = (id) => String(id || '').split(/[.:]/).pop();
    /* 引いてきた時刻表まわりの置き場 */
    const ttIdx = reactive({ station: {}, railway: {}, timetable: {}, name: {}, trainType: {}, direction: {} });

    /* 日本語の駅名 → その名前を持つ駅（路線ごとに1件ずつ返ってくる） */
    async function ttStationsByName(name) {
      const t = String(name || '').replace(/駅$/, '').trim();
      if (!t) return [];
      if (ttIdx.name[t]) return ttIdx.name[t];
      const rows = await odptGet('odpt:Station', { 'dc:title': t }, 60);
      const out = (rows || []).map(r => ({
        id: r['owl:sameAs'], title: r['dc:title'] || jaOf(r, 'odpt:stationTitle'),
        railway: r['odpt:railway'], operator: r['odpt:operator'],
        lat: r['geo:lat'], lon: r['geo:long'],
      }));
      ttIdx.name[t] = out;
      out.forEach(x => { ttIdx.station[x.id] = x; });
      return out;
    }
    /* 路線（駅の並びつき） */
    async function ttRailway(railwayId) {
      const id = String(railwayId || '');
      if (!id) return null;
      if (ttIdx.railway[id]) return ttIdx.railway[id];
      const rows = await odptGet('odpt:Railway', { 'owl:sameAs': id }, 60);
      const r = (rows || [])[0];
      if (!r) { ttIdx.railway[id] = null; return null; }
      const order = (r['odpt:stationOrder'] || []).map(o => ({
        index: o['odpt:index'], id: o['odpt:station'], title: jaOf(o, 'odpt:stationTitle') || idTail(o['odpt:station']),
      }));
      const v = {
        id, title: r['dc:title'] || jaOf(r, 'odpt:railwayTitle'),
        operator: r['odpt:operator'], code: r['odpt:lineCode'] || '',
        order,
      };
      order.forEach(o => { if (!ttIdx.station[o.id]) ttIdx.station[o.id] = { id: o.id, title: o.title, railway: id }; });
      ttIdx.railway[id] = v;
      return v;
    }
    /* 種別・方向の日本語名（少ないので一度だけ） */
    async function ttVocab() {
      if (Object.keys(ttIdx.trainType).length) return;
      const [types, dirs] = await Promise.all([
        odptGet('odpt:TrainType', {}, 90),
        odptGet('odpt:RailDirection', {}, 90),
      ]);
      (types || []).forEach(t => { ttIdx.trainType[t['owl:sameAs']] = t['dc:title'] || jaOf(t, 'odpt:trainTypeTitle'); });
      (dirs || []).forEach(d => { ttIdx.direction[d['owl:sameAs']] = d['dc:title'] || jaOf(d, 'odpt:railDirectionTitle'); });
      if (!Object.keys(ttIdx.trainType).length) ttIdx.trainType['__none'] = '';
    }
    /* 駅IDから日本語名（引けなければローマ字のまま） */
    function ttStationName(id) {
      const hit = ttIdx.station[id];
      return (hit && hit.title) || idTail(id).replace(/([a-z])([A-Z])/g, '$1 $2');
    }
    /* 平日 / 土休日 */
    function calendarOf(dateStr) {
      const d = new Date(String(dateStr || '') + 'T00:00:00');
      const day = isNaN(d) ? new Date().getDay() : d.getDay();
      return (day === 0 || day === 6) ? 'odpt.Calendar:SaturdayHoliday' : 'odpt.Calendar:Weekday';
    }
    /* 駅の時刻表（方向ごとに1本ずつ返る） */
    async function ttTimetables(stationId, railwayId) {
      const key = stationId + '|' + railwayId;
      if (ttIdx.timetable[key]) return ttIdx.timetable[key];
      const rows = await odptGet('odpt:StationTimetable',
        { 'odpt:station': stationId, 'odpt:railway': railwayId }, 14);
      const out = (rows || []).map(r => ({
        id: r['owl:sameAs'],
        calendar: r['odpt:calendar'] || '',
        direction: r['odpt:railDirection'] || '',
        platform: r['odpt:platformNumber'] || '',        // 入っていない事業者が多い
        trains: (r['odpt:stationTimetableObject'] || []).map(o => ({
          time: o['odpt:departureTime'] || o['odpt:arrivalTime'] || '',
          dest: (o['odpt:destinationStation'] || []).map(ttStationName).join('・'),
          destIds: o['odpt:destinationStation'] || [],
          type: o['odpt:trainType'] || '',
          /* 名前のある列車（しおかぜ・ひかり など）。無い列車のほうが多い */
          name: (Array.isArray(o['odpt:trainName']) ? o['odpt:trainName'] : [o['odpt:trainName']])
                  .map(x => (x && (x.ja || x)) || '').filter(v => typeof v === 'string' && v).join('・'),
          number: o['odpt:trainNumber'] || '',
          train: o['odpt:train'] || '',
          platform: o['odpt:platformNumber'] || '',
          via: (o['odpt:viaRailway'] || []).map(idTail).join('・'),
        })).filter(t => t.time),
      }));
      ttIdx.timetable[key] = out;
      return out;
    }
    /* 列車ごとの各駅時刻（到着時刻の割り出し用。無い事業者もある） */
    async function ttTrainStops(trainId) {
      if (!trainId) return null;
      const key = 'train:' + trainId;
      if (ttIdx.timetable[key] !== undefined) return ttIdx.timetable[key];
      const rows = await odptGet('odpt:TrainTimetable', { 'odpt:train': trainId }, 14);
      const r = (rows || [])[0];
      const v = r ? (r['odpt:trainTimetableObject'] || []).map(o => ({
        id: o['odpt:departureStation'] || o['odpt:arrivalStation'] || '',
        dep: o['odpt:departureTime'] || '', arr: o['odpt:arrivalTime'] || '',
      })) : null;
      ttIdx.timetable[key] = v;
      return v;
    }
    /* ---- 路線バス ----
       停留所（BusstopPole）→ 系統（BusroutePattern）→ 停留所の並び → 便（BusstopPoleTimetable）。
       停留所名は「◯◯駅前」のように書かれていることが多いので、いくつか言い換えて探す */
    async function ttBusstopsByName(name) {
      const t = String(name || '').trim();
      if (!t) return [];
      const key = 'bus:' + t;
      if (ttIdx.name[key]) return ttIdx.name[key];
      const tries = [t];
      if (!/前$/.test(t)) tries.push(t + '前');
      if (/駅$/.test(t)) tries.push(t + '前', t.replace(/駅$/, ''));
      let rows = [];
      for (const q of tries) {
        rows = (await odptGet('odpt:BusstopPole', { 'dc:title': q }, 60)) || [];
        if (rows.length) break;
      }
      const out = rows.map(r => ({
        id: r['owl:sameAs'], title: r['dc:title'],
        routes: r['odpt:busroutePattern'] || [],
        operator: r['odpt:operator'], lat: r['geo:lat'], lon: r['geo:long'],
      }));
      ttIdx.name[key] = out;
      out.forEach(x => { ttIdx.station[x.id] = x; });
      return out;
    }
    /* 系統（停留所の並びつき） */
    async function ttBusroute(patternId) {
      const id = String(patternId || '');
      if (!id) return null;
      if (ttIdx.railway[id]) return ttIdx.railway[id];
      const rows = await odptGet('odpt:BusroutePattern', { 'owl:sameAs': id }, 60);
      const r = (rows || [])[0];
      if (!r) { ttIdx.railway[id] = null; return null; }
      const order = (r['odpt:busstopPoleOrder'] || []).map(o => ({
        index: o['odpt:index'], id: o['odpt:busstopPole'], title: o['odpt:note'] || idTail(o['odpt:busstopPole']),
      }));
      const v = { id, title: r['dc:title'] || '', operator: r['odpt:operator'], order, bus: true };
      order.forEach(o => { if (!ttIdx.station[o.id]) ttIdx.station[o.id] = { id: o.id, title: o.title }; });
      ttIdx.railway[id] = v;
      return v;
    }
    /* その停留所の時刻表（系統・平日/土休日ごと） */
    async function ttBusTimetables(poleId) {
      const key = 'bt:' + poleId;
      if (ttIdx.timetable[key]) return ttIdx.timetable[key];
      const rows = await odptGet('odpt:BusstopPoleTimetable', { 'odpt:busstopPole': poleId }, 14);
      const out = (rows || []).map(r => ({
        id: r['owl:sameAs'], calendar: r['odpt:calendar'] || '',
        route: r['odpt:busroute'] || '', title: r['dc:title'] || '',
        direction: r['odpt:busDirection'] || '', platform: '',
        trains: (r['odpt:busstopPoleTimetableObject'] || []).map(o => ({
          time: o['odpt:departureTime'] || '',
          dest: o['odpt:destinationSign'] || ttStationName(o['odpt:destinationBusstopPole']),
          destIds: o['odpt:destinationBusstopPole'] ? [o['odpt:destinationBusstopPole']] : [],
          type: '', number: '', train: '', platform: '',
          pattern: o['odpt:busroutePattern'] || '',
          isMidnight: !!o['odpt:isMidnight'],
        })).filter(t => t.time),
      }));
      ttIdx.timetable[key] = out;
      return out;
    }

    /* つながっているか試す（設定画面から） */
    async function ttCheck() {
      ttState.busy++;
      try {
        const rows = await odptGet('odpt:Operator', {}, 0);
        ttState.ok = Array.isArray(rows) && rows.length > 0;
        ttState.lastCheck = ttState.ok
          ? `${rows.length}事業者ぶんの時刻表が使えます`
          : '応答がありませんでした';
        if (ttState.ok) await ttVocab();
      } catch (e) {
        ttState.ok = false; ttState.lastCheck = '確かめられませんでした';
      } finally { ttState.busy--; }
      return ttState.lastCheck;
    }

    /* ================= 列車えらび =================
       ①出発駅 → ②路線 → ③行き先の駅 → ④その時刻ごろの列車、の順にたずねる。
       時刻表が引けない路線でも、路線の駅の並び（HeartRails）で③まで進み、
       行先と時刻は手で入れられる。番線はもともと無い駅が多いので、
       あくまで「あれば出す・無ければ手入力」で扱う
       ------------------------------------------------ */
    const tw = reactive({
      kind: 'train',                             // train=電車 / bus=路線バス
      open: false, step: 1, mode: 'stop',        // stop=既存の駅に反映 / new=移動を新しく作る
      dayIdx: 0, evId: '', stopIdx: 0, insertAt: null,
      from: '', fromId: '', railCands: [], stationCands: [],
      railId: '', railTitle: '', order: [], hrOrder: [],
      to: '', toId: '',
      time: '', platform: '', trains: [], picked: null,
      arrTime: '', arrPlatform: '', stationsText: '',
      loading: false, note: '', hasTimetable: false,
    });
    const twStopsCount = computed(() => {
      const a = tw.order.findIndex(o => o.title === tw.from || o.id === tw.fromId);
      const b = tw.order.findIndex(o => o.title === tw.to || o.id === tw.toId);
      if (a >= 0 && b >= 0) {
        const d = Math.abs(b - a);
        /* 環状なら、逆回りのほうが短いこともある */
        const loop = new Set(tw.order.map(o => o.title)).size < tw.order.length;
        return loop ? Math.min(d, tw.order.length - d) : d;
      }
      const ha = tw.hrOrder.indexOf(tw.from), hb = tw.hrOrder.indexOf(tw.to);
      return (ha >= 0 && hb >= 0) ? Math.abs(hb - ha) : null;
    });

    /* 駅名を打ち直したときなど、前の問い合わせの答えがあとから届くことがある。
       通し番号を持たせて、古い答えは捨てる */
    let twSeq = 0;
    /* 言い回しを、電車とバスで切り替える */
    const twWord = computed(() => tw.kind === 'bus'
      ? { spot: 'バス停', line: '系統', train: '便', unit: '停留所', ride: '乗る便' }
      : { spot: '駅', line: '路線', train: '列車', unit: '駅', ride: '乗る列車' });
    function twReset() {
      Object.assign(tw, {
        step: 1, from: '', fromId: '', railCands: [], stationCands: [],
        railId: '', railTitle: '', order: [], hrOrder: [], to: '', toId: '',
        time: '', platform: '', trains: [], picked: null,
        arrTime: '', arrPlatform: '', stationsText: '', note: '', hasTimetable: false,
      });
    }
    /* 駅カードの「列車をえらぶ」から */
    function openTrainWizard(dayIdx, si) {
      const e = editing.value;
      const st = e && e.route && e.route[si];
      if (!st) return;
      twReset();
      Object.assign(tw, {
        open: true, mode: 'stop', dayIdx, evId: e.id, stopIdx: si,
        kind: e.type === 'bus' ? 'bus' : 'train',
        from: st.name || '', time: st.depTime || e.startTime || '',
        platform: st.depPlatform || '', railTitle: st.line || '',
        to: (e.route[si + 1] && e.route[si + 1].name) || '',
      });
      twLoadRailways();
    }
    /* 何も無いところから「時刻表から移動を作る」 */
    function openTrainWizardNew(dayIdx, insertAt = null) {
      twReset();
      const day = state.days[dayIdx];
      const prev = day && (insertAt === null ? day.events[day.events.length - 1] : day.events[insertAt - 1]);
      Object.assign(tw, {
        open: true, mode: 'new', dayIdx, insertAt,
        from: prev ? placeOf(prev, 'end') : (state.origin || homePlace() || ''),
        time: prev ? (prev.endTime || prev.startTime || '') : '',
      });
      addMenu.open = false;
      if (tw.from) twLoadRailways();
    }

    /* ① 出発駅 → その駅を通る路線 */
    async function twLoadRailways() {
      const name = String(tw.from || '').trim();
      if (!name) return;
      const seq = ++twSeq;
      tw.loading = true; tw.note = '';
      try {
        if (tw.kind === 'bus') return await twLoadBusRoutes(name, seq);
        await ttVocab();
        const cands = [];
        /* 時刻表がある路線（ODPT） */
        const sts = await ttStationsByName(name);
        for (const st of (sts || [])) {
          const rw = await ttRailway(st.railway);
          if (!rw) continue;
          cands.push({ id: rw.id, title: rw.title, tt: true, stationId: st.id, order: rw.order });
        }
        /* 時刻表が無くても、路線としては選べるようにする（全国）。
           同じ駅名が各地にあるので、時刻表で分かった位置の近くだけに絞る */
        const info = await loadStation(name);
        if (info && info.found) {
          const ref = (sts && sts[0] && sts[0].lat) ? { x: Number(sts[0].lon), y: Number(sts[0].lat) } : null;
          const same = (a, b) => {
            const x = lineKey(a), y = lineKey(b);
            return !!x && !!y && (x === y || x.includes(y) || y.includes(x));
          };
          linesNear(info, ref).forEach(l => {
            if (cands.some(c => same(c.title, l))) return;    // 「三田線」と「都営三田線」を二重に出さない
            cands.push({ id: '', title: l, tt: false, stationId: '', order: [] });
          });
        }
        if (seq !== twSeq) return;                 // もっと新しい問い合わせが始まっている
        tw.railCands = cands;
        tw.fromId = (sts && sts[0]) ? sts[0].id : '';
        tw.step = 2;
        if (!cands.length) tw.note = 'この駅の路線が見つかりませんでした。路線名を手で入れても進めます';
      } finally { if (seq === twSeq) tw.loading = false; }
    }

    /* 「odpt.BusroutePattern:Toei.Ueno26.60401.2」→「toei.ueno26」。
       時刻表側は Busroute（系統）単位なので、粒度をそろえて突き合わせる */
    function busRouteKey(id) {
      const m = String(id || '').split(':').pop().split('.');
      return (m.length >= 2 ? m[0] + '.' + m[1] : m[0] || '').toLowerCase();
    }
    /* バス：停留所 → その停留所を通る系統 */
    async function twLoadBusRoutes(name, seq) {
      const poles = await ttBusstopsByName(name);
      if (seq !== twSeq) return;
      const cands = [];
      const seen = new Set();
      for (const pole of (poles || []).slice(0, 6)) {          // 乗り場（ポール）は複数あることが多い
        for (const pid of pole.routes.slice(0, 20)) {
          if (seen.has(pid)) continue;
          seen.add(pid);
          const r = await ttBusroute(pid);
          if (seq !== twSeq) return;
          if (!r || !r.order.length) continue;
          if (cands.some(x => x.title === r.title)) continue;  // 同じ行き先の重複を並べない
          /* その乗り場が終点になっている系統は、ここからは乗れないので出さない */
          const at = r.order.findIndex(x => x.id === pole.id || x.title === name);
          if (at >= 0 && at === r.order.length - 1) continue;
          cands.push({ id: r.id, title: r.title, tt: true, stationId: pole.id, order: r.order, bus: true });
        }
      }
      cands.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
      tw.railCands = cands;
      tw.fromId = (poles && poles[0]) ? poles[0].id : '';
      tw.step = 2;
      if (!cands.length) {
        tw.note = 'この名前のバス停が見つかりませんでした。'
          + '（いまのところ都営バスなど、公開されている事業者だけです。系統名と時刻は手で入れられます）';
      }
    }

    /* ② 路線 → 駅の並び */
    async function twPickRailway(c) {
      if (!c) return;
      const seq = ++twSeq;
      tw.railId = c.id || '';
      tw.railTitle = c.title || '';
      tw.hasTimetable = !!c.tt;
      if (c.stationId) tw.fromId = c.stationId;
      tw.loading = true;
      try {
        if (tw.kind === 'bus') {
          tw.order = c.order && c.order.length ? c.order : (c.id ? ((await ttBusroute(c.id)) || {}).order || [] : []);
          tw.hrOrder = [];
          if (seq === twSeq) tw.step = 3;
          return;
        }
        tw.order = c.order && c.order.length ? c.order : (c.id ? ((await ttRailway(c.id)) || {}).order || [] : []);
        /* 時刻表が無い路線は、駅の並びだけ別のところから借りる */
        const info = await loadStation(tw.from);
        const api = info && info.found ? matchLine(tw.railTitle, info.lines) : '';
        const hr = api ? ((await loadLine(api)) || []) : [];
        if (seq !== twSeq) return;
        tw.hrOrder = hr;
        tw.step = 3;
      } finally { if (seq === twSeq) tw.loading = false; }
    }
    /* 路線を手で決めたとき */
    function twUseTypedRailway(name) {
      const hit = tw.railCands.find(c => lineKey(c.title) === lineKey(name));
      if (hit) return twPickRailway(hit);
      return twPickRailway({ id: '', title: name, tt: false, order: [] });
    }

    /* ③ 行き先の駅 */
    const twStationList = computed(() => {
      if (tw.order.length) {
        const list = tw.order.map(o => ({ id: o.id, title: o.title }));
        /* バスは向きが決まっているので、乗る停留所より先だけを出す */
        if (tw.kind === 'bus') {
          let i = list.findIndex(o => o.id === tw.fromId);
          if (i < 0) i = list.findIndex(o => o.title === tw.from);
          if (i >= 0 && i < list.length - 1) return list.slice(i + 1);
        }
        return list;
      }
      return tw.hrOrder.map(n => ({ id: '', title: n }));
    });
    async function twPickTo(stn) {
      if (!stn) return;
      tw.to = (typeof stn === 'string') ? stn : (stn.title || '');
      tw.toId = (typeof stn === 'string') ? '' : (stn.id || '');
      if (!tw.to) return;
      tw.step = 4;
      await twLoadTrains();
    }

    /* ④ その時刻ごろの列車 */
    const twMin = (t) => { const m = toMin(t); return m === null ? null : m; };
    async function twLoadTrains() {
      const seq = ++twSeq;
      tw.trains = []; tw.picked = null; tw.note = '';
      const n = twStopsCount.value;
      tw.stationsText = (n !== null && n > 0) ? n + twWord.value.unit : '';
      if (!tw.railId || !tw.fromId) {
        tw.note = `この${twWord.value.line}は時刻表を持っていないので、行先と時刻は手で入れてください`;
        return;
      }
      if (seq !== twSeq) return;
      if (tw.kind === 'bus') return await twLoadBuses(seq);
      tw.loading = true;
      try {
        const day = state.days[tw.dayIdx];
        const cal = calendarOf(day && day.date);
        const tables = (await ttTimetables(tw.fromId, tw.railId)) || [];
        const use = tables.filter(t => !t.calendar || t.calendar === cal);
        const list = (use.length ? use : tables);
        if (!list.length) { tw.note = 'この駅の時刻表が見つかりませんでした。手で入れてください'; return; }

        /* 行き先の側だけを残す（駅の並びの位置で判断する） */
        const idx = (id, title) => {
          let i = tw.order.findIndex(o => o.id === id);
          if (i < 0 && title) i = tw.order.findIndex(o => o.title === title);
          return i;
        };
        const fromIdx = idx(tw.fromId, tw.from), toIdx = idx(tw.toId, tw.to);
        /* 環状（同じ駅が並びに2回出てくる路線）は、どちら回りでも着けるので絞らない */
        const loop = new Set(tw.order.map(o => o.title)).size < tw.order.length;
        const side = (!loop && fromIdx >= 0 && toIdx >= 0) ? Math.sign(toIdx - fromIdx) : 0;
        const need = (fromIdx >= 0 && toIdx >= 0) ? Math.abs(toIdx - fromIdx) : 0;
        const towards = (t) => {
          if (!side) return true;
          const di = t.destIds.map(d => idx(d, '')).filter(i => i >= 0);
          if (!di.length) return true;                       // 直通で他社へ抜ける列車
          return di.some(i => Math.sign(i - fromIdx) === side && Math.abs(i - fromIdx) >= need);
        };
        let trains = [];
        list.forEach(tb => tb.trains.forEach(t => {
          if (!towards(t)) return;
          trains.push(Object.assign({}, t, {
            platform: t.platform || tb.platform || '',
            dirTitle: ttIdx.direction[tb.direction] || '',
            typeTitle: ttIdx.trainType[t.type] || '',
          }));
        }));
        /* 番線が分かっていて、データにも番線があるときだけ絞る */
        const pf = String(tw.platform || '').trim();
        if (pf && trains.some(t => t.platform)) {
          const k = placeKey(pf);
          const hit = trains.filter(t => t.platform && placeKey(t.platform).includes(k.replace(/番線|番のりば/, '')));
          if (hit.length) trains = hit;
        }
        trains.sort((a, b) => (twMin(a.time) - twMin(b.time)));
        const want = twMin(tw.time);
        if (want !== null && trains.length > 10) {
          let i = trains.findIndex(t => twMin(t.time) >= want);
          if (i < 0) i = trains.length - 1;
          trains = trains.slice(Math.max(0, i - 2), Math.max(0, i - 2) + 12);
        } else {
          trains = trains.slice(0, 12);
        }
        if (seq !== twSeq) return;
        tw.trains = trains;
        if (!trains.length) tw.note = 'その向きの列車が見つかりませんでした。手で入れてください';
        else {
          const msgs = [];
          if (loop) msgs.push('環状なので両方向を出しています（行先で選んでください）');
          if (!trains.some(t => t.platform)) msgs.push('この駅は番線が公開されていません（番線は手で入れられます）');
          tw.note = msgs.join('／');
        }
      } finally { if (seq === twSeq) tw.loading = false; }
    }

    /* 出発より後で、長すぎない到着時刻か（環状線では同じ列車が二度通るため必要） */
    function twArrOk(dep, arr) {
      const a = toMin(dep), b = toMin(arr);
      if (a === null || b === null) return false;
      let d = b - a;
      if (d < 0) d += 1440;
      return d > 0 && d <= 240;
    }
    /* バス：その時刻ごろの便 */
    async function twLoadBuses(seq) {
      tw.loading = true;
      try {
        const day = state.days[tw.dayIdx];
        const cal = calendarOf(day && day.date);
        const tables = (await ttBusTimetables(tw.fromId)) || [];
        if (seq !== twSeq) return;
        /* 都営バスの暦は「平日」「土曜」「休日」と事業者ごとの名前で入っているので、
           題名の末尾（:平日 など）で見分ける */
        const wantWeekday = cal === 'odpt.Calendar:Weekday';
        const calOf = (tb) => /(休日|日曜)/.test(tb.title) ? 'holiday' : (/土曜/.test(tb.title) ? 'sat' : 'weekday');
        const key = busRouteKey(tw.railId);
        const sameRoute = tables.filter(tb => !key || busRouteKey(tb.route) === key
                                       || tb.trains.some(x => busRouteKey(x.pattern) === key));
        const base = sameRoute.length ? sameRoute : tables;
        const sameCal = base.filter(tb => wantWeekday ? calOf(tb) === 'weekday' : calOf(tb) !== 'weekday');
        const use = sameCal.length ? sameCal : base;
        let buses = [];
        use.forEach(tb => tb.trains.forEach(t => {
          if (key && t.pattern && busRouteKey(t.pattern) !== key) return;
          buses.push(Object.assign({}, t, { dirTitle: tb.title || '', typeTitle: t.isMidnight ? '深夜' : '', name: '' }));
        }));
        buses.sort((a, b) => (twMin(a.time) - twMin(b.time)));
        const want = twMin(tw.time);
        if (want !== null && buses.length > 10) {
          let i = buses.findIndex(t => twMin(t.time) >= want);
          if (i < 0) i = buses.length - 1;
          buses = buses.slice(Math.max(0, i - 2), Math.max(0, i - 2) + 12);
        } else buses = buses.slice(0, 12);
        if (seq !== twSeq) return;
        tw.trains = buses;
        tw.note = buses.length ? 'バスは道路の混み具合で遅れます。余裕をみてください'
                               : 'この停留所の時刻表が見つかりませんでした。手で入れてください';
      } finally { if (seq === twSeq) tw.loading = false; }
    }

    /* ④' 列車を選ぶ → 到着時刻を割り出す */
    async function twPickTrain(t) {
      tw.picked = t;
      tw.time = t.time;
      if (t.platform) tw.platform = t.platform;
      tw.arrTime = '';
      tw.loading = true;
      try {
        if (tw.kind === 'bus') {
          const n = twStopsCount.value;
          const m = twMin(t.time);
          if (n && m !== null) {
            const est = Math.round(m + n * 1.8 + 3);      // 停留所ごとに約1.8分＋発車の余裕
            tw.arrTime = String(Math.floor(est / 60) % 24).padStart(2, '0') + ':' + String(est % 60).padStart(2, '0');
            tw.note = '到着時刻は停留所の数からの目安です（渋滞で変わります／手で直せます）';
          }
          tw.step = 5;
          return;
        }
        /* いちばん確かなのは、その列車の各駅時刻 */
        const stops = await ttTrainStops(t.train);
        if (stops && stops.length && tw.toId) {
          const hit = stops.find(s => s.id === tw.toId);
          const v = hit ? (hit.arr || hit.dep || '') : '';
          if (twArrOk(t.time, v)) tw.arrTime = v;
        }
        /* 無ければ、行き先の駅の時刻表で同じ列車を探す */
        if (!tw.arrTime && tw.toId && tw.railId) {
          const tbs = (await ttTimetables(tw.toId, tw.railId)) || [];
          for (const tb of tbs) {
            /* 同じ列車番号でも、出発より前の時刻なら別の周回なので採らない */
            const hit = tb.trains.find(x => x.number && x.number === t.number && twArrOk(t.time, x.time));
            if (hit) { tw.arrTime = hit.time; if (!tw.arrPlatform) tw.arrPlatform = hit.platform || tb.platform || ''; break; }
          }
        }
        /* それでも分からなければ、駅数から見当をつける */
        if (!twArrOk(t.time, tw.arrTime)) tw.arrTime = '';
        if (!tw.arrTime) {
          const n = twStopsCount.value;
          const per = /快速|急行|特急|ライナー|新幹線/.test(t.typeTitle || '') ? 1.8 : 2.4;
          const m = twMin(t.time);
          if (n && m !== null) {
            const est = Math.round(m + n * per);
            tw.arrTime = String(Math.floor(est / 60) % 24).padStart(2, '0') + ':' + String(est % 60).padStart(2, '0');
            tw.note = '到着時刻は駅数からの目安です（手で直せます）';
          }
        }
      } finally { tw.loading = false; }
      tw.step = 5;
    }
    function twSkipTrain() {          // 時刻表を使わずに手で決める
      tw.picked = null;
      tw.step = 5;
    }

    /* ⑤ 反映する */
    function twApply() {
      /* 行先は「◯◯行」。公開されていない路線は方向（外回り・◯◯方面）を使う */
      const destText = tw.picked
        ? (tw.picked.dest ? tw.picked.dest + '行' : (tw.picked.dirTitle || ''))
        : '';
      /* 種別（快速・特急など）と、名前のある列車（しおかぜ など）はまとめて持ち帰る */
      const kindText = tw.picked
        ? [tw.picked.typeTitle || '', tw.picked.name || ''].filter(Boolean).join(' ').trim()
        : '';
      const stopPatch = {
        line: tw.railTitle || '',
        kind: kindText,
        dest: destText || (tw.to ? tw.to + '行' : ''),
        stations: tw.stationsText || '',
        depTime: tw.time || '',
        depPlatform: tw.platform || '',
      };
      if (tw.mode === 'stop') {
        const e = editing.value;
        if (!e || !e.route || !e.route[tw.stopIdx]) { tw.open = false; return; }
        const st = e.route[tw.stopIdx];
        Object.assign(st, stopPatch, { name: tw.from || st.name });
        let next = e.route[tw.stopIdx + 1];
        if (!next) { e.route.push(blankStop(tw.to)); next = e.route[tw.stopIdx + 1]; }
        next.name = tw.to || next.name;
        if (tw.arrTime) next.arrTime = tw.arrTime;
        if (tw.arrPlatform) next.arrPlatform = tw.arrPlatform;
        /* 予定そのものの時刻も合わせる（1駅目の発＝この予定の始まり、最後の着＝終わり） */
        if (tw.time && (tw.stopIdx === 0 || !e.startTime)) e.startTime = tw.time;
        if (tw.arrTime && tw.stopIdx + 1 >= e.route.length - 1) e.endTime = tw.arrTime;
        flash('列車を入れました', 'fa-train-subway');
      } else {
        snapshot('列車から移動を追加');
        const ev = Object.assign(newEvent(), {
          type: tw.kind === 'bus' ? 'bus' : 'train',
          title: `${tw.from} → ${tw.to}`,
          location: `${tw.from} → ${tw.to}`,
          startTime: tw.time || '',
          endTime: tw.arrTime || '',
          route: [Object.assign(blankStop(tw.from), stopPatch),
                  Object.assign(blankStop(tw.to), { arrTime: tw.arrTime || '', arrPlatform: tw.arrPlatform || '' })],
        });
        const day = state.days[tw.dayIdx];
        if (tw.insertAt === null || tw.insertAt >= day.events.length) day.events.push(ev);
        else day.events.splice(tw.insertAt, 0, ev);
        activeDay.value = tw.dayIdx;
        highlight(ev.id);
        flash('時刻表から移動を作りました', 'fa-train-subway', { label: '元に戻す', fn: undo });
      }
      tw.open = false;
    }

    /* ================= 点検エンジン =================
       ひとつの指摘は { level, type, key, msg, ids, fix } を持つ。
         level : error=たぶん間違い / warn=危ない / info=気づき
         key   : 「無視」を覚えるための名前（内容が変われば別の指摘になる）
         fix   : { label, run } 直す案。押すと1手で直る
       ------------------------------------------------ */
    const LEVEL_RANK = { error: 0, warn: 1, info: 2 };
    const shortName = (t, n = 14) => { const v = String(t || '（無題）'); return v.length > n ? v.slice(0, n) + '…' : v; };
    /* 「3」→「3駅」「3停留所」。数字だけのときに単位を付ける */
    function normStops(v, kind) {
      const t = String(v || '').trim();
      if (!t) return '';
      const m = t.match(/^([0-9０-９]{1,3})$/);
      if (!m) return t;
      const num = m[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      return num + (kind === 'bus' ? '停留所' : '駅');
    }
    /* 「2」「2番」→「2番線」のような正規化 */
    function normPlatform(v, kind) {
      const t = String(v || '').trim();
      if (!t) return '';
      const m = t.match(/^([0-9０-９]{1,2})\s*(番線|番のりば|番|線)?$/);
      if (!m) return t;
      const num = m[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      return num + (kind === 'bus' ? '番のりば' : '番線');
    }
    /* ---- 種別（快速・特急など）----
       各駅に停まらない種別かどうかで、駅数の見方が変わる。
       「普通」「各駅停車」は全部の駅に停まる。それ以外の速い種別は飛ばす */
    const KIND_LOCAL = /^(普通|各駅停車|各停|鈍行|一般路線|各駅)$/;
    const isLocalKind = (v) => KIND_LOCAL.test(String(v || '').trim());
    /* 「快特」「準急」「区急」「S-TRAIN」「はやぶさ」…　種別や列車名は言い方が多すぎて
       数え上げられない。書いてあって「普通・各駅停車」でなければ、
       通過する駅があるものとして扱う。これなら知らない愛称でも取りこぼさない */
    const isFastKind = (v) => { const t = String(v || '').trim(); return !!t && !isLocalKind(t); };
    /* えらびやすいように並べた種別の候補 */
    const KIND_SUGGESTS = {
      rail: ['普通', '快速', '急行', '準急', '区間快速', '通勤快速', '新快速', '特急'],
      bus: ['一般路線', '急行', '直行', '高速バス', 'リムジン'],
    };
    function dayIssues(day, di) {
      const out = [];
      const evs = day.events;
      const said = new Set();                      // 同じ知らせは1日に一度だけ
      const push = (o) => {
        if (o && o.key) { if (said.has(o.key)) return; said.add(o.key); }
        out.push(Object.assign({ level: 'info', ids: [], dayIdx: di }, o));
      };

      /* 帯に出る期間と、日程のタブの日付が食い違っているとき。
         古い旅程では、出発日だけ変えて各日が置き去りになっていることがある */
      if (di === 0 && state.startDate && day.date && state.startDate !== day.date) {
        const delta = diffDays(day.date, state.startDate);
        push({ level: 'warn', type: 'time', key: 'startgap:' + state.startDate + ':' + day.date, ids: [],
               how: '上の帯の期間は「出発日」、日程のタブは「その日の日付」です。どちらかに合わせてください',
               msg: `出発日（${shortDate(state.startDate)}）と Day 1 の日付（${shortDate(day.date)}）が違います`,
               fixes: [
                 { label: `日程を ${shortDate(state.startDate)} からにする`,
                   detail: `${state.days.length}日分すべてを ${Math.abs(delta)}日 ${delta > 0 ? 'あと' : 'まえ'}へずらします`,
                   run: () => shiftAllDays(delta) },
                 { label: `出発日を ${shortDate(day.date)} に直す`,
                   detail: '日程はそのままで、帯の期間を日程に合わせます',
                   run: () => { state.startDate = day.date; syncDateRange(); } },
               ] });
      }
      if (di === state.days.length - 1 && state.days.length > 0 && state.endDate && day.date
          && state.endDate !== day.date && state.startDate === (state.days[0] || {}).date) {
        push({ level: 'warn', type: 'time', key: 'endgap:' + state.endDate + ':' + day.date, ids: [],
               how: '帰着日を直すか、日数のほうを期間に合わせてください',
               msg: `帰着日（${shortDate(state.endDate)}）と最終日の日付（${shortDate(day.date)}）が違います`,
               fixes: [
                 { label: `帰着日を ${shortDate(day.date)} に直す`,
                   detail: '日程はそのままで、帯の期間を日程に合わせます',
                   run: () => { state.endDate = day.date; } },
                 { label: '日数を期間に合わせる',
                   detail: `出発日〜帰着日（${diffDays(state.startDate, state.endDate) + 1}日間）になるよう日程を増減します`,
                   run: () => { fitDaysToRange(); } },
               ] });
      }

      /* 行動時間が長すぎるとき。
         就寝と起床が入っていれば、そのあいだは寝ていた時間として引いているので、
         それでも 18時間を超えるなら、たいてい就寝が書かれていない */
      {
        const ds = dayStats(day);
        if (ds.activeMins !== null && ds.activeMins > 18 * 60) {
          const first = evs.find(e => e.startTime || e.endTime);
          const last = [...evs].reverse().find(e => e.startTime || e.endTime);
          push({ level: 'info', type: 'time', key: 'longday:' + di + ':' + ds.activeMins,
                 how: ds.sleepMins
                   ? '夜通しの予定ならこのままで大丈夫です'
                   : '「就寝」と「起床」を入れると、そのあいだは寝ていた時間として行動時間から引きます。'
                     + '日をまたぐときは、翌7時を「31:00」のように書けます',
                 msg: `Day ${day.dayNumber} の行動が ${fmtMin(ds.activeMins)}あります`
                    + (ds.sleepMins ? `（就寝 ${fmtMin(ds.sleepMins)}を除いた時間）` : '（就寝が入っていません）'),
                 ids: [first, last].filter(Boolean).map(e => e.id) });
        }
      }

      evs.forEach((e, ei) => {
        const nm = shortName(e.title);
        /* --- 必須の抜け --- */
        if (!e.startTime && !LOOSE_TIME.includes(e.type)) {
          push({ level: 'info', type: 'time', key: 'notime:' + e.id, ids: [e.id],
                 how: '編集画面で開始時刻を入れてください（前後の予定から自動で入ることもあります）',
                 msg: `「${nm}」に開始時刻が入っていません` });
        }
        if (!String(e.title || '').trim()) {
          const guess = placeOf(e, 'start') || cat(e.type).label;
          push({ level: 'warn', type: 'title', key: 'notitle:' + e.id, ids: [e.id],
                 msg: 'タイトルのない予定があります',
                 fix: { label: '場所をタイトルにする', detail: `タイトルを「${guess}」にします`,
                        run: () => { e.title = guess; } } });
        }
        const s0 = toMin(e.startTime), e0 = toMin(e.endTime);
        if (s0 !== null && e0 !== null && e0 < s0 && !e.crossOk) {
          push({ level: 'info', type: 'time', key: 'cross:' + e.id + ':' + e.startTime + e.endTime, ids: [e.id],
                 how: `${e.startTime} に始まって ${e.endTime} に終わる＝翌日にまたがる予定として数えています。`
                    + '夜行バスや深夜の予定ならこのままで大丈夫です。違うなら終了時刻を直してください',
                 msg: `「${nm}」は日をまたぐ予定として計算しています`,
                 fixes: [
                   { label: 'これで合っています', detail: 'この予定は日をまたぐものとして覚えます（以降この案内は出ません）',
                     run: () => { e.crossOk = true; } },
                   { label: `終了を ${e.startTime} より後にする`, detail: `終了時刻を空にして、書き直せるようにします`,
                     run: () => { e.endTime = ''; } },
                 ] });
        }

        /* --- 経路まわり --- */
        const stops = routeStops(e);
        /* 経路の位置は、となり合う駅どうしで矛盾しないように決めてから使う */
        const rPos = routePositions(stops, null);
        stops.forEach((st, si) => {
          /* ホーム番号の書き方をそろえる */
          ['arrPlatform', 'depPlatform'].forEach(f => {
            if (st.through) return;                    // 直通の駅は降りないので番線を見ない
            const fixed = normPlatform(st[f], e.type === 'bus' ? 'bus' : 'rail');
            if (st[f] && fixed !== st[f]) {
              push({ level: 'info', type: 'format', key: 'pf:' + e.id + ':' + si + ':' + f + ':' + st[f], ids: [e.id], stop: si,
                     msg: `「${nm}」${st.name || (si + 1) + '駅目'}の「${st[f]}」は「${fixed}」と書けます`,
                     fix: { label: `「${fixed}」にする`, detail: `「${st[f]}」→「${fixed}」`,
                            run: () => { st[f] = fixed; } } });
            }
          });
          /* 同じ駅が続いている */
          const prev = stops[si - 1];
          if (prev && st.name && prev.name && placeKey(prev.name) === placeKey(st.name)) {
            push({ level: 'warn', type: 'route', key: 'dupstop:' + e.id + ':' + si + ':' + st.name, ids: [e.id], stop: si,
                   msg: `「${nm}」で ${st.name} が続けて並んでいます`,
                   fix: { label: 'あとの駅を消す', detail: `${si + 1}駅目の「${st.name}」を消します`,
                          run: () => { const k = e.route.indexOf(st); if (k >= 0) e.route.splice(k, 1); } } });
          }
          /* 着いた時刻より前に発つ／前の駅より前に着く */
          const a = toMin(st.arrTime), d = toMin(st.depTime);
          if (a !== null && d !== null && d < a && a - d < 12 * 60) {
            push({ level: 'error', type: 'route', key: 'stoporder:' + e.id + ':' + si + ':' + st.arrTime + st.depTime, ids: [e.id], stop: si,
                   how: `この駅の発時刻を ${st.arrTime} より後にしてください（乗換の猶予が出ます）`,
                   msg: `「${nm}」${st.name || (si + 1) + '駅目'}：${st.arrTime}着なのに ${st.depTime}発になっています` });
          }
          if (prev) {
            const pd = toMin(prev.depTime);
            if (pd !== null && a !== null && a < pd && pd - a < 12 * 60) {
              push({ level: 'error', type: 'route', key: 'seqorder:' + e.id + ':' + si + ':' + prev.depTime + st.arrTime, ids: [e.id], stop: si,
                     how: '駅の並び順か、どちらかの時刻が違います。時刻表から選び直すと確実です',
                     msg: `「${nm}」${prev.name || '前の駅'} ${prev.depTime}発 → ${st.name || '次の駅'} ${st.arrTime}着 と、時刻が戻っています` });
            }
          }
          /* ---- ここから、引いてきた実データとの照合 ----
             バスはバス停であって駅ではない。同じ名前の駅（徳島＝JR徳島駅／
             バス停の徳島駅前）に当ててしまうと、路線名も駅数もまるで違う話になるので、
             鉄道のデータは鉄道の移動にだけ当てる */
          const railCheck = e.type !== 'bus';
          const info = railCheck ? stationInfo(st.name) : null;
          const nextSt = stops[si + 1];
          const nextInfo = (railCheck && nextSt) ? stationInfo(nextSt.name) : null;
          const hereLines = railCheck ? linesAt(st.name, si > 0 ? rPos[si - 1] : null) : [];
          if (st.line && info && info.found && hereLines.length && !(st.through && si > 0 && stops[si - 1] && stops[si - 1].line)) {
            /* この駅・次の駅、それぞれの路線一覧に当ててみる。
               両方に通っていれば同じ路線、片方ずつなら直通（例：東海道・山陽新幹線）、
               どちらにも無いときだけ「通っていない」と言い切る */
            const linesB = (nextSt && nextSt.name) ? linesAt(nextSt.name, rPos[si]) : [];
            const shared = hereLines.filter(l => linesB.some(x => lineKey(x) === lineKey(l)));
            const apiShared = matchLine(st.line, shared);
            const apiA = matchLine(st.line, hereLines);
            const apiB = matchLine(st.line, linesB);
            if (!apiA && !apiB) {
              push({ level: 'error', type: 'rail', key: 'noline:' + e.id + ':' + si + ':' + st.name + ':' + st.line, ids: [e.id],
                     msg: `${info.name} に「${st.line}」は通っていません（${hereLines.slice(0, 3).join('・')}${hereLines.length > 3 ? ' ほか' : ''}）`,
                     stop: si,
                     how: `この駅を通るのは ${hereLines.slice(0, 5).join('・')} です。路線名を直すか、`
                        + `バスの系統なら「バス」の移動に変えてください`,
                     fixes: [
                       ...(hereLines.length === 1
                         ? [{ label: `「${hereLines[0]}」にする`, detail: `「${st.line}」→「${hereLines[0]}」`,
                              run: () => { st.line = hereLines[0]; } }]
                         : []),
                       { label: 'バスの移動に変える',
                         detail: `「${st.line}」がバスの系統なら、この移動を「バス」にします（駅ではなくバス停として扱われ、鉄道の路線とは照らし合わせません）`,
                         run: () => { e.type = 'bus'; } },
                     ] });
            } else if (!apiA && apiB) {
              /* 路線は合っているのに、この駅の名前だけ違う（例：浜松町 と モノレール浜松町） */
              const seqB = railIdx.line[apiB] || null;
              const cand = seqB ? seqB.find(nm => {
                const a = placeKey(nm), b = placeKey(st.name);
                return a.length >= 2 && b.length >= 2 && (a.includes(b) || b.includes(a));
              }) : null;
              if (cand && cand !== st.name) {
                push({ level: 'info', type: 'rail', key: 'stname:' + e.id + ':' + si + ':' + cand, ids: [e.id], stop: si,
                       msg: `${apiB} では「${cand}」という駅名です`,
                       fix: { label: `「${cand}」にする`, detail: `「${st.name}」→「${cand}」`,
                              run: () => { st.name = cand; } } });
              }
            } else if (apiShared) {
              const seq = railIdx.line[apiShared] || null;
              const i1 = seq ? seq.indexOf(info.name) : -1;
              const i2 = seq ? seq.indexOf(nextInfo.name) : -1;
              if (seq && seq.length && i1 >= 0 && i2 >= 0) {
                const n = Math.abs(i2 - i1);
                const wrote = String(st.stations || '').match(/\d+/);
                const setN = { label: `${n}駅にする`, detail: `「${st.stations}」→「${n}駅」（各駅に停まる場合の数）`,
                               run: () => { st.stations = n + '駅'; } };
                if (!st.stations) {
                  /* 速い種別と分かっているときは、各駅の数を勧めない（停車駅は少ないため） */
                  if (!isFastKind(st.kind)) {
                    push({ level: 'info', type: 'rail', key: 'stfill:' + e.id + ':' + si + ':' + n, ids: [e.id], stop: si,
                           msg: `${info.name} → ${nextInfo.name} は ${apiShared} で ${n}駅です`,
                           fix: { label: `${n}駅と書く`, detail: `駅数を「${n}駅」にします`,
                                  run: () => { st.stations = n + '駅'; } } });
                  }
                } else if (wrote && Number(wrote[0]) > n) {
                  /* 各駅ぶんより多いのは、速い種別でもありえない */
                  push({ level: 'warn', type: 'rail', key: 'stnum:' + e.id + ':' + si + ':' + wrote[0] + ':' + n, ids: [e.id], stop: si,
                         msg: `${info.name} → ${nextInfo.name} は ${apiShared} で ${n}駅です。「${st.stations}」は多すぎます`,
                         how: `この区間は各駅に停まっても ${n}駅です。数え違いか、駅の並びが違うかもしれません`,
                         fix: setN });
                } else if (wrote && Number(wrote[0]) < n) {
                  if (isFastKind(st.kind)) {
                    /* 快速・特急なら停車駅が少ないのは当たり前。何も言わない */
                  } else if (isLocalKind(st.kind)) {
                    push({ level: 'warn', type: 'rail', key: 'stnum:' + e.id + ':' + si + ':' + wrote[0] + ':' + n, ids: [e.id], stop: si,
                           msg: `${st.kind}なら ${info.name} → ${nextInfo.name} は ${n}駅です（「${st.stations}」になっています）`,
                           how: `${st.kind}は全部の駅に停まります。快速などに乗るなら、種別を直してください`,
                           fixes: [ setN,
                                    { label: '快速などに変える', detail: `種別を「快速」にします（停車駅が少ないのは当たり前になります）`,
                                      run: () => { st.kind = '快速'; } } ] });
                  } else {
                    /* 種別が書かれていないときは、どちらとも決めつけない */
                    push({ level: 'info', type: 'rail', key: 'stnum:' + e.id + ':' + si + ':' + wrote[0] + ':' + n, ids: [e.id], stop: si,
                           msg: `${info.name} → ${nextInfo.name} は各駅なら ${n}駅です（「${st.stations}」は快速などの停車駅数ですか）`,
                           how: '快速・急行・特急に乗るなら、種別を書いておくとこの指摘は出なくなります',
                           fixes: [ { label: '快速などなので、種別を書く', detail: '種別を「快速」にします（あとから急行・特急などに直せます）',
                                      run: () => { st.kind = st.kind || '快速'; } },
                                    setN ] });
                  }
                }
                /* 行先が進む向きと逆になっていないか */
                if (st.dest) {
                  const dk = placeKey(st.dest);
                  let di2 = -1;
                  seq.forEach((nm, k) => { if (placeKey(nm).length >= 2 && dk.includes(placeKey(nm))) di2 = k; });
                  if (di2 >= 0 && ((i2 - i1) * (di2 - i1) < 0)) {
                    const term = seq[i2 > i1 ? seq.length - 1 : 0];
                    push({ level: 'warn', type: 'rail', key: 'dir:' + e.id + ':' + si + ':' + st.dest, ids: [e.id], stop: si,
                           msg: `「${st.dest}」は ${info.name} から見て ${nextInfo.name} と逆の向きです`,
                           fix: { label: `${term}行にする`, detail: `「${st.dest}」→「${term}行」`,
                                  run: () => { st.dest = term + '行'; } } });
                  }
                }
              }
            } else if (apiA && nextSt && nextSt.name && nextInfo && nextInfo.found && !apiB) {
              /* この駅では通っているのに、次の駅がその路線上にない。
                 ふたつの路線がどこかでつながっていれば「直通」なので、
                 乗り換えが要るとは言い切らない（例：徳島線→高徳線は佐古でつながる） */
              const th = throughTo(apiA, nextInfo.lines);
              if (th && st.through) {
                /* 直通と分かっているので、何も言わない */
              } else if (th && placeKey(th.junction) === placeKey(info.name)) {
                /* 乗り入れ口が、いま乗るこの駅そのもの（例：京浜東北線は横浜から根岸線へ入る）。
                   ここで「乗り換え」と言うのは実態に合わない。路線名を直す話として出す */
                push({ level: 'info', type: 'rail', key: 'thisjct:' + e.id + ':' + si + ':' + th.line, ids: [e.id], stop: si,
                       msg: `${apiA} は ${info.name} から先、${th.line} に入ります（${nextInfo.name} まで乗り換えなしで行けます）`,
                       how: `この区間は ${th.line} として書くと、駅数や行先の候補も合います`,
                       fixes: [
                         { label: `${th.line} にする`,
                           detail: `${info.name} から乗る路線を「${apiA}」→「${th.line}」にします`,
                           run: () => { st.line = th.line; } },
                       ] });
              } else if (th) {
                const insert = (through) => () => {
                  const k = e.route.indexOf(st);
                  if (k >= 0) e.route.splice(k + 1, 0,
                    Object.assign(blankStop(th.junction), { line: th.line, through }));
                };
                push({ level: 'info', type: 'rail', key: 'through:' + e.id + ':' + si + ':' + th.junction, ids: [e.id], stop: si,
                       msg: `${apiA} と ${th.line} は ${th.junction} でつながっています`,
                       how: `直通列車なら ${th.junction} で降りずに行けます。直通でない列車に乗るなら、${th.junction} での乗り換えとして足してください`,
                       fixes: [
                         { label: `${th.junction} を直通で足す`,
                           detail: `${info.name} と ${nextInfo.name} のあいだに ${th.junction} を入れます（降りない「直通」）`,
                           run: insert(true) },
                         { label: `${th.junction} で乗り換える`,
                           detail: `${th.junction} を乗換駅として入れます（着・発の時刻を書くと猶予が出ます）`,
                           run: insert(false) },
                       ] });
              } else {
                push({ level: 'error', type: 'rail', key: 'nolink:' + e.id + ':' + si + ':' + apiA + ':' + nextSt.name, ids: [e.id], stop: si,
                       how: `路線名を直すか、${info.name} と ${nextInfo.name} の間に乗換駅を足してください。`
                          + `同じ列車で行けるなら、その駅を足して「直通」にします`,
                       msg: `${apiA} に ${nextInfo.name} という駅はありません` });
              }
            }
          }
          /* 距離と時間が釣り合っているか。
             同じ名前の駅が全国にあるので、となり合う駅を手がかりに位置を決める */
          const posA = rPos[si] || null;
          const posB = rPos[si + 1] || null;
          if (posA && posB && nextSt && st.depTime && nextSt.arrTime) {
            const km = distKm(posA, posB);
            let mins = toMin(nextSt.arrTime) - toMin(st.depTime);
            if (mins < 0) mins += 1440;
            if (km !== null && km > 1 && mins > 0) {
              const kmh = km / (mins / 60);
              const lim = speedLimit(e, st.line);
              if (kmh > lim) {
                /* 距離がおかしいときは、まず「位置の取り違え」を疑う。
                   地図で名前を引いただけの地点は、よその土地の同名かもしれないので、
                   時間のことは言わず、場所を決めてもらう。
                   ——バス停は同じ名前が全国にある（医学部前・市役所前…） */
                const vague = [st, nextSt].filter(x => x.name && geoOnly(x.name));
                /* 同じ名前が各地にあるほうを名指しする（片方が決まっているなら、そちらは言わない） */
                const worst = vague.filter(x => !posConfident(x.name));
                const say = worst.length ? worst : vague;
                if (say.length) {
                  const who = say.map(x => x.name).join('・');
                  push({ level: 'info', type: 'rail', key: 'where:' + say.map(x => placeKey(x.name)).join('/'), ids: [e.id], stop: si,
                         how: '同じ名前の駅・停留所が各地にあるためです。'
                            + 'その行の「同じ名前が各地にあります」から正しい土地を選ぶと、移動時間も見られるようになります。'
                            + '候補に無いときは、そのままで問題ありません',
                         msg: `「${who}」が地図のどこを指すか決まっていません。移動時間の点検は控えています` });
                } else {
                  push({ level: 'warn', type: 'rail', key: 'speed:' + e.id + ':' + si + ':' + mins, ids: [e.id], stop: si,
                         how: '時刻の打ち間違いか、途中の乗換が抜けているかもしれません',
                         msg: `${(info && info.name) || st.name} → ${(nextInfo && nextInfo.name) || nextSt.name} は直線でも ${km.toFixed(0)}km です。${mins}分は短すぎるかもしれません` });
                }
              }
            }
          }
          /* 直通の駅は、降りないので乗換の猶予を見ない */
          /* 乗換の猶予 */
          if (isTransferStop(stops, si) && !st.quick) {
            const m = transferMins(stops, si);
            const samePf = st.arrPlatform && st.depPlatform && placeKey(st.arrPlatform) === placeKey(st.depPlatform);
            const limit = samePf ? 2 : 5;          // 同じホームでの乗換は短くても足りる
            if (m !== null && m < limit) {
              push({ level: 'warn', type: 'transfer', key: 'tight:' + e.id + ':' + si + ':' + m, ids: [e.id], stop: si,
                     how: '向かいのホームに乗り換えるだけ（対面乗換）なら、1〜2分でも間に合います。'
                        + 'そうでなければ、1本あとの列車にするか、前の列車を早めてください',
                     msg: `「${nm}」の ${st.name || '乗換駅'} での乗換が ${m}分しかありません` + (samePf ? '（同じホーム）' : ''),
                     fixes: [
                       { label: '対面乗換にする',
                         detail: `${st.name || 'この駅'} は、降りたホームの向かい（または同じホーム）で乗り換えられる駅として覚えます。`
                               + '以降、この駅の短い乗換は指摘しません',
                         run: () => { st.quick = true; } },
                     ] });
            }
          }
        });
        /* 経路の時刻と、予定そのものの時刻が食い違う */
        if (stops.length) {
          const dep = stops.find(st => st.depTime), arr = [...stops].reverse().find(st => st.arrTime);
          const wantS = dep ? dep.depTime : '', wantE = arr ? arr.arrTime : '';
          const bad = (wantS && e.startTime && wantS !== e.startTime) || (wantE && e.endTime && wantE !== e.endTime);
          if (bad) {
            push({ level: 'warn', type: 'route', key: 'timesync:' + e.id + ':' + wantS + wantE + e.startTime + e.endTime, ids: [e.id],
                   msg: `「${nm}」の時刻（${e.startTime || '—'}〜${e.endTime || '—'}）が、経路の ${wantS || '—'}発〜${wantE || '—'}着 と合っていません`,
                   fix: { label: '経路に合わせる',
                          detail: `${e.startTime || '—'}〜${e.endTime || '—'} → ${wantS || e.startTime || '—'}〜${wantE || e.endTime || '—'}`,
                          run: () => { if (wantS) e.startTime = wantS; if (wantE) e.endTime = wantE; } } });
          }
          if (!e.startTime && wantS) {
            push({ level: 'info', type: 'route', key: 'timefill:' + e.id + ':' + wantS, ids: [e.id],
                   msg: `「${nm}」は経路から時刻を入れられます（${wantS}発）`,
                   fix: { label: '経路から入れる', detail: `時刻を ${wantS}${wantE ? '〜' + wantE : ''} にします`,
                          run: () => { e.startTime = wantS; if (wantE) e.endTime = wantE; } } });
          }
        }
        /* 費用の桁ちがいの疑い */
        const c = Number(e.cost) || 0;
        if (c >= 100000 && c % 10000 === 0 && MOVE_TYPES.includes(e.type) && e.type !== 'plane') {
          push({ level: 'info', type: 'cost', key: 'cost:' + e.id + ':' + c, ids: [e.id],
                 msg: `「${nm}」の ${yen(c)} は桁が多いかもしれません`,
                 fix: { label: yen(c / 10) + 'にする', detail: `${yen(c)} → ${yen(c / 10)}`,
                        run: () => { e.cost = c / 10; } } });
        }
      });

      /* --- 時間の重なり --- */
      if (!day.ignoreOverlap) {
        for (let i = 0; i < evs.length; i++) {
          for (let j = i + 1; j < evs.length; j++) {
            const a = evRange(evs[i]), b = evRange(evs[j]);
            if (!a || !b) continue;
            if (a[0] < b[1] && b[0] < a[1]) {
              push({ level: 'warn', type: 'overlap', key: 'ov:' + evs[i].id + ':' + evs[j].id, ids: [evs[i].id, evs[j].id],
                     how: 'どちらかの時刻を直すか、フェスのように重なって当たり前の日は「重なりは気にしない」を押してください',
                     msg: `「${shortName(evs[i].title)}」と「${shortName(evs[j].title)}」の時間が重なっています` });
            }
          }
        }
      }
      /* --- 並び順が時刻とちがう --- */
      for (let i = 0; i < evs.length - 1; i++) {
        const a = toMin(evs[i].startTime), b = toMin(evs[i + 1].startTime);
        if (a !== null && b !== null && b < a && !crossesDay(evs[i])) {
          push({ level: 'warn', type: 'order', key: 'order:' + evs[i].id + ':' + evs[i + 1].id, ids: [evs[i].id, evs[i + 1].id],
                 msg: `「${shortName(evs[i + 1].title)}」（${evs[i + 1].startTime}）が「${shortName(evs[i].title)}」（${evs[i].startTime}）より後ろに並んでいます`,
                 fix: { label: '時刻順に並べ替える', detail: 'この日の予定を時刻の早い順に並べ直します',
                        run: () => { sortDay(state.days[di]); } } });
        }
      }
      /* --- 場所が変わるのに移動が無い ---
         ごく近い（歩いてすぐ）ときは、わざわざ移動を書かないほうが自然なので言わない */
      for (let i = 0; i < evs.length - 1; i++) {
        const gap = moveGap(day, i);
        if (!gap) continue;
        const { from, to, km } = gap;
        const sureBoth = posConfident(from) && posConfident(to);
        const far = (sureBoth && km !== null) ? `（約${km < 10 ? km.toFixed(1) : km.toFixed(0)}km）` : '';
        push({ level: 'info', type: 'move', move: i, key: 'move:' + evs[i].id + ':' + evs[i + 1].id, ids: [evs[i].id, evs[i + 1].id],
               how: '「移動を入れる」で2地点と手段を選ぶと、所要時間の目安つきで足せます',
               msg: `「${from}」から「${to}」への移動が入っていません${far}` });
      }
      /* --- 移動のつなぎ目 ---
         「移動の終点」と「次の予定の場所」が食い違っていないか。
         行き先を変えたのに到着地点を直し忘れる、という取り違えを拾う。
         どちらも移動でないときは、ひとつ上の「移動が入っていない」に任せる */
      for (let i = 0; i < evs.length - 1; i++) {
        const a = evs[i], b = evs[i + 1];
        const aMove = isTransfer(a), bMove = isTransfer(b);
        if (!aMove && !bMove) continue;
        const p = placeOf(a, 'end'), q = placeOf(b, 'start');
        if (!p || !q || sameSpot(p, q)) continue;
        if (placesWarming() && (!placePos(p) || !placePos(q))) continue;
        const km = (posConfident(p) && posConfident(q)) ? placeDist(p, q) : null;
        /* 1日の始まり・終わりで、片方が「自宅」のように地図に無い場所のときは、
           家と駅のあいだを省いているだけなので気づき止まりにする。
           駅どうしの食い違い（行き先を変えて直し忘れた等）は、直す案まで出す */
        /* 「自宅」「◯◯のホテル」のような、駅ではない寝起きの場所かどうかで見る
           （地図が引けない環境でも同じ判断になるように、名前で決める） */
        const vague = (t) => {
          const v = String(t || '').trim();
          return VAGUE_PLACES.includes(v) || /(自宅|実家|家$|ホテル|宿$|旅館|民宿|ゲストハウス)/.test(v);
        };
        const edge = (a.anchor === 'start' && bMove) || (b.anchor === 'end' && aMove);
        const soft = edge && (vague(p) || vague(q));
        const far = km !== null ? `（約${km < 10 ? km.toFixed(1) : km.toFixed(0)}km）` : '';
        const bName = shortName(b.title);
        push({
          level: soft ? 'info' : 'warn', type: 'chain', move: i,
          key: 'chain:' + a.id + ':' + b.id + ':' + placeKey(p) + ':' + placeKey(q), ids: [a.id, b.id],
          msg: `「${shortName(a.title)}」は ${p} で終わり、「${bName}」は ${q} から始まります${far}`,
          how: soft
            ? `${p} から ${q} までの移動を足すか、このままで良ければ無視してください`
            : `移動の行き先か、次の予定の場所のどちらかを直してください（あいだに移動を足す手もあります）`,
          fix: soft ? null : {
            label: `次を「${p}」にする`,
            detail: `「${bName}」の場所を ${q} → ${p} にします`,
            run: () => {
              const stops = (b.route || []).filter(x => x.name);
              if (stops.length) stops[0].name = p;
              else b.location = b.location && b.location.includes(q)
                ? b.location.replace(q, p) : p;
              if (b.title && b.title.includes(q)) b.title = b.title.split(q).join(p);
            },
          },
        });
      }

      /* --- 前の日の終わりと、この日の始まりが違う --- */
      const prevDay = state.days[di - 1];
      if (prevDay && prevDay.events.length && evs.length) {
        const from = placeOf(prevDay.events[prevDay.events.length - 1], 'end');
        const to = placeOf(evs[0], 'start');
        const km = placeDist(from, to);
        if (from && to && !samePlace(from, to) && !(km !== null && km < 0.6)) {
          push({ level: 'info', type: 'continuity', key: 'cont:' + prevDay.events[prevDay.events.length - 1].id + ':' + evs[0].id,
                 ids: [evs[0].id],
                 how: '前の日の終わりに移動を足すか、この日の最初の場所を直してください（宿泊が同じ場所なら気にしなくて大丈夫です）',
                 msg: `前の日は「${from}」で終わり、この日は「${to}」から始まります` +
                      (km !== null ? `（約${km < 10 ? km.toFixed(1) : km.toFixed(0)}km 離れています）` : '') });
        }
      }
      return out;
    }
    /* 無視した指摘の出し入れ */
    const showIgnored = ref(false);
    const ignoredSet = computed(() => new Set(state.ignored || []));
    function ignoreIssue(key) {
      if (!key || ignoredSet.value.has(key)) return;
      state.ignored.push(key);
      flash('この指摘を無視します', 'fa-bell-slash', { label: '戻す', fn: () => unignoreIssue(key) });
    }
    function unignoreIssue(key) {
      const i = (state.ignored || []).indexOf(key);
      if (i >= 0) state.ignored.splice(i, 1);
    }
    function clearIgnored() {
      state.ignored.splice(0, state.ignored.length);
      flash('無視した指摘をすべて戻しました', 'fa-bell');
    }
    /* 直し方は1つとは限らない。fixes があればその中から選ぶ */
    const fixList = (iss) => (iss && iss.fixes && iss.fixes.length) ? iss.fixes : (iss && iss.fix ? [iss.fix] : []);
    function applyFix(issue, which) {
      const f = (typeof which === 'object' && which) ? which : fixList(issue)[which || 0];
      if (!f) return;
      snapshot('指摘を直す');
      try { f.run(); } catch (err) { flash('直せませんでした', 'fa-triangle-exclamation'); return; }
      flash('直しました', 'fa-wand-magic-sparkles');
    }
    /* 経路の駅名・路線が変わったら、必要なデータを静かに引いておく */
    watch(() => state.days.map(d => d.events.map(
        e => (e.route || []).map(st => (st.name || '') + '|' + (st.line || '')).join(',')).join(';')).join('/'),
      () => refreshRailData(), { immediate: true });
    const rawIssuesByDay = computed(() => state.days.map((d, i) => dayIssues(d, i)));
    const ignoredCount = computed(() => rawIssuesByDay.value.reduce(
      (n, list) => n + list.filter(x => ignoredSet.value.has(x.key)).length, 0));
    const issuesByDay = computed(() => rawIssuesByDay.value.map(list => {
      const shown = showIgnored.value ? list : list.filter(x => !ignoredSet.value.has(x.key));
      return shown.slice().sort((a, b) => (LEVEL_RANK[a.level] - LEVEL_RANK[b.level]));
    }));
    const warnsOf = (i) => (issuesByDay.value[i] || []).filter(x => x.level === 'warn' || x.level === 'error');
    const overlapWarnsOf = (i) => (issuesByDay.value[i] || []).filter(x => x.type === 'overlap');
    const activeIssues = computed(() => issuesByDay.value[activeDay.value] || []);
    const issueCounts = computed(() => {
      const c = { error: 0, warn: 0, info: 0 };
      activeIssues.value.forEach(x => { if (!ignoredSet.value.has(x.key)) c[x.level] = (c[x.level] || 0) + 1; });
      return c;
    });
    /* いちばん重い指摘がある日へ飛ぶ */
    function jumpToWorstIssue() {
      const lists = rawIssuesByDay.value;
      for (const lv of ['error', 'warn']) {
        for (let i = 0; i < lists.length; i++) {
          const hit = lists[i].find(x => x.level === lv && !ignoredSet.value.has(x.key));
          if (hit) {
            activeDay.value = i;
            nextTick(() => { highlight(hit.ids && hit.ids[0]); });
            return;
          }
        }
      }
    }
    /* 旅程ぜんぶの「要修正」件数（ヘッダーのバッジ用） */
    const tripIssueCounts = computed(() => {
      const c = { error: 0, warn: 0, info: 0 };
      rawIssuesByDay.value.forEach(list => list.forEach(x => {
        if (!ignoredSet.value.has(x.key)) c[x.level] = (c[x.level] || 0) + 1;
      }));
      return c;
    });
    const dayEventById = (di, id) => {
      const day = state.days[di];
      return day ? day.events.find(e => e.id === id) : null;
    };
    /* ---- 直し方の案内（「要修正」やバッジから開く） ---- */
    const fixDlg = reactive({ open: false, evId: '', dayIdx: 0 });
    function openFixDialog(dayIdx, ev) {
      if (!ev) return;
      fixDlg.dayIdx = dayIdx; fixDlg.evId = ev.id; fixDlg.open = true;
    }
    const fixIssues = computed(() => {
      if (!fixDlg.open) return [];
      const list = rawIssuesByDay.value[fixDlg.dayIdx] || [];
      return list.filter(x => (x.ids || []).includes(fixDlg.evId))
        .slice().sort((a, b) => LEVEL_RANK[a.level] - LEVEL_RANK[b.level]);
    });
    const fixTarget = computed(() => {
      const day = state.days[fixDlg.dayIdx];
      return day ? day.events.find(e => e.id === fixDlg.evId) : null;
    });
    /* その指摘の場所（何駅目か）を言葉にする */
    function issueWhere(iss) {
      const ev = fixTarget.value;
      if (!ev) return '';
      if (iss.stop !== undefined && ev.route && ev.route[iss.stop]) {
        const st = ev.route[iss.stop];
        return `${iss.stop + 1}駅目「${st.name || '（駅名なし）'}」`;
      }
      if (iss.type === 'move') return 'この予定と次の予定のあいだ';
      if (iss.type === 'overlap' || iss.type === 'order') return 'この日の並び';
      return 'この予定';
    }
    /* 手で直す：編集画面を開く（駅の指摘ならその駅へ寄せる） */
    function fixByHand(iss) {
      const ev = fixTarget.value;
      const di = fixDlg.dayIdx;
      fixDlg.open = false;
      if (!ev) return;
      openEdit(di, ev);
      if (iss && iss.stop !== undefined) {
        nextTick(() => {
          const el = document.getElementById('stop-' + iss.stop);
          if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
        });
      }
    }
    /* 時刻表からえらび直す（乗換が短い・時刻が戻る、などに効く） */
    function fixByTimetable(iss) {
      const ev = fixTarget.value;
      const di = fixDlg.dayIdx;
      fixDlg.open = false;
      if (!ev) return;
      openEdit(di, ev);
      nextTick(() => openTrainWizard(di, Math.max(0, (iss && iss.stop !== undefined) ? iss.stop - 1 : 0)));
    }
    function fixMove(iss) {
      const di = fixDlg.dayIdx;
      fixDlg.open = false;
      openMoveWizard(di, iss.move);
    }

    /* 予定ごとの、いちばん重い指摘（カードに印を出すため） */
    const issueLevelById = computed(() => {
      const map = {};
      rawIssuesByDay.value.forEach(list => list.forEach(x => {
        if (ignoredSet.value.has(x.key)) return;
        (x.ids || []).forEach(id => {
          if (!map[id] || LEVEL_RANK[x.level] < LEVEL_RANK[map[id]]) map[id] = x.level;
        });
      }));
      return map;
    });
    const conflictIds = computed(() => {
      const set = new Set();
      activeIssues.value.filter(x => x.type === 'overlap').forEach(i => i.ids.forEach(id => set.add(id)));
      return set;
    });
    /* 重なりが正しい日（フェスの被りなど）は警告しない */
    function toggleIgnoreOverlap(dayIdx) {
      const day = state.days[dayIdx];
      if (!day) return;
      day.ignoreOverlap = !day.ignoreOverlap;
      flash(day.ignoreOverlap ? 'この日は時間の重なりを気にしません' : '時間の重なりを見るようにしました',
            day.ignoreOverlap ? 'fa-bell-slash' : 'fa-bell');
    }
    /* いま重なりがあるか（気にしない設定でも判定はする） */
    function hasOverlap(day) {
      const evs = day.events;
      for (let i = 0; i < evs.length; i++) {
        for (let j = i + 1; j < evs.length; j++) {
          const a = evRange(evs[i]), b = evRange(evs[j]);
          if (a && b && a[0] < b[1] && b[0] < a[1]) return true;
        }
      }
      return false;
    }

    /* 着いてすぐ次へ移るかどうか（滞在5分未満）。
       乗り継ぎや、荷物を置いてすぐ出る、といった動きは実際によくある。
       「空き」も「抜け」も出ないので、何も無い代わりにこれを出す */
    function tightNext(day, i) {
      const a = day && day.events[i], b = day && day.events[i + 1];
      if (!a || !b) return false;
      const ra = evRange(a), rb = evRange(b);
      if (!ra || !rb) return false;
      const d = rb[0] - ra[1];
      return d >= 0 && d < 5;
    }
    /* 表示順で隣り合う予定のあいだの空き時間（分） */
    function gapAfter(day, i) {
      const a = day.events[i], b = day.events[i + 1];
      if (!a || !b) return null;
      const ra = evRange(a), rb = evRange(b);
      if (!ra || !rb) return null;
      const d = rb[0] - ra[1];
      return (d < 5 || d > 20 * 60) ? null : d;
    }

    /* ---------- 地点と移動 ---------- */
    /* 予定の「出発する場所」/「着いた場所」を取り出す（"A → B" 表記と乗換チェーンに対応） */
    function placeOf(ev, which) {
      if (!ev) return '';
      const stops = routeStops(ev).filter(st => st.name);
      if (stops.length) {
        const v = which === 'start' ? stops[0].name : stops[stops.length - 1].name;
        if (v) return String(v).trim();
      }
      const raw = String(ev.location || '').trim();
      if (!raw) return '';
      const parts = raw.split(/\s*(?:→|->|〜|~)\s*/).map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) return raw;
      return which === 'start' ? parts[0] : parts[parts.length - 1];
    }
    /* その予定が場所を移しているか（"A → B" や乗換チェーンを持つ） */
    function bridges(ev) {
      const s = placeOf(ev, 'start'), t = placeOf(ev, 'end');
      return !!(s && t && s !== t);
    }
    /* 「移動」として数えるか。
       役割（出発地点/到着地点）が付いていて場所を1つしか持たないものは
       移動手段ではなく「地点」とみなす（既定のカテゴリで移動時間や費用が汚れないように） */
    function isTransfer(ev) {
      if (!ev || !MOVE_TYPES.includes(ev.type)) return false;
      if (ev.anchor && !bridges(ev)) return false;
      return true;
    }
    /* 隣り合う予定で場所が変わるのに移動が入っていない？ */
    /* 表記ゆれを均す：全角/半角・記号・よくある接尾を落とす */
    function placeKey(v) {
      return String(v || '')
        .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .toLowerCase()
        .replace(/[\s\u3000()（）\[\]【】,、.。・:：/／-]/g, '')
        .replace(/(周辺|付近|前|口|内|構内|ビル|店|そば)$/, '')
        .replace(/駅$/, '');
    }
    /* 同じ場所とみなせるか。片方がもう片方を含むときも「同じ敷地」と見る
       （例：さいたまスーパーアリーナ 物販列 ⊃ さいたまスーパーアリーナ） */
    function samePlace(a, b) {
      const p = placeKey(a), q = placeKey(b);
      if (!p || !q) return false;
      if (p === q) return true;
      const short = p.length <= q.length ? p : q, long = p.length <= q.length ? q : p;
      return short.length >= 3 && long.includes(short);
    }
    function needsMove(day, i) {
      const a = day.events[i], b = day.events[i + 1];
      if (!a || !b) return false;
      if (isTransfer(a) || isTransfer(b)) return false;
      const p = placeOf(a, 'end'), q = placeOf(b, 'start');
      return !!(p && q && !samePlace(p, q));
    }
    /* 同じ場所とみなせるか。
       ①表記が同じ／片方が片方を含む ②地図で600m未満
       ③地図で分からないときは「天神」と「天神のホテル」のような前方一致を助け舟にする */
