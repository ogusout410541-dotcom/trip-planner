        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[85dvh] flex flex-col" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h2 class="font-black text-ink text-lg">旅程の管理</h2>
            <button @click="showTripPanel=false" aria-label="閉じる" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div v-if="tripIndex.length > 1" class="flex items-center gap-2 mb-2 text-[10px] text-slate-400">
            <i class="fa-solid fa-arrows-up-down"></i>
            <span>つまんで動かすか、左の <i class="fa-solid fa-chevron-up text-[8px]"></i><i class="fa-solid fa-chevron-down text-[8px]"></i> で並べ替えられます</span>
            <button @click="sortTripsByDate" title="出発日の早い順に並べます（元に戻せます）"
                    class="tap ml-auto shrink-0 px-2 py-1 rounded-lg font-bold text-indigo-500 hover:bg-indigo-50 transition">
              <i class="fa-solid fa-arrow-down-1-9 mr-1"></i>日付順
            </button>
          </div>
          <!-- 旅程リスト -->
          <div class="overflow-y-auto scroll-thin flex-1 space-y-2 mb-5 pr-1">
            <div v-for="(trip, ti) in tripIndex" :key="trip.id"
                 role="button" tabindex="0" draggable="true"
                 :data-focus-first="trip.id === currentTripId ? '' : null"
                 :aria-label="trip.title + (trip.id === currentTripId ? '（表示中）' : ' に切り替える') + '　Alt＋上下キーで並べ替え'"
                 class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer transition focus:outline-none focus:ring-2 focus:ring-indigo-400"
                 :class="[trip.id === currentTripId
                   ? (isDark ? 'border-indigo-500' : 'border-indigo-400 bg-indigo-50')
                   : (isDark ? 'border-transparent hover:border-slate-600' : 'border-transparent bg-slate-50 hover:bg-slate-100'),
                   tripDragFrom === ti ? 'opacity-40' : '']"
                 @click="switchTrip(trip.id)"
                 @keydown.enter.prevent="switchTrip(trip.id)"
                 @keydown.space.prevent="switchTrip(trip.id)"
                 @keydown.alt.up.prevent="moveTrip(trip.id, -1)"
                 @keydown.alt.down.prevent="moveTrip(trip.id, 1)"
                 @dragstart="onTripDragStart(ti, $event)" @dragend="onTripDragEnd"
                 @dragover="onTripDragOver($event)" @drop="onTripDrop(ti, $event)">
              <!-- 並べ替え（つまんで動かす／上下ボタン） -->
              <div class="flex flex-col shrink-0 -my-1">
                <button @click.stop="moveTrip(trip.id, -1)" :disabled="ti === 0"
                        :aria-label="trip.title + ' を上へ'" title="上へ（Alt＋↑）"
                        class="tap w-6 h-6 grid place-items-center rounded text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 disabled:opacity-25 disabled:hover:bg-transparent transition">
                  <i class="fa-solid fa-chevron-up text-[9px]"></i>
                </button>
                <button @click.stop="moveTrip(trip.id, 1)" :disabled="ti === tripIndex.length - 1"
                        :aria-label="trip.title + ' を下へ'" title="下へ（Alt＋↓）"
                        class="tap w-6 h-6 grid place-items-center rounded text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 disabled:opacity-25 disabled:hover:bg-transparent transition">
                  <i class="fa-solid fa-chevron-down text-[9px]"></i>
                </button>
              </div>
              <div class="w-8 h-8 rounded-lg grid place-items-center text-white shrink-0 text-xs font-black"
                   :style="{ background: trip.id === currentTripId ? '#4f46e5' : '#64748b' }">
                {{ ti + 1 }}
              </div>
              <!-- 名前は1行まるごと使う（スマホで「h…」の1文字まで潰れていた）。札・日付・ボタンは2行目 -->
              <div class="flex-1 min-w-0">
                <div class="font-bold text-ink text-sm leading-snug break-words line-clamp-2">
                  <i v-if="trip.id === currentTripId" class="fa-solid fa-check text-indigo-500 mr-1" title="表示中"></i>{{ trip.title }}
                </div>
                <div class="mt-1 flex items-center gap-x-2 gap-y-1 flex-wrap min-w-0">
                  <button @click.stop="toggleTripStatus(trip.id)"
                          :aria-label="trip.title + '：' + (trip.status === 'done' ? '完成（押すと作成中に戻します）' : '作成中（押すと完成にします）')"
                          :title="trip.status === 'done' ? '完成。押すと「作成中」に戻します' : 'まだ作成中。押すと「完成」にします'"
                          class="tap shrink-0 px-2 py-1.5 rounded-full text-[10px] font-black leading-none border transition"
                          :class="trip.status === 'done'
                            ? 'text-emerald-600 border-emerald-300 bg-emerald-50 hover:bg-emerald-100'
                            : 'text-amber-600 border-amber-300 bg-amber-50 hover:bg-amber-100'">
                    <i class="fa-solid mr-0.5" :class="trip.status === 'done' ? 'fa-circle-check' : 'fa-pen-ruler'"></i>{{ trip.status === 'done' ? '完成' : '作成中' }}
                  </button>
                  <span class="text-xs text-slate-400 min-w-0">{{ trip.startDate || '日付未設定' }}<span v-if="trip.endDate"> 〜 {{ trip.endDate }}</span><template v-if="trip.dayCount">・{{ trip.dayCount }}日間 {{ trip.eventCount || 0 }}件</template></span>
                  <span class="ml-auto flex items-center gap-0.5 shrink-0">
                    <button @click.stop="duplicateTrip(trip.id)" :aria-label="trip.title + ' を複製'" title="この旅程をコピーして新しく作る"
                            class="tap w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 transition">
                      <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                    <button @click.stop="deleteTrip(trip.id)" :aria-label="trip.title + ' を削除'" title="この旅程を削除"
                            class="tap w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition">
                      <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- アクション -->
          <div class="grid grid-cols-2 gap-2 border-t pt-4" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <button @click="createNewTrip"
              class="py-2.5 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2"
              style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-plus"></i>新規作成
            </button>
            <button @click="clearAllData" :title="'「' + state.title + '」は残したまま、日程と予定だけを消します'"
              class="py-2.5 rounded-xl text-sm font-bold text-rose-500 border-2 border-rose-200 hover:bg-rose-50 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-eraser"></i>この旅程を空にする
            </button>
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ 追加メニュー ============ -->
    <transition name="fade">
      <div v-if="addMenu.open" data-modal="add" role="dialog" aria-modal="true" aria-label="追加するものを選ぶ"
           class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="addMenu.open=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-plus"></i>
            </div>
            <div class="mr-auto min-w-0">
              <h2 class="font-black text-ink text-lg leading-tight">何を追加しますか？</h2>
              <div class="text-[10px] text-slate-400 font-bold">{{ addMenuWhere() }}</div>
            </div>
            <button @click="addMenu.open=false" aria-label="閉じる"
                    class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- 1日の起点・終点 -->
          <div class="text-[11px] font-black text-slate-400 mb-1.5">1日の起点・終点</div>
          <div class="grid grid-cols-2 gap-2">
            <button @click="pickAdd('start')" data-focus-first
              class="tap rounded-xl py-2.5 text-sm font-bold border-2 transition hover:shadow-md flex items-center justify-center gap-2"
              :style="{borderColor: ANCHORS.start.color, color: ink(ANCHORS.start.color), background: isDark ? 'rgba(14,165,233,0.12)' : '#f0f9ff'}">
              <i class="fa-solid" :class="ANCHORS.start.icon"></i>出発地点
            </button>
            <button @click="pickAdd('end')"
              class="tap rounded-xl py-2.5 text-sm font-bold border-2 transition hover:shadow-md flex items-center justify-center gap-2"
              :style="{borderColor: ANCHORS.end.color, color: ink(ANCHORS.end.color), background: isDark ? 'rgba(225,29,72,0.12)' : '#fff1f2'}">
              <i class="fa-solid" :class="ANCHORS.end.icon"></i>到着地点
            </button>
          </div>

          <!-- 移動 -->
          <div class="text-[11px] font-black text-slate-400 mt-4 mb-1.5">移動</div>
          <button @click="pickAdd('move')"
            class="tap w-full rounded-xl py-2.5 px-3 text-sm font-bold border-2 transition hover:shadow-md flex items-center gap-2"
            :style="{borderColor:'#6366f1', color: isDark ? '#a5b4fc' : '#4338ca', background: isDark ? 'rgba(99,102,241,0.14)' : '#eef2ff'}">
            <i class="fa-solid fa-route"></i>移動を追加
            <span class="text-[10px] font-medium opacity-70 ml-auto">2地点と手段を選ぶ</span>
          </button>
          <button @click="pickAdd('train')"
            class="tap mt-2 w-full rounded-xl py-2.5 px-3 text-sm font-bold border-2 transition hover:shadow-md flex items-center gap-2"
            :style="{borderColor: CATS.train.color, color: ink(CATS.train.color), background: isDark ? 'rgba(59,130,246,0.14)' : '#eaf1ff'}">
            <i class="fa-solid fa-magnifying-glass"></i>時刻表から列車・バスを選ぶ
            <span class="text-[10px] font-medium opacity-70 ml-auto">駅／バス停→路線→行き先→便</span>
          </button>
          <button v-if="addMenuAtEnd" @click="pickAdd('route')"
            class="tap mt-2 w-full rounded-xl py-2.5 px-3 text-sm font-bold text-white shadow-sm transition hover:opacity-90 flex items-center gap-2"
            style="background:linear-gradient(135deg,#6366f1,#a855f7)">
            <i class="fa-solid fa-map-location-dot"></i>ルートを作る
            <span class="text-[10px] font-medium opacity-80 ml-auto">出発地点→移動→到着地点をまとめて</span>
          </button>

          <!-- よく使う予定 -->
          <div class="text-[11px] font-black text-slate-400 mt-4 mb-1.5">よく使う予定</div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <button v-for="(q, qi) in QUICK_ADDS" :key="'am'+qi" @click="pickAdd('quick', q)"
              :title="CATS[q.type].label + 'として追加'"
              class="tap px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border hover:shadow-sm"
              :style="isDark
                ? {borderColor:'rgba(71,85,105,0.5)', background:'rgba(30,41,59,0.7)', color: ink(CATS[q.type].color, CATS[q.type].soft)}
                : {borderColor: CATS[q.type].ring, background: CATS[q.type].soft, color: ink(CATS[q.type].color, CATS[q.type].soft)}">
              <i class="fa-solid text-[10px]" :class="CATS[q.type].icon"></i>{{ q.label }}
            </button>
          </div>

          <!-- 自分で入力 -->
          <button @click="pickAdd('blank')"
            class="tap mt-4 w-full py-3 rounded-xl font-bold text-slate-600 border-2 border-dashed transition hover:bg-white/70 flex items-center justify-center gap-2"
            :class="isDark ? 'border-slate-600' : 'border-slate-300'">
            <i class="fa-solid fa-pen"></i>自分で入力して作る
          </button>

          <button @click="addMenu.open=false"
            class="mt-2 w-full py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition">
            キャンセル
          </button>
        </div>
      </div>
    </transition>

    <!-- ============ 移動ウィザード ============ -->
    <transition name="fade">
      <div v-if="moveWizard.open" data-modal="wizard" role="dialog" aria-modal="true"
           :aria-label="moveWizard.mode === 'route' ? 'ルートを作る' : (moveWizard.mode === 'next' ? '次はどこへ' : '移動を追加')"
           class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="moveWizard.open=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-route"></i>
            </div>
            <div class="mr-auto min-w-0">
              <h2 class="font-black text-ink text-lg leading-tight">{{ moveWizard.mode === 'route' ? 'ルートを作る' : (moveWizard.mode === 'next' ? '次はどこへ？' : '移動を追加') }}</h2>
              <div class="text-[10px] text-slate-400 font-bold">
                Day {{ (state.days[moveWizard.dayIdx] || {}).dayNumber || (moveWizard.dayIdx + 1) }}<span v-if="shortDate((state.days[moveWizard.dayIdx]||{}).date)">（{{ shortDate(state.days[moveWizard.dayIdx].date) }}）</span><span v-if="moveWizard.mode === 'next' && moveWizard.from">・「{{ moveWizard.from }}」から</span>
              </div>
            </div>
            <button @click="moveWizard.open=false" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 shrink-0" aria-label="閉じる">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- ===== 次はどこへ？（滞在 → 行き先） ===== -->
          <template v-if="moveWizard.mode === 'next'">
            <!-- STEP 1：ここでの滞在 -->
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-black text-white shrink-0" style="background:#6366f1">1</span>
              <span class="text-xs font-bold text-slate-500">「{{ moveWizard.from || 'ここ' }}」を出るのは何時ですか？</span>
            </div>
            <div class="rounded-2xl border p-3" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <div class="flex items-end gap-2">
                <label class="block w-[8rem] shrink-0">
                  <span class="text-[11px] font-bold" :style="{color: ink(ANCHORS.end.color)}">
                    <i class="fa-solid fa-clock mr-1"></i>出る時刻
                  </span>
                  <input type="time" v-model="moveWizard.fromTime" data-focus-first
                         class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
                </label>
                <div class="min-w-0 flex-1 pb-1">
                  <div class="text-[10px] font-bold text-slate-400 mb-1">滞在時間から決める</div>
                  <div class="flex items-center gap-1 flex-wrap">
                    <button v-for="m in [30, 60, 120, 180]" :key="'st'+m" @click="stayFor(m)"
                      class="tap px-2 py-1 rounded-lg text-[11px] font-bold transition tabular-nums"
                      :style="isDark ? {background:'#1e293b', color:'#94a3b8'} : {background:'#f1f4f9', color:'#536175'}">
                      {{ fmtMin(m) }}
                    </button>
                  </div>
                </div>
              </div>
              <div v-if="wizardStay" class="text-[11px] font-bold mt-2" :style="{color: ink(ANCHORS.end.color)}">
                <i class="fa-regular fa-clock mr-1"></i>ここでの滞在：{{ wizardStay }}
                <span v-if="wizardSource && wizardSource.startTime" class="text-slate-400 font-medium">（{{ wizardSource.startTime }} 〜 {{ moveWizard.fromTime }}）</span>
              </div>
            </div>

            <!-- STEP 2：行き先 -->
            <div class="flex items-center gap-2 mt-4 mb-1.5">
              <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-black text-white shrink-0" style="background:#6366f1">2</span>
              <span class="text-xs font-bold text-slate-500">次はどこへ行きますか？</span>
            </div>
            <div class="rounded-2xl border p-3" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <div class="flex items-end gap-2">
                <label class="block flex-1 min-w-0">
                  <span class="text-[11px] font-bold text-slate-500"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>行き先</span>
                  <input v-model="moveWizard.to" list="dl-station" placeholder="例：清水寺"
                         class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
                </label>
                <label class="block w-[7.5rem] shrink-0">
                  <span class="text-[11px] font-bold text-slate-400">到着時刻</span>
                  <input type="time" v-model="moveWizard.toTime"
                         class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2.5 text-sm focus:border-indigo-400 outline-none" />
                </label>
              </div>
              <div class="flex items-center gap-1 flex-wrap mt-1.5">
                <span class="text-[10px] font-bold text-slate-400 shrink-0">移動時間から決める</span>
                <button v-for="m in [10, 20, 30, 60]" :key="'tv'+m" @click="travelFor(m)"
                  class="tap px-2 py-1 rounded-lg text-[11px] font-bold transition tabular-nums"
                  :style="isDark ? {background:'#1e293b', color:'#94a3b8'} : {background:'#f1f4f9', color:'#536175'}">
                  {{ fmtMin(m) }}
                </button>
              </div>
              <div class="flex items-center gap-2 flex-wrap mt-3 pt-3 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
                <span class="text-[10px] font-bold text-slate-400 shrink-0">行き先の種類</span>
                <button v-for="k in DEST_TYPES" :key="'dt'+k" @click="moveWizard.destType = k; moveWizard.asEnd = false"
                  class="tap px-2 py-1 rounded-lg text-[11px] font-bold border transition flex items-center gap-1"
                  :style="(!moveWizard.asEnd && moveWizard.destType === k)
                    ? {borderColor: CATS[k].color, background: isDark ? 'rgba(99,102,241,0.15)' : CATS[k].soft, color: ink(CATS[k].color)}
                    : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f1f4f9', color:'#94a3b8'}">
                  <i class="fa-solid" :class="CATS[k].icon"></i>{{ CATS[k].label }}
                </button>
              </div>
              <!-- 1日の終わりかどうかは、あとからカードの⋯でも切り替えられる -->
              <button @click="moveWizard.asEnd = !moveWizard.asEnd"
                class="tap mt-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition flex items-center gap-1.5"
                :style="moveWizard.asEnd
                  ? {borderColor: ANCHORS.end.color, color: ink(ANCHORS.end.color), background: isDark ? 'rgba(225,29,72,0.12)' : '#fff1f2'}
                  : {borderColor: isDark ? '#334155' : '#e2e8f0', background:'transparent', color:'#94a3b8'}">
                <i class="fa-solid" :class="moveWizard.asEnd ? 'fa-square-check' : 'fa-square'"></i>
                ここで1日を終える（宿・帰宅）
              </button>
            </div>

            <!-- STEP 3：手段 -->
            <div class="flex items-center gap-2 mt-4 mb-1.5">
              <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-black text-white shrink-0" style="background:#6366f1">3</span>
              <span class="text-xs font-bold text-slate-500">そこまでは、どうやって移動しますか？</span>
            </div>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-1.5">
              <button v-for="k in MOVE_PICKS" :key="'np'+k" @click="pickMove(k)" :title="CATS[k].label + 'で移動'"
                class="tap rounded-xl py-3 text-center transition border-2 hover:shadow-md"
                :style="isDark
                  ? {borderColor:'rgba(71,85,105,0.5)', background:'rgba(30,41,59,0.7)'}
                  : {borderColor: CATS[k].ring, background: CATS[k].soft}">
                <i class="fa-solid block text-base" :class="CATS[k].icon" :style="{color: ink(CATS[k].color)}"></i>
                <span class="text-[10px] font-black mt-1 block leading-tight" :style="{color: ink(CATS[k].color)}">{{ CATS[k].label }}</span>
                <span v-if="estFor(k)" class="block text-[10px] font-black tabular-nums mt-0.5" :style="{color: ink(CATS[k].color)}">
                  約{{ fmtMin(estFor(k).min) }}
                </span>
              </button>
            </div>
            <div class="mt-3 rounded-xl px-3 py-2.5 text-[11px] font-bold"
                 :class="isDark ? 'bg-slate-800/60 text-slate-400' : 'bg-slate-50 text-slate-500'">
              <div class="flex items-center gap-1.5 flex-wrap">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>できあがり：
                <span class="px-1.5 py-0.5 rounded" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'">{{ moveWizard.from || 'ここ' }}<span v-if="moveWizard.fromTime"> {{ moveWizard.fromTime }}発</span></span>
                <i class="fa-solid fa-arrow-right text-[8px] text-slate-300"></i>
                <span class="px-1.5 py-0.5 rounded" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'">選んだ移動</span>
                <template v-if="moveWizard.to">
                  <i class="fa-solid fa-arrow-right text-[8px] text-slate-300"></i>
                  <span class="px-1.5 py-0.5 rounded"
                        :style="moveWizard.asEnd
                          ? {background: isDark ? 'rgba(225,29,72,.15)' : '#ffe4e6', color: ink(ANCHORS.end.color)}
                          : {background: isDark ? 'rgba(99,102,241,.15)' : CATS[moveWizard.destType].soft, color: ink(CATS[moveWizard.destType].color)}">
                    {{ moveWizard.to }}<span v-if="moveWizard.toTime"> {{ nextMark({startTime: moveWizard.fromTime, endTime: moveWizard.toTime}) }}{{ moveWizard.toTime }}着</span>
                  </span>
                </template>
              </div>
              <button @click="buildNext('')" class="tap mt-2 px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-indigo-500 hover:underline hover:bg-indigo-500/10">
                <i class="fa-solid fa-forward mr-0.5"></i>移動は書かずに行き先だけ足す
              </button>
            </div>

            <button @click="moveWizard.open=false"
              class="mt-4 w-full py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition">
              キャンセル
            </button>
          </template>

          <!-- ===== ルート作成 / 移動を追加 ===== -->
          <template v-else>
          <!-- STEP 1：2地点 -->
          <div class="flex items-center gap-2 mb-1.5">
            <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-black text-white shrink-0" style="background:#6366f1">1</span>
            <span class="text-xs font-bold text-slate-500">{{ moveWizard.mode === 'route' ? 'どこから、どこまでの1日ですか？' : 'どこから、どこまで移動しますか？' }}</span>
          </div>
          <div class="rounded-2xl border p-3" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="flex items-end gap-2">
              <label class="block flex-1 min-w-0">
                <span class="text-[11px] font-bold" :style="{color: ink(ANCHORS.start.color)}">
                  <i class="fa-solid mr-1" :class="ANCHORS.start.icon"></i>{{ moveWizard.mode === 'route' ? '出発地点' : 'どこから' }}
                </span>
                <input v-model="moveWizard.from" list="dl-station" placeholder="例：自宅 / 東京駅" data-focus-first
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
              </label>
              <label v-if="moveWizard.mode === 'route'" class="block w-[7.5rem] shrink-0">
                <span class="text-[11px] font-bold text-slate-400">出発時刻</span>
                <input type="time" v-model="moveWizard.fromTime"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2.5 text-sm focus:border-indigo-400 outline-none" />
              </label>
            </div>
            <div class="flex items-center gap-2 my-1.5">
              <div class="flex-1 h-px" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'"></div>
              <button @click="swapMovePlaces" title="出発地と到着地を入れ替える" aria-label="出発地と到着地を入れ替える"
                      class="tap w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-white/70 transition">
                <i class="fa-solid fa-arrow-down-up-across-line text-xs"></i>
              </button>
              <div class="flex-1 h-px" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'"></div>
            </div>
            <div class="flex items-end gap-2">
              <label class="block flex-1 min-w-0">
                <span class="text-[11px] font-bold" :style="{color: ink(ANCHORS.end.color)}">
                  <i class="fa-solid mr-1" :class="ANCHORS.end.icon"></i>{{ moveWizard.mode === 'route' ? '到着地点' : 'どこまで' }}
                </span>
                <input v-model="moveWizard.to" list="dl-station" placeholder="例：京都駅前のホテル"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
              </label>
              <label v-if="moveWizard.mode === 'route'" class="block w-[7.5rem] shrink-0">
                <span class="text-[11px] font-bold text-slate-400">到着時刻</span>
                <input type="time" v-model="moveWizard.toTime"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2.5 text-sm focus:border-indigo-400 outline-none" />
              </label>
            </div>
          </div>

          <!-- STEP 2：手段 -->
          <div class="flex items-center gap-2 mt-4 mb-1.5">
            <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-black text-white shrink-0" style="background:#6366f1">2</span>
            <span class="text-xs font-bold text-slate-500">そのあいだは、どうやって移動しますか？</span>
          </div>
          <div class="grid grid-cols-5 gap-1.5">
            <button v-for="k in MOVE_PICKS" :key="'mp'+k" @click="pickMove(k)"
              :title="CATS[k].label + 'で移動' + (estFor(k) ? '（地図の目安 約' + fmtMin(estFor(k).min) + '）' : '')"
              class="tap rounded-xl py-3 text-center transition border-2 hover:shadow-md"
              :style="isDark
                ? {borderColor:'rgba(71,85,105,0.5)', background:'rgba(30,41,59,0.7)'}
                : {borderColor: CATS[k].ring, background: CATS[k].soft}">
              <i class="fa-solid block text-base" :class="CATS[k].icon" :style="{color: ink(CATS[k].color)}"></i>
              <span class="text-[10px] font-black mt-1 block leading-tight" :style="{color: ink(CATS[k].color)}">{{ CATS[k].label }}</span>
              <span v-if="estFor(k)" class="block text-[10px] font-black tabular-nums mt-0.5" :style="{color: ink(CATS[k].color)}">
                約{{ fmtMin(estFor(k).min) }}
              </span>
            </button>
          </div>

          <!-- できあがりの見取り図（ルート作成のとき） -->
          <div v-if="moveWizard.mode === 'route'" class="mt-3 rounded-xl px-3 py-2.5 text-[11px] font-bold"
               :class="isDark ? 'bg-slate-800/60 text-slate-400' : 'bg-slate-50 text-slate-500'">
            <div class="flex items-center gap-1.5 flex-wrap">
              <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>できあがり：
              <template v-if="moveWizard.from">
                <span class="px-1.5 py-0.5 rounded" :style="{background: isDark ? 'rgba(14,165,233,.15)' : '#e0f2fe', color: ink(ANCHORS.start.color)}">{{ moveWizard.from }}を出発</span>
                <i class="fa-solid fa-arrow-right text-[8px] text-slate-300"></i>
              </template>
              <span class="px-1.5 py-0.5 rounded" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'">選んだ移動</span>
              <template v-if="moveWizard.to">
                <i class="fa-solid fa-arrow-right text-[8px] text-slate-300"></i>
                <span class="px-1.5 py-0.5 rounded" :style="{background: isDark ? 'rgba(225,29,72,.15)' : '#ffe4e6', color: ink(ANCHORS.end.color)}">{{ moveWizard.to }}に到着</span>
              </template>
            </div>
            <button @click="buildRoute('')" class="tap mt-2 px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-indigo-500 hover:underline hover:bg-indigo-500/10">
              <i class="fa-solid fa-forward mr-0.5"></i>移動はあとで決める（地点だけ作る）
            </button>
          </div>
          <p v-else class="text-[10px] text-slate-400 mt-2 leading-relaxed">
            <i class="fa-solid fa-circle-info mr-0.5"></i>選ぶと、地点と時刻（前後の予定から）・乗換の1区間目までを入れた状態で、編集画面が開きます
          </p>

          <button @click="moveWizard.open=false"
            class="mt-4 w-full py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition">
            キャンセル
          </button>
          </template>
        </div>
      </div>
    </transition>

    <!-- ============ 検索・絞り込み ============ -->
    <transition name="fade">
      <div v-if="showSearch" data-modal="search" role="dialog" aria-modal="true" aria-label="検索" class="no-print fixed inset-0 z-50 flex items-start justify-center p-3 sm:p-4 pt-12 sm:pt-16"
           style="background:rgba(31,36,51,.45)" @click.self="showSearch=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-2xl p-4 sm:p-5 max-h-[82dvh] flex flex-col" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">

          <!-- 入力欄 -->
          <div class="flex items-center gap-2">
            <div class="relative flex-1 min-w-0">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="searchInput" v-model="query" type="search" placeholder="予定・場所・メモ・路線名で検索"
                     class="w-full rounded-xl border border-slate-200 pl-9 pr-9 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
              <button v-if="query" @click="query=''" aria-label="入力を消す"
                      class="absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-lg text-slate-400 hover:bg-slate-100">
                <i class="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>
            <button @click="showSearch=false" class="tap w-9 h-9 rounded-xl text-slate-400 hover:bg-slate-100 shrink-0" aria-label="閉じる">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- カテゴリ絞り込み -->
          <div class="flex items-center gap-1.5 flex-wrap mt-3">
            <button v-for="k in CAT_KEYS" :key="'cf'+k" @click="toggleCatFilter(k)"
              class="tap px-2 py-1 rounded-lg text-[11px] font-bold border-2 transition flex items-center gap-1"
              :style="catFilter.includes(k)
                ? {borderColor: CATS[k].color, background: isDark ? 'rgba(99,102,241,0.15)' : CATS[k].soft, color: ink(CATS[k].color)}
                : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f1f4f9', color:'#94a3b8'}">
              <i class="fa-solid" :class="CATS[k].icon"></i>{{ CATS[k].label }}
            </button>
            <span class="w-px h-4 mx-0.5" :class="isDark ? 'bg-slate-700' : 'bg-slate-200'"></span>
            <button v-for="k in ['start','end']" :key="'af'+k" @click="toggleAnchorFilter(k)"
              class="tap px-2 py-1 rounded-lg text-[11px] font-bold border-2 transition flex items-center gap-1"
              :style="anchorFilter.includes(k)
                ? {borderColor: ANCHORS[k].color, background: isDark ? 'rgba(99,102,241,0.15)' : '#f8fafc', color: ink(ANCHORS[k].color)}
                : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f1f4f9', color:'#94a3b8'}">
              <i class="fa-solid" :class="ANCHORS[k].icon"></i>{{ ANCHORS[k].label }}
            </button>
            <button v-if="searchActive" @click="clearSearch"
              class="px-2 py-1 rounded-lg text-[11px] font-bold text-slate-400 hover:text-rose-500 transition ml-1">
              <i class="fa-solid fa-eraser mr-0.5"></i>条件をクリア
            </button>
          </div>

          <!-- 件数 -->
          <div class="flex items-center gap-2 mt-3 pt-3 border-t text-[11px] font-bold"
               :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <span v-if="searchActive" class="text-slate-500">{{ searchResults.length }}件が一致</span>
            <span v-else class="text-slate-400">キーワードを入力するか、カテゴリを選んでください</span>
            <span v-if="searchActive && searchCost" class="ml-auto text-ink tabular-nums">合計 {{ yen(searchCost) }}</span>
          </div>

          <!-- 結果 -->
          <div class="overflow-y-auto scroll-thin flex-1 mt-2 -mx-1 px-1">
            <div v-if="searchActive && !searchResults.length" class="py-10 text-center text-slate-400 text-sm font-bold">
              <i class="fa-regular fa-face-frown text-2xl block mb-2 opacity-60"></i>一致する予定がありません
            </div>
            <button v-for="(r, ri) in searchResults" :key="'sr'+r.ev.id+ri" @click="jumpTo(r.dayIdx, r.ev)"
              class="w-full text-left flex items-center gap-3 p-2.5 rounded-xl transition hover:bg-slate-100 mb-1">
              <div class="w-8 h-8 rounded-lg grid place-items-center text-white shrink-0"
                   :style="{background: r.ev.anchor ? anchorCfg(r.ev.anchor).color : cat(r.ev.type).color}">
                <i class="fa-solid text-xs" :class="r.ev.anchor ? anchorCfg(r.ev.anchor).icon : cat(r.ev.type).icon"></i>
              </div>
              <div class="min-w-0 flex-1">
                <div class="font-bold text-ink text-sm truncate">{{ r.ev.title }}</div>
                <div class="text-[11px] text-slate-400 font-medium truncate"><b class="text-slate-500">Day {{ state.days[r.dayIdx].dayNumber }}</b> {{ resultMeta(r) }}</div>
              </div>
              <span v-if="r.ev.cost > 0" class="text-[11px] font-black text-slate-500 tabular-nums shrink-0">{{ yen(r.ev.cost) }}</span>
              <i class="fa-solid fa-arrow-right text-slate-300 text-xs shrink-0"></i>
            </button>
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ 当日モード ============ -->
    <div v-if="dayMode.on" data-daymode class="dm no-print fixed inset-0 z-40 overflow-y-auto" role="region" aria-label="当日モード">
      <div class="max-w-xl mx-auto px-4 pt-3 pb-32">
        <!-- 時計 -->
        <div class="dm-top">
          <button class="dm-icon" @click="closeDayMode()" aria-label="当日モードを閉じる" title="ふだんの画面へ"><i class="fa-solid fa-xmark"></i></button>
          <div class="dm-clock">{{ dm.clock[0] }}:{{ dm.clock[1] }}<span class="dm-sec">{{ dm.clock[2] }}</span></div>
          <button class="dm-icon" :class="dayMode.wake ? 'dm-icon-on' : ''" @click="setWake(!dayMode.wake, true)" :aria-pressed="dayMode.wake ? 'true' : 'false'"
                  aria-label="画面を点けたままにする" title="画面を点けたままにする"><i class="fa-solid fa-lightbulb"></i></button>
        </div>
        <div class="dm-dayline">
          <button class="dm-icon dm-icon-s" :disabled="dm.idx <= 0" @click="dayModePick(-1)" aria-label="前の日"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="flex-1 text-center min-w-0">
            <div class="dm-dayname">Day {{ dm.idx + 1 }}<span v-if="dm.day.date">　{{ shortDate(dm.day.date) }}（{{ weekday(dm.day.date) }}）</span></div>
            <div class="dm-trip truncate">{{ state.title }}</div>
          </div>
          <button class="dm-icon dm-icon-s" :disabled="dm.idx >= state.days.length - 1" @click="dayModePick(1)" aria-label="次の日"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div v-if="dm.status === 'before'" class="dm-note"><i class="fa-solid fa-calendar-day"></i>
          <span v-if="dm.daysUntil > 0">旅行の初日まで、あと {{ dm.daysUntil }} 日です。この日の予定を表示しています</span>
          <span v-else>この日の予定を表示しています</span>
        </div>
        <div v-else-if="dm.status === 'nodate'" class="dm-note"><i class="fa-solid fa-circle-info"></i>
          <span>この日には日付が入っていないため、いまの予定を決められません。旅程の設定で出発日を入れてください</span>
        </div>
        <div v-else-if="dm.tripOver" class="dm-note"><i class="fa-solid fa-flag-checkered"></i><span>この旅程の日程はすべて終わりました</span></div>

        <!-- いま -->
        <section v-if="dm.current" class="dm-card dm-card-now" aria-label="いまの予定">
          <div class="dm-label dm-label-now"><span class="dm-dot"></span>いま</div>
          <div class="dm-title"><i class="fa-solid mr-1.5" :class="cat(dm.current.e.type).icon" :style="{ color: ink(cat(dm.current.e.type).color) }"></i>{{ dm.current.e.title }}</div>
          <div class="dm-sub">{{ dmTime(dm.current.s) }} 〜 {{ dmTime(dm.current.end) }}<span class="dm-left">終わりまで {{ untilText(dm.current.end) }}</span></div>

          <!-- 乗っている途中：次に着く駅・乗る列車 -->
          <div v-if="dm.step" class="dm-step">
            <template v-if="dm.step.kind === 'arr'">
              <div class="dm-step-head">次の駅</div>
              <div class="dm-step-main">{{ dm.current.stops[dm.step.k].st.name }}<span class="dm-step-time">{{ dmTime(dm.step.at) }} 着</span>
                <span v-if="dm.current.stops[dm.step.k].st.arrPlatform && !dm.current.stops[dm.step.k].st.through" class="dm-plat">{{ dm.current.stops[dm.step.k].st.arrPlatform }}</span></div>
              <div class="dm-count">{{ untilText(dm.step.at) }}</div>
              <div v-if="dm.step.k === dm.current.stops.length - 1" class="dm-step-then"><i class="fa-solid fa-person-walking-arrow-right mr-1"></i>ここで降ります</div>
              <div v-else-if="dm.current.stops[dm.step.k].st.through" class="dm-step-then"><i class="fa-solid fa-arrow-right mr-1"></i>降りずにそのまま{{ dm.current.stops[dm.step.k].st.line ? ' ' + dm.current.stops[dm.step.k].st.line + ' へ' : '進みます' }}</div>
              <div v-else class="dm-step-then dm-step-xfer">
                <i class="fa-solid fa-right-left mr-1"></i>乗り換え
                <span v-if="dm.current.stops[dm.step.k].dep !== null">（{{ fmtMin(Math.round(dm.current.stops[dm.step.k].dep - dm.step.at)) || '0分' }}）→ {{ dmTime(dm.current.stops[dm.step.k].dep) }} 発</span>
                <span v-if="dm.current.stops[dm.step.k].st.depPlatform" class="dm-plat">{{ dm.current.stops[dm.step.k].st.depPlatform }}</span>
                <span class="block mt-0.5">{{ boardText(dm.current.stops[dm.step.k].st) }}</span>
              </div>
            </template>
            <template v-else>
              <div class="dm-step-head">次に乗る列車</div>
              <div class="dm-step-main">{{ dm.current.stops[dm.step.k].st.name }}<span class="dm-step-time">{{ dmTime(dm.step.at) }} 発</span>
                <span v-if="dm.current.stops[dm.step.k].st.depPlatform" class="dm-plat">{{ dm.current.stops[dm.step.k].st.depPlatform }}</span></div>
              <div class="dm-count">{{ untilText(dm.step.at) }}</div>
              <div class="dm-step-then">{{ boardText(dm.current.stops[dm.step.k].st) }}</div>
            </template>
          </div>
          <ol v-if="dm.current.stops.length > 1" class="dm-stops">
            <li v-for="(p, k) in dm.current.stops" :key="'dmc' + k" :class="{ 'dm-stop-hit': dm.step && dm.step.k === k, 'dm-stop-past': dm.r !== null && (p.dep !== null ? p.dep : (p.arr !== null ? p.arr : 1e9)) < dm.r }">
              <span class="dm-stop-name">{{ p.st.name || '（駅名なし）' }}</span>
              <span class="dm-stop-t">
                <span v-if="p.arr !== null">{{ dmTime(p.arr) }}着<template v-if="p.st.arrPlatform && !p.st.through"> {{ p.st.arrPlatform }}</template></span>
                <span v-if="p.dep !== null && k < dm.current.stops.length - 1">{{ dmTime(p.dep) }}発<template v-if="p.st.depPlatform && !p.st.through"> {{ p.st.depPlatform }}</template></span>
              </span>
            </li>
          </ol>
          <div v-if="dm.current.e.location" class="dm-place"><i class="fa-solid fa-location-dot mr-1"></i>{{ dm.current.e.location }}</div>
          <div v-if="dm.current.e.seat" class="dm-place"><i class="fa-solid fa-couch mr-1"></i>{{ seatLabel(dm.current.e) }}：{{ dm.current.e.seat }}</div>
        </section>

        <!-- 次 -->
        <section v-if="dm.next" class="dm-card" aria-label="次の予定">
          <div class="dm-label">{{ dm.status === 'live' ? '次' : 'この日の最初' }}</div>
          <div class="flex items-end gap-3 flex-wrap">
            <div class="dm-big">{{ dmTime(dm.next.s) || '時刻なし' }}</div>
            <div v-if="dm.status === 'live'" class="dm-count pb-1.5">{{ untilText(dm.next.s) }}</div>
          </div>
          <div class="dm-title mt-1"><i class="fa-solid mr-1.5" :class="cat(dm.next.e.type).icon" :style="{ color: ink(cat(dm.next.e.type).color) }"></i>{{ dm.next.e.title }}</div>
          <!-- 乗る列車（最初の駅） -->
          <div v-if="dm.next.stops.length" class="dm-step">
            <div class="dm-step-main">{{ dm.next.stops[0].st.name }}<span v-if="dm.next.stops[0].dep !== null" class="dm-step-time">{{ dmTime(dm.next.stops[0].dep) }} 発</span>
              <span v-if="dm.next.stops[0].st.depPlatform" class="dm-plat">{{ dm.next.stops[0].st.depPlatform }}</span></div>
            <div class="dm-step-then">{{ boardText(dm.next.stops[0].st) }}</div>
          </div>
          <ol v-if="dm.next.stops.length > 1" class="dm-stops">
            <li v-for="(p, k) in dm.next.stops" :key="'dmn' + k">
              <span class="dm-stop-name">{{ p.st.name || '（駅名なし）' }}</span>
              <span class="dm-stop-t">
                <span v-if="p.arr !== null">{{ dmTime(p.arr) }}着<template v-if="p.st.arrPlatform && !p.st.through"> {{ p.st.arrPlatform }}</template></span>
                <span v-if="p.dep !== null && k < dm.next.stops.length - 1">{{ dmTime(p.dep) }}発<template v-if="p.st.depPlatform && !p.st.through"> {{ p.st.depPlatform }}</template></span>
              </span>
            </li>
          </ol>
          <div v-if="dm.next.e.location" class="dm-place"><i class="fa-solid fa-location-dot mr-1"></i>{{ dm.next.e.location }}</div>
          <div v-if="dm.next.e.seat" class="dm-place"><i class="fa-solid fa-couch mr-1"></i>{{ seatLabel(dm.next.e) }}：{{ dm.next.e.seat }}</div>
          <div v-if="dm.next.e.notes" class="dm-notes">{{ dm.next.e.notes }}</div>
        </section>
        <div v-else-if="dm.status === 'live' && !dm.current" class="dm-note"><i class="fa-solid fa-moon"></i><span>この日の予定はもうありません</span></div>

        <!-- このあと -->
        <section v-if="dm.after.length" class="dm-list" aria-label="このあとの予定">
          <div class="dm-label">このあと</div>
          <button v-for="x in dm.after" :key="'dma' + x.e.id" class="dm-row" @click="openEdit(dm.idx, x.e)">
            <span class="dm-row-t">{{ dmTime(x.s) }}</span>
            <i class="fa-solid w-5 text-center" :class="cat(x.e.type).icon" :style="{ color: ink(cat(x.e.type).color) }"></i>
            <span class="dm-row-title">{{ x.e.title }}<span v-if="x.e.location" class="dm-row-loc">{{ x.e.location }}</span></span>
          </button>
        </section>
        <section v-if="dm.done.length" class="dm-list">
          <button class="dm-label dm-label-btn" @click="dayMode.doneOpen = !dayMode.doneOpen" :aria-expanded="dayMode.doneOpen ? 'true' : 'false'">
            終わった予定 {{ dm.done.length }}件<i class="fa-solid ml-1" :class="dayMode.doneOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </button>
          <template v-if="dayMode.doneOpen">
            <button v-for="x in dm.done" :key="'dmd' + x.e.id" class="dm-row dm-row-done" @click="openEdit(dm.idx, x.e)">
              <span class="dm-row-t">{{ dmTime(x.s) }}</span>
              <i class="fa-solid w-5 text-center" :class="cat(x.e.type).icon"></i>
              <span class="dm-row-title">{{ x.e.title }}</span>
            </button>
          </template>
        </section>
      </div>

      <!-- 親指の届くところに固定 -->
      <div class="dm-bar">
        <div v-if="dayMode.delayOpen && dmFocus" class="dm-delay" role="group" aria-label="遅れを入れる">
          <div class="dm-delay-head">「{{ dmFocus.e.title }}」から後ろの時刻をずらします</div>
          <div class="grid grid-cols-5 gap-1.5">
            <button v-for="m in [5, 10, 15, 30, -5]" :key="'dmdl' + m" class="dm-delay-btn" @click="dayModeDelay(m)">{{ m > 0 ? '+' + m : '−' + (-m) }}分</button>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button class="dm-act" :disabled="!dmFocus" @click="dayMode.delayOpen = !dayMode.delayOpen" :aria-expanded="dayMode.delayOpen ? 'true' : 'false'">
            <i class="fa-solid fa-clock-rotate-left"></i>遅れを入れる</button>
          <a class="dm-act" :class="{ 'dm-act-off': !dmPlace }"
             :href="dmPlace ? mapUrl(dmPlace) : undefined" target="_blank" rel="noopener">
            <i class="fa-solid fa-map-location-dot"></i>地図</a>
          <button class="dm-act" :disabled="!dmFocus" @click="openEdit(dm.idx, dmFocus.e)">
            <i class="fa-solid fa-pen"></i>予定を開く</button>
        </div>
      </div>
    </div>

    <!-- ============ スマホで開く ============ -->
    <transition name="fade">
      <div v-if="share.open" data-modal="share" role="dialog" aria-modal="true" aria-label="スマホで開く" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="share.open=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <h2 class="font-black text-ink text-lg">スマホで開く</h2>
            <button @click="share.open=false" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <p v-if="share.kind === 'cloud'" class="text-xs text-slate-600 leading-relaxed">
            クラウド保存の設定をリンクにしました。スマホでこのリンクを開くと、スマホも同じクラウドに旅程を保存するようになり、PC の旅程も入ります。
            <b class="text-rose-700">合言葉が入っているので、人には見せないでください。</b>
          </p>
          <p v-else class="text-xs text-slate-600 leading-relaxed">
            「{{ state.title }}」をリンクにしました。スマホでこのリンクを開くと、旅程がスマホに入ります。
            スマホで一度開いておけば、圏外でも見られます。
          </p>
          <div v-if="share.busy" class="py-10 text-center text-slate-500 text-sm"><i class="fa-solid fa-spinner fa-spin mr-1"></i>作っています</div>
          <template v-else>
            <div v-if="share.qr" class="mt-4 text-center">
              <div class="inline-block p-2 rounded-2xl bg-white" v-html="share.qr"></div>
              <div class="text-[11px] text-slate-500 mt-1.5">スマホのカメラで読み取ってください</div>
            </div>
            <div v-else class="mt-4 rounded-xl px-3 py-2.5 text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 leading-relaxed">
              <i class="fa-solid fa-circle-info mr-1"></i>予定が多くて QR コードに入りきりません。下のボタンでリンクをコピーし、LINE などで自分あてに送ってから、スマホで開いてください。
            </div>
            <input :value="share.url" readonly aria-label="旅程のリンク" @focus="$event.target.select()"
                   class="mt-4 w-full px-3 py-2 rounded-xl border border-slate-200 text-[11px] text-slate-600 bg-slate-50 font-mono">
            <div class="grid gap-2 mt-2" :class="share.canShare ? 'grid-cols-2' : 'grid-cols-1'">
              <button @click="copyShare()" data-focus-first class="py-2.5 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2"
                      style="background:linear-gradient(135deg,#6366f1,#a855f7)"><i class="fa-solid fa-copy"></i>リンクをコピー</button>
              <button v-if="share.canShare" @click="nativeShare()" class="py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-share-from-square"></i>ほかのアプリで送る</button>
            </div>
            <p class="text-[11px] text-slate-500 mt-3 leading-relaxed">
              <template v-if="share.kind === 'cloud'">ホーム画面に追加したアプリで使うときは、アプリの設定の「クラウドに保存」で、同じ URL と合言葉を入れてください（Safari とホーム画面のアプリは保存場所が別です）。</template>
              <template v-else>PCで直したあとは、もう一度リンクを作って開き直すと、スマホの旅程が新しい内容に置き換わります。</template>
            </p>
          </template>
        </div>
      </div>
    </transition>

    <!-- ============ クラウドにつないだとき、両方に旅程がある ============ -->
    <transition name="fade">
      <div v-if="cloud.ask" data-modal="cloudask" role="dialog" aria-modal="true" aria-label="クラウドの旅程をどうするか" class="no-print fixed inset-0 z-[60] grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0" style="background:linear-gradient(135deg,#6366f1,#a855f7)"><i class="fa-solid fa-cloud"></i></div>
            <h2 class="font-black text-ink text-lg">クラウドにも旅程があります</h2>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">
            この端末と、クラウド（{{ cloud.ask.trips }}件{{ cloud.ask.device ? '・最後に保存したのは ' + cloud.ask.device : '' }}）の両方に旅程があります。どうしますか？
          </p>
          <div class="grid gap-2 mt-4">
            <button @click="cloudChoose('merge')" data-focus-first class="py-3 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              両方を合わせる（どちらの旅程も残す）</button>
            <button @click="cloudChoose('server')" class="py-3 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition">クラウドの旅程にする（この端末のものは消えます）</button>
            <button @click="cloudChoose('local')" class="py-3 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition">この端末の旅程でクラウドを上書きする</button>
          </div>
          <p class="text-[11px] text-slate-500 mt-3 leading-relaxed">どれを選んでも、クラウドには1日1つ過去の版が残ります。</p>
        </div>
      </div>
    </transition>

    <!-- ============ リンクから受け取る ============ -->
    <transition name="fade">
      <div v-if="incoming.open && incoming.data" data-modal="incoming" role="dialog" aria-modal="true" aria-label="旅程を受け取る" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-download"></i>
            </div>
            <h2 class="font-black text-ink text-lg">旅程を受け取る</h2>
          </div>
          <div class="rounded-2xl px-4 py-3 border border-slate-200">
            <div class="font-black text-ink">{{ incoming.data.title }}</div>
            <div class="text-xs text-slate-600 mt-1">
              <span v-if="incoming.data.startDate">{{ incoming.data.startDate }} 〜 {{ incoming.data.endDate }}　</span>{{ incoming.data.days.length }}日間・予定 {{ incoming.data.days.reduce((n, d) => n + d.events.length, 0) }}件
            </div>
          </div>
          <p v-if="incoming.exists" class="text-xs text-slate-600 mt-3 leading-relaxed">
            この端末には同じ旅程がすでにあります。受け取った内容に置き換えると、この端末で直したところは消えます（あとから元に戻せます）。
          </p>
          <div class="grid gap-2 mt-4">
            <button v-if="incoming.exists" @click="acceptIncoming('replace')" data-focus-first
                    class="py-3 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              受け取った内容に置き換える</button>
            <button @click="acceptIncoming('add')" :data-focus-first="incoming.exists ? null : ''"
                    class="py-3 rounded-xl text-sm font-bold transition"
                    :class="incoming.exists ? 'text-slate-700 bg-white/70 hover:bg-white border border-slate-200' : 'text-white shadow-md hover:opacity-90'"
                    :style="incoming.exists ? null : 'background:linear-gradient(135deg,#6366f1,#a855f7)'">
              {{ incoming.exists ? '別の旅程として追加する' : 'この旅程を追加する' }}</button>
            <button @click="rejectIncoming()" class="py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition">受け取らない</button>
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ アップデート履歴 ============ -->
    <transition name="fade">
      <div v-if="changelog.open" data-modal="changelog" role="dialog" aria-modal="true" aria-label="アップデート履歴" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="changelog.open=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-lg p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <h2 class="font-black text-ink text-lg">{{ changelog.since ? '新しくなったこと' : 'アップデート履歴' }}</h2>
            <button @click="changelog.open=false" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100" aria-label="閉じる">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="space-y-4">
            <section v-for="c in CHANGELOG" :key="'cl'+c.v">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="font-black text-ink">v{{ c.v }}</span>
                <span class="text-[11px] text-slate-500">{{ c.date }}</span>
                <span v-if="changelog.since && verCmp(c.v, changelog.since) > 0" class="text-[10px] font-black px-1.5 py-0.5 rounded bg-rose-600 text-white">NEW</span>
              </div>
              <div class="text-xs font-bold text-slate-600 mt-0.5">{{ c.title }}</div>
              <ul class="mt-2 space-y-1.5">
                <li v-for="(it, ii) in c.items" :key="'cli'+c.v+ii" class="flex items-start gap-2 text-xs text-slate-600 leading-relaxed">
                  <span class="shrink-0 text-[10px] font-black px-1.5 py-0.5 rounded" :class="CHANGE_TAGS[it[0]].cls">{{ CHANGE_TAGS[it[0]].label }}</span>
                  <span class="min-w-0">{{ it[1] }}</span>
                </li>
              </ul>
            </section>
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ ショートカット一覧 ============ -->
    <transition name="fade">
      <div v-if="showHelp" data-modal="help" role="dialog" aria-modal="true" aria-label="ショートカットと使い方" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="showHelp=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-lg p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-keyboard"></i>
            </div>
            <h2 class="font-black text-ink text-lg">ショートカットと使い方</h2>
            <button @click="showHelp=false" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100" aria-label="閉じる">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="space-y-1.5">
            <div v-for="(sc, si) in SHORTCUTS" :key="'sc'+si"
                 class="flex items-center gap-3 px-3 py-2 rounded-xl" :class="si % 2 ? '' : (isDark ? 'bg-slate-800/60' : 'bg-slate-50')">
              <div class="flex items-center gap-1 shrink-0 w-40">
                <template v-for="(k, ki) in sc.keys" :key="'k'+si+ki">
                  <kbd>{{ k }}</kbd><span v-if="ki < sc.keys.length-1" class="text-slate-400 text-[10px]">{{ sc.sep || '+' }}</span>
                </template>
              </div>
              <span class="text-xs font-bold text-slate-600 min-w-0">{{ sc.desc }}</span>
            </div>
          </div>

          <div class="mt-5 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="text-[11px] font-black text-slate-500 mb-2"><i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>ちょっとしたコツ</div>
            <ul class="text-[11px] text-slate-500 font-medium space-y-1.5 leading-relaxed">
              <li>・旅の当日は、上の <b class="text-ink"><i class="fa-solid fa-person-walking-luggage"></i> 当日モード</b>で、いまの予定・次の予定・乗換までの残り時間を大きく出せます。</li>
              <li>・スマホへは、設定の<b class="text-ink">「スマホで開く」</b>からリンクか QR コードで送れます。スマホで一度開けば、圏外でも見られます。</li>
              <li>・予定カードは<b class="text-ink">ドラッグ</b>のほか、カード内の <b class="text-ink">▲▼</b> でも並べ替えできます。</li>
              <li>・カードの <b class="text-ink">⋯</b> から「別の日へ移動」「複製」ができます。</li>
              <li>・地点を足すと、前の地点との<b class="text-ink">移動手段をたずねます</b>。</li>
              <li>・追加ボタンの <b class="text-ink">▾</b> から、出発地点・到着地点・移動・よく使う予定を選べます。</li>
              <li>・予定と予定の<b class="text-ink">あいだにカーソルを置く</b>と、そこに追加できます。位置を選んで移動もできます。</li>
              <li>・空の日は「<b class="text-ink">ルートを作る</b>」で、出発地点・移動・到着地点をまとめて作れます。</li>
              <li>・いちばん下の予定の「<b class="text-ink">ここから次へ</b>」で、滞在時間を決めて次の行き先へ続けられます。</li>
              <li>・日付を変更すると、<b class="text-ink">それ以降の日程も同じ日数だけ自動でずれます</b>。</li>
              <li>・予定の時間が重なると、カードに <span class="text-amber-600 font-bold">重なり</span> の印と注意が出ます。</li>
              <li>・時刻を変えた予定だけ、自動で時刻順の位置に移ります。自分で並べた順はそのまま残ります。</li>
              <li>・削除や並べ替えは <b class="text-ink">Ctrl+Z</b>（または画面下の知らせの「元に戻す」）で戻せます。</li>
              <li>・列車が遅れたら、カードの <b class="text-ink">⋯ → ここから後ろをずらす</b>。その予定より後ろを、乗換の時刻ごとまとめて動かします。</li>
              <li>・編集画面の<b class="text-ink">「前後のつながり」</b>で、前の到着地・次の出発時刻に1タップで合わせられます。</li>
              <li>・路線が変わっても降りない列車は、途中駅のバッジを押して <b class="text-ink">直通</b> に。1本の列車としてまとめて印刷されます。</li>
              <li>・書きかけのまま閉じようとすると<b class="text-ink">確かめてから</b>閉じます。閉じてしまっても、次に開くと<b class="text-ink">書きかけを戻せます</b>。</li>
              <li>・印刷は<b class="text-ink">読みやすさを優先</b>します。1枚に入らないときは、文字を小さくせずに紙を増やします。</li>
            </ul>
          </div>

          <button @click="showHelp=false"
            class="mt-5 w-full py-3 rounded-xl font-bold text-white shadow-lg hover:opacity-90 transition"
            style="background:linear-gradient(135deg,#6366f1,#a855f7)">
            <i class="fa-solid fa-check mr-1"></i>閉じる
          </button>
        </div>
      </div>
    </transition>

    <!-- ============ TOAST ============ -->
    <transition name="fade">
      <!-- 当日モードでは、画面下の操作ボタンにかぶらないよう上へずらす -->
      <div v-if="toast.show" class="no-print fixed left-1/2 -translate-x-1/2 z-50 max-w-[92vw]" :class="dayMode.on ? 'bottom-28' : 'bottom-6'">
        <div class="bg-ink text-white pl-5 pr-3 py-3 rounded-2xl shadow-2xl text-sm font-bold flex items-center gap-2.5">
          <i class="fa-solid text-emerald-300 shrink-0" :class="toast.icon"></i>
          <span class="min-w-0 leading-snug">{{ toast.msg }}</span>
          <button v-if="toast.action" @click="runToastAction"
            class="shrink-0 ml-1 px-3 py-1.5 rounded-xl text-[11px] font-black bg-white/15 hover:bg-white/25 transition flex items-center gap-1.5">
            <i class="fa-solid" :class="toast.action.icon || 'fa-rotate-left'"></i>{{ toast.action.label }}
          </button>
          <button v-else @click="toast.show=false" class="shrink-0 w-6 h-6 rounded-lg text-white/50 hover:text-white transition" aria-label="閉じる">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
      </div>
    </transition>
  </div>
  `,
}).mount('#app');
</script>

</body>
</html>
