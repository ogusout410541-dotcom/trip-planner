    /* 地点の座標をまだ引いている最中か（この間は距離で決まる指摘を待たせる） */
    const placesWarming = () => netState.enabled && netState.warming;
    function sameSpot(p, q) {
      if (!p || !q) return false;
      if (samePlace(p, q)) return true;
      const km = placeDist(p, q);
      if (km !== null) return km < 0.6;
      const a = placeKey(p), b = placeKey(q);
      return !!a && !!b && a.length >= 2 && b.length >= 2 && (a.startsWith(b) || b.startsWith(a));
    }
    /* 実際に案内する「移動の抜け」。歩いてすぐの距離なら言わない。
       点検パネルと、予定のあいだの案内で、同じ判定を使う */
    function moveGap(day, i) {
      if (!needsMove(day, i)) return null;
      const from = placeOf(day.events[i], 'end'), to = placeOf(day.events[i + 1], 'start');
      if (sameSpot(from, to)) return null;
      /* 距離が分かれば消える指摘なので、調べ終わるまで出さない */
      if (placesWarming() && (!placePos(from) || !placePos(to))) return null;
      return { from, to, km: placeDist(from, to) };
    }

    /* 移動ウィザード：2地点を確かめてから手段を選ぶ */
    const MOVE_PICKS = ['walk', 'train', 'bus', 'taxi', 'car', 'plane', 'ship'];
    const moveWizard = reactive({
      open: false, mode: 'move', dayIdx: 0, afterIdx: -1,
      from: '', to: '', fromTime: '', toTime: '',
      destType: 'activity', asEnd: false,
    });
    /* 行き先として選べる種類（移動手段はここには出さない） */
    const DEST_TYPES = ['activity', 'meal', 'shop', 'standby', 'waypoint', 'accommodation'];
    function openMoveWizard(dayIdx, afterIdx) {
      const day = state.days[dayIdx];
      if (!day) return;
      const idx = (afterIdx === undefined || afterIdx === null) ? day.events.length - 1 : afterIdx;
      moveWizard.mode = 'move';
      moveWizard.dayIdx = dayIdx;
      moveWizard.afterIdx = idx;
      moveWizard.from = placeOf(day.events[idx], 'end');
      moveWizard.to = placeOf(day.events[idx + 1], 'start');
      moveWizard.fromTime = ''; moveWizard.toTime = '';
      moveWizard.destType = 'activity'; moveWizard.asEnd = false;
      moveWizard.open = true;
      menuFor.value = '';
    }
    /* 前の日が終わった場所（空の日の案内に使う） */
    function prevDayEnd(dayIdx) {
      const prev = state.days[dayIdx - 1];
      if (!prev || !prev.events.length) return '';
      const endEv = [...prev.events].reverse().find(e => e.anchor === 'end') || prev.events[prev.events.length - 1];
      return placeOf(endEv, 'end');
    }
    /* いまいる場所から、次の行き先へ続ける */
    function openNextWizard(dayIdx, fromIdx) {
      const day = state.days[dayIdx];
      const src = day && day.events[fromIdx];
      if (!src) return;
      moveWizard.mode = 'next';
      moveWizard.dayIdx = dayIdx;
      moveWizard.afterIdx = fromIdx;
      moveWizard.from = placeOf(src, 'end');
      moveWizard.to = '';
      /* 着いてすぐ動くこともあるので、終了時刻が無いときは着いた時刻をそのまま使う */
      moveWizard.fromTime = src.endTime || src.startTime || '';
      moveWizard.toTime = '';
      moveWizard.destType = 'activity';
      moveWizard.asEnd = false;
      moveWizard.open = true;
      menuFor.value = '';
      cancelMoving();
    }
    /* 起点の予定 */
    const wizardSource = computed(() => {
      const day = state.days[moveWizard.dayIdx];
      return (day && day.events[moveWizard.afterIdx]) || null;
    });
    /* 滞在時間から「ここを出る時刻」を決める */
    function stayFor(mins) {
      const src = wizardSource.value;
      const base = toMin(src && src.startTime);
      if (base === null) { flash('起点の時刻が入っていません', 'fa-triangle-exclamation'); return; }
      moveWizard.fromTime = minToHHMM(base + mins);
    }
    /* 移動時間から到着時刻を決める */
    function travelFor(mins) {
      const base = toMin(moveWizard.fromTime);
      if (base === null) { flash('先に「ここを出る時刻」を入れてください', 'fa-triangle-exclamation'); return; }
      moveWizard.toTime = minToHHMM(base + mins);
    }
    /* いまの滞在時間（表示用） */
    const wizardStay = computed(() => {
      const src = wizardSource.value;
      return (src && src.startTime && moveWizard.fromTime) ? duration(src.startTime, moveWizard.fromTime) : '';
    });

    /* 次の行き先（移動＋行き先）を作って、そのまま続けられるようにする */
    function buildNext(type) {
      const w = moveWizard;
      const day = state.days[w.dayIdx];
      const src = day && day.events[w.afterIdx];
      if (!day || !src) return;
      const from = String(w.from || '').trim();
      const to = String(w.to || '').trim();
      if (!to) { flash('次の行き先を入れてください', 'fa-triangle-exclamation'); return; }
      snapshot('次の行き先を追加');
      /* 起点に「ここを出る時刻」を書き込む＝滞在時間が決まる */
      if (w.fromTime) src.endTime = w.fromTime;
      const made = [];
      if (type) {
        const both = from && to;
        made.push(Object.assign(newEvent(), {
          type,
          title: both ? `${from} → ${to}` : moveTitle(type, from, to),
          location: [from, to].filter(Boolean).join(' → '),
          startTime: w.fromTime || '',
          endTime: w.toTime || '',
          direction: type === 'plane' ? to : '',
          route: (['train', 'bus'].includes(type) && both)
            ? [Object.assign(blankStop(from), { depTime: w.fromTime || '' }),
               Object.assign(blankStop(to), { arrTime: w.toTime || '' })] : [],
        }));
      }
      made.push(Object.assign(newEvent(), {
        type: w.asEnd ? guessPlaceType(w.to, 'accommodation') : (w.destType || 'activity'),
        anchor: w.asEnd ? 'end' : '',
        title: w.asEnd ? to + 'に到着' : to,
        location: to,
        startTime: w.toTime || '',
      }));
      const at = w.afterIdx + 1;
      day.events.splice(at, 0, ...made);
      w.open = false;
      activeDay.value = w.dayIdx;
      const nextIdx = at + made.length - 1;
      flash(`${to} を追加しました`, 'fa-flag-checkered',
            { label: 'ここから次へ', icon: 'fa-arrow-right', fn: () => openNextWizard(w.dayIdx, nextIdx) });
    }
    /* 1日の骨組み：出発地点 →（移動）→ 到着地点 をまとめて作る */
    function openRouteWizard(dayIdx) {
      const day = state.days[dayIdx];
      if (!day) return;
      moveWizard.mode = 'route';
      moveWizard.dayIdx = dayIdx;
      moveWizard.afterIdx = day.events.length - 1;
      /* 前の日の到着地点を、この日の出発地点の初期値にする */
      let from = '';
      const prev = state.days[dayIdx - 1];
      if (prev && prev.events.length) {
        const endEv = [...prev.events].reverse().find(e => e.anchor === 'end') || prev.events[prev.events.length - 1];
        from = placeOf(endEv, 'end');
      } else if (dayIdx === 0) {
        from = state.origin || homePlace() || '';
      }
      moveWizard.from = from;
      moveWizard.to = '';
      moveWizard.fromTime = '';
      moveWizard.toTime = '';
      moveWizard.destType = 'activity';
      moveWizard.asEnd = false;
      moveWizard.open = true;
      menuFor.value = '';
    }
    /* ルートを組み立てて、その日に流し込む */
    function buildRoute(type) {
      const w = moveWizard;
      const day = state.days[w.dayIdx];
      if (!day) return;
      const from = String(w.from || '').trim();
      const to = String(w.to || '').trim();
      if (!from && !to) { flash('出発地点か到着地点を入れてください', 'fa-triangle-exclamation'); return; }
      snapshot('ルートの作成');
      const made = [];
      if (from) {
        made.push(Object.assign(newEvent(), {
          anchor: 'start', type: guessPlaceType(from, 'waypoint'), title: from + 'を出発', location: from, startTime: w.fromTime || '',
        }));
      }
      if (type && (from || to)) {
        const both = from && to;
        made.push(Object.assign(newEvent(), {
          type,
          title: both ? `${from} → ${to}` : moveTitle(type, from, to),
          location: [from, to].filter(Boolean).join(' → '),
          startTime: w.fromTime || '',
          endTime: (both && w.toTime) ? w.toTime : '',
          direction: type === 'plane' ? to : '',
          route: (['train', 'bus'].includes(type) && both)
            ? [Object.assign(blankStop(from), { depTime: w.fromTime || '' }),
               Object.assign(blankStop(to), { arrTime: (both && w.toTime) ? w.toTime : '' })] : [],
        }));
      }
      if (to) {
        made.push(Object.assign(newEvent(), {
          anchor: 'end', type: guessPlaceType(to, 'waypoint'), title: to + 'に到着', location: to, startTime: w.toTime || '',
        }));
      }
      const at = day.events.length;
      day.events.push(...made);
      w.open = false;
      activeDay.value = w.dayIdx;
      const lastIdx = at + made.length - 1;
      /* 「作って終わり」にせず、そのまま次の行き先へ進める */
      flash(`ルートを作りました（${made.length}件）`, 'fa-route',
            (made.length && placeOf(made[made.length - 1], 'end'))
              ? { label: 'ここから次へ', icon: 'fa-arrow-right', fn: () => openNextWizard(w.dayIdx, lastIdx) }
              : { label: '元に戻す', fn: undo });
    }
    function swapMovePlaces() {
      const t = moveWizard.from; moveWizard.from = moveWizard.to; moveWizard.to = t;
    }
    function moveTitle(type, from, to) {
      if (from && to) return `${from} → ${to}`;
      const label = CATS[type].label;
      if (to) return type === 'walk' ? `${to}まで徒歩` : `${label}で${to}へ`;
      return type === 'walk' ? '徒歩で移動' : `${label}で移動`;
    }
    /* 手段を選ぶ → 時刻・区間まで埋めた状態で通常の入力画面へ */
    function pickMove(type) {
      if (moveWizard.mode === 'route') { buildRoute(type); return; }
      if (moveWizard.mode === 'next') { buildNext(type); return; }
      const w = moveWizard;
      const day = state.days[w.dayIdx];
      if (!day) return;
      const a = day.events[w.afterIdx];
      const b = day.events[w.afterIdx + 1];
      const from = String(w.from || '').trim();
      const to = String(w.to || '').trim();
      w.open = false;
      openAdd(w.dayIdx);
      const e = editing.value;
      e.type = type;
      e.title = moveTitle(type, from, to);
      e.location = [from, to].filter(Boolean).join(' → ');
      /* 前の予定の終わり 〜 次の予定の始まり を初期値に */
      const st = a ? (a.endTime || a.startTime) : '';
      if (st) e.startTime = st;
      if (b && b.startTime) e.endTime = b.startTime;
      if (['train', 'bus'].includes(type) && (from || to)) {
        e.route = [Object.assign(blankStop(from), { depTime: e.startTime || '' }),
                   Object.assign(blankStop(to), { arrTime: e.endTime || '' })];
      }
      if (type === 'plane' && to) e.direction = to;
      e.__insertAt = w.afterIdx + 1;
      e.__isMove = true;
      e.__srcTime = e.startTime;
    }
    /* 地点を足したあとに「移動はどうする？」と聞く */
    function suggestMove(dayIdx, ev) {
      const day = state.days[dayIdx];
      if (!day) return false;
      const i = day.events.findIndex(x => x.id === ev.id);
      if (i <= 0) return false;
      if (!needsMove(day, i - 1)) return false;
      const a = placeOf(day.events[i - 1], 'end'), b = placeOf(ev, 'start');
      flash(`${a} → ${b} の移動は？`, 'fa-route', { label: '移動を追加', icon: 'fa-route', fn: () => openMoveWizard(dayIdx, i - 1) });
      return true;
    }

    /* ---------- カードのメニュー / モーダル ---------- */
    const menuFor = ref('');
    const showHelp = ref(false);
    /* スマホ幅では、点検の一覧と日の操作をたたんでおく（最初の予定までが遠かったため） */
    const narrowScreen = !!(window.matchMedia && window.matchMedia('(max-width: 639px)').matches);
    const issuesOpen = ref(!narrowScreen);
    const dayOpsOpen = ref(false);
    /* アップデート履歴。since があれば、その版より新しいものに「NEW」を付ける */
    const LS_SEEN_VER = 'trip_seen_version_v1';
    const changelog = reactive({ open: false, since: '' });
    function openChangelog(since = '') { changelog.since = since; changelog.open = true; }
    const showSearch = ref(false);
    const saveError = ref(false);

    /* ---------- 検索・絞り込み ---------- */
    const query = ref('');
    const catFilter = ref([]);
    const anchorFilter = ref([]);
    const highlightId = ref('');
    function toggleCatFilter(k) {
      const i = catFilter.value.indexOf(k);
      if (i >= 0) catFilter.value.splice(i, 1); else catFilter.value.push(k);
    }
    function toggleAnchorFilter(k) {
      const i = anchorFilter.value.indexOf(k);
      if (i >= 0) anchorFilter.value.splice(i, 1); else anchorFilter.value.push(k);
    }
    const searchActive = computed(() =>
      !!query.value.trim() || catFilter.value.length > 0 || anchorFilter.value.length > 0);
    const searchResults = computed(() => {
      if (!searchActive.value) return [];
      const q = query.value.trim().toLowerCase();
      const cf = catFilter.value;
      const out = [];
      const af = anchorFilter.value;
      state.days.forEach((d, di) => d.events.forEach(e => {
        if (cf.length && !cf.includes(e.type)) return;
        if (af.length && !af.includes(e.anchor)) return;
        if (q) {
          const hay = [e.title, e.location, e.notes, e.url, e.flightNo, e.direction, e.platform, e.stations, e.seat]
            .concat((e.route || []).flatMap(st => [st.name, st.line, st.kind, st.dest, st.depPlatform, st.arrPlatform, st.stations]))
            .join(' ').toLowerCase();
          if (!hay.includes(q)) return;
        }
        out.push({ dayIdx: di, ev: e });
      }));
      return out;
    });
    const searchCost = computed(() => searchResults.value.reduce((t, r) => t + (Number(r.ev.cost) || 0), 0));
    /* 検索結果の補足行（Day のあとに続ける） */
    function resultMeta(r) {
      const d = state.days[r.dayIdx] || {};
      const wd = weekday(d.date);
      const stops = routeStops(r.ev).filter(st => st.name);
      const place = r.ev.location || (stops.length >= 2 ? `${stops[0].name} → ${stops[stops.length - 1].name}` : '');
      return [
        shortDate(d.date) + (wd ? '（' + wd + '）' : ''),
        r.ev.startTime + (r.ev.endTime ? '〜' + nextMark(r.ev) + r.ev.endTime : ''),
        place,
      ].filter(x => x && x.trim()).join(' ・ ');
    }
    function openSearch() {
      showSearch.value = true;
      nextTick(() => { const el = document.getElementById('searchInput'); if (el) el.focus(); });
    }
    function clearSearch() { query.value = ''; catFilter.value = []; anchorFilter.value = []; }
    /* その予定を光らせて画面内へ */
    function highlight(id) {
      if (!id) return;
      highlightId.value = id;
      nextTick(() => {
        const el = document.getElementById('ev-' + id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      setTimeout(() => { if (highlightId.value === id) highlightId.value = ''; }, 2600);
    }
    function jumpTo(dayIdx, ev) {
      activeDay.value = dayIdx;
      showSearch.value = false;
      highlight(ev.id);
    }
    /* 予定の役割（1日の出発地点／到着地点）を、その場で切り替える。
       遠征のように行き先が何度も変わるときは、あとから決めたほうが早い */
    function toggleAnchor(dayIdx, ev, role) {
      const day = state.days[dayIdx];
      if (!day || !ev) return;
      const on = ev.anchor !== role;
      snapshot(on ? (role === 'end' ? '1日の終わりにする' : '1日の始まりにする') : '役割を外す');
      if (on) day.events.forEach(x => { if (x !== ev && x.anchor === role) x.anchor = ''; });   // 同じ役割は1つだけ
      ev.anchor = on ? role : '';
      menuFor.value = '';
      flash(on ? (role === 'end' ? 'この予定を1日の終わりにしました' : 'この予定を1日の始まりにしました')
               : '役割を外しました', on ? 'fa-flag-checkered' : 'fa-xmark', { label: '元に戻す', fn: undo });
    }

    /* 日を切り替えるたびに数を進めて、中身の入れ替えを目に見えるようにする */
    const dayTick = ref(0);
    watch(activeDay, () => { dayTick.value++; });

    /* 「気になる点」から、その予定へ飛ぶ（操作そのものは現場のボタンに任せる） */
    function jumpToIssue(iss) {
      highlight(iss && iss.ids && iss.ids[0]);
    }

    /* ---------- 印刷オプション（端末ごとに保存） ---------- */
    const LS_PRINT = 'trip_print_opts_v1';
    const printOpts = reactive(Object.assign(
      { cols: 'auto', notes: true, conn: true, url: false, orient: 'landscape' },
      (() => { try { return JSON.parse(localStorage.getItem(LS_PRINT) || '{}'); } catch { return {}; } })()
    ));
    watch(printOpts, () => { try { localStorage.setItem(LS_PRINT, JSON.stringify(printOpts)); } catch {} }, { deep: true });
    /* ── 紙に収める（割り付けを解く）──
       A4の余白は @page で 10mm/12mm に固定しているので、刷れる領域は計算できる。
       印刷レイアウトを画面外に同じ幅で組んで高さを測り、
         ① はみ出す日は段を増やす（文字の大きさはそのまま）
         ② それでも収まらなければ、少しだけ全体を縮める
       の順で、いちばん読みやすい割り付けを選ぶ */
    /* 刷れる高さ（A4から上下の余白を引いたぶん）より 4mm 低く取る。
       ぴったりに合わせると、ブラウザ側のわずかな違いで1枚ぶん送られてしまう */
    const PAGE_PAD_MM = 4;
    const PRINT_MM = {
      landscape: { w: 297 - 24, h: 210 - 20 - PAGE_PAD_MM },
      portrait:  { w: 210 - 24, h: 297 - 20 - PAGE_PAD_MM },
    };
    const MIN_COL_MM = 52;                              // これより細い段は作らない
    /* ================= 紙への割り付け =================
       これまではCSSの改ページ任せだったが、それだと
         ・見出しだけの紙／締めだけの紙ができる
         ・段の高さがそろわずガタつく
       という出方をしてしまう。そこで
         (1) 予定ひとつぶんの高さを実際に測り
         (2) 段（列）へ順に詰め
         (3) 段が埋まったら次の段、段がK本たまったら次の紙
       と、こちらで決める。紙をまたぐのは段の切れ目だけになる */
    const printPlan = reactive({ cols: 0, pages: 1, measured: false });
    const printPages = ref([]);          // [{ k, cols: [[かたまり…], …] }]
    const COL_GAP_PX = 14;               // 段と段のすき間
    const MAX_AUTO_COLS = 4;             // 自動でえらぶ段数の上限（これ以上は細くて読みにくい）

    function pxPerMm() {
      const probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:100mm;height:0';
      document.body.appendChild(probe);
      const v = probe.getBoundingClientRect().width / 100;
      probe.remove();
      return v || 3.7795;
    }

    /* 紙に載せる「かたまり」。これ以上は割らない単位 */
    function printBlocks() {
      const out = [];
      state.days.forEach((day, di) => {
        out.push({ t: 'day', di, key: 'd' + di });
        day.events.forEach((ev, ei) => out.push({
          t: 'ev', di, ei, key: 'e' + di + '_' + ei, last: ei === day.events.length - 1,
        }));
      });
      return out;
    }

    /* かたまりを段へ詰める。
       target を渡すと、その高さを目安に詰めて段の高さをそろえる（ガタつき対策） */
    function packPages(blocks, h, K, capFirst, capRest, target) {
      const pages = [];
      let cols = [], cur = [], used = 0;
      const cap = () => (pages.length === 0 ? capFirst : capRest);
      const room = () => (target > 0 ? Math.min(cap(), target) : cap());
      const flushCol = () => {
        cols.push(cur); cur = []; used = 0;
        if (cols.length >= K) { pages.push(cols); cols = []; }
      };
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        const bh = h[b.key] || 0;
        /* 段の頭に来る予定には「つづき」の見出しが付くので、そのぶんも見込む */
        const contH = (b.t === 'ev') ? (h['d' + b.di] || 0) : 0;
        let need = bh + (cur.length === 0 ? contH : 0);
        /* 見出しだけが段の末尾に残らないよう、次のひとつも一緒に置けるか見る */
        if (b.t === 'day' && blocks[i + 1]) need += (h[blocks[i + 1].key] || 0);
        if (cur.length > 0 && used + need > room()) flushCol();
        if (cur.length === 0 && b.t === 'ev') {
          cur.push({ t: 'day', di: b.di, cont: true, key: 'd' + b.di });
          used += contH;
        }
        cur.push(b);
        used += bh;
      }
      if (cur.length) cols.push(cur);
      if (cols.length) pages.push(cols);
      return pages.map(c => ({ k: K, cols: c }));
    }

    /* 段の幅（px）。紙の幅からすき間を引いて割る */
    function colWidthPx(K, pgW, mm) {
      return Math.max(40, (pgW * mm - COL_GAP_PX * (K - 1)) / K);
    }
    /* 画面で測った高さと、実際に刷られる高さはわずかにずれる。
       段が細いほど行の折り返しが増え、ずれも積み上がるので、
       段数に応じて余裕を取る（1段なら2%、4段なら5%ほど） */
    const pageSafe = (pageH, K) => Math.max(10, pageH * (0.015 + 0.008 * K));

    /* 組んである紙面から、かたまりごとの高さを読む */
    function readBlockHeights(el, widthPx) {
      el.classList.add('print-measure');
      el.style.width = widthPx + 'px';
      const h = {};
      el.querySelectorAll('[data-blk]').forEach(n => {
        const k = n.dataset.blk;
        h[k] = Math.max(h[k] || 0, n.getBoundingClientRect().height);
      });
      const head = el.querySelector('.ph-wrap');
      const foot = el.querySelector('.ptl-foot');
      const out = {
        h,
        head: head ? head.getBoundingClientRect().height + 8 : 0,
        foot: foot ? foot.getBoundingClientRect().height + 6 : 0,
      };
      el.style.width = '';
      el.classList.remove('print-measure');
      return out;
    }

    /* Kの候補ひとつぶんを組んでみる */
    function tryCols(el, blocks, K, pg, mm, pageH) {
      const m = readBlockHeights(el, colWidthPx(K, pg.w, mm));
      const safe = pageSafe(pageH, K);
      const capFirst = Math.max(60, pageH - m.head - m.foot - safe);
      const capRest = Math.max(60, pageH - m.foot - safe);
      let pages = packPages(blocks, m.h, K, capFirst, capRest, 0);
      /* 段の高さをそろえる。紙が増えてしまうならやめる */
      const total = blocks.reduce((a, b) => a + (m.h[b.key] || 0), 0);
      const target = Math.min(capRest, Math.ceil(total / Math.max(1, pages.length * K)) + 4);
      const even = packPages(blocks, m.h, K, capFirst, capRest, target);
      if (even.length <= pages.length) pages = even;
      return { K, pages };
    }

    /* 割り付けを決める。Vueの描き直しを1度はさむので非同期 */
    async function planPrint() {
      const el = document.querySelector('.print-only');
      if (!el) return printPlan;
      const blocks = printBlocks();
      if (!blocks.length) {
        printPages.value = [{ k: 1, cols: [[]] }];
        printPlan.cols = 1; printPlan.pages = 1; printPlan.measured = true;
        return printPlan;
      }
      /* 締めの行は「出力：日時」が入ると高さが変わるので、空なら入れてから測る
         （空のまま測ると、刷る直前に日時が入って最後の予定が次の紙へ押し出されていた） */
      if (!printTime.value) printTime.value = stampText();
      /* 測るために、いったん1段で全部を組む */
      printPages.value = [{ k: 1, cols: [blocks] }];
      await nextTick();

      const mm = pxPerMm();
      const pg = PRINT_MM[printOpts.orient === 'portrait' ? 'portrait' : 'landscape'];
      const pageH = pg.h * mm;
      const maxCols = Math.max(1, Math.min(MAX_AUTO_COLS, Math.floor(pg.w / MIN_COL_MM)));
      const manual = printOpts.cols !== 'auto';

      let best = null;
      if (manual) {
        best = tryCols(el, blocks, Math.max(1, Math.min(maxCols, Number(printOpts.cols) || 1)), pg, mm, pageH);
      } else {
        for (let K = 1; K <= maxCols; K++) {
          const r = tryCols(el, blocks, K, pg, mm, pageH);
          if (!best || r.pages.length < best.pages.length) best = r;
        }
        /* 何枚かに分かれるときは、1枚に3段以上。
           細い段のほうが紙面が埋まり、紙をめくる回数も減る */
        const want = Math.min(3, maxCols);
        if (best && best.pages.length > 1 && best.K < want) {
          const r = tryCols(el, blocks, want, pg, mm, pageH);
          if (r.pages.length <= best.pages.length) best = r;
        }
      }
      if (!best) best = { K: 1, pages: [{ k: 1, cols: [blocks] }] };

      printPages.value = best.pages;
      printPlan.cols = best.K;
      printPlan.pages = best.pages.length;
      printPlan.measured = true;
      await nextTick();
      return printPlan;
    }

    /* 中身や設定が変わったら、割り付けを組み直しておく
       （ブラウザのCtrl+Pで刷られても、そのときの割り付けで出るように） */
    let planTimer = 0;
    function schedulePlan() {
      clearTimeout(planTimer);
      planTimer = setTimeout(() => { planPrint(); }, 500);
    }
    watch(() => [printOpts.orient, printOpts.cols, printOpts.notes, printOpts.conn, printOpts.url].join('|'), schedulePlan);
    watch(state, schedulePlan, { deep: true });
    onMounted(() => schedulePlan());

    /* 紙に出すときの中身を引く */
    const blkDay = (b) => state.days[b.di] || { events: [] };
    /* この予定と次の予定のあいだが、眠っていた時間なら、その長さ */
    function blkSleep(b) {
      const day = state.days[b.di];
      if (!day || b.t !== 'ev' || b.last) return null;
      if (!sleepBetween(day, b.ei)) return null;
      return gapAfter(day, b.ei);
    }
    const blkEv = (b) => (state.days[b.di] && state.days[b.di].events[b.ei]) || null;



    /* @page は CSS 変数で切り替えられないため、動的なスタイル要素で上書きする */
    const printPageStyle = document.createElement('style');
    document.head.appendChild(printPageStyle);
    watch(() => printOpts.orient, (v) => {
      printPageStyle.textContent =
        '@media print {'
        + ' @page { size: A4 ' + (v === 'portrait' ? 'portrait' : 'landscape') + '; margin: 10mm 12mm; }'
        /* 紙1枚ぶんの高さを決めておく。こうしておけば、わずかな測りのずれで
           ブラウザが勝手に紙を増やすことがない（中身は必ずこの高さに収めてある） */
        + ' .ptl-page { height: ' + (v === 'portrait' ? (297 - 20 - 4) : (210 - 20 - 4)) + 'mm; overflow: hidden; }'
        + ' }';
    }, { immediate: true });

    /* ---------- toast ---------- */
    let toastTimer;
    function flash(msg, icon = 'fa-check', action = null) {
      toast.msg = msg; toast.icon = icon; toast.action = action; toast.show = true;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.show = false; toast.action = null; }, action ? 5000 : 2200);
    }
    function runToastAction() {
      const a = toast.action;
      toast.show = false; toast.action = null;
      if (a && typeof a.fn === 'function') a.fn();
    }

    /* ---------- JSON import / export ---------- */

    function currentJson() {
      return JSON.stringify(state, null, 2);
    }

    /* 旅程をファイルとして書き出す。
       置き場がいっぱいで保存できないときの逃がし先にもなる */
    function downloadJson() {
      try {
        const name = (state.title || '旅程').replace(/[\/:*?"<>|]/g, '_');
        const blob = new Blob([currentJson()], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name + '_' + todayISO() + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        flash('控えを書き出しました', 'fa-download');
      } catch { flash('書き出せませんでした', 'fa-triangle-exclamation'); }
    }
    async function copyJson() {
      try {
        await navigator.clipboard.writeText(currentJson());
        flash('JSONをコピーしました', 'fa-clipboard-check');
      } catch {
        jsonText.value = currentJson();
        flash('下の欄に出しました', 'fa-file-export');
      }
    }
    function pullToEditor() {
      jsonText.value = currentJson();
      flash('いまの旅程を下の欄に出しました', 'fa-arrow-down');
    }

    /* ---------- 全旅程バックアップ（Cookie削除などで localStorage ごと消えたときの保険） ---------- */
    function allTripsJson() {
      const trips = tripIndex.value.map(t => {
        let data = null;
        try { data = JSON.parse(localStorage.getItem(tripKey(t.id)) || 'null'); } catch {}
        return data ? { id: t.id, data } : null;
      }).filter(Boolean);
      return JSON.stringify({ __app: 'trip-itinerary-planner', __kind: 'backup-all', version: 1, exportedAt: new Date().toISOString(), trips }, null, 2);
    }
    function _downloadText(text, filename) {
      const blob = new Blob([text], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    /* silent=true は自動バックアップ用（通知を出さない） */
    function downloadAllBackup(silent = false) {
      try {
        _downloadText(allTripsJson(), '旅程バックアップ_全件_' + todayISO() + '.json');
        lastBackupAt.value = todayISO();
        try { localStorage.setItem(LS_LAST_BACKUP, lastBackupAt.value); } catch {}
        if (!silent) flash('すべての旅程をファイルに書き出しました', 'fa-download');
        return true;
      } catch { if (!silent) flash('書き出せませんでした', 'fa-triangle-exclamation'); return false; }
    }
    /* Cookie削除などで消える前提で、1日1回だけ自動でファイルに書き出しておく。
       中身が空の新規旅程しかないときは、書き出す意味がないので動かさない */
    function maybeAutoBackup() {
      try {
        const today = todayISO();
        if (lastBackupAt.value === today) return;
        const hasContent = tripIndex.value.some(t => (t.eventCount || 0) > 0 || t.startDate);
        if (!hasContent) return;
        downloadAllBackup(true);
      } catch {}
    }
    /* 起動時に退避した「読めなかった旅程」を、そのままファイルに書き出す（手で直して読み込み直せるように） */
    const brokenCount = ref((() => { let n = 0; try { for (let i = 0; i < localStorage.length; i++) if ((localStorage.key(i) || '').startsWith(LS_BROKEN)) n++; } catch {} return n; })());
    function downloadBroken() {
      const out = {};
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS_BROKEN)) out[k] = localStorage.getItem(k); } } catch {}
      _downloadText(JSON.stringify(out, null, 2), '読めなかった旅程_' + todayISO() + '.json');
    }
    /* バックアップの中身を、いまの旅程一覧に「追加」する（既存の旅程を上書きはしない） */
    function importBackupData(obj) {
      const items = (obj && obj.__kind === 'backup-all' && Array.isArray(obj.trips))
        ? obj.trips.map(t => t && t.data).filter(Boolean)
        : (obj && Array.isArray(obj.days)) ? [obj] : [];
      if (!items.length) { flash('読み込めるデータが見つかりませんでした', 'fa-triangle-exclamation'); return; }
      let count = 0;
      items.forEach((raw) => {
        let data;
        try { data = normalizeData(JSON.parse(JSON.stringify(raw))); } catch { return; }
        const id = newTripId();
        try { localStorage.setItem(tripKey(id), JSON.stringify(data)); } catch { return; }
        tripIndex.value.push({
          id, title: data.title || '旅程', startDate: data.startDate, endDate: data.endDate,
          origin: data.origin, destination: data.destination, status: data.status || 'wip',
          dayCount: data.days.length, eventCount: data.days.reduce((n, d) => n + d.events.length, 0),
        });
        count++;
      });
      if (count) {
        saveTripIndex();
        showTripPanel.value = true;
        flash(`${count}件の旅程を復元しました`, 'fa-rotate-left');
      } else {
        flash('読み込めませんでした', 'fa-triangle-exclamation');
      }
    }
    function onImportFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let obj;
        try { obj = JSON.parse(String(reader.result || '')); } catch { flash('JSONとして読み取れませんでした', 'fa-triangle-exclamation'); return; }
        importBackupData(obj);
      };
      reader.onerror = () => flash('ファイルを読み込めませんでした', 'fa-triangle-exclamation');
      reader.readAsText(file, 'utf-8');
    }

    /* ---------- day ops ---------- */
    function renumber() { state.days.forEach((d, i) => (d.dayNumber = i + 1)); }
    function syncDateRange() {
      const first = state.days[0], last = state.days[state.days.length - 1];
      if (first && first.date) state.startDate = first.date;
      if (last && last.date) state.endDate = last.date;
    }
    function addDay() {
      snapshot('日程の追加');
      const last = state.days[state.days.length - 1];
      const nextDate = (last && last.date) ? shiftDate(last.date, 1) : '';
      state.days.push({ date: nextDate, dayNumber: state.days.length + 1, ignoreOverlap: false, events: [] });
      activeDay.value = state.days.length - 1;
      syncDateRange();
      flash('日程を追加しました');
    }
    function removeDay(idx) {
      if (state.days.length <= 1) { flash('最後の1日は削除できません', 'fa-triangle-exclamation'); return; }
      const day = state.days[idx];
      if (day.events.length && !confirm(`Day ${idx + 1}（予定${day.events.length}件）を削除しますか？（元に戻せます）`)) return;
      snapshot('日程の削除');
      state.days.splice(idx, 1);
      renumber();
      if (activeDay.value >= state.days.length) activeDay.value = state.days.length - 1;
      syncDateRange();
      flash('日程を削除しました', 'fa-trash-can', { label: '元に戻す', fn: undo });
    }
    function duplicateDay(idx) {
      snapshot('日程の複製');
      const src = JSON.parse(JSON.stringify(state.days[idx]));
      src.events.forEach(e => (e.id = uid()));
      src.date = src.date ? shiftDate(src.date, 1) : '';
      state.days.splice(idx + 1, 0, src);
      renumber();
      activeDay.value = idx + 1;
      syncDateRange();
      flash('日程を複製しました', 'fa-copy');
    }
    function moveDay(idx, dir) {
      const to = idx + dir;
      if (to < 0 || to >= state.days.length) return;
      snapshot('日程の並べ替え');
      const [d] = state.days.splice(idx, 1);
      state.days.splice(to, 0, d);
      renumber();
      activeDay.value = to;
      flash('日程を並べ替えました', 'fa-arrows-up-down');
    }
    /* 日付を変更 → 以降の日付も同じ日数だけスライド */
    function setDayDate(idx, val) {
      const day = state.days[idx];
      if (!day) return;
      const old = day.date;
      if (!validDate(val)) return;                 // 打ちかけ・年が5桁などは受け取らない
      if (old === val) return;
      snapshot('日付の変更');
      day.date = val;
      if (old && val) {
        const delta = diffDays(old, val);
        if (delta !== 0) {
          for (let i = idx + 1; i < state.days.length; i++) {
            if (state.days[i].date) state.days[i].date = shiftDate(state.days[i].date, delta);
          }
        }
      } else if (val) {
        for (let i = idx + 1; i < state.days.length; i++) {
          if (!state.days[i].date) state.days[i].date = shiftDate(state.days[i - 1].date || val, 1);
        }
      }
      syncDateRange();
    }
    /* 打ちかけの日付を受け取らないための見張り。
       日付欄は、年を打ち直している途中に「空」や「20261-10-29」を投げてくる。
       そのまま入れると、入力の途中で欄が書き換わって打てなくなる */
    const DATE_MIN = '2000-01-01', DATE_MAX = '2100-12-31';
    function validDate(v) {
      const t = String(v || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(t)) return false;
      if (t < DATE_MIN || t > DATE_MAX) return false;
      const d = new Date(t + 'T00:00:00');
      return !isNaN(d.getTime());
    }
    /* 旅程まるごと、日付を前後にずらす（各日の間隔はそのまま） */
    function shiftAllDays(delta) {
      if (!delta) return;
      state.days.forEach(d => { if (d.date) d.date = shiftDate(d.date, delta); });
      syncDateRange();
    }
    /* 出発日の変更。
       帯の「2026-10-29 〜」だけが変わって、日程のタブが「10/2」のまま——という
       食い違いが起きないよう、日付の入った日程はまとめて同じ日数だけずらす */
    function setStartDate(val) {
      const v = val || '';
      if (!validDate(v)) return;                   // 打ちかけ・年が5桁などは受け取らない
      if (v === state.startDate) return;
      const first = state.days[0];
      if (!first || !first.date) {
        state.startDate = v;
        /* まだ日付が入っていない旅程は、その場で連番を振る（帯だけ先に進まないように） */
        if (state.days.every(d => !d.date)) applyDatesFromStart(true);
        return;
      }
      const delta = diffDays(first.date, v);
      if (!delta) { state.startDate = v; return; }
      snapshot('出発日の変更');
      shiftAllDays(delta);
      state.startDate = v;
      flash(`日程を ${Math.abs(delta)}日 ${delta > 0 ? 'あと' : 'まえ'}へずらしました`,
            'fa-calendar-day', { label: '元に戻す', fn: undo });
    }
    /* 帰着日の変更＝旅の長さの変更。日数をその期間に合わせる */
    function setEndDate(val) {
      const v = val || '';
      if (!validDate(v)) return;                   // 打ちかけ・年が5桁などは受け取らない
      if (v === state.endDate) return;
      const prev = state.endDate;
      state.endDate = v;
      if (!state.startDate) return;
      const last = state.days[state.days.length - 1];
      if (last && last.date === v) return;              // すでに合っている
      if (!fitDaysToRange()) state.endDate = prev;      // 直せないときは元に戻す
    }
    /* 出発日から全日程の日付を連番で採番 */
    function applyDatesFromStart(silent = false) {
      const base = state.startDate || todayISO();
      if (!silent) snapshot('日付の一括設定');
      state.startDate = base;
      state.days.forEach((d, i) => (d.date = shiftDate(base, i)));
      syncDateRange();
      if (!silent) flash(`${state.days.length}日分の日付を設定しました`, 'fa-calendar-check');
    }
    /* 出発日〜帰着日の期間に合わせて日数を増減 */
    function fitDaysToRange() {
      if (!state.startDate || !state.endDate) { flash('出発日と帰着日を設定してください', 'fa-triangle-exclamation'); return false; }
      const n = diffDays(state.startDate, state.endDate) + 1;
      if (n < 1) { flash('帰着日が出発日より前です', 'fa-triangle-exclamation'); return false; }
      if (n > 60) { flash('期間が長すぎます（最大60日）', 'fa-triangle-exclamation'); return false; }
      const dropped = state.days.slice(n).reduce((sum, d) => sum + d.events.length, 0);
      if (dropped && !confirm(`${state.days.length - n}日分（予定${dropped}件）が削除されます。続けますか？`)) return false;
      snapshot('日数の調整');
      while (state.days.length < n) state.days.push({ date: '', dayNumber: state.days.length + 1, ignoreOverlap: false, events: [] });
      if (state.days.length > n) state.days.splice(n);
      renumber();
      applyDatesFromStart(true);
      if (activeDay.value >= state.days.length) activeDay.value = state.days.length - 1;
      flash(`${n}日間の旅程に調整しました`, 'fa-calendar-days', { label: '元に戻す', fn: undo });
      return true;
    }

    /* ---------- event ops ---------- */
    function newEvent() {
      /* 読み込み時に足される項目（crossOk など）も最初から持たせて、
         新しく作った予定と、読み込んだ予定で形をそろえる */
      return { id: uid(), type: 'activity', startTime: '', endTime: '', title: '', location: '', cost: 0, paid: false, notes: '', url: '', platform: '', direction: '', stations: '', flightNo: '', seat: '', anchor: '', crossOk: false, route: [] };
    }
    function openAdd(dayIdx, anchor = '', insertAt = null) {
      editingDayIdx.value = dayIdx;
      editing.value = newEvent();
      wantEnd.value = false; metaOpen.value = false; catOverride.value = null;
      /* その日のいちばん遅い終了時刻を初期値に（手で並べ替えていても破綻しない）。
         出発地点は1日の起点なので引き継がない */
      const day = state.days[dayIdx];
      if (day && anchor !== 'start') {
        let latest = null;
        day.events.forEach(ev => {
          const t = ev.endTime || ev.startTime;
          const m = toMin(t);
          if (m !== null && (latest === null || m > latest)) latest = m;
        });
        if (latest !== null) { editing.value.startTime = minToHHMM(latest); editing.value.__autoTime = true; }
      }
      if (anchor) {
        editing.value.anchor = anchor;

    function shiftDayTimes(dayIdx, mins) {

    /* この予定から後ろだけをずらす。

    const rippleFor = ref('');
    function shiftFrom(dayIdx, ev, mins) {
      const day = state.days[dayIdx];
      if (!day) return;
      const at = day.events.findIndex(x => x.id === ev.id);
      if (at < 0) return;
      const targets = day.events.slice(at).filter(e => e.startTime || e.endTime || (e.route || []).some(st => st.arrTime || st.depTime));
      if (!targets.length) { flash('ずらす時刻がありません', 'fa-circle-info'); return; }
      snapshot('ここから後ろをずらす');
      const bump = (t) => { const m = toMin(t); return m === null ? t : minToHHMM(m + mins); };
      targets.forEach(e => {
        if (e.startTime) e.startTime = bump(e.startTime);
        if (e.endTime) e.endTime = bump(e.endTime);

          if (st.arrTime) st.arrTime = bump(st.arrTime);

      menuFor.value = '';
      flash(`${targets.length}件を ${mins > 0 ? '+' : '−'}${fmtMin(Math.abs(mins))} ずらしました`,
            'fa-clock-rotate-left', { label: '元に戻す', fn: undo });
    }

    /* ---------- 当日モード（旅の最中にスマホで見る画面） ----------

    const LS_DAYMODE = 'trip_day_mode_v1';

    /* 「あと 12分」「あと 3分20秒」「1時間5分前」 */

    const dmPlace = computed(() => {
      const x = dmFocus.value;
      if (!x) return '';
      if (x.e.location) return x.e.location;
      const names = x.stops.map(p => p.st.name).filter(Boolean);

    function dayModeOnBoot() {

    /* ---------- スマホで開く（リンクと QR で旅程を渡す） ----------

      persistCurrent();
      share.open = true; share.busy = true; share.url = ''; share.qr = ''; share.kind = 'trip';

    }

    /* 受け取る側：起動時に #trip= があれば中身を見せて、取り込むかたずねる */
    const incoming = reactive({ open: false, id: '', data: null, exists: false, error: '' });
    async function checkIncoming() {
      const m = location.hash.match(/^#trip=([A-Za-z0-9_-]+)$/);

      try {
        const obj = await unpackTrip(m[1]);
        if (!obj || obj.app !== 'trip' || !obj.data) throw new Error('旅程のリンクではありません');
        incoming.data = normalizeData(obj.data);
        incoming.id = typeof obj.id === 'string' ? obj.id : '';
        incoming.exists = !!incoming.id && tripIndex.value.some(t => t.id === incoming.id);
        incoming.open = true;
      } catch {
        flash('リンクから旅程を読み取れませんでした。リンクが途中で切れていないか確かめてください', 'fa-triangle-exclamation');
        clearIncomingHash();
      }
    }
    function clearIncomingHash() {
      /* setup の中の history は「元に戻す」の履歴なので、ブラウザの履歴は window から引く */
      try { window.history.replaceState(null, '', location.pathname + location.search); } catch {}
    }
    /* mode: 'replace'＝同じ旅程を置き換える（取り消せる） / 'add'＝別の旅程として足す */
    function acceptIncoming(mode) {
      const data = incoming.data;
      if (!data) return;
      persistCurrent();
      let id = incoming.id;
      let before = null;
      if (mode === 'replace' && incoming.exists) {
        try { before = localStorage.getItem(tripKey(id)); } catch {}
      } else if (incoming.exists || !/^t[a-z0-9]+$/.test(id)) {
        id = newTripId();                    // 別の旅程として足す
        if (incoming.exists) data.title = data.title + '（受け取り）';
      }
      /* 初めて受け取る旅程は、送り元と同じ id のまま入れる（次に送ったとき「同じ旅程」と分かるように） */
      if (!lsSet(tripKey(id), JSON.stringify(data))) { flash('保存できませんでした。空き容量が足りません', 'fa-triangle-exclamation'); return; }
      /* まっさらな端末に最初から入っている、手つかずの「新しい旅程」は片づける */
      const prevId = currentTripId.value;
      const untouched = prevId !== id && state.title === '新しい旅程' && !state.startDate && state.days.every(d => !d.date && !d.events.length);
      if (untouched) {
        tripIndex.value = tripIndex.value.filter(t => t.id !== prevId);
        try { localStorage.removeItem(tripKey(prevId)); } catch {}
      }
      const sum = tripSummary(id, data);
      const at = tripIndex.value.findIndex(t => t.id === id);
      if (at >= 0) tripIndex.value.splice(at, 1, sum); else tripIndex.value.push(sum);
      saveTripIndex();
      _applyTrip(id, normalizeData(JSON.parse(JSON.stringify(data))));
      incoming.open = false; incoming.data = null;
      clearIncomingHash();
      if (before !== null) {
        flash(`「${data.title}」を受け取った内容に置き換えました`, 'fa-download', { label: '元に戻す', fn: () => {
          lsSet(tripKey(id), before);
          _applyTrip(id, normalizeData(JSON.parse(before)));
          flash('受け取る前に戻しました', 'fa-rotate-left');
        } });
      } else flash(`「${data.title}」を受け取りました`, 'fa-download');
    }
    function rejectIncoming() { incoming.open = false; incoming.data = null; clearIncomingHash(); }



    /* ---------- クラウドに保存（自分の Google ドライブ。GAS のウェブアプリ） ----------
       Cookie・サイトデータを消すと端末の旅程は置き場ごと消える。そこで、直すたびにドライブへも保存しておく
       （クルナビの同期と同じ作り。GAS 側は gas/コード.gs）。
       ・合言葉はサーバーに送らず、SHA-256 のハッシュ（k）だけを使う
       ・送るのは全旅程と自宅の設定。最後にそろえたサーバーの時刻（updated）を添え、食い違えば競合
       ・前回そろえた内容（base）を控え、「base→この端末」「base→サーバー」の変更を合わせる（merge3）
       ・空の端末（Cookie を消した直後・新しいスマホ）は、送る前に必ず取り込む */
    const LS_CLOUD = 'trip_cloud_v1';
    const LS_CLOUD_BASE = 'trip_cloud_base_v1';
    /* 自分の GAS の URL をここに入れておくと、Cookie を消したあとも合言葉だけで戻せる */
    const CLOUD_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbwjOSCGSy580Pg_pnvgqCSMp6VxpzahWbg-_Hg9j2MBnsLFS54panQWdpk8f5BrOIV_Iw/exec';
    const CLOUD_WAIT = 4000;                // 直してから送るまでの待ち（打っている途中で送らない）
    const cloud = reactive(Object.assign(
      { url: '', phrase: '', updated: 0, lastAt: 0, code: '' },
      (() => { try { return JSON.parse(localStorage.getItem(LS_CLOUD) || '{}'); } catch { return {}; } })(),
      { busy: false, error: '', status: 'off', ask: null, form: false, formUrl: '', formPhrase: '', formShow: false, testing: false },
    ));
    const cloudOn = computed(() => !!(cloud.url && cloud.phrase));
    function saveCloudConf() {
      try { localStorage.setItem(LS_CLOUD, JSON.stringify({ url: cloud.url, phrase: cloud.phrase, updated: cloud.updated, lastAt: cloud.lastAt, code: cloud.code })); } catch {}
    }
    const saveCloudBase = (obj) => { try { localStorage.setItem(LS_CLOUD_BASE, JSON.stringify(obj)); } catch {} };
    const loadCloudBase = () => { try { const t = localStorage.getItem(LS_CLOUD_BASE); return t ? JSON.parse(t) : null; } catch { return null; } };

    /* URL の崩れ（全角・空白・改行・前後の文字・末尾の /）を取り除き、…/exec だけを抜き出す */
    function normalizeCloudUrl(raw) {
      const t = String(raw || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[\s​　]+/g, '');
      const m = t.match(/https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/(?:exec|dev)/)
             || t.match(/http:\/\/127\.0\.0\.1:\d+\/macros\/s\/[A-Za-z0-9_-]+\/exec/);   // 検査用
      return m ? m[0] : '';

    async function cloudKey(phrase) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('trip:' + phrase));
      return [...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const deviceLabel = () => /iPhone|iPad|Android/.test(navigator.userAgent || '') ? 'スマホ' : 'PC';
    function cloudNiceError(e) {
      const m = String((e && e.message) || e || '');
      if (/応答が 404/.test(m)) return 'URL が見つかりませんでした。途中で切れているか、余分な文字が入っているかもしれません';
      if (/応答が 40\d/.test(m)) return 'アクセスを断られました。GAS のデプロイを「アクセスできるユーザー：全員」にしてください';
      if (/応答が 5\d\d/.test(m)) return 'サーバー側でエラーが出ています。少し待ってから、もう一度試してください';
      if (/JSONではない/.test(m)) return 'GAS のウェブアプリの URL ではないようです（デプロイの画面に出る …/exec の URL を使ってください）';
      /* GAS がアクセスを断ると（デプロイが「全員」でない）、ブラウザには中身の無い失敗しか届かない。
         電波があるのに失敗したら、まずその設定を疑うよう案内する */
      if (/failed to fetch|networkerror|load failed|network/i.test(m)) return navigator.onLine
        ? 'つながりませんでした。GAS の「デプロイを管理」で、アクセスできるユーザーが「全員」になっているか確かめてください（URL が途中で切れていないかも）'
        : 'つながりませんでした。電波のあるところで、もう一度試してください';

    async function cloudFetch(url, init) {
      const res = await fetch(url, Object.assign({ redirect: 'follow' }, init));
      if (!res.ok) throw new Error('サーバーの応答が ' + res.status);
      const text = await res.text();
      try { return JSON.parse(text); } catch { throw new Error('サーバーの応答がJSONではない'); }
    }
    const cloudGet = async (url, k) => cloudFetch(`${url}?k=${k}&t=${Date.now()}`, { method: 'GET' });
    /* text/plain で送ると事前確認（preflight）が起きず、GAS でもそのまま受け取れる */
    const cloudPost = async (url, body) => cloudFetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    async function packJson(obj) {
      const raw = new TextEncoder().encode(JSON.stringify(obj));
      if (typeof CompressionStream === 'function') { try { return 'z' + b64u(await pipeBytes(raw, new CompressionStream('deflate-raw'))); } catch {} }
      return 'r' + b64u(raw);
    }

    /* この端末の全旅程を、送る形にまとめる（normalizeData を通して形をそろえる） */
    function cloudPayload() {
      persistCurrent();
      const trips = {};
      const order = [];
      tripIndex.value.forEach(t => {
        try {
          const raw = localStorage.getItem(tripKey(t.id));
          if (!raw) return;
          trips[t.id] = normalizeData(JSON.parse(raw));
          order.push(t.id);
        } catch {}
      });
      return { v: 1, order, trips, home: { place: home.place || '', station: home.station || '' } };
    }
    /* 中身のある旅程が1つでもあるか（空の端末かどうか） */
    const payloadHasContent = (p) => !!p && Object.values(p.trips || {}).some(d => d.days.some(x => x.events.length) || (d.title && d.title !== '新しい旅程'));

    /* まとめた形を、この端末に入れる（旅程の置き場と一覧を作り直す。開いている旅程は中身が変わったときだけ読み直す） */
    function applyCloudPayload(p) {
      cloudQuietUntil = Date.now() + 400;
      const ids = (p.order || []).filter(id => p.trips && p.trips[id]);
      Object.keys(p.trips || {}).forEach(id => { if (!ids.includes(id)) ids.push(id); });
      const keep = new Set(ids);
      tripIndex.value.forEach(t => { if (!keep.has(t.id)) { try { localStorage.removeItem(tripKey(t.id)); } catch {} } });
      const summaries = [];
      ids.forEach(id => {
        const data = normalizeData(JSON.parse(JSON.stringify(p.trips[id])));
        lsSet(tripKey(id), JSON.stringify(data));
        summaries.push(tripSummary(id, data));
      });
      if (p.home) { home.place = p.home.place || home.place; home.station = p.home.station || ''; }
      if (!summaries.length) return;
      tripIndex.value = summaries;
      const cur = keep.has(currentTripId.value) ? currentTripId.value : ids[0];
      const raw = localStorage.getItem(tripKey(cur));
      if (cur !== currentTripId.value || raw !== JSON.stringify(state)) {
        const day = activeDay.value;
        _applyTrip(cur, normalizeData(JSON.parse(raw)));
        activeDay.value = Math.min(day, state.days.length - 1);
      }
      saveTripIndex();
    }

    /* 3方向マージ（クルナビの merge3 と同じ）。b＝前回そろえた内容、l＝この端末、r＝サーバー。
       片方だけが変えたところはその変更を採る。id を持つものの配列（旅程・予定）は id ごとに合わせる。
       両方が同じところを違う値にしたときだけ、この端末の値を残す */
    const sameJson = (a, b) => a === b || JSON.stringify(a) === JSON.stringify(b);
    function merge3(b, l, r) {
      if (sameJson(l, r)) return l;
      if (b !== undefined && sameJson(b, l)) return r;
      if (b !== undefined && sameJson(b, r)) return l;
      if (isObj(l) && isObj(r)) {
        const bb = isObj(b) ? b : {};
        const out = {};
        new Set([...Object.keys(l), ...Object.keys(r)]).forEach(k => {
          const inL = k in l, inR = k in r, inB = k in bb;
          if (inL && inR) out[k] = merge3(inB ? bb[k] : undefined, l[k], r[k]);
          else if (inL) { if (!(inB && sameJson(bb[k], l[k]))) out[k] = l[k]; }     // サーバーで消されたものは、こちらが変えていなければ消す
          else if (!(inB && sameJson(bb[k], r[k]))) out[k] = r[k];                 // こちらで消したものは、サーバーが変えていなければ消したまま
        });
        return out;
      }
      if (Array.isArray(l) && Array.isArray(r)) {
        const bb = Array.isArray(b) ? b : [];
        const idd = (a) => a.every(x => isObj(x) && typeof x.id === 'string');
        if (idd(l) && idd(r) && (l.length || r.length)) {
          const byB = new Map(bb.filter(isObj).map(x => [x.id, x]));
          const byR = new Map(r.map(x => [x.id, x]));
          const out = [];
          l.forEach(x => {
            if (byR.has(x.id)) out.push(merge3(byB.get(x.id), x, byR.get(x.id)));
            else if (!(byB.has(x.id) && sameJson(byB.get(x.id), x))) out.push(x);
          });
          const lIds = new Set(l.map(x => x.id));
          r.forEach(x => { if (!lIds.has(x.id) && !(byB.has(x.id) && sameJson(byB.get(x.id), x))) out.push(x); });
          return out;
        }
        const prim = (a) => a.every(x => x === null || typeof x !== 'object');
        if (prim(l) && prim(r) && prim(bb)) {
          const out = l.filter(x => r.includes(x) || !bb.includes(x));
          r.forEach(x => { if (!l.includes(x) && !bb.includes(x) && !out.includes(x)) out.push(x); });
          return out;
        }
        /* 日程（id の無い配列）は位置ごとに合わせる。日数が違えば、この端末の並びを残す */
        if (l.length === r.length && bb.length === l.length) return l.map((x, i) => merge3(bb[i], x, r[i]));
        return l;
      }
      return l;
    }

    /* 同期の本体。受け取って合わせ、変わっていれば送る */
    async function cloudSync(opts = {}) {
      if (!cloudOn.value || cloud.busy) return false;
      if (!navigator.onLine) { cloud.status = 'offline'; return false; }
      if (editing.value) { scheduleCloud(); return false; }     // 編集中は読み直さない（閉じてから）
      cloud.busy = true; cloud.error = '';
      try {
        const k = await cloudKey(cloud.phrase);
        for (let tries = 0; tries < 3; tries++) {
          const srv = await cloudGet(cloud.url, k);
          if (!srv || srv.app !== 'trip') throw new Error('サーバーの応答がJSONではない');
          const local = cloudPayload();
          let base = loadCloudBase();
          let server = srv.data ? await unpackTrip(srv.data) : null;
          let next;
          if (!server) {
            if (!payloadHasContent(local)) { cloud.status = 'ok'; break; }              // どちらも空
            next = local;
          } else if (!base || !cloud.updated) {
            /* 初めてつなぐ端末：空ならそのまま取り込む。両方にあれば本人に選んでもらう */
            if (!payloadHasContent(local) || opts.take === 'server') { applyCloudPayload(server); next = null; base = server; }
            else if (opts.take === 'local') next = local;
            else if (opts.take === 'merge') { next = merge3(undefined, local, server); applyCloudPayload(next); }
            else { cloud.ask = { trips: Object.keys(server.trips || {}).length, at: srv.updated, device: srv.device }; cloud.status = 'ask'; return false; }
            if (!next) { cloud.updated = srv.updated; saveCloudBase(server); cloud.lastAt = Date.now(); saveCloudConf(); cloud.status = 'ok'; break; }
          } else if (srv.updated === cloud.updated) {
            if (sameJson(base, local)) { cloud.status = 'ok'; break; }                   // 何も変わっていない
            next = local;
          } else {
            next = merge3(base, local, server);
            if (!sameJson(next, local)) applyCloudPayload(next);
            if (sameJson(next, server)) { cloud.updated = srv.updated; saveCloudBase(server); cloud.lastAt = Date.now(); saveCloudConf(); cloud.status = 'ok'; break; }
          }
          const r = await cloudPost(cloud.url, { k, base: srv.updated, data: await packJson(next), device: deviceLabel() });
          if (r && r.conflict) continue;                                              // そのあいだに別の端末が保存した＝もう一度合わせる
          if (!r || !r.ok) throw new Error(r && r.error === 'large' ? '旅程が大きすぎて保存できませんでした' : '保存できませんでした');
          cloud.updated = r.updated; saveCloudBase(next); cloud.lastAt = Date.now(); saveCloudConf();
          cloud.status = 'ok';
          break;
        }
        return cloud.status === 'ok';
      } catch (e) {
        cloud.status = navigator.onLine ? 'error' : 'offline';
        cloud.error = cloudNiceError(e);
        if (opts.manual) flash(cloud.error, 'fa-triangle-exclamation');
        return false;
      } finally {
        cloud.busy = false;
      }
    }
    let cloudTimer = 0;
    let cloudQuietUntil = 0;                 // 取り込んだ直後は、中身の変化を自分の編集として数えない
    function scheduleCloud(wait = CLOUD_WAIT) {
      if (!cloudOn.value || Date.now() < cloudQuietUntil) return;
      if (cloud.status === 'ok') cloud.status = 'pending';
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(() => cloudSync(), wait);
    }
    watch(state, () => scheduleCloud(), { deep: true });
    watch(() => tripIndex.value.map(t => t.id).join(','), () => scheduleCloud());
    watch(editing, (v) => { if (!v && cloudOn.value) scheduleCloud(800); });
    window.addEventListener('online', () => cloudSync());
    let lastCloudLook = 0;
    document.addEventListener('visibilitychange', () => {
      /* 画面に戻ってきたら、ほかの端末の変更を取り込む（前回から15秒以上あいていれば） */
      if (document.visibilityState === 'visible' && Date.now() - lastCloudLook > 15000) { lastCloudLook = Date.now(); cloudSync(); }
    });

    /* 設定画面の「つなぐ」。保存する前に接続を確かめる */
    function openCloudForm() {
      cloud.formUrl = cloud.url || CLOUD_URL_DEFAULT;
      cloud.formPhrase = cloud.phrase;
      cloud.form = true;
    }
    async function connectCloud() {
      const url = normalizeCloudUrl(cloud.formUrl);
      const phrase = String(cloud.formPhrase || '').trim();
      if (!url) { flash('GAS のウェブアプリの URL（…/exec で終わるもの）を貼ってください', 'fa-triangle-exclamation'); return; }
      if (/\/dev$/.test(url)) { flash('「…/dev」の URL はテスト用です。デプロイの画面に出る「…/exec」の URL を使ってください', 'fa-triangle-exclamation'); return; }
      if (phrase.length < 8) { flash('合言葉は8文字以上にしてください（ほかの人に当てられないように）', 'fa-triangle-exclamation'); return; }
      cloud.testing = true;
      try {
        const r = await cloudGet(url, await cloudKey(phrase));
        if (!r || r.app !== 'trip') throw new Error('サーバーの応答がJSONではない');
      } catch (e) { cloud.testing = false; flash(cloudNiceError(e), 'fa-triangle-exclamation'); return; }
      cloud.testing = false;
      if (cloud.url !== url || cloud.phrase !== phrase) { cloud.updated = 0; try { localStorage.removeItem(LS_CLOUD_BASE); } catch {} }
      cloud.url = url; cloud.phrase = phrase; cloud.code = (await cloudKey(phrase)).slice(0, 4).toUpperCase();
      cloud.form = false;
      saveCloudConf();
      const ok = await cloudSync({ manual: true });
      if (ok) flash('つながりました。これからは直すたびにクラウドにも保存します', 'fa-cloud');
    }
    async function cloudChoose(take) {
      cloud.ask = null;
      const ok = await cloudSync({ manual: true, take });
      if (ok) flash(take === 'server' ? 'クラウドの旅程を取り込みました' : take === 'local' ? 'この端末の旅程をクラウドに保存しました' : '両方の旅程を合わせました', 'fa-cloud');
    }
    function disconnectCloud() {
      if (!confirm('この端末のクラウド保存をやめますか？（クラウドの中身と、この端末の旅程はどちらも消えません）')) return;
      cloud.url = ''; cloud.phrase = ''; cloud.updated = 0; cloud.code = ''; cloud.status = 'off'; cloud.ask = null;
      try { localStorage.removeItem(LS_CLOUD); localStorage.removeItem(LS_CLOUD_BASE); } catch {}

    }
    /* スマホにも同じ設定を渡す（#cloud= のリンク。合言葉が入るので人に見せない） */
    async function shareCloudConf() {
      share.open = true; share.busy = true; share.url = ''; share.qr = ''; share.kind = 'cloud';
      try {
        share.url = shareBase() + '#cloud=' + await packTrip({ app: 'trip-cloud', url: cloud.url, phrase: cloud.phrase });
        share.qr = (window.HC && window.HC.qr) ? (window.HC.qr.svg(share.url, { ecl: 'M', px: 260 }) || '') : '';
        share.canShare = typeof navigator.share === 'function';
      } catch { share.open = false; }
      share.busy = false;
    }
    async function checkIncomingCloud() {
      const m = location.hash.match(/^#cloud=([A-Za-z0-9_-]+)$/);
      if (!m) return false;
      clearIncomingHash();
      try {
        const o = await unpackTrip(m[1]);
        if (!o || o.app !== 'trip-cloud' || !normalizeCloudUrl(o.url) || !o.phrase) throw new Error();
        if (!confirm('クラウド保存の設定を受け取りますか？\nこの端末も、PC と同じクラウドに旅程を保存するようになります')) return true;
        cloud.formUrl = o.url; cloud.formPhrase = o.phrase;
        await connectCloud();
      } catch { flash('リンクから設定を読み取れませんでした', 'fa-triangle-exclamation'); }
      return true;
    }
    /* 「クラウドから戻す」：設定を開いて、URL と合言葉の欄まで動かす */
    function openCloudRestore() {
      showSettings.value = true;
      openCloudForm();
      /* 設定を開くと一番上の欄にフォーカスが当たってスクロールが戻るので、それが済んでから動かす */
      setTimeout(() => {
        const el = document.querySelector('[data-cloud-url]') || document.querySelector('[data-cloud]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
        if (el && el.focus) el.focus({ preventScroll: true });
      }, 350);
    }
    /* Cookie を消した直後など、旅程がひとつも無くクラウドにもつないでいないときに「戻す」を出す */
    const showRestoreHint = computed(() => !cloudOn.value && !tripIndex.value.some(t => (t.eventCount || 0) > 0));

    /* ---------- オフライン（Service Worker） ----------
       公開ページ（https）で開いたときだけ登録する。localhost では古いキャッシュで混乱しないよう外しておく
       （検査のときだけ trip_sw_force_v1=1 で有効にできる）。新しい版を取り込んでも勝手に読み込み直さない */
    const swState = reactive({ supported: 'serviceWorker' in navigator, https: location.protocol === 'https:', cache: '', count: 0 });
    function askSwStatus() {

    }
    function registerSW() {
      if (!swState.supported) return;
      let force = false;
      try { force = localStorage.getItem('trip_sw_force_v1') === '1'; } catch {}

    /* ---------- 文字の濃さ ----------
       カテゴリ色・地点の色をそのまま文字色に使うと、明るい色（黄・緑・空色）は淡い背景に沈む（1.8〜3）。
       ink(色, 背景) は色味を保ったまま、背景に対して 4.5:1 になるまで黒（暗い背景なら白）へ寄せる。
       背景を省くと、いまの明暗の面（明るい画面＝薄い灰、暗い画面＝濃紺）に合わせる。
       白い文字を乗せる下地には ink(色, '#ffffff') を使う（白とのあいだで 4.5:1 になる） */
    const _inkCache = new Map();
    const _rgb = (h) => {
      const m = String(h || '').trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return null;
      const x = m[1].length === 3 ? m[1].split('').map(c => c + c).join('') : m[1];
      return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16));
    };
    const _lum = (c) => { const v = c.map(x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
    const _ratio = (a, b) => { const A = _lum(a), B = _lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
    function ink(hex, bg) {
      const surface = bg || (isDark.value ? '#1e293b' : '#f1f5f9');
      const key = hex + '|' + surface;
      if (_inkCache.has(key)) return _inkCache.get(key);
      const c0 = _rgb(hex), b = _rgb(surface);
      if (!c0 || !b) return hex;
      const toward = _lum(b) < 0.4 ? [255, 255, 255] : [0, 0, 0];
      let c = c0.slice();
      for (let i = 0; i < 30 && _ratio(c, b) < 4.5; i++) c = c.map((v, k) => Math.round(v + (toward[k] - v) * 0.07));
      const out = '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
      _inkCache.set(key, out);
      return out;
    }

    /* ---------- ダークモード ---------- */

    purgeRoom = (step) => {

        try {
          const n = Object.keys(netCache).length;
          Object.keys(netCache).forEach(k => { delete netCache[k]; });
          localStorage.removeItem(LS_NET);
          return n > 0;
        } catch { return false; }
      }
      if (step === 1) {                     // ② 元に戻す履歴（今回のぶんだけ）
        if (!history.value.length && !redoStack.value.length) return false;
        history.value.splice(0, Math.max(1, history.value.length - 3));
        redoStack.value = [];
        return true;

    /* ---------- 旅程操作 ---------- */
    /* 保存は watch 任せ（非同期）なので、旅程を切り替える前に必ず自分で書き出す。
       これをしないと直前の編集が切り替え先のキーに書かれてしまう */
    function persistCurrent() {
      const id = currentTripId.value;
      if (!id) return false;
      const json = JSON.stringify(state);
      const ok = lsSet(tripKey(id), json);
      if (ok) { lastWrite.value = Date.now(); lastWritten = json; saveError.value = false; }
      return ok;
    }
    /* 最後に自分が書いた中身。置き場のいまと突き合わせて、
       「自分が書いたまま」なのか「誰かが書き換えたのか」を見分ける */
    const lastWrite = ref(0);
    const storedNow = (id) => { try { return localStorage.getItem(tripKey(id)); } catch { return null; } };
    /* 置き場の中身が、自分の知らないものに変わっていないか */
    function storeChangedElsewhere() {
      const id = currentTripId.value;
      if (!id || lastWritten === null) return false;
      const cur = storedNow(id);
      return cur !== null && cur !== lastWritten;
    }
    const otherTab = ref(false);            // 別のタブが同じ旅程を書き換えた
    function reloadFromStore() {
      const id = currentTripId.value;
      try {
        const raw = localStorage.getItem(tripKey(id));
        if (raw) { _applyTrip(id, normalizeData(JSON.parse(raw))); flash('読み込み直しました', 'fa-rotate'); }
      } catch { flash('読み込めませんでした', 'fa-triangle-exclamation'); }
      otherTab.value = false;
    }
    function _applyTrip(id, data) {
      /* 元に戻す履歴は旅程ごと。切り替えたのに残しておくと、前の旅程の中身が
         今の旅程に書き戻されてしまう（Bを開いて元に戻すと、BがAの写しになっていた） */
      history.value = []; redoStack.value = [];
      lastWritten = storedNow(id);
      draftFound.value = null;              // ほかの旅程の書きかけを出さない
      currentTripId.value = id;
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, data);
      activeDay.value = 0;
      saveTripIndex();
    }
    function switchTrip(id, persist = true) {
      if (id === currentTripId.value) { showTripPanel.value = false; return; }
      try {
        const raw = localStorage.getItem(tripKey(id));
        if (!raw) { flash('この旅程のデータが見つかりません', 'fa-triangle-exclamation'); return; }
        if (persist) persistCurrent();
        _applyTrip(id, normalizeData(JSON.parse(raw)));
        showTripPanel.value = false;
        flash('旅程を切り替えました', 'fa-right-left');
      } catch { flash('読み込めませんでした', 'fa-triangle-exclamation'); }
    }
    function createNewTrip() {
      persistCurrent();
      const id = newTripId();
      const blank = _blankTrip();
      try { localStorage.setItem(tripKey(id), JSON.stringify(blank)); }
      catch { flash('保存できませんでした。空き容量が足りないかもしれません', 'fa-triangle-exclamation'); return; }
      if (!blank.origin && homePlace()) blank.origin = homePlace();
      tripIndex.value.push({ id, title: blank.title, startDate: '', endDate: '', origin: blank.origin || '', destination: '', status: 'wip', dayCount: 1, eventCount: 0 });
      saveTripIndex();
      _applyTrip(id, blank);
      showTripPanel.value = false;
      flash('新しい旅程を作成しました', 'fa-plus');

    /* 去年の旅程をベースに作れるように */
    function duplicateTrip(id) {
      let raw = null;
      try { raw = localStorage.getItem(tripKey(id)); } catch {}
      if (!raw) { flash('この旅程のデータが見つかりません', 'fa-triangle-exclamation'); return; }
      let data;
      try { data = normalizeData(JSON.parse(raw)); } catch { flash('読み込めませんでした', 'fa-triangle-exclamation'); return; }
      persistCurrent();
      data.title = data.title + ' のコピー';
      /* 予定のIDは振り直す（元の旅程と混ざらないように） */
      data.days.forEach(d => d.events.forEach(e => { e.id = uid(); }));
      const nid = newTripId();
      try { localStorage.setItem(tripKey(nid), JSON.stringify(data)); }
      catch { flash('保存できませんでした。空き容量が足りないかもしれません', 'fa-triangle-exclamation'); return; }
      tripIndex.value.push({
        id: nid, title: data.title, startDate: data.startDate, endDate: data.endDate,
        origin: data.origin, destination: data.destination, status: data.status || 'wip',
        dayCount: data.days.length, eventCount: data.days.reduce((n, d) => n + d.events.length, 0),
      });
      saveTripIndex();
      _applyTrip(nid, data);
      showTripPanel.value = false;
      flash('旅程を複製しました', 'fa-copy');
    }
    function deleteTrip(id) {
      if (tripIndex.value.length <= 1) { flash('最後の旅程は削除できません', 'fa-triangle-exclamation'); return; }
      const ti = tripIndex.value.findIndex(t => t.id === id);
      const trip = tripIndex.value[ti];
      if (!trip || !confirm(`「${trip.title}」を削除しますか？（元に戻せます）`)) return;
      let raw = null;
      try { raw = localStorage.getItem(tripKey(id)); localStorage.removeItem(tripKey(id)); } catch {}
      const entry = JSON.parse(JSON.stringify(trip));
      const wasCurrent = (id === currentTripId.value);
      tripIndex.value.splice(ti, 1);
      /* 削除したキーに書き戻さないよう、ここでは保存しない */
      if (wasCurrent) switchTrip(tripIndex.value[Math.max(0, ti - 1)].id, false);
      else saveTripIndex();
      flash('旅程を削除しました', 'fa-trash-can', { label: '元に戻す', fn: () => restoreTrip(entry, raw, ti, wasCurrent) });
    }
    /* 「作成中」と「完成」を切り替える。
       表示していない旅程でも、控えを書き換えて覚えておく */
    function toggleTripStatus(id) {
      const t = tripIndex.value.find(x => x.id === id);
      if (!t) return;
      const next = (t.status === 'done') ? 'wip' : 'done';
      if (id === currentTripId.value) {
        state.status = next;                       // 控えへの書き出しは watch まかせ
      } else {
        try {
          const raw = localStorage.getItem(tripKey(id));
          if (raw) {
            const data = JSON.parse(raw);
            data.status = next;
            localStorage.setItem(tripKey(id), JSON.stringify(data));

      flash(next === 'done' ? `「${t.title}」を完成にしました` : `「${t.title}」を作成中に戻しました`,
            next === 'done' ? 'fa-circle-check' : 'fa-pen-ruler');
    }
    /* 旅程の並べ替え。並び順はそのまま控えに書くので、次に開いても保たれる */
    function moveTrip(id, dir) {
      const from = tripIndex.value.findIndex(t => t.id === id);
      const to = from + dir;
      if (from < 0 || to < 0 || to >= tripIndex.value.length) return;
      const [t] = tripIndex.value.splice(from, 1);
      tripIndex.value.splice(to, 0, t);
      saveTripIndex();
      flash('旅程を並べ替えました', 'fa-arrows-up-down');
    }
    /* つまんで動かす（ドラッグ） */
    const tripDragFrom = ref(-1);
    function onTripDragStart(ti, ev) {
      tripDragFrom.value = ti;
      if (ev && ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', String(ti)); } catch {} }
    }
    const onTripDragEnd = () => { tripDragFrom.value = -1; };
    function onTripDragOver(ev) {
      if (tripDragFrom.value < 0) return;
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
    }
    function onTripDrop(ti, ev) {
      const from = tripDragFrom.value;
      tripDragFrom.value = -1;
      if (from < 0 || from === ti) return;
      if (ev) ev.preventDefault();
      const [t] = tripIndex.value.splice(from, 1);
      tripIndex.value.splice(ti, 0, t);
      saveTripIndex();
      flash('旅程を並べ替えました', 'fa-arrows-up-down');
    }
    /* 出発日の早い順に。日付の無いものは後ろへ */
    function sortTripsByDate() {
      const before = tripIndex.value.slice();
      const key = (t) => t.startDate || '9999-99-99';
      tripIndex.value = tripIndex.value
        .map((t, i) => ({ t, i }))
        .sort((a, b) => (key(a.t) < key(b.t) ? -1 : key(a.t) > key(b.t) ? 1 : a.i - b.i))
        .map(x => x.t);
      saveTripIndex();
      flash('日付の早い順に並べました', 'fa-arrow-down-1-9', {
        label: '元に戻す', fn: () => { tripIndex.value = before; saveTripIndex(); },
      });
    }
    function restoreTrip(entry, raw, at, backToIt) {
      if (!entry || tripIndex.value.some(t => t.id === entry.id)) return;
      try { if (raw) localStorage.setItem(tripKey(entry.id), raw); } catch {}
      tripIndex.value.splice(Math.min(Math.max(0, at), tripIndex.value.length), 0, entry);
      saveTripIndex();

      if (backToIt && raw) { switchTrip(entry.id); flash('旅程を戻しました', 'fa-rotate-left'); return; }
      flash('旅程を戻しました', 'fa-rotate-left');
    }
    /* 旅程そのものは残し、中身（日程と予定）だけを空にする */
    function clearAllData() {

    /* ---------- 乗換チェーン ---------- */
    const blankStop = (name = '') => ({ name, arrPlatform: '', arrTime: '', depPlatform: '', depTime: '',
                                        line: '', kind: '', dest: '', stations: '', through: false, quick: false });
    /* 駅を1つ足す。まだ何もないときは、場所欄の「A → B」から2駅ぶん用意する */
    function addStop() {
      const e = editing.value;
      if (!e) return;
      if (!Array.isArray(e.route)) e.route = [];
      if (!e.route.length) {
        const parts = splitRoute(e.location);
        const first = blankStop(parts[0] || '');
        first.depPlatform = e.platform || '';
        first.stations = e.stations || '';
        if (e.direction) first.dest = String(e.direction).replace(/行き?$/, '').trim() + '行';
        e.route.push(first);
        e.route.push(blankStop(parts.length >= 2 ? parts[parts.length - 1] : ''));
      } else {
        e.route.push(blankStop());
      }
      const at = e.route.length - 1;
      nextTick(() => { const el = document.getElementById('stop-' + at); if (el) el.focus(); });
    }
    function removeStop(i) {
      const r = editing.value && editing.value.route;
      if (r) r.splice(i, 1);
    }
    function moveStop(i, dir) {
      const r = editing.value && editing.value.route;
      const to = i + dir;
      if (!r || to < 0 || to >= r.length) return;
      const [m] = r.splice(i, 1);
      r.splice(to, 0, m);
    }
    function duplicateStop(i) {
      const r = editing.value && editing.value.route;
      if (!r || !r[i]) return;
      r.splice(i + 1, 0, JSON.parse(JSON.stringify(r[i])));
    }
    /* その駅から乗る列車の候補：直前の駅と同じ路線／旅程内でよく使う路線 */
    /* 路線の候補：①直前の乗換で使った路線（その駅を通るときだけ）
                    ②その駅を通る路線（実データ・全部出す） ③これまでの入力（関係するものだけ） */
    function lineSuggests(i) {
      const r = editing.value && editing.value.route;
      if (!r) return [];
      const out = [];
      const prev = i > 0 ? r[i - 1] : null;
      const nm = r[i] ? r[i].name : '';
      /* バスの停留所は駅データに無いので、系統は時刻表データから引く */
      const busy = editingBus();
      const hint = i > 0 && r[i - 1] ? posNear(r[i - 1].name, null) : null;
      const here = busy ? [] : linesAt(nm, hint);
      const known = here.length > 0;
      /* 「続けて乗る」は、その路線がこの駅を通るときだけ勧める
         （桜木町に京急を勧めない、といった取り違えを防ぐ） */
      if (prev && prev.line && (!known || matchLine(prev.line, here))) {
        out.push({ line: prev.line, dest: prev.dest, keep: true });
      }
      if (busy) {
        busRoutesAt(nm).forEach(l => {
          if (out.some(o => lineKey(o.line) === lineKey(l))) return;
          out.push({ line: l, dest: '', net: true });
        });
      }
      if (known) {
        here.forEach(l => {
          if (out.some(o => lineKey(o.line) === lineKey(l))) return;
          out.push({ line: l, dest: '', net: true });
        });
      }
      /* その駅を通る路線が実データで分かっているなら、それがいちばん確かなので
         これまでの入力は足さない（同じ路線が言い方違いで二重に並ぶのを防ぐ）。
         駅が分からないときだけ、これまでの入力を助け舟にする */
      if (!known && !(busy && busRoutesAt(nm).length)) {
        lineOptions.value.forEach(l => {
          if (out.some(o => lineKey(o.line) === lineKey(l))) return;
          if (out.length >= 6) return;
          out.push({ line: l, dest: '', keep: false });
        });
      }
      return out;
    }
    /* 駅名の候補：実データの駅名と、地図で見つかった地点 */
    function nameSuggests(i) {
      const r = editing.value && editing.value.route;
      const st = r && r[i];
      const q = st && String(st.name || '').trim();
      if (!q || q.length < 2) return [];
      const out = [];
      const info = stationInfo(q);
      /* 書いたとおりの駅が実在するなら、直すところは無い。
         代わりに、下に「通っている路線」が出る。ここで候補を並べても選ぶ手が増えるだけ */
      if (info && info.found && info.name === q) return [];
      /* 停留所の名前がそのままあるときも同じ（「徳島駅前」に別の停留所を勧めない） */
      if (tbStops(q).some(r => r.name === q)) return [];
      if (info && info.found) {
        out.push({ name: info.name, sub: info.lines.slice(0, 2).join('・') });
      }
      /* 地図の答えは「空港」だけで引っかかった別の土地のものも混ざる。
         書いた名前と本当に同じものだけを出す */
      const geoKeys = ['geo:' + q];
      const formal = PLACE_ALIASES[q.replace(/\s|　/g, '')];
      if (formal) geoKeys.unshift('geo:' + formal);
      geoKeys.forEach(gk => {
        (railIdx.geo[gk] || []).forEach(h => {
          if (out.some(o => o.name === h.name) || h.name === q) return;
          if (out.length >= 5) return;
          if (!sameNamed(h.name, q)) return;
          out.push({ name: h.name, sub: h.addr });
        });
      });
      /* 徳島のバス停（持っているデータ）。地図には無いので、ここでしか出せない */
      if (!(info && info.found && info.name === q)) {
        tbSearch(q, 4).forEach(r => {
          if (out.length >= 5 || out.some(o => o.name === r.name)) return;
          out.push({ name: r.name, sub: r.routes.length ? r.routes.slice(0, 2).join('・') : 'バス停（徳島）' });
        });
      }
      /* 実際の駅が見つかっているなら、そこから路線をたどれる。
         これまでの入力は路線を持たないので、並べても選ぶ手が増えるだけ。
         何も見つからなかったときの助け舟としてだけ使う */
      if (!out.length) {
        stationOptions.value.forEach(nm => {
          if (out.length >= 5 || nm === q || !placeKey(nm).includes(placeKey(q))) return;
          if (out.some(o => o.name === nm)) return;

    }
    /* いま選んでいる路線の、実データ上の名前と駅の並び */
    function resolvedLine(i) {
      if (editingBus()) return null;
      const r = editing.value && editing.value.route;
      const st = r && r[i];
      if (!st || !st.line) return null;
      const info = stationInfo(st.name);
      const api = info && info.found ? matchLine(st.line, info.lines) : '';
      if (!api) return null;
      return { api, seq: railIdx.line[api] || null };
    }
    /* 行先の候補：路線の両端＋これまでの入力 */
    /* この駅から見て、進む向きにある駅を順に返す（近い順）。
       行先は終点とは限らない（京急蒲田行・武蔵小杉行 …）ので、
       候補に出ないときの受け皿として、路線上の駅をそのまま選べるようにする */
    /* ある区間ひとつぶんの、進む向きにある駅 */
    function destAlongOne(i) {
      const rl = resolvedLine(i);
      if (!rl || !rl.seq || rl.seq.length < 2) return [];
      const r = editing.value && editing.value.route;
      const st = r && r[i], next = r && r[i + 1];
      if (!st) return [];
      const info = stationInfo(st.name), ninfo = next && stationInfo(next.name);
      const i1 = info && info.found ? rl.seq.indexOf(info.name) : -1;
      const i2 = (ninfo && ninfo.found) ? rl.seq.indexOf(ninfo.name) : -1;

      if (i2 >= 0 && i2 !== i1) {

        return fwd ? rl.seq.slice(i1 + 1) : rl.seq.slice(0, i1).reverse();

      for (let k = 1; k < rl.seq.length; k++) {

    function destAlong(i) {

      const add = (nm) => { if (nm && !seen.has(nm)) { seen.add(nm); out.push(nm); } };
      destAlongOne(i).forEach(add);

      if (r) {

      const out = [];

        if (!info || !info.found) await loadGeo(q);

    /* 入力欄から離れたときに、書き方をそっとそろえる（警告にしないで直す） */
    function tidyStop(st, kind) {
      if (!st) return;
      const k = kind === 'bus' ? 'bus' : 'rail';
      ['arrPlatform', 'depPlatform'].forEach(f => {

      if (sv !== st.stations) st.stations = sv;

    function tidyRoute(ev) {

    }

        else if (k === 'p') { e.preventDefault(); printNow(); }
        else if (e.key === 'Enter' && editing.value) { e.preventDefault(); saveEvent(); }
        return;
      }
      if (isTyping(e.target) || anyModal()) return;
      if (showSearch.value && e.key !== '/' && e.key !== '?') return;
      switch (e.key) {
        case 'n': case 'N': e.preventDefault(); openAdd(activeDay.value); break;
        case 'd': case 'D': e.preventDefault(); addDay(); break;
        case 's': case 'S': e.preventDefault(); sortDayManual(activeDay.value); break;
        case 'm': case 'M': e.preventDefault(); openMoveWizard(activeDay.value); break;
        case 'ArrowLeft': if (activeDay.value > 0) { e.preventDefault(); activeDay.value--; } break;
        case 'ArrowRight': if (activeDay.value < state.days.length - 1) { e.preventDefault(); activeDay.value++; } break;
        case '/': e.preventDefault(); openSearch(); break;
        case '?': e.preventDefault(); showHelp.value = true; break;
      }
    }
    /* カードのメニューは外側クリックで閉じる */
    function onDocClick() { if (menuFor.value) { menuFor.value = ''; rippleFor.value = ''; } if (shiftMenuFor.value >= 0) shiftMenuFor.value = -1; }

    /* アプリの印刷ボタンを通さずに印刷された場合も出力時刻を埋める */
    function stampPrintTime() { printTime.value = stampText(); }
    onMounted(() => {
      document.addEventListener('keydown', onKeydown);
      document.addEventListener('click', onDocClick);
      window.addEventListener('scroll', onScroll, { passive: true });
      /* 金額や日付の欄を触ったあと、そのまま画面を動かすと、
         カーソルの下にある欄の数字が回ってしまう（ブラウザの標準の動き）。
         入力欄からいったん手を離させて、画面だけが動くようにする */
      const SPINNABLE = ['number', 'date', 'time', 'datetime-local', 'month', 'week'];
      window.addEventListener('wheel', (ev) => {
        const el = document.activeElement;
        if (!el || el.tagName !== 'INPUT' || !SPINNABLE.includes(el.type)) return;
        if (el !== ev.target && !el.contains(ev.target)) return;
        el.blur();
      }, { passive: true });
      /* 編集中の移動と、移動ウィザードの2地点から所要の目安を用意する
         （中で使う値が出そろってから見張り始める） */
      watch(() => {
        const e = editing.value;
        if (moveWizard.open) return 'w|' + moveWizard.from + '|' + moveWizard.to;
        if (e && MOVE_TYPES.includes(e.type)) { const p = endsOf(e); return p ? 'e|' + p.a + '|' + p.b : ''; }
        return '';
      }, (v) => {
        if (!v) { estimates.key = ''; estimates.list = []; return; }
        const [, a, b] = v.split('|');
        requestEstimates(a, b);
      });
      /* 閉じる・別のタブへ移る、といったときに取りこぼさないよう、その場で書き出す。
         watch 任せの保存は次の一拍で動くので、閉じるほうが速いことがある */
      const flushAll = () => {
        if (editing.value) saveDraft();
        /* 別のタブや別の画面が書き換えていたら、上書きしない。
           こちらが古いままなら、閉じるだけで相手の入力を消してしまう */
        if (storeChangedElsewhere()) { otherTab.value = true; return; }
        persistCurrent();
      };
      window.addEventListener('pagehide', flushAll);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

      /* 同じ旅程を別のタブでも開いていると、あとから書いたほうで上書きされる。
         気づかずに片方の入力が消えるので、変化に気づいたら知らせる */
      window.addEventListener('storage', (ev) => {
        if (!ev || ev.key !== tripKey(currentTripId.value) || !ev.newValue) return;
        /* 中身が手元と同じなら、自分の書き込みが返ってきただけ */
        try { if (ev.newValue === JSON.stringify(state)) return; } catch {}
        otherTab.value = true;
      });

      loadDraft();
      window.addEventListener('beforeprint', stampPrintTime);
      window.addEventListener('beforeprint', planPrint);
      maybeAutoBackup();
      registerSW();
      checkIncoming();
      checkIncomingCloud().then(got => { if (!got && cloudOn.value) cloudSync(); });
      window.addEventListener('hashchange', () => { checkIncoming(); checkIncomingCloud(); });   // 開いているページにリンクを貼り直したとき
      dayModeOnBoot();
      /* 更新してから初めて開いたときだけ、新しくなったことを出す（はじめて使う人には出さない） */
      try {
        const seen = localStorage.getItem(LS_SEEN_VER);
        const used = tripIndex.value.some(t => (t.eventCount || 0) > 0);
        if (seen ? verCmp(APP_VERSION, seen) > 0 : used) openChangelog(seen || '1.0.0');
        localStorage.setItem(LS_SEEN_VER, APP_VERSION);
      } catch {}
      if (brokenTrips.length) {
        flash(`読めない旅程が${brokenTrips.length}件ありました。中身は控えに残して、一覧から外しています`, 'fa-triangle-exclamation',
              { label: '控えを書き出す', icon: 'fa-download', fn: downloadBroken });
      }
    });
    onUnmounted(() => {
      document.removeEventListener('keydown', onKeydown);
      document.removeEventListener('click', onDocClick);
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('beforeprint', stampPrintTime);
      window.removeEventListener('beforeprint', planPrint);
    });

    <main class="px-3 sm:px-6 py-4 sm:py-5 max-w-5xl mx-auto">
