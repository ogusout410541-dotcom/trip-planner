                        style="background:linear-gradient(135deg,#6366f1,#a855f7)" data-cloud-connect>
                  <i class="fa-solid" :class="cloud.testing ? 'fa-spinner fa-spin' : 'fa-cloud-arrow-up'"></i>つないで保存する</button>
                <p class="text-[11px] text-slate-500 mt-2 leading-relaxed">
                  GAS の準備のしかたは、アプリのフォルダの「gas/デプロイ手順.md」にあります。前に保存していた旅程は、同じ URL と合言葉でつなぐと戻ります。
                </p>
                <button v-if="cloudOn" @click="cloud.form = false" class="tap text-[11px] font-bold text-slate-500 hover:underline px-1 py-1 mt-1">やめる</button>
              </template>
            </template>
          </div>

          <!-- 版 -->
          <div class="mt-5 pt-4 border-t flex items-center gap-2 flex-wrap" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <span class="text-xs font-black text-ink"><i class="fa-solid fa-code-branch text-indigo-400 mr-1"></i>バージョン v{{ APP_VERSION }}</span>
            <button @click="openChangelog()" class="tap ml-auto px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 bg-white/70 hover:bg-white border border-slate-200">アップデート履歴</button>
            <p class="w-full text-[11px] text-slate-500 leading-relaxed">
              <i class="fa-solid fa-wifi mr-1"></i>
              <template v-if="!swState.https">圏外で使えるのは、公開ページ（https）で開いたときです。スマホへは「スマホで開く」から送れます。</template>
              <template v-else-if="!swVersion">圏外でも開けるよう、この端末に保存しています。</template>
              <template v-else-if="swVersion === APP_VERSION">圏外でも開けます（v{{ swVersion }} をこの端末に保存済み）。</template>
              <template v-else>この端末に保存されている版は v{{ swVersion }} です。読み込み直すと v{{ APP_VERSION }} に切り替わります。</template>
            </p>
            <button @click="showSettings = false; print()" class="sm:hidden w-full py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-print"></i>印刷 / PDF</button>
            <button @click="toggleDark" class="w-full py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
              <i class="fa-solid" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>{{ isDark ? '明るい画面にする' : '暗い画面にする' }}</button>
            <button @click="showSettings = false; showJsonModal = true; pullToEditor()" class="w-full py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-shield-halved"></i>バックアップと書き出し</button>
            <button @click="showSettings = false; openShare()" class="w-full py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-mobile-screen-button"></i>スマホで開く（リンク・QRコード）</button>
          </div>

          <div class="sticky-foot mt-5" :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
            <button @click="showSettings=false"
              class="w-full py-3 rounded-xl font-bold text-white shadow-lg hover:opacity-90 transition"
              style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-check mr-1"></i>完了
            </button>
          </div>
        </div>
      </div>
    </transition>



    <!-- ============ 直し方の案内 ============ -->
    <transition name="fade">
      <div v-if="fixDlg.open" data-modal="fix" role="dialog" aria-modal="true" aria-label="直し方"
           class="no-print fixed inset-0 z-[55] grid place-items-center p-3 sm:p-4">
        <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-sm" @click="fixDlg.open = false"></div>
        <div class="relative glass rounded-3xl shadow-2xl w-full max-w-xl max-h-[88dvh] overflow-y-auto p-4 sm:p-5">
          <div class="flex items-start gap-2 mb-3">
            <span class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0 bg-rose-500">
              <i class="fa-solid fa-screwdriver-wrench"></i>
            </span>
            <div class="min-w-0">
              <div class="text-base font-black text-ink">直し方</div>
              <div class="text-[11px] font-bold text-slate-400 truncate">
                {{ fixTarget ? (fixTarget.title || '（無題）') : '' }}
                <span v-if="fixTarget && fixTarget.startTime">／{{ fixTarget.startTime }}</span>
              </div>
            </div>
            <button @click="fixDlg.open = false" data-focus-first aria-label="閉じる"
                    class="tap ml-auto w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 transition shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div v-if="!fixIssues.length" class="text-center py-8">
            <i class="fa-solid fa-circle-check text-3xl text-emerald-400"></i>
            <div class="text-sm font-bold text-slate-500 mt-2">この予定の指摘は片づきました</div>
          </div>

          <div v-for="(iss, ii) in fixIssues" :key="'fx'+ii" class="fx-card"
               :class="'fx-' + iss.level">
            <div class="flex items-start gap-2">
              <i class="fa-solid mt-0.5 shrink-0"
                 :class="iss.level === 'error' ? 'fa-circle-exclamation text-rose-500'
                         : (iss.level === 'warn' ? 'fa-triangle-exclamation text-amber-500' : 'fa-lightbulb text-slate-400')"></i>
              <div class="min-w-0">
                <div class="fx-title">{{ iss.msg }}</div>
                <div class="fx-where">
                  <i class="fa-solid fa-location-dot text-[9px] mr-0.5"></i>{{ issueWhere(iss) }}
                  <span v-if="ignoredSet.has(iss.key)" class="ml-1">（いまは無視しています）</span>
                </div>
              </div>
            </div>

            <!-- 直す案（当てる前に、何がどう変わるかを見せる） -->
            <div v-if="fixList(iss).length" class="mt-2.5 fx-box">
              <div class="fx-lead">
                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>{{ fixList(iss).length > 1 ? 'どちらかを選べます' : '直す案があります' }}
              </div>
              <div v-for="(f, fi) in fixList(iss)" :key="'fo'+fi" :class="fi ? 'mt-2.5 pt-2.5 border-t border-slate-200/60' : ''">
                <div class="fx-detail">{{ f.detail || f.label }}</div>
                <button @click="applyFix(iss, f)" class="tap mt-1.5 px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm"
                        :style="fi === 0
                          ? 'background:linear-gradient(135deg,#6366f1,#a855f7)'
                          : 'background:linear-gradient(135deg,#0d9488,#14b8a6)'">
                  <i class="fa-solid fa-check mr-1"></i>{{ fixList(iss).length > 1 ? f.label : 'この内容で直す' }}
                </button>
              </div>
              <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                <button @click="fixByHand(iss)" class="tap fx-btn">
                  <i class="fa-solid fa-pen"></i>自分で直す
                </button>
                <button v-if="!ignoredSet.has(iss.key)" @click="ignoreIssue(iss.key)" class="tap fx-btn fx-btn-quiet">無視する</button>
                <button v-else @click="unignoreIssue(iss.key)" class="tap fx-btn fx-btn-quiet">無視をやめる</button>
              </div>
            </div>

            <!-- 直す案が無いときの手引き -->
            <div v-else class="mt-2.5">
              <div v-if="iss.how" class="fx-box fx-how">
                <i class="fa-solid fa-circle-info mr-1 opacity-70"></i>{{ iss.how }}
              </div>
              <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                <button v-if="(iss.type === 'move' || iss.type === 'chain') && iss.move !== undefined" @click="fixMove(iss)"
                        class="tap px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm"
                        style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                  <i class="fa-solid fa-route mr-1"></i>移動を入れる
                </button>
                <button v-if="iss.type === 'transfer' || iss.type === 'rail' || (iss.type === 'route' && iss.stop !== undefined)"
                        @click="fixByTimetable(iss)"
                        class="tap px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm"
                        :style="{background: ink(CATS.train.color, '#ffffff')}">
                  <i class="fa-solid fa-magnifying-glass mr-1"></i>時刻表から選び直す
                </button>
                <button v-if="iss.type === 'overlap'" @click="toggleIgnoreOverlap(fixDlg.dayIdx); fixDlg.open = false"
                        class="tap fx-btn">
                  <i class="fa-solid fa-bell-slash"></i>この日は重なりを気にしない
                </button>
                <button @click="fixByHand(iss)" class="tap fx-btn">
                  <i class="fa-solid fa-pen"></i>自分で直す
                </button>
                <button v-if="!ignoredSet.has(iss.key)" @click="ignoreIssue(iss.key)" class="tap fx-btn fx-btn-quiet">無視する</button>
                <button v-else @click="unignoreIssue(iss.key)" class="tap fx-btn fx-btn-quiet">無視をやめる</button>
              </div>
            </div>
          </div>

          <div class="text-[11px] mt-2 leading-relaxed" :class="isDark ? 'text-slate-400' : 'text-slate-500'">
            直したあとは Ctrl+Z で元に戻せます。無視した指摘は、点検の「無視した指摘」から戻せます
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ 列車をえらぶ（時刻表） ============ -->
    <transition name="fade">
      <div v-if="tw.open" data-modal="train" role="dialog" aria-modal="true" aria-label="列車を選ぶ"
           class="no-print fixed inset-0 z-[60] grid place-items-center p-3 sm:p-4">
        <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-sm" @click="tw.open = false"></div>
        <div class="relative glass rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90dvh] overflow-y-auto p-4 sm:p-5">

          <div class="flex items-center gap-2 mb-3">
            <span class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                  :style="{background: tw.kind === 'bus' ? CATS.bus.color : CATS.train.color}">
              <i class="fa-solid" :class="tw.kind === 'bus' ? 'fa-bus' : 'fa-train-subway'"></i>
            </span>
            <div class="min-w-0">
              <div class="text-base font-black text-ink">{{ twWord.train }}を選ぶ</div>
              <div class="text-[10px] font-bold text-slate-400">
                <span v-if="tw.from">{{ tw.from }}</span><span v-if="tw.railTitle"> ／ {{ tw.railTitle }}</span><span v-if="tw.to"> → {{ tw.to }}</span>
                <span v-else-if="!tw.from">出発する{{ twWord.spot }}から順に選びます</span>
              </div>
            </div>
            <span v-if="tw.loading" class="ml-auto text-[10px] font-bold text-slate-400">
              <i class="fa-solid fa-circle-notch fa-spin mr-1"></i>調べています
            </span>
            <button @click="tw.open = false" aria-label="閉じる"
                    class="tap ml-auto w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 transition shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- 進み具合 -->
          <div class="flex items-center gap-1 mb-3">
            <template v-for="n in 5" :key="'tws'+n">
              <span class="h-1.5 flex-1 rounded-full transition"
                    :style="{background: n <= tw.step ? CATS.train.color : (isDark ? '#334155' : '#e2e8f0')}"></span>
            </template>
          </div>

          <!-- ① 出発（駅／バス停） -->
          <div v-if="tw.step === 1">
            <div class="flex items-center gap-1.5 mb-2.5">
              <button v-for="k in ['train','bus']" :key="'kind'+k"
                      @click="tw.kind = k; tw.railCands = []; tw.order = []; tw.note = ''"
                      class="tap px-3 py-2 rounded-xl text-xs font-black border-2 transition flex items-center gap-1.5"
                      :style="tw.kind === k
                        ? {borderColor: CATS[k].color, color: ink(CATS[k].color, CATS[k].soft), background: CATS[k].soft}
                        : {borderColor: isDark ? '#334155' : '#e2e8f0', color: '#94a3b8', background: 'transparent'}">
                <i class="fa-solid" :class="CATS[k].icon"></i>{{ k === 'bus' ? '路線バス' : '電車' }}
              </button>
            </div>
            <div class="text-xs font-black text-slate-500 mb-1.5">どの{{ twWord.spot }}から乗りますか？</div>
            <div class="flex items-center gap-2">
              <input v-model="tw.from" :list="tw.kind === 'bus' ? 'dl-place' : 'dl-station'" data-focus-first
                     :placeholder="tw.kind === 'bus' ? '例：渋谷駅前' : '例：大井町'"
                     @keydown.enter.prevent="twLoadRailways()"
                     class="flex-1 min-w-0 rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none" />
              <button @click="twLoadRailways()" :disabled="!tw.from"
                      class="tap px-3 py-2.5 rounded-xl font-bold text-white text-sm shrink-0 disabled:opacity-40"
                      :style="{background: tw.kind === 'bus' ? CATS.bus.color : CATS.train.color}">{{ twWord.line }}をみる</button>
            </div>
            <div class="text-[10px] text-slate-400 mt-2">
              {{ twWord.spot }}名は手で入れられます。時刻表が無い{{ twWord.line }}でも、この先へ進めます
            </div>
          </div>

          <!-- ② 路線 -->
          <div v-else-if="tw.step === 2">
            <div class="text-xs font-black text-slate-500 mb-1.5">{{ tw.from }} から、どの{{ twWord.line }}を使いますか？</div>
            <div v-if="!tw.railCands.length && !tw.loading" class="text-[11px] text-slate-400 mb-2">
              {{ tw.note || (twWord.line + '名を手で入れてください') }}
            </div>
            <div class="space-y-1.5 max-h-[46dvh] overflow-y-auto pr-1">
              <button v-for="(c, ci) in tw.railCands" :key="'tr'+ci" @click="twPickRailway(c)"
                      class="tap w-full flex items-center gap-2 px-3 py-2.5 rounded-xl border-2 transition text-left"
                      :style="{borderColor: lineColor(c.title) || (isDark ? '#334155' : '#e2e8f0'),
                               background: isDark ? 'rgba(30,41,59,.6)' : '#fff'}">
                <span class="w-2.5 h-2.5 rounded-full shrink-0" :style="{background: lineColor(c.title) || '#94a3b8'}"></span>
                <span class="text-sm font-bold text-ink min-w-0 break-words">{{ c.title }}</span>
                <span v-if="c.tt" class="ml-auto text-[9px] font-black px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-700 shrink-0">時刻表あり</span>
                <span v-else class="ml-auto text-[9px] font-bold text-slate-400 shrink-0">時刻表なし</span>
              </button>
            </div>
            <div class="flex items-center gap-2 mt-3">
              <input v-model="tw.railTitle" list="dl-line" :placeholder="twWord.line + '名を手で入れる'"
                     class="flex-1 min-w-0 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 outline-none" />
              <button @click="twUseTypedRailway(tw.railTitle)" :disabled="!tw.railTitle"
                      class="tap px-3 py-2 rounded-xl text-xs font-bold border border-slate-200 disabled:opacity-40">これで進む</button>
            </div>
            <button @click="tw.step = 1" class="tap mt-2 px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-slate-400 hover:underline hover:bg-slate-500/10">← {{ twWord.spot }}を選び直す</button>
          </div>

          <!-- ③ 行き先 -->
          <div v-else-if="tw.step === 3">
            <div class="text-xs font-black text-slate-500 mb-1.5">
              {{ tw.railTitle }}で、どこまで行きますか？
              <span v-if="twStationList.length" class="font-medium text-slate-400">（{{ twStationList.length }}{{ twWord.unit }}）</span>
            </div>
            <div v-if="twStationList.length" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-[46dvh] overflow-y-auto pr-1">
              <button v-for="(stn, si2) in twStationList" :key="'tt'+si2" @click="twPickTo(stn)"
                      class="tap px-3 py-3 rounded-xl text-[13px] font-bold border transition text-left truncate min-h-[44px]"
                      :class="stn.title === tw.from
                        ? 'border-transparent text-slate-400 bg-slate-50 cursor-default'
                        : (isDark ? 'border-slate-700 text-slate-200 hover:border-indigo-500' : 'border-slate-200 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50')"
                      :disabled="stn.title === tw.from">
                {{ stn.title }}<span v-if="stn.title === tw.from" class="text-[9px]">（出発）</span>
              </button>
            </div>
            <div v-else class="text-[11px] text-slate-400">{{ twWord.spot }}の並びが分かりませんでした。行き先を手で入れてください</div>
            <div class="flex items-center gap-2 mt-3">
              <input v-model="tw.to" :list="tw.kind === 'bus' ? 'dl-place' : 'dl-station'" :placeholder="'行き先の' + twWord.spot + 'を手で入れる'"
                     class="flex-1 min-w-0 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 outline-none" />
              <button @click="twPickTo({ title: tw.to, id: '' })" :disabled="!tw.to"
                      class="tap px-3 py-2 rounded-xl text-xs font-bold border border-slate-200 disabled:opacity-40">これで進む</button>
            </div>
            <button @click="tw.step = 2" class="tap mt-2 px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-slate-400 hover:underline hover:bg-slate-500/10">← {{ twWord.line }}を選び直す</button>
          </div>

          <!-- ④ 列車 -->
          <div v-else-if="tw.step === 4">
            <div class="text-xs font-black text-slate-500 mb-2">何時ごろの{{ twWord.train }}に乗りますか？</div>
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <label class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-slate-500">出発</span>
                <input type="time" v-model="tw.time" @change="twLoadTrains()"
                       class="rounded-lg border border-slate-200 px-2 py-1.5 text-sm focus:border-indigo-400 outline-none" />
              </label>
              <label v-if="tw.kind !== 'bus'" class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-slate-500">番線</span>
                <input v-model="tw.platform" @change="twLoadTrains()" @blur="tw.platform = normPlatform(tw.platform, tw.kind === 'bus' ? 'bus' : 'rail')"
                       placeholder="任意"
                       class="w-24 rounded-lg border border-slate-200 px-2 py-1.5 text-sm focus:border-indigo-400 outline-none" />
              </label>
              <button @click="twLoadTrains()" class="tap text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-200">
                <i class="fa-solid fa-rotate mr-1"></i>探し直す
              </button>
            </div>
            <div v-if="tw.note" class="text-[11px] font-bold text-amber-600 mb-2">
              <i class="fa-solid fa-circle-info mr-1"></i>{{ tw.note }}
            </div>
            <div v-if="tw.trains.length" class="space-y-1 max-h-[42dvh] overflow-y-auto pr-1">
              <button v-for="(t, ti) in tw.trains" :key="'tn'+ti" @click="twPickTrain(t)"
                      class="tap w-full flex items-center gap-2 px-3 py-3 rounded-xl border transition text-left min-h-[48px]"
                      :class="isDark ? 'border-slate-700 hover:border-indigo-500' : 'border-slate-200 hover:border-indigo-400 hover:bg-indigo-50'">
                <span class="text-sm font-black text-ink tabular-nums shrink-0">{{ t.time }}</span>
                <span v-if="t.typeTitle || t.name" class="text-[10px] font-black px-1.5 py-0.5 rounded-md shrink-0"
                      :style="{background: isDark ? 'rgba(99,102,241,.2)' : '#eef2ff', color: '#4f46e5'}">{{ [t.typeTitle, t.name].filter(Boolean).join(' ') }}</span>
                <span class="text-xs font-bold text-slate-600 min-w-0 truncate">
                  {{ t.dest ? t.dest + '行' : (t.dirTitle || (tw.to + '行')) }}
                </span>
                <span v-if="t.platform" class="ml-auto text-[10px] font-black px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600 shrink-0">{{ t.platform }}</span>
                <span v-else class="ml-auto text-[9px] font-bold text-slate-300 shrink-0">番線なし</span>
              </button>
            </div>
            <button @click="twSkipTrain()" class="tap mt-3 w-full py-3 rounded-xl text-xs font-bold border border-dashed"
                    :class="isDark ? 'border-slate-600 text-slate-300' : 'border-slate-300 text-slate-500'">
              時刻表を使わず、自分で入れる
            </button>
            <button @click="tw.step = 3" class="tap mt-2 px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-slate-400 hover:underline hover:bg-slate-500/10">← 行き先を選び直す</button>
          </div>

          <!-- ⑤ 確認して入れる -->
          <div v-else-if="tw.step === 5">
            <div class="text-xs font-black text-slate-500 mb-2">この内容で入れます（直せます）</div>
            <div class="rounded-2xl border p-3 space-y-2" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <div class="grid grid-cols-2 gap-2">
                <label class="block"><span class="text-[10px] font-bold text-slate-500">出発{{ twWord.spot }}</span>
                  <input v-model="tw.from" list="dl-station" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
                <label class="block"><span class="text-[10px] font-bold text-slate-500">到着{{ twWord.spot }}</span>
                  <input v-model="tw.to" list="dl-station" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
              </div>
              <label class="block"><span class="text-[10px] font-bold text-slate-500">{{ twWord.line }}</span>
                <input v-model="tw.railTitle" list="dl-line" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <label class="block"><span class="text-[10px] font-bold text-slate-500">発時刻</span>
                  <input type="time" v-model="tw.time" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
                <label v-if="tw.kind !== 'bus'" class="block"><span class="text-[10px] font-bold text-slate-500">発番線</span>
                  <input v-model="tw.platform" placeholder="任意" @blur="tw.platform = normPlatform(tw.platform, 'rail')"
                         class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
                <label class="block"><span class="text-[10px] font-bold text-slate-500">着時刻</span>
                  <input type="time" v-model="tw.arrTime" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
                <label v-if="tw.kind !== 'bus'" class="block"><span class="text-[10px] font-bold text-slate-500">着番線</span>
                  <input v-model="tw.arrPlatform" placeholder="任意" @blur="tw.arrPlatform = normPlatform(tw.arrPlatform, 'rail')"
                         class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <label class="block"><span class="text-[10px] font-bold text-slate-500">{{ twWord.unit }}数</span>
                  <input v-model="tw.stationsText" :placeholder="'例：9' + twWord.unit"
                         @blur="tw.stationsText = normStops(tw.stationsText, tw.kind === 'bus' ? 'bus' : 'rail')"
                         class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm" /></label>
                <div class="flex items-end">
                  <div class="text-[11px] font-bold text-slate-500 pb-2">
                    <span v-if="tw.picked">{{ tw.picked.typeTitle }}
                      {{ tw.picked.dest ? tw.picked.dest + '行' : (tw.picked.dirTitle || '') }}<span v-if="tw.picked.number">（{{ tw.picked.number }}）</span></span>
                    <span v-else class="text-slate-400">手入力</span>
                  </div>
                </div>
              </div>
              <div v-if="tw.note" class="text-[10px] font-bold text-amber-600">{{ tw.note }}</div>
            </div>
            <div class="flex items-center gap-2 mt-3">
              <button @click="tw.step = 4" class="tap px-3 py-2.5 rounded-xl text-xs font-bold border border-slate-200">← {{ twWord.train }}を選び直す</button>
              <button @click="twApply()" :disabled="!tw.from || !tw.to"
                      class="tap flex-1 py-3 rounded-xl font-bold text-white shadow-lg disabled:opacity-40"
                      style="background:linear-gradient(135deg,#3b82f6,#6366f1)">
                <i class="fa-solid fa-check mr-1"></i>この内容で入れる
              </button>
            </div>
          </div>

          <div class="text-[10px] text-slate-400 mt-3 leading-relaxed">
            時刻表：公共交通オープンデータセンター（ODPT）。バスは都営バスなど公開されている事業者のみ。番線は公開している事業者だけに出ます。
            事業者ごとに提供の条件がちがうので、出てこない路線は手で入れてください（設定に説明があります）
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ JSON 入出力モーダル ============ -->
    <transition name="fade">
      <div v-if="showJsonModal" data-modal="json" role="dialog" aria-modal="true" aria-label="バックアップと書き出し" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="showJsonModal=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-lg p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-4">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-file-code"></i>
            </div>
            <h2 class="font-black text-ink text-lg">バックアップと書き出し</h2>
            <button @click="showJsonModal=false" aria-label="閉じる" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <textarea :value="jsonText" readonly spellcheck="false" aria-label="いまの旅程のJSON"
            class="scroll-thin w-full h-48 sm:h-56 rounded-xl bg-slate-900 text-emerald-200/90 text-[12px] leading-relaxed font-mono p-3 outline-none resize-y border border-slate-700"
            placeholder="「今の内容を出す」を押すと、ここに旅程のJSONが出ます"></textarea>
          <div class="grid grid-cols-2 gap-2 mt-3">
            <button @click="pullToEditor"
              class="py-2.5 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2"
              style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-rotate"></i>今の内容を出す
            </button>
            <button @click="copyJson"
              class="py-2.5 rounded-xl text-sm font-bold text-slate-600 bg-white/70 hover:bg-white transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-clipboard"></i>コピー
            </button>
          </div>
          <button @click="downloadJson()"
            class="mt-2 w-full py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i>ファイルに書き出す
          </button>
          <p class="text-[10px] text-slate-400 mt-2 leading-relaxed">
            いま開いている旅程だけを JSON の形で書き出します。中身を確かめたいときや、ほかのアプリに渡したいときに使います
          </p>

          <!-- 全旅程バックアップ／復元：Cookie削除などで置き場ごと消えたときの保険 -->
          <div class="mt-5 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="text-xs font-black text-ink flex items-center gap-1.5">
              <i class="fa-solid fa-shield-halved text-indigo-400"></i>すべての旅程のバックアップ
            </div>
            <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">
              Cookie／サイトデータを消すと、保存した旅程は置き場ごと消えます。ここから全部の旅程をまとめてファイルに出しておけば、消えたときにこのファイルから戻せます。
              1日1回、開いたときに自動でも書き出しています{{ lastBackupAt ? '（最終：' + lastBackupAt + '）' : '' }}。
            </p>
            <div class="grid grid-cols-2 gap-2 mt-2.5">
              <button @click="downloadAllBackup()"
                class="py-2.5 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2"
                style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <i class="fa-solid fa-shield-halved"></i>今すぐ全部バックアップ
              </button>
              <label class="py-2.5 rounded-xl text-sm font-bold text-slate-600 bg-white/70 hover:bg-white transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-upload"></i>バックアップから復元
                <input type="file" accept="application/json,.json" class="hidden" @change="onImportFile">
              </label>
            </div>
            <p class="text-[10px] text-slate-400 mt-2 leading-relaxed">
              復元は「追加」されます（今ある旅程は消えません）。復元した旅程は、旅程の管理から開けます
            </p>
            <div v-if="brokenCount" class="mt-3 rounded-xl px-3 py-2.5 text-xs font-bold flex items-center gap-2 flex-wrap bg-amber-50 text-amber-700 border border-amber-200">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span class="flex-1 min-w-[10rem]">読めなかった旅程の控えが {{ brokenCount }} 件あります</span>
              <button @click="downloadBroken()" class="px-3 py-1.5 rounded-lg bg-white border border-amber-300 hover:bg-amber-100">控えを書き出す</button>
            </div>
          </div>

        </div>
      </div>
    </transition>

    <!-- ============ EDIT MODAL ============ -->
    <transition name="fade">
      <div v-if="editing" data-modal="edit" role="dialog" aria-modal="true" :aria-label="modalTitle(editing)" class="no-print fixed inset-0 z-50 grid place-items-center p-4" style="background:rgba(31,36,51,.45)" @click.self="tryCloseEdit()">
        <div class="glass modal-inner rounded-3xl w-full max-w-lg p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <!-- 書いたものを捨てる前に、必ず一度たずねる -->
          <div v-if="discardAsk" class="mb-4 rounded-2xl border-2 px-3.5 py-3"
               :class="isDark ? 'border-amber-500/40 bg-amber-950/30' : 'border-amber-300 bg-amber-50'">
            <div class="text-sm font-black flex items-center gap-2" :class="isDark ? 'text-amber-200' : 'text-amber-800'">
              <i class="fa-solid fa-triangle-exclamation"></i>書いた内容がまだ保存されていません
            </div>
            <div class="text-[11px] font-bold mt-1 leading-relaxed" :class="isDark ? 'text-amber-200/80' : 'text-amber-700'">
              このまま閉じると、いま書いたところは消えます
            </div>
            <div class="flex items-center gap-1.5 mt-2.5 flex-wrap">
              <button @click="discardAsk = false; saveEvent()"
                      class="tap px-3.5 py-2 rounded-xl text-xs font-black text-white shadow-sm"
                      style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <i class="fa-solid fa-check mr-1"></i>保存して閉じる
              </button>
              <button @click="discardAsk = false"
                      class="tap px-3.5 py-2 rounded-xl text-xs font-black border"
                      :class="isDark ? 'border-slate-600 text-slate-200' : 'border-slate-300 text-slate-600'">
                <i class="fa-solid fa-pen mr-1"></i>編集に戻る
              </button>
              <button @click="discardEdit()"
                      class="tap ml-auto px-3 py-2 rounded-xl text-xs font-bold text-rose-500 hover:bg-rose-500/10">
                <i class="fa-solid fa-trash-can mr-1"></i>書いたものを捨てる
              </button>
            </div>
          </div>

          <div class="flex items-center gap-2 mb-5">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 :style="{background: editing.anchor ? ink(anchorCfg(editing.anchor).color, '#ffffff') : ink(cat(editing.type).color, '#ffffff')}">
              <i class="fa-solid" :class="editing.anchor ? anchorCfg(editing.anchor).icon : cat(editing.type).icon"></i>
            </div>
            <h2 class="font-black text-ink text-lg">{{ modalTitle(editing) }}</h2>
            <button @click="tryCloseEdit()" aria-label="閉じる" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <!-- 日程と役割：ふだんは1行のまとめ、必要なときだけ開く -->
          <div class="mb-4 rounded-xl border px-3 py-2" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[11px] font-bold text-slate-400 shrink-0">この予定は</span>
              <span class="text-xs font-black text-ink shrink-0">
                Day {{ (state.days[editingDayIdx] || {}).dayNumber || (editingDayIdx + 1) }}<span v-if="shortDate((state.days[editingDayIdx]||{}).date)" class="text-slate-400 font-bold">（{{ shortDate(state.days[editingDayIdx].date) }}）</span>
              </span>
              <span v-if="editing.anchor" class="text-[10px] font-black px-2 py-0.5 rounded-full text-white flex items-center gap-1 shrink-0"
                    :style="{background: ink(anchorCfg(editing.anchor).color, '#ffffff')}">
                <i class="fa-solid" :class="anchorCfg(editing.anchor).icon"></i>{{ anchorCfg(editing.anchor).label }}
              </span>
              <span v-else class="text-[11px] font-bold text-slate-400 shrink-0">通常の予定</span>
              <button @click="metaOpen = !metaOpen"
                      class="tap ml-auto shrink-0 px-2 py-1.5 rounded-lg text-[11px] font-bold text-indigo-500 hover:underline hover:bg-indigo-500/10">
                {{ metaOpen ? '閉じる' : '日程・役割を変更' }}
              </button>
            </div>

            <div v-if="metaOpen" class="mt-3 pt-3 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <label class="block mb-3">
                <span class="text-xs font-bold text-slate-500">日程</span>
                <select v-model.number="editingDayIdx"
                        class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-bold focus:border-indigo-400 outline-none">
                  <option v-for="(d, i) in state.days" :key="'edx'+i" :value="i">
                    Day {{ d.dayNumber }}{{ d.date ? '（' + shortDate(d.date) + (weekday(d.date) ? ' ' + weekday(d.date) : '') + '）' : '' }}
                  </option>
                </select>
                <span v-if="!editing.__isNew && editingDayIdx !== editing.__srcDay" class="text-[10px] font-bold text-indigo-500 mt-1 block">
                  <i class="fa-solid fa-right-left mr-0.5"></i>保存すると Day {{ editingDayIdx + 1 }} へ移動します
                </span>
              </label>

              <span class="text-xs font-bold text-slate-500">この予定の役割</span>
              <div class="grid grid-cols-3 gap-1.5 mt-1">
              <button @click="editing.anchor=''"
                class="rounded-xl py-2 text-center transition border-2 text-xs font-bold"
                :style="editing.anchor===''
                  ? {borderColor:'#94a3b8', background: isDark ? '#334155' : '#f1f4f9', color: isDark ? '#e2e8f0' : '#475569'}
                  : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f8fafc', color:'#94a3b8'}">
                <i class="fa-solid fa-location-dot block mb-0.5"></i>通常
              </button>
              <button @click="editing.anchor='start'"
                class="rounded-xl py-2 text-center transition border-2 text-xs font-bold"
                :style="editing.anchor==='start'
                  ? {borderColor: ANCHORS.start.color, background: isDark ? 'rgba(14,165,233,0.18)' : '#e0f2fe', color: ink(ANCHORS.start.color)}
                  : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f8fafc', color:'#94a3b8'}">
                <i class="fa-solid block mb-0.5" :class="ANCHORS.start.icon"></i>出発地点
              </button>
              <button @click="editing.anchor='end'"
                class="rounded-xl py-2 text-center transition border-2 text-xs font-bold"
                :style="editing.anchor==='end'
                  ? {borderColor: ANCHORS.end.color, background: isDark ? 'rgba(225,29,72,0.18)' : '#ffe4e6', color: ink(ANCHORS.end.color)}
                  : {borderColor:'transparent', background: isDark ? '#1e293b' : '#f8fafc', color:'#94a3b8'}">
                <i class="fa-solid block mb-0.5" :class="ANCHORS.end.icon"></i>到着地点
              </button>
            </div>
              <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">
                <i class="fa-solid fa-circle-info mr-0.5"></i>
                <template v-if="editing.anchor">{{ anchorCfg(editing.anchor).label }}は、一覧と印刷で目立つように出ます</template>
                <template v-else>1日の起点・終点にしたい予定は「出発地点／到着地点」を選んでください（一覧と印刷で目立つように出ます）</template>
              </p>
            </div>
          </div>

          <!-- カテゴリ：役割つきのときは畳んでおく（誤って手段を変えないように） -->
          <div class="mb-4">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-bold text-slate-500 shrink-0">カテゴリ</span>
              <template v-if="!catOpen">
                <span class="text-xs font-black px-2 py-1 rounded-lg flex items-center gap-1.5 shrink-0"
                      :style="isDark ? {background:'#1e293b', color: ink(cat(editing.type).color)} : {background: cat(editing.type).soft, color: ink(cat(editing.type).color, cat(editing.type).soft)}">
                  <i class="fa-solid" :class="cat(editing.type).icon"></i>{{ cat(editing.type).label }}
                </span>
                <button @click="catOverride = true" class="tap shrink-0 px-2 py-1.5 rounded-lg text-[11px] font-bold text-indigo-500 hover:underline hover:bg-indigo-500/10">変更</button>
              </template>
              <button v-else-if="editing.anchor || !editing.__isNew" @click="catOverride = false"
                      class="ml-auto shrink-0 text-[11px] font-bold text-slate-400 hover:underline">閉じる</button>
            </div>
            <div v-if="catOpen" class="mt-1.5 space-y-1.5">
              <div v-for="g in CAT_GROUPS" :key="g.key" class="flex items-start gap-2">
                <span class="text-[10px] font-black text-slate-400 w-8 shrink-0 pt-2.5 text-right">{{ g.label }}</span>
                <div class="grid grid-cols-5 sm:grid-cols-7 gap-1.5 flex-1 min-w-0">
                  <button v-for="k in g.keys" :key="k" @click="pickType(k)" :title="CATS[k].label"
                    class="tap rounded-xl py-2 text-center transition border-2"
                    :style="editing.type===k
                      ? {background: CATS[k].soft, borderColor: CATS[k].color}
                      : {borderColor: 'transparent', background: isDark ? '#1e293b' : '#f1f4f9'}">
                    <i class="fa-solid block" :class="CATS[k].icon" :style="{color: ink(CATS[k].color)}"></i>
                    <!-- 選んでいるものは淡い地なので、その地に合わせて濃くする（暗い画面の text-slate-600 は !important なので外す） -->
                    <span class="text-[9px] font-bold mt-0.5 block leading-tight" :class="editing.type===k ? '' : 'text-slate-600'"
                          :style="editing.type===k ? {color: ink(CATS[k].color, CATS[k].soft)} : null">{{ CATS[k].label }}</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <label class="block mb-1.5">
            <span class="text-xs font-bold text-slate-500">タイトル *</span>
            <input v-model="editing.title" :placeholder="titlePlaceholder(editing)" data-focus-first
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
          </label>
          <div v-if="titleSuggests(editing).length" class="flex items-center gap-1.5 flex-wrap mb-3">
            <button v-for="t in titleSuggests(editing)" :key="'ts'+t" @click="editing.title = t"
              class="tap px-2 py-1 rounded-lg text-[11px] font-bold transition"
              :style="isDark ? {background:'#1e293b', color:'#94a3b8'} : {background:'#f1f4f9', color:'#536175'}">
              <i class="fa-solid fa-plus text-[8px] mr-1 opacity-60"></i>{{ t }}
            </button>
          </div>
          <div v-else class="mb-3"></div>

          <div class="grid gap-3 mb-1.5" :class="showEnd ? 'grid-cols-2' : 'grid-cols-1'">
            <label class="block">
              <span class="text-xs font-bold flex items-center gap-1"
                    :class="editing.anchor ? '' : 'text-slate-500'"
                    :style="editing.anchor ? {color: ink(anchorCfg(editing.anchor).color)} : {}">
                <i v-if="editing.anchor" class="fa-solid text-[10px]" :class="anchorCfg(editing.anchor).icon"></i>{{ startLabel(editing) }}
              </span>
              <input type="time" v-model="editing.startTime" @change="editing.__autoTime = false"
                     class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
            </label>
            <label v-if="showEnd" class="block">
              <span class="text-xs font-bold text-slate-500">{{ endLabel(editing) }}
                <span v-if="duration(editing.startTime, editing.endTime)" class="text-indigo-500">（{{ duration(editing.startTime, editing.endTime) }}）</span>
              </span>
              <input type="time" v-model="editing.endTime" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
            </label>
          </div>
          <!-- 前後の予定とのつながり -->
          <div v-if="linkState.prev || linkState.next" class="lk-panel mb-3 rounded-xl px-3 py-2.5"
               :class="isDark ? 'bg-slate-800/60' : 'bg-slate-50'">
            <div class="text-[10px] font-black text-slate-500 mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-link text-indigo-400"></i>前後のつながり
            </div>

            <!-- ひとつ前 -->
            <div v-if="linkState.prev" class="flex items-start gap-1.5 flex-wrap py-1">
              <span class="lk-tag">前</span>
              <span class="text-[11px] font-bold text-ink min-w-0 break-words">{{ shortName(linkState.prev.title) }}</span>
              <span class="text-[10px] font-bold text-slate-400 tabular-nums shrink-0">
                {{ linkState.prev.endTime || linkState.prev.startTime || '—' }}{{ linkState.prev.endTime ? 'まで' : '' }}
              </span>
              <span v-if="linkState.prevPlace" class="text-[10px] font-bold text-slate-400 min-w-0 break-words">／{{ linkState.prevPlace }}</span>
              <span v-if="linkState.gap !== null" class="lk-chip shrink-0"
                    :class="linkState.gap < 0 ? 'lk-bad' : (linkState.gap < 5 ? 'lk-tight' : 'lk-ok')">
                {{ linkState.gap < 0 ? '時刻が重なっています' : (linkState.gap < 5 ? 'すぐ移動' : '空き ' + fmtMin(linkState.gap)) }}
              </span>
              <span v-if="linkState.placeOk === false" class="lk-chip lk-bad shrink-0">場所が違います</span>
            </div>
            <div v-if="linkState.prev" class="flex items-center gap-1 flex-wrap mt-0.5 mb-1.5">
              <button v-if="linkState.prev.endTime || linkState.prev.startTime"
                      @click="useLinkTime('start')" class="tap sug"
                      :title="'この予定の開始を ' + (linkState.prev.endTime || linkState.prev.startTime) + ' にします'">
                <i class="fa-solid fa-clock text-[8px] mr-0.5"></i>{{ linkState.prev.endTime || linkState.prev.startTime }} から始める
              </button>
              <button v-if="linkState.prevPlace && linkState.placeOk === false"
                      @click="useLinkPlace('start')" class="tap sug sug-net"
                      :title="'この予定の始まりを ' + linkState.prevPlace + ' にします'">
                <i class="fa-solid fa-location-dot text-[8px] mr-0.5"></i>{{ linkState.prevPlace }} から
              </button>
            </div>

            <!-- ひとつ後ろ -->
            <div v-if="linkState.next" class="flex items-start gap-1.5 flex-wrap py-1"
                 :class="linkState.prev ? 'border-t pt-2 ' + (isDark ? 'border-slate-700' : 'border-slate-200') : ''">
              <span class="lk-tag lk-tag-next">次</span>
              <span class="text-[11px] font-bold text-ink min-w-0 break-words">{{ shortName(linkState.next.title) }}</span>
              <span class="text-[10px] font-bold text-slate-400 tabular-nums shrink-0">{{ linkState.next.startTime || '—' }}から</span>
              <span v-if="linkState.nextPlace" class="text-[10px] font-bold text-slate-400 min-w-0 break-words">／{{ linkState.nextPlace }}</span>
              <span v-if="linkState.nextGap !== null" class="lk-chip shrink-0"
                    :class="linkState.nextGap < 0 ? 'lk-bad' : (linkState.nextGap < 5 ? 'lk-tight' : 'lk-ok')">
                {{ linkState.nextGap < 0 ? '次に食い込んでいます' : (linkState.nextGap < 5 ? 'すぐ移動' : '空き ' + fmtMin(linkState.nextGap)) }}
              </span>
              <span v-if="linkState.nextPlaceOk === false" class="lk-chip lk-bad shrink-0">場所が違います</span>
            </div>
            <div v-if="linkState.next" class="flex items-center gap-1 flex-wrap mt-0.5">
              <button v-if="linkState.next.startTime" @click="useLinkTime('end')" class="tap sug"
                      :title="'この予定の終了を ' + linkState.next.startTime + ' にします'">
                <i class="fa-solid fa-clock text-[8px] mr-0.5"></i>{{ linkState.next.startTime }} で終える
              </button>
              <button v-if="editing.endTime || editing.startTime" @click="pushNextStart()" class="tap sug"
                      :title="'次の予定のほうを、この予定の終わりに合わせます'">
                <i class="fa-solid fa-arrow-right text-[8px] mr-0.5"></i>次を {{ editing.endTime || editing.startTime }} から
              </button>
              <button v-if="linkState.nextPlace && linkState.nextPlaceOk === false"
                      @click="useLinkPlace('end')" class="tap sug sug-net"
                      :title="'この予定の終わりを ' + linkState.nextPlace + ' にします'">
                <i class="fa-solid fa-location-dot text-[8px] mr-0.5"></i>{{ linkState.nextPlace }} まで
              </button>
            </div>
          </div>

          <!-- 地図から出した所要の目安（押すと終了時刻が入る／手でも直せる） -->
          <div v-if="MOVE_TYPES.includes(editing.type) && (estimates.list.length || estimates.loading || estimates.error)"
               class="mb-3 rounded-xl px-3 py-2.5" :class="isDark ? 'bg-slate-800/60' : 'bg-slate-50'">
            <div class="text-[10px] font-black text-slate-500 mb-1.5 flex items-center gap-1.5 flex-wrap">
              <i class="fa-solid fa-route text-teal-500"></i>所要の目安
              <span class="font-medium text-slate-400">{{ estimates.from }} → {{ estimates.to }}</span>
              <span v-if="estimates.loading" class="text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
            </div>
            <div v-if="estimates.list.length" class="flex items-center gap-1.5 flex-wrap">
              <button v-for="m in estimates.list" :key="'est'+m.key" @click="applyEstimate(editing, m.min)"
                      :title="m.label + 'で約' + m.min + '分（' + m.km + 'km' + (m.rough ? '・直線からのざっくり見当' : '') + '）。押すと終了時刻に入ります'"
                      class="tap est-chip" :class="editing.type === m.key ? 'est-chip-on' : ''">
                <i class="fa-solid" :class="m.icon"></i>
                <span class="font-black">{{ m.label }} {{ fmtMin(m.min) }}</span>
                <span class="opacity-60">{{ m.km }}km{{ m.rough ? '（目安）' : '' }}</span>
              </button>
            </div>
            <div v-else-if="estimates.error" class="text-[11px] font-bold text-slate-400">{{ estimates.error }}</div>
            <div class="text-[10px] text-slate-400 mt-1.5">
              {{ estimates.list.some(m => m.rough) ? '一部は直線距離からのざっくり見当です。' : '' }}地図の経路から出した目安です。実際の時刻は手で直せます
            </div>
          </div>

          <!-- 所要時間から終了時刻を決める / 2つ目の時刻を出す -->
          <div class="flex items-center gap-1.5 flex-wrap mb-3">
            <template v-if="showEnd">
              <span class="text-[10px] font-bold text-slate-400 shrink-0">所要時間で入力</span>
              <button v-for="m in [15, 30, 60, 90, 120]" :key="'dur'+m" @click="bumpEnd(m)"
                class="tap px-2 py-1 rounded-lg text-[11px] font-bold transition tabular-nums"
                :style="isDark ? {background:'#1e293b', color:'#94a3b8'} : {background:'#f1f4f9', color:'#536175'}">
                +{{ fmtMin(m) }}
              </button>
              <button v-if="editing.endTime" @click="clearEnd" title="終了時刻を空にする"
                class="tap px-2 py-1 rounded-lg text-[11px] font-bold text-rose-600 hover:text-rose-700 transition">
                <i class="fa-solid fa-eraser mr-0.5"></i>クリア
              </button>
            </template>
            <button v-else @click="wantEnd = true"
              class="tap px-2 py-1 rounded-lg text-[11px] font-bold text-slate-400 hover:text-indigo-500 transition">
              <i class="fa-solid fa-plus text-[9px] mr-0.5"></i>終了時刻も入れる
            </button>
          </div>

          <!-- 電車/バス専用フィールド（乗換チェーン） -->
          <div v-if="['train','bus'].includes(editing.type)" class="mb-3 rounded-xl border overflow-hidden"
               :style="isDark ? {borderColor:'rgba(59,130,246,0.25)'} : {borderColor:cat(editing.type).ring}">
            <!-- ヘッダー -->
            <div class="px-3 py-2 flex items-center justify-between"
                 :style="isDark ? {background:'rgba(59,130,246,0.12)'} : {background:cat(editing.type).soft}">
              <div class="text-[10px] font-black flex items-center gap-1.5" :style="{color: ink(cat(editing.type).color)}">
                <i class="fa-solid" :class="cat(editing.type).icon"></i>
                {{ cat(editing.type).label }}のルート
                <span class="text-[9px] font-medium text-slate-400 ml-1">（{{ editing.route.length }}{{ editing.type === 'bus' ? '停留所' : '駅' }}）</span>
              </div>
              <button @click="addStop()" class="tap text-[11px] font-bold px-2.5 py-1.5 rounded-lg text-white"
                      :style="{background: ink(cat(editing.type).color, '#ffffff')}">
                <i class="fa-solid fa-plus mr-0.5"></i>{{ editing.type === 'bus' ? '停留所' : '駅' }}を追加
              </button>
            </div>

            <!-- まだ駅が無いとき -->
            <div v-if="editing.route.length === 0" class="p-4 text-center">
              <button @click="addStop()" class="tap px-4 py-2.5 rounded-xl font-bold text-white text-sm shadow-md hover:opacity-90 transition"
                      :style="{background: ink(cat(editing.type).color, '#ffffff')}">
                <i class="fa-solid fa-diagram-project mr-1.5"></i>経路をつくる
              </button>
              <div class="text-[10px] text-slate-400 mt-2.5 leading-relaxed">
                駅ごとに、着くホーム・出るホーム・乗る列車・乗り換えの時間を書けます。<br>
                場所欄の「{{ editing.location || 'A → B' }}」から{{ (editing.location || '').match(/→|->|〜|~/) ? '2駅' : '1駅' }}ぶん用意します
              </div>
            </div>

            <!-- 駅の並び -->
            <div v-else class="p-3 space-y-1">
              <template v-for="(st, si) in editing.route" :key="si">
                <!-- 1つの駅 = 1枚のカード -->
                <div class="rounded-xl border-2 overflow-hidden"
                     :style="isDark
                       ? {background:'rgba(30,41,59,0.6)', borderColor: si === 0 || si === editing.route.length - 1 ? 'rgba(99,102,241,0.4)' : 'rgba(71,85,105,0.4)'}
                       : {background:'#fff', borderColor: si === 0 || si === editing.route.length - 1 ? '#c7d2fe' : '#e2e8f0'}">

                  <!-- 駅名と操作（狭い画面では、乗換・対面・並べ替えのボタンを2行目に回して駅名の幅を確保する） -->
                  <div class="flex items-center flex-wrap gap-1.5 px-2.5 py-2"
                       :style="isDark ? {background:'rgba(15,23,42,0.5)'} : {background:'#f8fafc'}">
                    <span class="w-5 h-5 rounded-full grid place-items-center text-[9px] font-black shrink-0 text-white"
                          :style="{background: si === 0 ? ink(ANCHORS.start.color, '#ffffff') : (si === editing.route.length - 1 ? ink(ANCHORS.end.color, '#ffffff') : '#64748b')}">
                      {{ si + 1 }}
                    </span>
                    <input v-model="st.name" :id="'stop-' + si" list="dl-station"
                           @keydown.enter.prevent="focusNextStop(si)"
                           :placeholder="si === 0 ? '出発する駅' : (si === editing.route.length - 1 ? '降りる駅' : '乗り換える駅')"
                           class="flex-1 min-w-[9rem] rounded-lg border border-slate-200 px-2 py-1.5 text-sm font-bold focus:border-indigo-400 outline-none" />
                    <span v-if="si === 0" class="text-[9px] font-black shrink-0" :style="{color: ink(ANCHORS.start.color)}">出発</span>
                    <span v-else-if="si === editing.route.length - 1" class="text-[9px] font-black shrink-0" :style="{color: ink(ANCHORS.end.color)}">到着</span>
                    <button v-else @click="toggleThrough(st)"
                            :title="st.through ? '降りません（同じ列車のまま）。押すと乗換にします' : 'ここで降りて乗り換えます。押すと直通にします'"
                            class="tap shrink-0 text-[10px] font-black px-2 py-1 rounded-lg border transition"
                            :class="st.through
                              ? 'text-teal-700 border-teal-300 bg-teal-50'
                              : 'text-amber-700 border-amber-300 bg-amber-50'">
                      <i class="fa-solid mr-0.5" :class="st.through ? 'fa-arrow-right-long' : 'fa-arrows-rotate'"></i>{{ st.through ? '直通' : '乗換' }}
                    </button>
                    <button v-if="si > 0 && si < editing.route.length - 1 && !st.through"
                            @click="toggleQuick(st)"
                            :title="st.quick ? '向かいのホームで乗り換えられる駅として覚えています。押すとふつうの乗換に戻します'
                                             : '降りたホームの向かい（または同じホーム）で乗り換えられるなら、押してください。1〜2分でも短すぎるとは言わなくなります'"
                            class="tap shrink-0 text-[10px] font-black px-2 py-1 rounded-lg border transition"
                            :class="st.quick
                              ? 'text-sky-700 border-sky-300 bg-sky-50'
                              : (isDark ? 'text-slate-400 border-slate-600' : 'text-slate-400 border-slate-200')">
                      <i class="fa-solid fa-right-left mr-0.5"></i>対面
                    </button>
                    <div class="flex items-center gap-0.5 shrink-0 ml-auto">
                      <button @click="moveStop(si, -1)" :disabled="si === 0" aria-label="この駅を上へ" title="上へ"
                              class="tap w-7 h-7 rounded-lg transition"
                              :class="si === 0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-400 hover:text-indigo-500 hover:bg-white/70'">
                        <i class="fa-solid fa-chevron-up text-[10px]"></i>
                      </button>
                      <button @click="moveStop(si, 1)" :disabled="si === editing.route.length - 1" aria-label="この駅を下へ" title="下へ"
                              class="tap w-7 h-7 rounded-lg transition"
                              :class="si === editing.route.length - 1 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-400 hover:text-indigo-500 hover:bg-white/70'">
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                      </button>
                      <button @click="duplicateStop(si)" aria-label="この駅を複製" title="複製"
                              class="tap w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-white/70 transition">
                        <i class="fa-solid fa-copy text-[10px]"></i>
                      </button>
                      <button @click="removeStop(si)" aria-label="この駅を削除" title="削除"
                              class="tap w-7 h-7 rounded-lg text-rose-400 hover:text-rose-600 hover:bg-rose-50 transition">
                        <i class="fa-solid fa-xmark text-[10px]"></i>
                      </button>
                    </div>
                  </div>

                  <div class="px-2.5 py-2 space-y-2">
                    <!-- 駅名の候補・その駅の情報（オンライン） -->
                    <div v-if="!st.name && homeStation()" class="flex items-center gap-1 flex-wrap">
                      <button @click="useName(si, homeStation())" class="tap sug"
                              :title="'最寄り駅「' + homeStation() + '」を入れます'">
                        <i class="fa-solid fa-house text-[8px] mr-0.5"></i>{{ homeStation() }}
                      </button>
                    </div>
                    <div v-if="nameSuggests(si).length" class="flex items-center gap-1 flex-wrap">
                      <span class="text-[9px] font-bold text-slate-400 shrink-0">もしかして</span>
                      <button v-for="(c, ci) in nameSuggests(si)" :key="'ns'+si+ci" @click="useName(si, c.name)"
                              class="tap sug" :class="c.sub === 'これまでの入力' ? '' : 'sug-net'" :title="c.name + ' ' + (c.sub || '')">
                        {{ c.name }}<span v-if="c.sub" class="sug-sub">{{ c.sub }}</span>
                      </button>
                    </div>
                    <!-- バスの経路では、駅より先に停留所として見せる
                         （「徳島駅前」は駅名として読むと鉄道の駅に当たってしまう） -->
                    <div v-if="editing.type === 'bus' && tbKnown(st.name)"
                         class="text-[9px] font-bold text-teal-600 flex items-center gap-1 flex-wrap">
                      <i class="fa-solid fa-bus-simple"></i>バス停（徳島）<span v-if="busRoutesAt(st.name).length"
                        class="font-medium opacity-80">{{ busRoutesAt(st.name).slice(0, 2).join('・') }}<span
                        v-if="busRoutesAt(st.name).length > 2">ほか{{ busRoutesAt(st.name).length - 2 }}系統</span></span>
                    </div>
                    <div v-else-if="stationInfo(st.name) && stationInfo(st.name).found"
                         class="text-[9px] font-bold text-teal-600 flex items-center gap-1 flex-wrap">
                      <i class="fa-solid fa-circle-check"></i>{{ stationInfo(st.name).lines.slice(0, 3).join('・') }}<span
                        v-if="stationInfo(st.name).lines.length > 3">ほか{{ stationInfo(st.name).lines.length - 3 }}路線</span>
                    </div>
                    <!-- 同じ名前の場所が各地にあるとき、どれかを決められるようにする -->
                    <div v-if="st.name && ambiguousPlace(st.name)" class="flex items-center gap-1 flex-wrap">
                      <span class="text-[9px] font-bold shrink-0"
                            :class="pinnedPos(st.name) ? 'text-sky-600' : (posConfident(st.name) ? 'text-slate-400' : 'text-amber-600')">
                        <i class="fa-solid fa-map-pin mr-0.5"></i>{{ pinnedPos(st.name) ? 'この旅程では'
                          : (posConfident(st.name) ? 'いまは色つきの場所として扱っています' : '同じ名前が各地にあります') }}
                      </span>
                      <button v-for="(c, pi2) in posCandidates(st.name).slice(0, 6)" :key="'pc'+si+pi2"
                              @click="pinPlace(st.name, c)"
                              class="tap sug"
                              :class="samePos(posInUse(st.name), c) ? 'sug-net' : ''"
                              :title="'「' + st.name + '」を ' + (c.sub || 'この場所') + ' として扱います'">
                        {{ c.sub || '場所' + (pi2 + 1) }}
                      </button>
                      <button v-if="nearAnchor(si)" @click="pinNear(si)" class="tap sug"
                              :class="samePos(pinnedPos(st.name), nearAnchor(si)) ? 'sug-net' : ''"
                              :title="'候補に正しい場所が無いときに。「' + st.name + '」を ' + nearAnchor(si).name + ' のあたりとして扱います'">
                        {{ nearAnchor(si).name }}の近く
                      </button>
                      <button v-if="pinnedPos(st.name)" @click="unpinPlace(st.name)"
                              class="tap text-[9px] font-bold text-slate-400 hover:underline">指定を外す</button>
                    </div>

                    <!-- 着・発（この駅での乗換） -->
                    <div class="grid gap-2" :class="(si > 0 && si < editing.route.length - 1) ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1'">
                      <div v-if="si > 0" class="rounded-lg px-2 py-1.5" :class="isDark ? 'bg-slate-900/50' : 'bg-indigo-50/60'">
                        <div class="text-[9px] font-black mb-1" :class="st.through ? 'text-teal-600' : 'text-indigo-500'">
                          <i class="fa-solid text-[8px] mr-1" :class="st.through ? 'fa-arrow-right-long' : 'fa-arrow-down-to-line'"></i>{{ st.through ? (editing.type === 'bus' ? 'ここを通る' : 'この駅を通る') : (editing.type === 'bus' ? 'ここで降りる' : 'この駅に着く') }}
                        </div>
                        <div class="flex items-center gap-1">
                          <input v-if="!st.through" v-model="st.arrPlatform" placeholder="番線" @blur="tidyStop(st, editing.type)"
                                 :title="editing.type === 'bus' ? '数字だけでも「◯番のりば」にそろえます' : '数字だけでも「◯番線」にそろえます'"
                                 class="min-w-0 w-full rounded-md border border-slate-200 px-1.5 py-1 text-xs focus:border-indigo-400 outline-none" />
                          <input type="time" v-model="st.arrTime"
                                 class="min-w-0 w-full rounded-md border border-slate-200 px-1 py-1 text-xs focus:border-indigo-400 outline-none" />
                        </div>
                      </div>
                      <div v-if="si < editing.route.length - 1 || editing.route.length === 1" class="rounded-lg px-2 py-1.5" :class="isDark ? 'bg-slate-900/50' : 'bg-slate-50'">
                        <div class="text-[9px] font-black text-slate-500 mb-1">
                          <i class="fa-solid text-[8px] mr-1" :class="st.through ? 'fa-arrow-right-long' : 'fa-arrow-up-right-from-square'"></i>{{ st.through ? (editing.type === 'bus' ? 'ここを出る' : 'この駅を出る') : 'ここから乗る' }}
                        </div>
                        <div class="flex items-center gap-1">
                          <input v-if="!st.through" v-model="st.depPlatform" placeholder="番線" @blur="tidyStop(st, editing.type)"
                                 :title="editing.type === 'bus' ? '数字だけでも「◯番のりば」にそろえます' : '数字だけでも「◯番線」にそろえます'"
                                 class="min-w-0 w-full rounded-md border border-slate-200 px-1.5 py-1 text-xs focus:border-indigo-400 outline-none" />
                          <input type="time" v-model="st.depTime"
                                 class="min-w-0 w-full rounded-md border border-slate-200 px-1 py-1 text-xs focus:border-indigo-400 outline-none" />
                        </div>
                      </div>
                    </div>

                    <!-- 乗換の猶予（この駅の中で決まる） -->
                    <div v-if="isTransferStop(editing.route, si) && transferMins(editing.route, si) !== null"
                         class="text-[10px] font-black flex items-center gap-1.5 px-2 py-1 rounded-lg"
                         :class="tightTransfer(editing.route, si)
                           ? 'bg-rose-50 text-rose-700'
                           : (isDark ? 'bg-slate-900/60 text-amber-300' : 'bg-amber-50 text-amber-700')">
                      <i class="fa-solid text-[9px]" :class="st.quick ? 'fa-right-left' : 'fa-arrows-rotate'"></i>
                      {{ (st.quick ? 'この駅で対面乗換　猶予 ' : 'この駅で乗り換え　猶予 ') + fmtMin(transferMins(editing.route, si)) }}
                      <i v-if="tightTransfer(editing.route, si)" class="fa-solid fa-triangle-exclamation" title="乗換時間が短めです"></i>
                    </div>
                    <div v-else-if="isThroughStop(editing.route, si)"
                         class="text-[10px] font-black flex items-center gap-1.5 px-2 py-1 rounded-lg"
                         :class="isDark ? 'bg-teal-900/40 text-teal-300' : 'bg-teal-50 text-teal-700'">
                      <i class="fa-solid fa-arrow-right-long text-[9px]"></i>
                      直通（降りません）{{ transferMins(editing.route, si) ? '　停車 ' + fmtMin(transferMins(editing.route, si)) : '' }}
                    </div>

                    <!-- ここから乗る列車 -->
                    <div v-if="si < editing.route.length - 1 || editing.route.length === 1" class="rounded-lg px-2 py-2"
                         :style="{borderLeft: '3px solid ' + segColor(editing, st), background: isDark ? 'rgba(15,23,42,0.4)' : '#f8fafc'}">
                      <div class="text-[9px] font-black text-slate-500 mb-1.5 flex items-center gap-1 flex-wrap">
                        <i class="fa-solid text-[8px]" :class="editing.type === 'bus' ? 'fa-bus' : 'fa-train-subway'"></i>{{
                          editing.type === 'bus' ? 'ここから乗るバス' : (st.through ? 'ここから先の路線' : 'ここから乗る列車') }}
                        <span class="font-medium text-slate-400">（次の{{ editing.type === 'bus' ? 'バス停' : '駅' }}まで）</span>
                        <button @click="openTrainWizard(activeDay, si)" :disabled="!st.name"
                                class="tap ml-auto text-[11px] font-black px-2.5 py-1.5 rounded-lg transition"
                                :class="st.name ? 'text-white' : 'text-slate-400 cursor-not-allowed'"
                                :style="st.name ? {background: ink(cat(editing.type).color, '#ffffff')} : {background: isDark ? '#334155' : '#e2e8f0'}"
                                title="時刻表から、路線・行先・列車を選ぶ">
                          <i class="fa-solid fa-magnifying-glass mr-0.5"></i>{{ editing.type === 'bus' ? '時刻表から便を選ぶ' : '時刻表から選ぶ' }}
                        </button>
                      </div>
                      <div class="grid grid-cols-2 gap-1.5">
                        <div class="relative min-w-0">
                          <input v-model="st.line" :placeholder="editing.type === 'bus' ? '系統名（例：空港線）' : '路線名'" list="dl-line"
                                 class="w-full rounded-md border border-slate-200 pl-6 pr-2 py-1.5 text-xs focus:border-indigo-400 outline-none" />
                          <span class="absolute left-2 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full"
                                :style="{background: lineColor(st.line) || '#cbd5e1'}"
                                :title="lineColor(st.line) ? '路線カラー' : '路線名を入れると色が付きます'"></span>
                        </div>
                        <input v-model="st.dest" placeholder="行先（例：大宮行）" list="dl-dest"
                               class="min-w-0 w-full rounded-md border border-slate-200 px-2 py-1.5 text-xs focus:border-indigo-400 outline-none" />
                      </div>
                      <!-- 行先の候補（路線の終点・これまでの入力から） -->
                      <div v-if="!st.dest && (destSuggests(si).length || destAlong(si).length)" class="flex items-center gap-1 flex-wrap mt-1.5">
                        <span class="text-[9px] font-bold text-slate-400 shrink-0" :title="throughAhead(si) ? '直通列車は、路線が変わる駅ではなく、その先の駅を行先に掲げています' : ''">行先{{ throughAhead(si) ? '（直通の先まで）' : '' }}</span>
                        <button v-for="(d, di2) in destSuggests(si)" :key="'ds'+si+di2" @click="useDest(si, d.dest)"
                                class="tap sug" :class="d.net ? 'sug-net' : ''">{{ d.dest }}</button>
                        <button v-if="destAlong(si).length" @click="toggleDestList(si)"
                                class="tap sug" :title="'この路線で、' + (st.name || 'この駅') + ' から先にある駅から選びます'">
                          <i class="fa-solid text-[8px] mr-0.5" :class="destOpen === String(si) ? 'fa-chevron-up' : 'fa-list'"></i>{{ destOpen === String(si) ? '閉じる' : 'ほかの行先' }}
                        </button>
                      </div>
                      <!-- 路線上の駅から直接えらぶ（終点以外が行先の列車のため） -->
                      <div v-if="!st.dest && destOpen === String(si) && destAlong(si).length"
                           class="mt-1.5 rounded-lg p-2 max-h-40 overflow-y-auto scroll-thin"
                           :class="isDark ? 'bg-slate-900/50' : 'bg-slate-50'">
                        <div class="text-[9px] font-bold text-slate-400 mb-1.5">
                          {{ st.line }}　{{ st.name }} から先の駅（近い順）<template v-if="throughAhead(si)">。{{ throughAhead(si).name }} から先の直通ぶんも入っています</template>
                        </div>
                        <div class="flex items-center gap-1 flex-wrap">
                          <button v-for="(nm, ni) in destAlong(si)" :key="'da'+si+ni"
                                  @click="useDest(si, nm + '行'); toggleDestList(si)"
                                  class="tap sug">{{ nm }}行</button>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-1.5 mt-1.5">
                        <input v-model="st.kind" :placeholder="editing.type === 'bus' ? '種別（例：急行）' : '種別（例：快速）'"
                               :list="editing.type === 'bus' ? 'dl-kind-bus' : 'dl-kind-rail'"
                               title="普通・快速・特急など。速い種別を書いておくと、停車駅が少なくても指摘されません"
                               class="min-w-0 w-full rounded-md border border-slate-200 px-2 py-1.5 text-xs focus:border-indigo-400 outline-none" />
                        <input v-model="st.stations" :placeholder="stopsPlaceholder(editing)" @blur="tidyStop(st, editing.type)"
                               class="min-w-0 w-full rounded-md border border-slate-200 px-2 py-1.5 text-xs focus:border-indigo-400 outline-none" />
                      </div>
                      <!-- 種別の候補 -->
                      <div v-if="!st.kind" class="flex items-center gap-1 flex-wrap mt-1.5">
                        <span class="text-[9px] font-bold text-slate-400 shrink-0">種別</span>
                        <button v-for="(k, ki) in KIND_SUGGESTS[editing.type === 'bus' ? 'bus' : 'rail']" :key="'kd'+si+ki"
                                @click="st.kind = k" class="tap sug">{{ k }}</button>
                      </div>
                      <div v-if="stopCount(si) !== null && st.stations !== stopCount(si) + '駅'" class="mt-1.5">
                        <button @click="useStopCount(si)" class="tap sug sug-net"
                                :title="isFastKind(st.kind)
                                  ? '各駅に停まる場合の数です。' + st.kind + 'の停車駅はこれより少なくなります'
                                  : '実際の駅の並びから数えました'">
                          {{ isFastKind(st.kind) ? '各駅なら' + stopCount(si) + '駅' : stopCount(si) + '駅にする' }}
                        </button>
                      </div>
                      <!-- 路線の候補（直前の乗換で使った路線を先頭に） -->
                      <div v-if="!st.line && lineSuggests(si).length" class="flex items-center gap-1 flex-wrap mt-1.5">
                        <span class="text-[9px] font-bold text-slate-400">{{ editing.type === 'bus' ? 'このバス停を通る系統' : 'この駅を通る路線' }}</span>
                        <button v-for="(sug, gi) in lineSuggests(si)" :key="'ls'+si+gi" @click="useLine(si, sug)"
                                class="tap px-3 py-1.5 rounded-lg text-[11px] font-bold transition min-h-[32px]"
                                :style="{background: lineColor(sug.line) || '#e2e8f0', color: onColor(lineColor(sug.line) || '#e2e8f0')}">
                          {{ sug.line }}<span v-if="sug.keep" class="opacity-80">（続けて乗る）</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 駅と駅をつなぐ線 -->
                <div v-if="si < editing.route.length - 1" class="flex items-center gap-2 pl-4 py-0.5">
                  <span class="w-1 h-5 rounded-full" :style="{background: segColor(editing, st)}"></span>
                  <span class="text-[9px] font-bold text-slate-400">
                    {{ st.line || '（路線未入力）' }}<span v-if="st.dest"> ・{{ st.dest }}</span><span v-if="st.stations"> ・{{ st.stations }}</span>
                  </span>
                </div>
              </template>

              <div class="flex items-center gap-1.5 pt-1">
                <button @click="addStop()"
                        class="flex-1 py-1.5 rounded-lg border-2 border-dashed text-[11px] font-bold transition"
                        :style="isDark ? {borderColor:'rgba(59,130,246,0.4)',color: ink(cat(editing.type).color)} : {borderColor:cat(editing.type).ring,color: ink(cat(editing.type).color)}">
                  <i class="fa-solid fa-plus mr-1"></i>駅を追加
                </button>
                <button @click="fillTimesFromRoute()" title="最初の発時刻と最後の着時刻を、この予定の開始・終了に入れます"
                        class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 bg-white/70 hover:bg-white transition whitespace-nowrap">
                  <i class="fa-solid fa-clock mr-1"></i>発着を反映
                </button>
              </div>
            </div>
          </div>

          <!-- 飛行機専用フィールド -->
          <div v-if="editing.type==='plane'" class="mb-3 p-3 rounded-xl border"
               :style="isDark ? {background:'rgba(99,102,241,0.08)',borderColor:'rgba(99,102,241,0.25)'} : {background:CATS.plane.soft,borderColor:CATS.plane.ring}">
            <div class="text-[10px] font-black mb-2.5 flex items-center gap-1" :style="{color: ink(CATS.plane.color)}">
              <i class="fa-solid fa-plane-departure"></i> 飛行機の情報
            </div>
            <div class="grid grid-cols-2 gap-2">
              <label class="block">
                <span class="text-xs font-bold text-slate-500">便番号</span>
                <input v-model="editing.flightNo" placeholder="ANA282"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
              <label class="block">
                <span class="text-xs font-bold text-slate-500">行先空港</span>
                <input v-model="editing.direction" placeholder="伊丹(ITM)"
                       class="mt-1 w-full rounded-xl border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
            </div>
          </div>

          <!-- 座席（電車・バス・飛行機・イベントに共通） -->
          <label v-if="hasSeat(editing)" class="block mb-3">
            <span class="text-xs font-bold text-slate-500"><i class="fa-solid fa-couch mr-1 text-slate-400"></i>{{ seatLabel(editing) }}</span>
            <input v-model="editing.seat" :placeholder="seatPlaceholder(editing)"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
          </label>

          <div class="grid grid-cols-2 gap-3 mb-3">
            <label class="block">
              <span class="text-xs font-bold text-slate-500">{{ locLabel(editing) }}</span>
              <input v-model="editing.location" :placeholder="locPlaceholder(editing)" list="dl-place"
                     class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
              <div v-if="homePlace() && editing.location !== homePlace()" class="flex items-center gap-1 flex-wrap mt-1">
                <button @click.prevent="editing.location = homePlace()" class="tap sug"
                        :title="'場所を「' + homePlace() + '」にします'">
                  <i class="fa-solid fa-house text-[8px] mr-0.5"></i>{{ homePlace() }}
                </button>
                <button v-if="homeStation() && editing.location !== homeStation()"
                        @click.prevent="editing.location = homeStation()" class="tap sug"
                        :title="'場所を最寄り駅「' + homeStation() + '」にします'">
                  <i class="fa-solid fa-train-subway text-[8px] mr-0.5"></i>{{ homeStation() }}
                </button>
              </div>
              <div v-if="placeSuggests().length" class="flex items-center gap-1 flex-wrap mt-1">
                <span class="text-[9px] font-bold text-slate-400 shrink-0">もしかして</span>
                <button v-for="(c, ci) in placeSuggests()" :key="'ps'+ci" @click.prevent="usePlace(c.name)"
                        class="tap sug sug-net" :title="c.name + ' ' + (c.sub || '')">
                  {{ c.name }}<span v-if="c.sub" class="sug-sub">{{ c.sub }}</span>
                </button>
              </div>
            </label>
            <label class="block">
              <span class="text-xs font-bold text-slate-500">費用（円）</span>
              <input type="number" v-model.number="editing.cost" min="0" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
            </label>
          </div>
          <!-- きっぷ・宿・チケットは、出発前に払い終えていることが多い -->
          <div v-if="editing.cost > 0" class="mb-3 -mt-1">
            <button @click="editing.paid = !editing.paid"
                    :title="editing.paid ? '当日に払う（現地払い）に戻します' : '出発前に払い終えているものとして数えます'"
                    class="tap px-3 py-2 rounded-xl text-xs font-black border-2 transition flex items-center gap-1.5"
                    :class="editing.paid
                      ? 'border-emerald-300 text-emerald-700 bg-emerald-50'
                      : (isDark ? 'border-slate-600 text-slate-300' : 'border-slate-200 text-slate-500')">
              <i class="fa-solid" :class="editing.paid ? 'fa-circle-check' : 'fa-circle'"></i>
              {{ editing.paid ? '支払い済（出発前に決済）' : '支払い済にする' }}
            </button>
            <div class="text-[10px] text-slate-400 mt-1 leading-relaxed">
              支払い済にしても合計からは外れません。<b>当日いくら要るか</b>を「当日」として別に出します
            </div>
          </div>

          <label class="block mb-3">
            <span class="text-xs font-bold text-slate-500">メモ</span>
            <textarea v-model="editing.notes" rows="2" :placeholder="notePlaceholder(editing)"
                      class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none resize-y"></textarea>
          </label>

          <label class="block mb-5">
            <span class="text-xs font-bold text-slate-500">関連URL</span>
            <input v-model="editing.url" placeholder="https://" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none" />
          </label>

          <!-- 保存・キャンセルは、長い予定でもスクロールせずに押せるよう下に固定する -->
          <div class="sticky-foot flex gap-3" :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
            <button @click="tryCloseEdit()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition">キャンセル</button>
            <button @click="saveEvent" class="flex-1 py-3 rounded-xl font-bold text-white shadow-lg hover:opacity-90 transition"
              style="background:linear-gradient(135deg,#6366f1,#a855f7)" title="Ctrl+Enter でも保存できます">
              <i class="fa-solid fa-check mr-1"></i>保存
            </button>
          </div>
        </div>
      </div>
    </transition>

    <!-- ============ 旅程管理モーダル ============ -->
    <transition name="fade">
      <div v-if="showTripPanel" data-modal="trip" role="dialog" aria-modal="true" aria-label="旅程の管理" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="showTripPanel=false">
