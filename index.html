<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅程プランナー — Trip Itinerary Studio</title>
<!-- スマホのホーム画面に置いて、圏外でも開けるように（sw.js） -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6366f1" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="旅程" />

<!-- 部品は vendor/ に版を固定して同梱（配信元の更新で壊れない・圏外でも動く）。版を上げるときは vendor/README.md -->
<!-- Tailwind CSS 3.4.17 -->
<script src="vendor/tailwindcss-play-3.4.17.js"></script>
<!-- FontAwesome 6.5.1 -->
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
<!-- Vue 3.5.43 -->
<script src="vendor/vue.global.prod.js"></script>
<!-- QRコード（クルナビと同じ自作の部品。外部ライブラリなし） -->
<script src="vendor/qr.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Noto Sans JP"', 'system-ui', 'sans-serif'],
        },
        colors: {
          ink: '#1f2433',
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #eef1f7;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, #dfe7ff 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, #ffe6ef 0%, transparent 50%),
      var(--bg);
    color: #1f2433;
    font-feature-settings: "palt";
  }
  /* glass card */
  .glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.65);
    box-shadow: 0 10px 30px -12px rgba(31, 36, 51, 0.25);
  }
  .scroll-thin::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #c5cbdb; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }

  /* timeline rail */
  .rail::before {
    content: "";
    position: absolute;
    left: 19px; top: 6px; bottom: 6px;
    width: 2px;
    background: linear-gradient(to bottom, #d7ddec, #eef1f7);
  }

  .drag-ghost { opacity: 0.4; }
  .drag-over { box-shadow: 0 0 0 2px #6366f1 inset; border-radius: 16px; }

  textarea { tab-size: 2; }

  /* fade */
  /* ===== 画面の切り替わり =====
     目が追いつく速さだけを狙う。速すぎると「いつ変わったか」が分からず、
     遅いと待たされるので、0.2秒前後にそろえる */
  .fade-enter-active { transition: opacity .2s ease, transform .2s cubic-bezier(.22,.61,.36,1); }
  .fade-leave-active { transition: opacity .14s ease, transform .14s ease; }
  .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(6px) scale(.995); }

  /* 日を切り替えたとき、中身がすっと入れ替わる */
  @keyframes dayIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .day-in { animation: dayIn .24s cubic-bezier(.22,.61,.36,1); }

  /* 予定の増減・並べ替え */
  .ev-enter-active { transition: opacity .22s ease, transform .22s cubic-bezier(.22,.61,.36,1); }
  .ev-leave-active { transition: opacity .16s ease, transform .16s ease; }
  .ev-enter-from { opacity: 0; transform: translateY(10px); }
  .ev-leave-to { opacity: 0; transform: translateY(-6px) scale(.98); }
  .ev-move { transition: transform .24s cubic-bezier(.22,.61,.36,1); }

  /* 点検パネルなど、小さな出入り */
  .soft-enter-active { transition: opacity .2s ease, transform .2s ease; }
  .soft-leave-active { transition: opacity .12s ease; }
  .soft-enter-from { opacity: 0; transform: translateY(-6px); }
  .soft-leave-to { opacity: 0; }

  /* タブや押した所の反応を、少しだけなめらかに */
  .tab-btn { transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .12s ease; }
  .tab-btn:active { transform: scale(.97); }

  /* 動きが苦手な設定のときは、いっさい動かさない */
  @media (prefers-reduced-motion: reduce) {
    .fade-enter-active, .fade-leave-active,
    .ev-enter-active, .ev-leave-active, .ev-move,
    .soft-enter-active, .soft-leave-active, .tab-btn { transition: none !important; }
    .day-in { animation: none !important; }
    .fade-enter-from, .fade-leave-to, .ev-enter-from, .soft-enter-from { transform: none !important; }
  }

  [v-cloak] { display: none; }

  /* ===== DARK MODE ===== */
  body.dark {
    background:
      radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, #2d1b45 0%, transparent 50%),
      #0f172a;
    color: #e2e8f0;
  }
  body.dark .glass {
    background: rgba(15, 23, 42, 0.88) !important;
    border-color: rgba(71, 85, 105, 0.4) !important;
    box-shadow: 0 10px 30px -12px rgba(0,0,0,0.55) !important;
  }
  /* イベントカード背景（ソフトカラー → ダーク） */
  body.dark .ev-card { background: rgba(30, 41, 59, 0.82) !important; }
  /* モーダル内パネル */
  body.dark .modal-inner { background: rgba(15, 23, 42, 0.97) !important; }
  /* 長い題名や地名が入っても、モーダルは画面幅を超えない。
     grid の既定トラックは中身の最小幅で広がるので、トラック自体を画面幅で止める。
     （中身に max-width を直接かけると Tailwind の max-w-* を打ち消して
       大きな画面でモーダルが伸びてしまうので、ここではトラックだけを止める） */
  [role="dialog"] { grid-template-columns: minmax(0, 1fr); }
  [role="dialog"] > * { min-width: 0; }
  /* 入力欄 */
  body.dark input:not([type=range]),
  body.dark textarea {
    background: #1e293b !important;
    border-color: #475569 !important;
    color: #e2e8f0 !important;
  }
  body.dark input::placeholder,
  body.dark textarea::placeholder { color: #64748b !important; }
  /* テキスト */
  /* 明るい画面：補足の文字（slate-400/500）が白地で 2.6 しかなく読みにくかった。
     白・薄い藍・薄い灰のどの背景でも 4.5:1 を超える濃さへ寄せる（暗い画面は下の body.dark 側） */
  body:not(.dark) .text-slate-400 { color: #5f6e84; }
  body:not(.dark) .text-slate-500 { color: #536175; }
  body:not(.dark) .text-indigo-500 { color: #4f46e5; }
  body:not(.dark) .text-rose-500 { color: #e11d48; }
  body:not(.dark) .text-amber-600 { color: #b45309; }
  body.dark .text-ink   { color: #e2e8f0 !important; }
  body.dark .text-slate-600,
  body.dark .text-slate-500 { color: #94a3b8 !important; }
  body.dark .text-slate-700 { color: #94a3b8 !important; }
  body.dark .text-slate-400 { color: #94a3b8 !important; }
  body.dark .text-slate-300 { color: #64748b !important; }
  body.dark .text-indigo-600 { color: #a5b4fc !important; }
  body.dark .text-blue-600  { color: #93c5fd !important; }
  body.dark .ring-white { --tw-ring-color: rgba(30,41,59,0.65) !important; }
  /* 背景 */
  body.dark .bg-ink    { background-color: #334155 !important; }
  body.dark .border-ink { border-color: #94a3b8 !important; }
  body.dark .bg-white\/70, body.dark .bg-white\/80 { background: rgba(30, 41, 59, 0.85) !important; }
  body.dark .bg-slate-100 { background: #1e293b !important; }
  body.dark .bg-slate-200 { background: #334155 !important; }
  body.dark .bg-slate-900 { background: #020617 !important; }
  body.dark .border-slate-200 { border-color: #334155 !important; }
  body.dark .border-slate-700 { border-color: #475569 !important; }
  body.dark .border-indigo-200 { border-color: #6366f1 !important; }
  /* ホバー */
  body.dark .hover\:bg-white:hover      { background: rgba(51, 65, 85, 0.95) !important; }
  body.dark .hover\:bg-white\/70:hover  { background: rgba(51, 65, 85, 0.7) !important; }
  body.dark .hover\:bg-slate-100:hover  { background: #1e293b !important; }
  body.dark .hover\:bg-slate-200:hover  { background: #334155 !important; }
  body.dark .hover\:bg-indigo-50:hover  { background: #1e1b4b !important; }
  body.dark .hover\:bg-rose-50:hover    { background: #3f0f1a !important; }
  /* スクロールバー */
  body.dark .scroll-thin::-webkit-scrollbar-thumb { background: #475569; }
  /* タイムラインレール */
  body.dark .rail::before { background: linear-gradient(to bottom, #334155, #0f172a); }
  /* ドラッグオーバー */
  body.dark .drag-over { box-shadow: 0 0 0 2px #818cf8 inset; }

  /* ===== 検索ジャンプ時のハイライト / 時間重複の強調 ===== */
  @keyframes evPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    35%      { box-shadow: 0 0 0 5px rgba(99, 102, 241, .45); }
  }
  .ev-highlight { animation: evPulse 1.2s ease-in-out 2; }
  .ev-conflict  { outline: 2px dashed #f59e0b; outline-offset: 2px; }

  /* セレクトボックス（ダークモード） */
  body.dark select { background: #1e293b !important; border-color: #475569 !important; color: #e2e8f0 !important; }
  body.dark .bg-amber-50 { background: #422006 !important; }
  body.dark .bg-amber-100 { background: #451a03 !important; }
  body.dark .hover\:bg-amber-200:hover { background: #78350f !important; }
  body.dark .bg-rose-100 { background: #4c0519 !important; }
  body.dark .hover\:bg-rose-200:hover { background: #881337 !important; }
  body.dark .text-rose-700 { color: #fda4af !important; }
  body.dark .bg-rose-50 { background: #4c0519 !important; }
  body.dark .text-rose-600 { color: #fda4af !important; }
  body.dark .border-rose-200 { border-color: #9f1239 !important; }
  body.dark .text-amber-700 { color: #fcd34d !important; }
  body.dark .border-amber-200 { border-color: #78350f !important; }
  body.dark .bg-indigo-50 { background: #1e1b4b !important; }
  body.dark .bg-slate-50  { background: #1e293b !important; }
  body.dark .hover\:bg-slate-50:hover { background: #1e293b !important; }
  body.dark .border-slate-300 { border-color: #475569 !important; }
  body.dark kbd { background: #334155 !important; border-color: #475569 !important; color: #e2e8f0 !important; }

  input[type=search]::-webkit-search-cancel-button,
  input[type=search]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }

  kbd {
    display: inline-block; padding: 1px 6px; border-radius: 6px;
    border: 1px solid #cbd5e1; border-bottom-width: 2px; background: #f8fafc;
    font-family: inherit; font-size: 11px; font-weight: 700; color: #475569; line-height: 1.5;
  }

  /* ボタンの当たり判定（タッチ端末）。指で押す目安の 44px にそろえる */
  @media (hover: none), (pointer: coarse) {
    .tap { min-width: 44px; min-height: 44px; }
    .isu-btn { min-height: 44px; }
  }
  /* 同じところを素早く2回押しても拡大しない（2本指での拡大はできる） */
  html { touch-action: manipulation; }
  /* モーダル・当日モードを開いている間は、後ろの画面をスクロールさせない */
  html.modal-open, html.modal-open body { overflow: hidden; }
  /* モーダルの下に固定するボタンの帯（.modal-inner の余白 p-5 / sm:p-6 に合わせて端まで伸ばす） */
  .sticky-foot { position: sticky; bottom: -1.25rem; z-index: 5; margin: 0 -1.25rem -1.25rem; padding: .75rem 1.25rem 1.25rem;
                 border-top: 1px solid rgba(148,163,184,.25); }
  @media (min-width: 640px) { .sticky-foot { bottom: -1.5rem; margin: 0 -1.5rem -1.5rem; padding: .75rem 1.5rem 1.5rem; } }
  [role="dialog"], [role="dialog"] .modal-inner, [data-daymode] { overscroll-behavior: contain; }

  /* ===== 所要の目安チップ ===== */
  .est-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; padding: 7px 12px; min-height: 34px;
    border-radius: 10px; border: 1px solid #99f6e4; background: #f0fdfa; color: #0f766e;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .est-chip:hover { box-shadow: 0 2px 8px rgba(13,148,136,.18); transform: translateY(-1px); }
  .est-chip-on { border-color: #0d9488; background: #ccfbf1; }
  body.dark .est-chip { background: rgba(13,148,136,.18); border-color: rgba(45,212,191,.4); color: #5eead4; }
  body.dark .est-chip-on { background: rgba(13,148,136,.34); border-color: #2dd4bf; }

  /* ===== 直し方の画面 ===== */
  .fx-card { border-radius: 16px; padding: 12px; border: 1px solid; margin-bottom: 8px; }
  .fx-error { border-color: #fecdd3; background: #fff5f6; }
  .fx-warn  { border-color: #fde68a; background: #fffbeb; }
  .fx-info  { border-color: #e2e8f0; background: #f8fafc; }
  body.dark .fx-error { border-color: rgba(244,63,94,.45); background: rgba(76,5,25,.55); }
  body.dark .fx-warn  { border-color: rgba(245,158,11,.45); background: rgba(69,39,3,.55); }
  body.dark .fx-info  { border-color: rgba(71,85,105,.6); background: rgba(30,41,59,.6); }
  /* 見出し・場所・手引き */
  .fx-title { font-size: 13px; font-weight: 700; line-height: 1.6; color: #1f2433; overflow-wrap: anywhere; }
  .fx-where { font-size: 11px; font-weight: 700; color: #536175; margin-top: 2px; }
  .fx-box   { border-radius: 12px; padding: 10px 12px; background: #fff; border: 1px solid #e2e8f0; }
  .fx-how   { font-size: 12px; font-weight: 600; line-height: 1.6; color: #475569; }
  .fx-lead  { font-size: 10px; font-weight: 800; color: #4f46e5; margin-bottom: 4px; }
  .fx-detail{ font-size: 13px; font-weight: 700; color: #1f2433; line-height: 1.6; overflow-wrap: anywhere; }
  body.dark .fx-title  { color: #f1f5f9; }
  body.dark .fx-where  { color: #94a3b8; }
  body.dark .fx-box    { background: rgba(15,23,42,.75); border-color: rgba(71,85,105,.6); }
  body.dark .fx-how    { color: #cbd5e1; }
  body.dark .fx-lead   { color: #a5b4fc; }
  body.dark .fx-detail { color: #f1f5f9; }
  /* ボタン（副） */
  .fx-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; padding: 8px 12px; min-height: 36px;
    border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; color: #475569;
  }
  .fx-btn:hover { border-color: #94a3b8; background: #f8fafc; }
  body.dark .fx-btn { background: rgba(30,41,59,.9); border-color: #475569; color: #cbd5e1; }
  body.dark .fx-btn:hover { border-color: #64748b; background: rgba(51,65,85,.9); }
  .fx-btn-quiet { color: #536175; }
  body.dark .fx-btn-quiet { color: #94a3b8; }

  /* ===== 入力候補のチップ ===== */
  .sug {
    font-size: 11px; font-weight: 700; padding: 6px 12px; min-height: 32px;
    display: inline-flex; align-items: center; gap: 4px; border-radius: 10px;
    border: 1px solid #e2e8f0; background: #fff; color: #475569;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .sug:active { transform: scale(.97); }
  .sug:hover { border-color: #a5b4fc; background: #eef2ff; color: #4338ca; }
  body.dark .sug { background: #1e293b; border-color: #334155; color: #cbd5e1; }
  body.dark .sug:hover { border-color: #6366f1; background: #312e81; color: #e0e7ff; }
  .sug-net { border-color: #99f6e4; background: #f0fdfa; color: #0f766e; }
  body.dark .sug-net { background: rgba(13,148,136,.18); border-color: rgba(45,212,191,.4); color: #5eead4; }
  .sug-sub { font-weight: 500; opacity: .65; margin-left: 4px; }

  /* ===== 点検パネル ===== */
  /* 直しボタンの言葉が長いと、細い画面では1行に入らない。
     入らなければ折り返す（横スクロールを出さない） */
  .isu { border-radius: 12px; padding: 6px 8px; display: flex; align-items: flex-start; gap: 7px; flex-wrap: wrap; }
  .isu-acts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; min-width: 0; max-width: 100%; }
  .isu-acts .isu-btn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 639px) {
    .isu > button.isu-msg { flex-basis: calc(100% - 24px); }
    .isu-acts { width: 100%; justify-content: flex-start; padding-left: 17px; }
  }
  .isu-error { background: #fef2f2; }
  .isu-warn  { background: #fffbeb; }
  .isu-info  { background: #f8fafc; }
  body.dark .isu-error { background: rgba(127,29,29,.28); }
  body.dark .isu-warn  { background: rgba(120,53,15,.28); }
  body.dark .isu-info  { background: rgba(30,41,59,.6); }
  .isu-msg { font-size: 11px; font-weight: 600; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
  .isu-error .isu-msg { color: #b91c1c; }
  .isu-warn  .isu-msg { color: #b45309; }
  .isu-info  .isu-msg { color: #536175; }
  body.dark .isu-error .isu-msg { color: #fca5a5; }
  body.dark .isu-warn  .isu-msg { color: #fcd34d; }
  body.dark .isu-info  .isu-msg { color: #cbd5e1; }
  .isu-btn {
    font-size: 11px; font-weight: 800; padding: 5px 11px; min-height: 30px;
    display: inline-flex; align-items: center; border-radius: 9px;
    border: 1px solid currentColor; white-space: nowrap; opacity: .85;
  }
  .isu-btn:active { transform: scale(.97); }
  .isu-btn:hover { opacity: 1; }

  /* ===== 乗換の経路図 ===== */
  .rt { margin-top: 6px; }
  .rt-stop {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 12px; font-weight: 700; line-height: 1.5; min-width: 0;
  }
  /* 乗り換える駅は帯を敷いて目立たせる */
  .rt-stop-tr {
    background: #fffbeb; border-radius: 8px; padding: 2px 6px; margin-left: -6px;
    box-shadow: inset 2px 0 0 #f59e0b;
  }
  body.dark .rt-stop-tr { background: rgba(120,53,15,.32); box-shadow: inset 2px 0 0 #f59e0b; }
  .rt-stop-tight { background: #fef2f2; box-shadow: inset 2px 0 0 #e11d48; }
  body.dark .rt-stop-tight { background: rgba(127,29,29,.32); box-shadow: inset 2px 0 0 #f43f5e; }
  .rt-dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: #fff; border: 3px solid var(--sc, #94a3b8); box-sizing: border-box;
  }
  body.dark .rt-dot { background: #0f172a; }
  /* 駅名は途中で割らない。ただし1行に収まらないほど長ければ折る */
  .rt-name { word-break: keep-all; overflow-wrap: anywhere; }
  /* 「07:06着 2番線」のような組は、ひとかたまりで次の行へ動く */
  .rt-grp {
    display: inline-flex; align-items: center; gap: 5px;
    flex-wrap: wrap; max-width: 100%; min-width: 0;
  }
  .rt-t { white-space: nowrap; }   /* 時刻は短いので割らない。ホーム名は長い入力もありうるので割れるままにする */
  .rt-seg {
    margin-left: 3.5px; padding: 4px 0 4px 12.5px;
    border-left: 3px solid var(--sc, #cbd5e1);
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0;
  }
  .rt-line {
    font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
    letter-spacing: .01em; max-width: 100%; word-break: break-all;
  }
  .rt-meta { font-size: 10px; font-weight: 700; color: #5f6e84; word-break: break-all; }
  body.dark .rt-meta { color: #94a3b8; }
  /* 前後のつながり */
  .lk-tag {
    font-size: 9px; font-weight: 900; color: #fff; background: #4f46e5;
    padding: 1px 5px; border-radius: 5px; line-height: 1.5; flex-shrink: 0;
  }
  .lk-tag-next { background: #0f766e; }
  .lk-chip { font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 999px; line-height: 1.5; }
  .lk-ok    { background: #eef2f7; color: #536175; }
  .lk-tight { background: #ccfbf1; color: #0f766e; }
  .lk-bad   { background: #ffe4e6; color: #be123c; }
  body.dark .lk-ok    { background: #1e293b; color: #cbd5e1; }
  body.dark .lk-tight { background: #134e4a; color: #5eead4; }
  body.dark .lk-bad   { background: #4c0519; color: #fda4af; }
  /* 種別（快速・特急）と行先は、ぱっと見て分かるように濃く出す */
  /* 枠は路線の色、文字は濃いまま。薄い路線色を文字に使うと読めなくなるため */
  .rt-kind {
    font-size: 10px; font-weight: 900; padding: 0 4px; border-radius: 4px;
    border: 1.5px solid var(--kc, #cbd5e1); color: #334155;
    white-space: nowrap; line-height: 1.5;
  }
  body.dark .rt-kind { color: #e2e8f0; }
  .rt-dest { font-size: 11px; font-weight: 800; color: #475569; word-break: break-all; }
  /* 路線と路線のあいだの「直通」。同じ列車のまま乗り入れることを示す */
  .rt-thru {
    font-size: 9px; font-weight: 900; color: #0f766e; background: #ccfbf1;
    padding: 0 4px; border-radius: 999px; line-height: 1.6; white-space: nowrap;
  }
  body.dark .rt-thru { background: #134e4a; color: #5eead4; }
  body.dark .rt-dest { color: #cbd5e1; }
  .rt-pf {
    font-size: 10px; font-weight: 800; padding: 0 5px; border-radius: 4px;
    background: #f1f4f9; color: #536175; max-width: 100%; word-break: break-all;
  }
  body.dark .rt-pf { background: #1e293b; color: #94a3b8; }
  .rt-tr {
    font-size: 9px; font-weight: 800; padding: 0 5px; border-radius: 999px;
    background: #fff7ed; color: #c2410c; white-space: nowrap;
  }
  body.dark .rt-tr { background: #431407; color: #fdba74; }
  .rt-tr-tight { background: #fee2e2; color: #b91c1c; }
  /* 直通：降りないので、静かな色にして乗換と見分ける */
  .rt-th {
    font-size: 9px; font-weight: 800; padding: 0 5px; border-radius: 999px;
    background: #f0fdfa; color: #0f766e; white-space: nowrap;
  }
  body.dark .rt-th { background: rgba(13,148,136,.22); color: #5eead4; }
  .rt-stop-th { background: #f6fffd; border-radius: 8px; padding: 2px 6px; margin-left: -6px; box-shadow: inset 2px 0 0 #14b8a6; }
  body.dark .rt-stop-th { background: rgba(13,148,136,.14); box-shadow: inset 2px 0 0 #2dd4bf; }
  body.dark .rt-tr-tight { background: #450a0a; color: #fca5a5; }
  .rt-t {
    font-size: 10px; font-weight: 800; color: #475569;
    font-variant-numeric: tabular-nums; max-width: 100%; word-break: break-all;
  }
  body.dark .rt-t { color: #cbd5e1; }
  .rt-pf-arr { background: #eef2ff; color: #4f46e5; }
  body.dark .rt-pf-arr { background: #1e1b4b; color: #a5b4fc; }

  /* ===== 予定と予定の「あいだ」＝挿入ポイント ===== */
  .ins-row { position: relative; min-height: 20px; }
  .ins-row::before {
    content: ""; position: absolute; left: 48px; right: 8px; top: 50%;
    border-top: 1px dashed transparent; transition: border-color .15s ease;
    pointer-events: none;
  }
  .ins-row:hover::before { border-color: #c7d2fe; }
  .ins-row.ins-active::before { border-top: 1.5px solid #818cf8; }
  body.dark .ins-row:hover::before { border-color: #4f46e5; }
  .ins-hint {
    opacity: 0; transition: opacity .15s ease;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ins-row:hover .ins-hint, .ins-row:focus-within .ins-hint { opacity: 1; }
  .ins-dot {
    width: 16px; height: 16px; border-radius: 999px;
    display: grid; place-items: center; font-size: 9px;
    color: #a5b4fc; opacity: .55; transition: opacity .15s ease;
  }
  .ins-row:hover .ins-dot { opacity: 0; }
  /* 移動先を選んでいる最中は、あいだを常に見せる */
  .ins-row.ins-active .ins-hint { opacity: 1; }
  .ins-row.ins-active .ins-dot { display: none; }
  @media (hover: none), (pointer: coarse) {
    .ins-hint { opacity: 1; }
    .ins-dot { display: none; }
    .ins-row::before { border-color: #e2e8f0; }
  }

  /* 移動中のカードは薄く */
  .ev-moving { opacity: .45; outline: 2px dashed #818cf8; outline-offset: 2px; border-radius: 16px; }

  /* 長い連続文字でも入力欄やカードが横に広がらないように */
  input, textarea, select { max-width: 100%; }
  .break-all { word-break: break-all; }

  /* ===== HEADER SCROLL ===== */
  header { transition: background-color .2s ease; }
  /* スマホ幅でスクロールしたら、カウントダウンと予算の帯を畳んで本文の場所を空ける */
  @media (max-width: 639px) { .header-scrolled .hdr-extra { display: none !important; } }
  .header-scrolled {
    background: rgba(238, 241, 247, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  body.dark .header-scrolled {
    background: rgba(15, 23, 42, 0.96);
  }

  /* ===== RESPONSIVE / モバイル互換 ===== */
  /* モバイルブラウザのアドレスバー対応（100dvh） */
  .min-h-dvh { min-height: 100vh; min-height: 100dvh; }

  /* タブ・チップ内の文字折り返し防止 */
  .nowrap { white-space: nowrap; }

  /* iOS Safari: input文字サイズ16px未満だとフォーカス時に自動ズームしてしまうのを防止 */
  @media (max-width: 640px) {
    input:not([type=range]), textarea, select { font-size: 16px !important; }
  }

  /* タッチデバイス（hoverなし）ではカード操作ボタンを常時表示 */
  @media (hover: none), (pointer: coarse) {
    .ev-actions { opacity: 1 !important; }
  }

  /* print-only要素：画面では非表示、印刷時に表示。
     印刷レイアウトのCSSは @media print の外に置く：紙に収まるかを画面側で
     計測してから縮小率を決めるため、画面でも同じ見た目で組める必要がある */
  .print-only { display: none; }
  /* 計測のあいだだけ、紙と同じ幅で画面外に組む */
  .print-only.print-measure {
    display: block !important; position: fixed !important; left: -20000px; top: 0;
    visibility: hidden; background: #fff; color: #1f2433; font-size: 9pt; line-height: 1.4;
  }

  /* ── 印刷ヘッダー ── */
  .ph-wrap { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #1f2433; padding-bottom: 4px; margin-bottom: 8px; }
  .ph-label { font-size: 5.5pt; font-weight: 700; letter-spacing: .1em; color: #6366f1; }
  .ph-title { font-size: 11pt; font-weight: 900; color: #1f2433; line-height: 1.2; }
  .ph-meta  { font-size: 6.5pt; color: #64748b; margin-top: 1px; }
  .ph-budget-label { font-size: 5.5pt; color: #94a3b8; font-weight: 700; text-align: right; }
  .ph-budget-val   { font-size: 9pt; font-weight: 900; color: #1f2433; text-align: right; }

  /* ── 紙1枚ぶん ──
     どこで改ページするかは、こちらで測って決める（CSSの成り行きに任せない）。
     任せると、見出しだけの紙・締めだけの紙・段のガタつきが出てしまう */
  .ptl-page { break-after: page; }
  .ptl-page:last-child { break-after: auto; }
  .ptl-grid {
    display: grid;
    grid-template-columns: repeat(var(--pcols, 3), minmax(0, 1fr));
    column-gap: 14px;
    align-items: start;
  }
  .ptl-col { min-width: 0; position: relative; }
  /* 仕切りはすき間の真ん中に置く（段の幅を食わないので、測った高さとずれない） */
  .ptl-col + .ptl-col::before {
    content: ''; position: absolute; left: -8px; top: 0; bottom: 0;
    border-left: 1px solid #e3e6ef;
  }
  /* かたまりひとつ。
     中の余白が外へすり抜ける（マージンの相殺）と、測った高さと実際がずれるので止める */
  .ptl-blk { display: flow-root; }
  /* 日の見出し（続きの紙・段では「つづき」と断る） */
  .ptl-cont { font-size: 6pt; font-weight: 700; color: #94a3b8; margin-left: 4px; }

  /* ── 3カラム タイムライン ── */
  /* 段のなかは、上から順に流すだけ（切る場所はこちらで決めてある） */
  .ptl-day-body > * { break-inside: avoid; }
  .ptl-day-hd {
    font-size: 8.5pt; font-weight: 900; color: #1f2433;
    border-bottom: 1.5px solid #1f2433; padding-bottom: 2px; margin-bottom: 5px;
    break-after: avoid; display: flex; justify-content: space-between; align-items: baseline;
    gap: 4px;
  }
  /* 日付は「10/20」で1つのまとまり。細い段でも途中で折り返させない。
     詰まるときは、右の金額のほうを縮める */
  .ptl-day-when { white-space: nowrap; flex: 0 0 auto; }
  .ptl-day-hd .ptl-day-cost { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptl-day-cost { font-size: 6.5pt; font-weight: 500; color: #64748b; }
  .ptl-day-sub  { font-size: 6pt; color: #94a3b8; margin: -3px 0 5px; letter-spacing: .02em; break-after: avoid; }
  .ptl-rt-stop, .ptl-rt-seg { break-inside: avoid; }

  /* イベント行 */
  .ptl-ev { break-inside: avoid; position: relative; padding-left: 12px; }
  .ptl-ev-dot {
    position: absolute; left: 0; top: 4px;
    width: 7px; height: 7px; border-radius: 50%;
  }
  /* 出発地点 / 到着地点の強調（印刷） */
  .ptl-ev-anchor {
    background: #f1f5f9; border-radius: 0 3px 3px 0;
    border-left: 2.5px solid var(--ac, #94a3b8);
    padding: 2px 2px 3px 13px; margin: 2px 0;
  }
  .ptl-ev-anchor .ptl-ev-dot { width: 9px; height: 9px; left: 4px; }
  .ptl-anchor-badge {
    display: inline-block; font-size: 5.5pt; font-weight: 900; color: #fff;
    padding: 0 3px; border-radius: 2px; margin-right: 3px; vertical-align: middle;
  }
  .ptl-ev-rail {
    position: absolute; left: 3px; top: 11px; bottom: 0;
    width: 1.5px; background: #e3e6ef;
  }
  .ptl-ev-tlabel { font-size: 5.5pt; font-weight: 900; letter-spacing: .12em; line-height: 1.1; margin-bottom: 1px; }
  .ptl-ev-time { font-size: 7pt; font-weight: 700; color: #64748b; font-variant-numeric: tabular-nums; line-height: 1.4; }
  .ptl-ev-name, .ptl-ev-loc, .ptl-ev-note, .ptl-ev-cost { overflow-wrap: anywhere; }
  .ptl-ev-badge {
    display: inline-block; font-size: 5.5pt; font-weight: 700;
    padding: 0 3px; border-radius: 2px; margin-right: 2px; vertical-align: middle;
  }
  .ptl-ev-name { font-size: 8pt; font-weight: 700; color: #1f2433; line-height: 1.3; word-break: break-word; }
  .ptl-ev-loc  { font-size: 6.5pt; color: #64748b; line-height: 1.3; margin-top: 1px; word-break: break-word; }
  .ptl-ev-note { font-size: 6pt; color: #94a3b8; line-height: 1.3; margin-top: 1px; word-break: break-word; }
  .ptl-ev-cost { font-size: 6.5pt; font-weight: 700; color: #475569; margin-top: 1px; font-variant-numeric: tabular-nums; }

  /* 矢印 */
  .ptl-arrow { padding-left: 12px; color: #cbd5e1; font-size: 7pt; line-height: 1.1; break-inside: avoid; }
  /* 寝ていた時間。ただの空きと区別が付くようにする */
  .ptl-sleep { font-size: 5.5pt; font-weight: 900; color: #4f46e5; margin-left: 4px; }

  /* 乗換チェーン（印刷） */
  .ptl-conn { margin-top: 2px; }
  .ptl-rt-stop {
    font-size: 6.5pt; font-weight: 700; color: #1f2433;
    display: flex; align-items: center; flex-wrap: wrap; gap: 0 4px; line-height: 1.35;
  }
  .ptl-rt-stop-tr { background: #fff7ed; box-shadow: inset 2px 0 0 #ea580c; padding-left: 3px; }
  .ptl-rt-stop-th { background: #f0fdfa; box-shadow: inset 2px 0 0 #0d9488; padding-left: 3px; }
  .ptl-rt-th { font-size: 5pt; font-weight: 800; color: #0f766e; }
  /* 駅名・着・発は、それぞれ途中で折り返さない（細い段でも読めるように） */
  .ptl-rt-name { word-break: keep-all; overflow-wrap: anywhere; }
  .ptl-rt-grp  { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 2px; max-width: 100%; }
  .ptl-rt-dot { width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid var(--sc, #94a3b8); background: #fff; flex: none; box-sizing: border-box; }
  .ptl-rt-seg { margin-left: 1.5px; padding: 1px 0 1px 6px; border-left: 1.5px solid var(--sc, #cbd5e1); display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .ptl-rt-line { font-size: 5.5pt; font-weight: 800; padding: 0 3px; border-radius: 999px; white-space: nowrap; }
  .ptl-rt-meta { font-size: 5.5pt; color: #64748b; }
  .ptl-rt-thru { font-size: 5pt; font-weight: 900; color: #0f766e; white-space: nowrap; }
  /* 出発前に払い終えているぶん（当日は財布から出ない） */
  .ptl-paid {
    font-size: 5pt; font-weight: 900; color: #047857; border: .7pt solid #6ee7b7;
    border-radius: 2px; padding: 0 2px; margin-left: 3px; white-space: nowrap;
  }
  /* 種別（快速・特急）… 路線色の枠で囲って、路線名の隣で目立たせる */
  .ptl-rt-kind {
    font-size: 5.5pt; font-weight: 900; padding: 0 2.5px; border-radius: 2px;
    border: .8pt solid var(--sc, #94a3b8); color: #111827; white-space: nowrap;
  }
  /* 行先 … 印刷でいちばん探される情報なので、濃く・少し大きく */
  .ptl-rt-dest { font-size: 6.5pt; font-weight: 900; color: #111827; letter-spacing: .01em; }
  /* 便名・列車名 … 空港や改札で照合するので、枠を付けて拾いやすくする */
  .ptl-code {
    display: inline-block; font-size: 7pt; font-weight: 900; color: #111827;
    border: .9pt solid #64748b; border-radius: 2.5px; padding: 0 3px;
    margin-right: 3px; font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .ptl-code-lbl { font-size: 5.5pt; font-weight: 700; color: #64748b; margin-right: 2px; }
  .ptl-rt-t { font-size: 5.5pt; font-weight: 800; color: #334155; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ptl-rt-tr { font-size: 5pt; font-weight: 800; color: #c2410c; white-space: nowrap; }
  .ptl-conn-seg { font-size: 6.5pt; color: #1f2433; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; line-height: 1.4; min-width: 0; }
  .ptl-conn-seg > span { word-break: break-all; }
  .ptl-conn-line { font-size: 5.5pt; font-weight: 700; padding: 0 3px; border-radius: 3px; }
  .ptl-conn-sub { font-size: 5.5pt; color: #64748b; padding-left: 6px; line-height: 1.3; word-break: break-all; }
  .ptl-conn-transfer { font-size: 5.5pt; color: #94a3b8; padding: 1px 0 1px 6px; line-height: 1.3; }

  /* フッター合計 */
  /* 締めの行は本文の流れの中に置く。
     紙に固定すると、本文が紙いっぱいまで来たときに下の行を覆い隠してしまう。
     （読めなくなるくらいなら、1枚増えるほうがましという判断） */
  .ptl-foot {
    font-size: 7.5pt; font-weight: 900; margin-top: 6px;
    border-top: 1.5px solid #1f2433; padding-top: 3px;
    display: flex; justify-content: space-between; align-items: baseline;
    break-inside: avoid;
  }
  .ptl-foot-time { font-size: 5.5pt; font-weight: 400; color: #94a3b8; }



  /* ---------- 当日モード ---------- */
  .dm { --dm-bg: #f3f5fa; --dm-card: #ffffff; --dm-ink: #111827; --dm-sub: #475569; --dm-line: #e2e8f0;
        --dm-accent: #4338ca; --dm-now: #047857; --dm-now-soft: #ecfdf5; --dm-warn: #b45309; --dm-chip: #eef2ff;
        background: var(--dm-bg); color: var(--dm-ink); font-size: 16px; -webkit-text-size-adjust: 100%; }
  body.dark .dm { --dm-bg: #0b1120; --dm-card: #131c2e; --dm-ink: #f1f5f9; --dm-sub: #cbd5e1; --dm-line: #334155;
        --dm-accent: #a5b4fc; --dm-now: #34d399; --dm-now-soft: #052e22; --dm-warn: #fbbf24; --dm-chip: #1e1b4b; }
  .dm-top { display: flex; align-items: center; gap: 12px; }
  .dm-clock { flex: 1; text-align: center; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .dm-sec { font-size: 20px; margin-left: 4px; color: var(--dm-sub); }
  .dm-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--dm-card); color: var(--dm-sub);
             border: 1px solid var(--dm-line); flex: 0 0 auto; }
  .dm-icon:disabled { opacity: .35; }
  .dm-icon-on { background: #fde68a; color: #78350f; border-color: #f59e0b; }
  .dm-icon-s { width: 40px; height: 40px; }
  .dm-dayline { display: flex; align-items: center; gap: 8px; margin: 14px 0 12px; }
  .dm-dayname { font-weight: 900; font-size: 18px; }
  .dm-trip { font-size: 12px; color: var(--dm-sub); font-weight: 700; }
  .dm-note { display: flex; gap: 8px; align-items: flex-start; background: var(--dm-card); border: 1px solid var(--dm-line); border-radius: 16px;
             padding: 12px 14px; font-size: 14px; font-weight: 700; color: var(--dm-sub); margin-bottom: 12px; }
  .dm-note i { margin-top: 3px; }
  .dm-card { background: var(--dm-card); border: 1px solid var(--dm-line); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 6px 20px -14px rgba(15,23,42,.35); }
  .dm-card-now { border: 2px solid var(--dm-now); }
  .dm-label { font-size: 12px; font-weight: 900; letter-spacing: .08em; color: var(--dm-sub); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .dm-label-now { color: var(--dm-now); }
  .dm-label-btn { background: none; border: 0; padding: 4px 0; min-height: 32px; }
  .dm-dot { width: 9px; height: 9px; border-radius: 99px; background: var(--dm-now); }
  .dm-title { font-size: 20px; font-weight: 900; line-height: 1.35; overflow-wrap: anywhere; }
  .dm-sub { font-size: 14px; font-weight: 700; color: var(--dm-sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums; }
  .dm-left { color: var(--dm-now); }
  .dm-big { font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .dm-count { font-size: 18px; font-weight: 900; color: var(--dm-accent); font-variant-numeric: tabular-nums; }
  .dm-step { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--dm-chip); }
  .dm-card-now .dm-step { background: var(--dm-now-soft); }
  .dm-step-head { font-size: 12px; font-weight: 900; color: var(--dm-sub); }
  .dm-step-main { font-size: 22px; font-weight: 900; line-height: 1.3; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; overflow-wrap: anywhere; }
  .dm-step-time { font-size: 18px; font-variant-numeric: tabular-nums; }
  .dm-step-then { font-size: 15px; font-weight: 800; margin-top: 4px; overflow-wrap: anywhere; }
  .dm-step-xfer { color: var(--dm-warn); }
  .dm-plat { display: inline-block; font-size: 15px; font-weight: 900; padding: 1px 8px; border-radius: 8px; border: 2px solid currentColor; }
  .dm-stops { margin-top: 10px; border-left: 3px solid var(--dm-line); padding-left: 12px; display: grid; gap: 6px; }
  .dm-stops li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
  .dm-stop-name { min-width: 0; overflow-wrap: anywhere; }
  .dm-stop-t { color: var(--dm-sub); text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; flex: 0 0 auto; }
  .dm-stop-hit, .dm-stop-hit .dm-stop-t { color: var(--dm-accent); }
  .dm-stop-past { opacity: .55; }
  .dm-place { font-size: 14px; font-weight: 700; color: var(--dm-sub); margin-top: 8px; overflow-wrap: anywhere; }
  .dm-notes { font-size: 13px; color: var(--dm-sub); margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dm-list { margin-top: 18px; }
  .dm-row { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--dm-card); border: 1px solid var(--dm-line);
            border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; min-height: 48px; color: var(--dm-ink); }

createApp({
  setup() {
    /* ---------- ユーティリティ ---------- */
    const uid = () => 'e' + Math.random().toString(36).slice(2, 9);

    /* 日付：ローカルタイムで YYYY-MM-DD 化（toISOString はUTCずれを起こすため使わない） */
    const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const todayISO = () => toISO(new Date());
    function shiftDate(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return '';
      d.setDate(d.getDate() + n);
      return toISO(d);
    }
    function diffDays(a, b) {
      const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
      if (isNaN(da) || isNaN(db)) return 0;
      return Math.round((db - da) / 86400000);
    }
    /* 時刻："HH:MM" → 分。未入力/不正は null */
    function toMin(t) {
      if (!t) return null;
      const [h, m] = String(t).split(':').map(Number);
      return (isNaN(h) || isNaN(m)) ? null : h * 60 + m;
    }
    const minToHHMM = (m) => {
      const v = ((m % 1440) + 1440) % 1440;
      return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
    };
    function fmtMin(mins) {
      if (mins == null || mins <= 0) return '';
      const h = Math.floor(mins / 60), m = mins % 60;
      return (h ? h + '時間' : '') + (m ? m + '分' : '');
    }

    /* ---------- 旅程マルチ管理 ---------- */
    /* ---- 置き場（localStorage）への書き込み ----
       ブラウザの置き場には上限がある。いっぱいになると書き込みが失敗し、
       画面には残っているのに、開き直すと前の状態に戻る＝「入れたものが消えた」になる。
       そこで、あふれたら「あとから引き直せるもの」（通信の控え・元に戻す履歴）を
       捨ててから、もう一度書く */
    let purgeRoom = null;                 // 場所を空ける手立て（あとで入れる）
    let lastWritten = null;               // 最後に自分が書いた（または読み込んだ）中身
    function lsSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (err) {
        for (let step = 0; step < 3; step++) {
          if (!purgeRoom || !purgeRoom(step)) break;
          try { localStorage.setItem(key, value); return true; } catch {}
        }
        return false;
      }
    }
    /* 旅は自宅から始まることがほとんど。
       旅程ごとに書き直さなくていいよう、アプリ全体で覚えておく */
    const LS_HOME = 'trip_home_v1';
    const home = reactive((() => {
      try { return Object.assign({ place: '自宅', station: '' }, JSON.parse(localStorage.getItem(LS_HOME) || '{}')); }
      catch { return { place: '自宅', station: '' }; }
    })());
    watch(home, () => { try { localStorage.setItem(LS_HOME, JSON.stringify(home)); } catch {} }, { deep: true });
    const homePlace = () => String(home.place || '').trim();
    const homeStation = () => String(home.station || '').trim();

    const LS_DRAFT = 'trip_draft_v1';
    const LS_TRIPS_IDX = 'trip_index_v1';
    const LS_CURRENT_ID = 'trip_current_id_v1';
    const LS_OLD = 'trip_itinerary_v1';
    const LS_LAST_BACKUP = 'trip_last_backup_v1';   // Cookie削除等でlocalStorageごと消えても復元できるよう、日1回ファイルに書き出した日を覚えておく
    const tripKey = (id) => 'trip_data_' + id;
    const newTripId = () => 't' + Date.now().toString(36);

    const tripIndex = ref([]);
    const currentTripId = ref('');
    const showTripPanel = ref(false);
    const lastBackupAt = ref((() => { try { return localStorage.getItem(LS_LAST_BACKUP) || ''; } catch { return ''; } })());

    function saveTripIndex() {
      try {
        localStorage.setItem(LS_TRIPS_IDX, JSON.stringify(tripIndex.value));
        localStorage.setItem(LS_CURRENT_ID, currentTripId.value);
      } catch {}
    }

    /* 次回・次々回のイベント（＝開始日がまだ来ていない旅程）までのカウントダウン。
       開始日の早い順に並べ、今日からの日数と行き先（会場）を出す */
    const upcomingTrips = computed(() => {
      const today = todayISO();
      return tripIndex.value
        .filter(t => t.startDate && t.startDate >= today)
        .sort((a, b) => a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0)
        .slice(0, 2)
        .map((t, i) => ({
          id: t.id,
          label: i === 0 ? '次回' : '次々回',
          title: t.title || '旅程',
          venue: t.destination || t.origin || '',
          daysLeft: diffDays(today, t.startDate),
        }));
    });

    /* 旧形式（区間の並び）を、新形式（駅の並び）へ移す */
    function migrateConnections(e) {
      const cs = (Array.isArray(e && e.connections) ? e.connections : []).filter(c => c.from || c.to || c.line);
      if (!cs.length) return [];
      const blank = (name) => ({ name: name || '', arrPlatform: '', arrTime: '', depPlatform: '', depTime: '',
                            line: '', kind: '', dest: '', stations: '', through: false, quick: false });
      const out = [];
      cs.forEach((c) => {
        const last = out[out.length - 1];
        const board = (last && last.name === (c.from || '')) ? last : (out.push(blank(c.from)), out[out.length - 1]);
        board.depPlatform = c.platform || '';
        board.depTime = c.depTime || '';
        board.line = c.line || '';
        board.dest = c.dest || '';
        board.stations = c.stations || '';
        const arrive = blank(c.to);
        arrive.arrPlatform = c.arrPlatform || '';
        arrive.arrTime = c.arrTime || '';
        out.push(arrive);
      });
      return out;
    }

    /* ---------- データ正規化 ---------- */
    /* 文字であるはずの欄に数や null が入っていたら文字にそろえる（古い版・手で直したJSONの保険） */
    const asText = (o, keys) => keys.forEach(k => { if (typeof o[k] !== 'string') o[k] = (o[k] == null || typeof o[k] === 'object') ? '' : String(o[k]); });
    const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
    function normalizeData(data) {
      if (!isObj(data)) throw new Error('旅程のデータではありません');
      data.title ??= '新しい旅程';
      data.startDate ??= '';
      /* 同じ名前の場所がいくつもあるとき、この旅程ではどれを指すかを覚えておく
         { '大和': { x, y, sub: '神奈川県' } } */
      if (!data.pins || typeof data.pins !== 'object') data.pins = {};
      data.endDate ??= '';
      data.origin ??= '';
      /* 旅程が作りかけか、できあがっているか（一覧で見分けるため） */
      data.status = (data.status === 'done') ? 'done' : 'wip';
      data.destination ??= '';
      data.totalBudget = Number(data.totalBudget) || 0;
      data.members = Math.max(1, Math.min(99, Math.round(Number(data.members) || 1)));
      /* 「これは指摘しなくていい」と決めた点検の控え */
      data.ignored = Array.isArray(data.ignored) ? data.ignored.filter(k => typeof k === 'string') : [];
      asText(data, ['title', 'startDate', 'endDate', 'origin', 'destination']);
      if (!Array.isArray(data.days)) data.days = [];
      data.days = data.days.filter(isObj);
      if (data.days.length === 0) data.days.push({ date: '', dayNumber: 1, events: [] });
      data.days.forEach((d, i) => {
        asText(d, ['date']);
        d.dayNumber = i + 1;
        d.ignoreOverlap = !!d.ignoreOverlap;   // フェスの被りなど、重なりが正しい日もある
        d.events = Array.isArray(d.events) ? d.events.filter(isObj) : [];
        d.events.forEach((e) => {
          if (typeof e.id !== 'string' || !e.id) e.id = uid();
          e.type = CAT_KEYS.includes(e.type) ? e.type : (e.type === 'transport' ? 'train' : 'free_time');
          e.cost = Math.max(0, Number(e.cost) || 0);
          asText(e, ['startTime','endTime','title','location','notes','url','platform','direction','stations','flightNo','seat']);
          if (e.route != null && !Array.isArray(e.route)) e.route = [];
          if (Array.isArray(e.route)) e.route = e.route.filter(isObj);
          e.crossOk = !!e.crossOk;          // 日をまたぐ予定だと確かめ済みか
          e.paid = !!e.paid;                // 出発前に払い終えているか（きっぷ・宿・チケット）
          e.anchor = ['start','end'].includes(e.anchor) ? e.anchor : '';
          /* 経路は「駅の並び」。各駅は、着（ホーム・時刻）／発（ホーム・時刻）と、
             その駅から乗る列車（路線・行先・駅数）を持つ。乗換は1つの駅の中で完結する */
          if (!Array.isArray(e.route)) e.route = migrateConnections(e);
          /* 旧「番線・行先・駅数」は駅の並びへ移す（入口を2つ持たないため）。
             飛行機だけは便名・行先で表すので、そのまま残す */
          if (!e.route.length && e.type !== 'plane' && (e.platform || e.direction || e.stations)) {
            const names = String(e.location || '').split(/\s*(?:→|->|〜|~)\s*/).map(t => t.trim()).filter(Boolean);
            const board = { name: names[0] || '', arrPlatform: '', arrTime: '', depPlatform: e.platform || '',
                            depTime: '', line: '', dest: e.direction || '', stations: e.stations || '' };
            e.route = names.length >= 2
              ? [board, { name: names[names.length - 1] }]
              : [board];
            e.platform = ''; e.direction = ''; e.stations = '';
          }
          e.route.forEach((st, si) => {
            asText(st, ['name',
                        'arrPlatform', 'arrTime',        // この駅に着く
                        'depPlatform', 'depTime',        // この駅から出る
                        'line', 'dest', 'stations',      // ここから乗る列車
                        'kind']);                        // 種別・列車名（快速・特急しおかぜ・エアポート急行 …）
            st.quick = !!st.quick;           // 対面乗換（同じホームの向かい側。1〜2分でも間に合う）
            /* true＝降りない（同じ列車のまま路線が変わる）。
               最初と最後の駅では意味を持たないので落とす */
            st.through = !!st.through && si > 0 && si < e.route.length - 1;
            /* 「3」だけで書かれた番線・駅数は、読み込む時点で整える */
            const kk = e.type === 'bus' ? 'bus' : 'rail';
            st.arrPlatform = normPlatform(st.arrPlatform, kk);
            st.depPlatform = normPlatform(st.depPlatform, kk);
            st.stations = normStops(st.stations, kk);
          });
          delete e.connections;
        });
      });
      return data;
    }
    function _blankTrip(title = '新しい旅程') {
      return normalizeData({ title, startDate: '', endDate: '', totalBudget: 0, days: [{ date: '', dayNumber: 1, events: [] }] });
    }

    /* ---------- 壊れたデータからの復帰 ----------
       開いている旅程が読めないとき、以前は一覧ごと「新しい旅程」1件に置き換えていた（ほかの旅程が見えなくなる）。
       いまは読めない旅程だけを trip_broken_<id>_<日時> に退避して一覧から外し、残りはそのまま使う */
    const LS_BROKEN = 'trip_broken_';
    const brokenTrips = [];                 // 起動時に退避したもの（起動後に知らせる）
    function stashBroken(id, raw) {
      const key = LS_BROKEN + id + '_' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15);
      try { localStorage.setItem(key, raw); localStorage.removeItem(tripKey(id)); brokenTrips.push(key); }
      catch { brokenTrips.push(''); }     // 退避できなくても元の置き場は消さない
    }
    /* 1件読む。無ければ null、壊れていたら退避して false */
    function readTrip(id) {
      let raw = null;
      try { raw = localStorage.getItem(tripKey(id)); } catch { return null; }
      if (raw == null) return null;
      try { return { raw, data: normalizeData(JSON.parse(raw)) }; }
      catch { stashBroken(id, raw); return false; }
    }
    function tripSummary(id, data) {
      return { id, title: data.title || '旅程', startDate: data.startDate, endDate: data.endDate,
               origin: data.origin, destination: data.destination, status: data.status,
               dayCount: data.days.length, eventCount: data.days.reduce((n, d) => n + d.events.length, 0) };
    }
    /* 一覧が壊れていたら、置き場にある旅程データから作り直す */
    function rebuildIndex() {
      const ids = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('trip_data_')) ids.push(k.slice(10)); } } catch {}
      return ids.sort().map(id => { const r = readTrip(id); return r ? tripSummary(id, r.data) : null; }).filter(Boolean);
    }

    function loadInitial() {
      // 新形式（マルチ旅程）
      let idx = null;
      try { idx = JSON.parse(localStorage.getItem(LS_TRIPS_IDX) || 'null'); } catch { idx = undefined; }
      if (idx !== null && !Array.isArray(idx)) idx = rebuildIndex();          // 一覧が壊れている
      if (Array.isArray(idx)) idx = idx.filter(t => isObj(t) && typeof t.id === 'string' && t.id);
      if (Array.isArray(idx) && idx.length > 0) {
        let cid = '';
        try { cid = localStorage.getItem(LS_CURRENT_ID) || ''; } catch {}
        const order = [cid, ...idx.map(t => t.id).filter(id => id !== cid)].filter(Boolean);
        const dropped = new Set();         // 壊れていて退避したもの
        for (const id of order) {
          const r = readTrip(id);
          if (r === false) dropped.add(id);
          if (!r) continue;
          tripIndex.value = idx.filter(t => !dropped.has(t.id));
          currentTripId.value = id;
          /* 読み込んだ中身を控えておく。
             あとで「置き場のいまは自分が書いたままか」を見分けるのに使う */
          lastWritten = r.raw;
          saveTripIndex();
          return r.data;
        }
        idx = idx.filter(t => !dropped.has(t.id));
      }

      // 旧形式からマイグレーション
      try {
        const raw = localStorage.getItem(LS_OLD);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.days) && data.days.length > 0) {
            const id = newTripId();
            normalizeData(data);
            tripIndex.value = [{ id, title: data.title || '旅程', startDate: data.startDate || '', endDate: data.endDate || '' }];
            currentTripId.value = id;
            localStorage.setItem(tripKey(id), JSON.stringify(data));
            saveTripIndex();
            try { localStorage.removeItem(LS_OLD); } catch {}
            return data;
          }
        }
      } catch {}

      // 新規（空白旅程）。読めない旅程があっても、一覧に残っているものは消さない
      const id = newTripId();
      const blank = _blankTrip();
      tripIndex.value = [...(Array.isArray(idx) ? idx : []), { id, title: blank.title, startDate: '', endDate: '' }];
      currentTripId.value = id;
      try { localStorage.setItem(tripKey(id), JSON.stringify(blank)); } catch {}
      saveTripIndex();
      return blank;
    }
    const state = reactive(loadInitial());
    const activeDay = ref(0);
    const jsonText = ref('');
    const toast = reactive({ show: false, msg: '', icon: 'fa-check', action: null });
    const editing = ref(null);
    const editingDayIdx = ref(0);
    const showJsonModal = ref(false);
    const showSettings = ref(false);

    /* ---------- helpers ---------- */
    const cat = (t) => CATS[t] || CATS.free_time;

    /* 路線名から色を当てる。分からなければ空 */
    function lineColor(name) {
      let t = String(name || '').replace(/[\s　]/g, '');
      if (!t) return '';
      /* データ側の正式名（京浜急行本線など）も、ふだんの呼び方に寄せてから照合する */
      LINE_ALIASES.forEach(([re, to]) => { t = t.replace(re, to); });
      for (const [k, c] of LINE_COLORS) if (t.includes(k)) return c;
      return '';
    }
    /* その色の上に置く文字色（明るい路線色は黒文字） */
    function onColor(hex) {
      const h = String(hex || '').replace('#', '');
      if (h.length < 6) return '#ffffff';
      const c = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
      /* 明るさのしきい値（旧：165）だと、水色・橙の路線色に白い文字が乗って読みにくかった（2.4） */
      return _ratio(c, [255, 255, 255]) >= _ratio(c, [31, 36, 51]) ? '#ffffff' : '#1f2433';
    }
    /* その駅から乗る列車の色（路線色がなければカテゴリ色） */
    const segColor = (ev, st) => lineColor(st && st.line) || cat(ev && ev.type).color;
    /* 中身のある駅だけ */
    const routeStops = (ev) => ((ev && ev.route) || []).filter(st => st.name || st.line || st.arrTime || st.depTime);
    /* その駅での乗換猶予（同じ駅の 着 → 発） */
    function transferMins(stops, i) {
      const st = stops && stops[i];
      if (!st) return null;
      const arr = toMin(st.arrTime), dep = toMin(st.depTime);
      if (arr === null || dep === null) return null;
      let d = dep - arr;
      if (d < 0) d += 1440;
      return d;
    }
    /* 乗換が短すぎないか（5分未満は赤で注意） */
    /* 対面乗換（同じホームの向かい側／同じホームの前後）は、1〜2分でも間に合う。
       そう決めてある駅では、短くても「短すぎる」と言わない */
    const quickStop = (stops, i) => !!(stops[i] && stops[i].quick);
    const tightTransfer = (stops, i) => {
      const m = transferMins(stops, i);
      if (m === null) return false;
      return quickStop(stops, i) ? m < 1 : m < 5;
    };
    /* その駅は乗換駅か（着も発もある＝途中の駅） */
    /* 途中の駅は「乗り換える駅」か「直通で通る駅」のどちらか。
       直通＝降りないので、猶予の心配も、乗換の強調も要らない */
    const isMidStop = (stops, i) => i > 0 && i < stops.length - 1;
    const isThroughStop = (stops, i) => isMidStop(stops, i) && !!(stops[i] && stops[i].through);
    const isTransferStop = (stops, i) => isMidStop(stops, i) && !(stops[i] && stops[i].through);
    /* 途中の駅だけでなく、1駅だけの経路でも「発ホーム・乗る列車」を書けるようにする */
    const hasDepInfo = (stops, i) => i < stops.length - 1 || !!(stops[i] && (stops[i].depTime || stops[i].depPlatform));
    const hasBoardInfo = (stops, i) => i < stops.length - 1 || !!(stops[i] && (stops[i].line || stops[i].dest || stops[i].stations));
    /* ---- 直通の区間をひとまとめにする ----
       A →（Bで路線が変わる・降りない）→ C は、1本の列車で行く。
       それを「B行」「C行」と分けて書くと、乗り換えるように読めてしまう。
       Bが直通なら、A から始まる区間に B以降をつなげて、ひとつの帯として出す */
    function segChain(stops, i) {
      const out = [stops[i]];
      /* 最初の駅の「直通」は前につながる先が無いので、ここでは見ない */
      for (let k = i + 1; k < stops.length; k++) {
        if (!stops[k] || !stops[k].through) break;
        out.push(stops[k]);
      }
      return out;
    }
    /* その区間の帯を出すか（直通で前につながる駅からは出さない） */
    const showSeg = (stops, i) => hasBoardInfo(stops, i) && !(i > 0 && stops[i] && stops[i].through);
    /* まとめた区間の路線たち（言い方違いは1つに寄せる） */
    function segLines(stops, i) {
      const out = [];
      segChain(stops, i).forEach(st => {
        if (!st.line) return;
        if (out.some(l => lineKey(l) === lineKey(st.line))) return;
        out.push(st.line);
      });
      return out;
    }
    /* まとめた区間の行先。直通列車が掲げるのは、いちばん先の行先 */
    function segDest(stops, i) {
      const ch = segChain(stops, i);
      for (let k = ch.length - 1; k >= 0; k--) if (ch[k].dest) return ch[k].dest;
      return '';
    }
    /* 種別は直通の境目で変わることがある（京急線内は快特、都営線内は各駅…）。
       違うものが出てきたら、そのぶんだけ並べる */
    function segKinds(stops, i) {
      const out = [];
      segChain(stops, i).forEach(st => { if (st.kind && !out.includes(st.kind)) out.push(st.kind); });
      return out;
    }
    /* まとめた区間の駅数。数字だけのものは足し合わせる */
    function segStations(stops, i) {
      const ch = segChain(stops, i);
      const vals = ch.map(st => st.stations).filter(Boolean);
      if (!vals.length) return '';
      if (vals.length === 1) return vals[0];
      const nums = vals.map(v => (String(v).match(/\d+/) || [])[0]).map(Number);
      if (nums.every(n => !isNaN(n))) {
        const unit = String(vals[0]).replace(/[0-9０-９]/g, '') || '駅';
        return nums.reduce((a, b) => a + b, 0) + unit;
      }
      return vals.join('＋');
    }
    /* 区間の時刻から、予定全体の発着を埋める補助 */
    function fillTimesFromRoute() {
      const e = editing.value;
      const stops = e && routeStops(e);
      if (!stops || !stops.length) { flash('駅の時刻が入っていません', 'fa-triangle-exclamation'); return; }
      const dep = stops.find(st => st.depTime), arr = [...stops].reverse().find(st => st.arrTime);
      if (!dep && !arr) { flash('駅に発着時刻を入れてください', 'fa-triangle-exclamation'); return; }
      if (dep) e.startTime = dep.depTime;
      if (arr) e.endTime = arr.arrTime;
      flash('駅の時刻から、この予定の発着を入れました', 'fa-clock');
    }

    /* 出発地点 / 到着地点（家・ホテルなど）の表示設定 */
    const ANCHORS = {
      start: { label: '出発地点', icon: 'fa-house-chimney',  color: '#0ea5e9', timeLabel: '出発', timeField: '出発時刻', endField: '終了時刻（任意）' },
      end:   { label: '到着地点', icon: 'fa-flag-checkered', color: '#e11d48', timeLabel: '到着', timeField: '到着時刻', endField: 'ここを出る時刻（滞在の終わり）' },
    };
    const anchorCfg = (a) => ANCHORS[a] || null;

    const yen = (n) => '¥' + (Number(n) || 0).toLocaleString('ja-JP');

    function weekday(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return '';
      return ['日','月','火','水','木','金','土'][d.getDay()];
    }
    function shortDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return dateStr || '';
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function duration(s, e) {
      if (!s || !e) return '';
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      if ([sh, sm, eh, em].some(isNaN)) return '';
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins < 0) mins += 24 * 60;
      if (mins === 0) return '';
      const h = Math.floor(mins / 60), m = mins % 60;
      return (h ? h + '時間' : '') + (m ? m + '分' : '');
    }

    /* 「A → B」形式なら地点検索ではなく経路案内を開く */
    const splitRoute = (loc) =>
      String(loc || '').split(/\s*(?:→|->|〜|~)\s*/).map(x => x.trim()).filter(Boolean);
    const isRouteText = (loc) => splitRoute(loc).length >= 2;
    const mapUrl = (loc) => {
      if (!loc) return '';
      const p = splitRoute(loc);
      if (p.length >= 2) {
        return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(p[0]) +
               '&destination=' + encodeURIComponent(p[p.length - 1]);
      }
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc);
    };
    /* 乗換チェーンと同じ内容の場所表記は重ねて出さない */
    /* 場所欄が、題名や経路の言い直しになっていないか。
       「羽田空港 → 桜木町」という題名の下に同じ文字が並ぶと、紙の上では邪魔なだけ */
    function redundantLocation(ev) {
      if (!ev || !ev.location) return false;
      const norm = (x) => String(x || '').replace(/[\s　]/g, '').replace(/->|[→⇒>＞]+/g, '→');
      const loc = norm(ev.location);
      if (!loc) return false;
      if (loc === norm(ev.title)) return true;             // 題名とそっくり同じ
      const stops = routeStops(ev).filter(st => st.name);
      if (stops.length >= 2 && loc === norm(stops[0].name) + '→' + norm(stops[stops.length - 1].name)) return true;
      return false;
    }

    /* ---------- budgets ---------- */
    const totalActual = computed(() =>
      state.days.reduce((sum, d) => sum + d.events.reduce((s, e) => s + (Number(e.cost) || 0), 0), 0)
    );
    /* 出発前に払い終えているぶん。当日いくら持って出るかを知るために分けて数える */
    const totalPaid = computed(() =>
      state.days.reduce((sum, d) => sum + d.events.reduce((s, e) => s + (e.paid ? (Number(e.cost) || 0) : 0), 0), 0)
    );
    const totalUnpaid = computed(() => totalActual.value - totalPaid.value);
    const dayTotal = (d) => d.events.reduce((s, e) => s + (Number(e.cost) || 0), 0);
    const dayUnpaid = (d) => d.events.reduce((s, e) => s + (e.paid ? 0 : (Number(e.cost) || 0)), 0);
    const eventCount = computed(() => state.days.reduce((s, d) => s + d.events.length, 0));
    const budgetPct = computed(() => {
      const b = Number(state.totalBudget) || 0;
      if (!b) return 0;
      return Math.min(100, Math.round((totalActual.value / b) * 100));
    });
    const hasBudget = computed(() => (Number(state.totalBudget) || 0) > 0);
    const members = computed(() => Math.max(1, Number(state.members) || 1));
    const perPerson = computed(() => Math.round(totalActual.value / members.value));
    const overBudget = computed(() => hasBudget.value && totalActual.value > state.totalBudget);

    /* ---------- 履歴（元に戻す / やり直す） ---------- */
    const history = ref([]);
    const redoStack = ref([]);
    const HISTORY_MAX = 50;
    /* 変更を加える「直前」に呼ぶ。state のスナップショットを積む */
    function snapshot(label = '編集') {
      try {
        history.value.push({ label, data: JSON.stringify(state) });
        if (history.value.length > HISTORY_MAX) history.value.shift();
        redoStack.value = [];
      } catch {}
    }
    function restoreSnapshot(json) {
      const data = normalizeData(JSON.parse(json));
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, data);
      if (activeDay.value >= state.days.length) activeDay.value = Math.max(0, state.days.length - 1);
    }
    function undo() {
      const h = history.value.pop();
      if (!h) { flash('元に戻せる操作はありません', 'fa-circle-info'); return; }
      redoStack.value.push({ label: h.label, data: JSON.stringify(state) });
      restoreSnapshot(h.data);
      flash('元に戻しました：' + h.label, 'fa-rotate-left');
    }
    function redo() {
      const h = redoStack.value.pop();
      if (!h) { flash('やり直せる操作はありません', 'fa-circle-info'); return; }
      history.value.push({ label: h.label, data: JSON.stringify(state) });
      restoreSnapshot(h.data);
      flash('やり直しました：' + h.label, 'fa-rotate-right');
    }
    const canUndo = computed(() => history.value.length > 0);
    const canRedo = computed(() => redoStack.value.length > 0);

    /* ---------- 時間の解析 ---------- */
    const MOVE_TYPES = ['train', 'bus', 'plane', 'ship', 'car', 'taxi', 'walk'];

    /* 地点名から、ふさわしいカテゴリを当てる。
       「到着地点＝いつも宿泊」のような、実態に合わない既定を無くすため */
    const PLACE_GUESS = [
      [/(ホテル|旅館|宿|ゲストハウス|民宿|ロッジ|旅籠|イン$|hotel|inn|hostel)/i, 'accommodation'],
      [/(空港|港$|フェリーターミナル|airport|ターミナル|バスタ|駅$|駅前$|停留所|のりば|口$)/i, 'waypoint'],
      [/(自宅|我が家|家$|マンション|アパート|実家)/, 'waypoint'],
      [/(会館|アリーナ|ドーム|ホール|スタジアム|劇場|シアター|ライブハウス|美術館|博物館|城$|神社|寺$|公園|水族館|動物園)/, 'activity'],
      [/(食堂|レストラン|市場|屋台|カフェ|居酒屋|ラーメン|寿司)/, 'meal'],
      [/(店$|ショップ|モール|百貨店|物販|土産)/, 'shop'],
    ];
    function guessPlaceType(name, fallback) {
      const t = String(name || '').trim();
      if (!t) return fallback;
      for (const [re, key] of PLACE_GUESS) if (re.test(t)) return key;
      return fallback;
    }
    /* 終了が開始より前＝日をまたぐ */
    const crossesDay = (e) => {
      const s = toMin(e && e.startTime), en = toMin(e && e.endTime);
      return s !== null && en !== null && en < s;
    };
    /* 翌日の時刻には「翌」を付ける */
    const nextMark = (e) => crossesDay(e) ? '翌 ' : '';
    /* 予定の占有時間 [開始分, 終了分]。終了 < 開始 は日跨ぎとみなす */
    function evRange(e) {
      const s = toMin(e.startTime);
      if (s === null) return null;
      let en = toMin(e.endTime);
      if (en === null) en = s;
      if (en < s) en += 1440;
      return [s, en];
    }
    function dayStats(day) {
      let first = null, last = null, moveMins = 0;
      let moveCost = 0, mealCost = 0, stayCost = 0, paidCost = 0;
      day.events.forEach(e => {
        const r = evRange(e);
        const move = isTransfer(e);
        if (r) {
          first = (first === null) ? r[0] : Math.min(first, r[0]);
          last = (last === null) ? r[1] : Math.max(last, r[1]);
          if (move) moveMins += (r[1] - r[0]);
        }
        const c = Number(e.cost) || 0;
        if (e.paid) paidCost += c;
        if (move) moveCost += c;
        else if (e.type === 'meal') mealCost += c;
        else if (e.type === 'accommodation') stayCost += c;
      });
      /* 寝ていた時間（就寝のあと・起床の前）。
         夜行の予定や深夜到着があると、最初から最後までを「行動」と呼ぶには長すぎるので、
         そのぶんを差し引いて「起きて動いていた時間」を出す */
      let sleepMins = 0;
      day.events.forEach((e, i) => {
        if (!sleepBetween(day, i)) return;
        const g = gapAfter(day, i);
        if (g && g > 0) sleepMins += g;
      });
      const cost = dayTotal(day);
      const span = (first !== null && last !== null && last > first) ? last - first : null;
      return {
        count: day.events.length,
        cost,
        first, last,
        crossesMidnight: last !== null && last > 24 * 60,
        span,
        sleepMins,
        /* 画面に出す「行動」はこちら（就寝ぶんを引いたもの） */
        activeMins: span === null ? null : Math.max(0, span - sleepMins),
        moveMins,
        moveCost, mealCost, stayCost, paidCost, unpaidCost: cost - paidCost,
        /* 残りをその他にすることで、内訳の合計は必ず日計と一致する */
        otherCost: cost - moveCost - mealCost - stayCost,
      };
    }
    /* 1日ぶんの警告（時間の重なり・時刻未入力など） */
    /* ================= オンライン照会 =================
       ・鉄道：HeartRails Express API（無料・登録不要）
           駅名 → その駅を通る路線／路線 → 駅の並び／駅の緯度経度
       ・地名：OpenStreetMap Nominatim（無料・登録不要／1秒に1回まで）
       ・徳島県のバス停：国土数値情報「バス停留所データ」（国土交通省）をアプリに同梱。通信不要
           会場・ホテル・空港などの表記ゆれを拾う
       答えは端末に貯めるので、同じ問い合わせは2回目から即答。
       つながらないときは、これまでの入力履歴だけで静かに動く（機能は止めない）
       ------------------------------------------------ */
    const LS_NET = 'net_cache_v1';
    const NET_TTL = 60 * 24 * 3600 * 1000;      // 60日
    const NET_MAX = 600;                        // 貯めておく件数
    /* 置き場の上限は5MBほど。時刻表は1件でも大きいので、
       旅程そのものを押し出さないよう、控えは1MBまでに抑える */
    const NET_MAX_BYTES = 1024 * 1024;
    const RAIL_API = 'https://express.heartrails.com/api/json';
    const GEO_API = 'https://nominatim.openstreetmap.org/search';
    const LS_NET_ON = 'net_enabled_v1';
    const netState = reactive({
      busy: 0, online: true, tried: 0, failed: 0, lastError: '',
      /* 切っておくこともできる（社内ネットワークや、通信を使いたくないとき） */
      warming: false,          // 経路ぶんの照会がひととおり終わるまで true
      enabled: (() => { try { return localStorage.getItem(LS_NET_ON) !== '0'; } catch { return true; } })(),
    });
    watch(() => netState.enabled, (v) => {
      try { localStorage.setItem(LS_NET_ON, v ? '1' : '0'); } catch {}
      if (v) refreshRailData();
    });
    const netCache = (() => { try { return JSON.parse(localStorage.getItem(LS_NET) || '{}'); } catch { return {}; } })();
    let netSaveTimer = 0;
    function netSave() {
      clearTimeout(netSaveTimer);
      netSaveTimer = setTimeout(() => {
        try {
          let keys = Object.keys(netCache);
          if (keys.length > NET_MAX) {
            keys.sort((a, b) => (netCache[a].t || 0) - (netCache[b].t || 0))
                .slice(0, keys.length - NET_MAX).forEach(k => { delete netCache[k]; });
          }
          /* 大きさでも抑える。古いものから落として、上限に収まるまで繰り返す */
          let body = JSON.stringify(netCache);
          if (body.length > NET_MAX_BYTES) {
            keys = Object.keys(netCache).sort((a, b) => (netCache[a].t || 0) - (netCache[b].t || 0));
            while (body.length > NET_MAX_BYTES && keys.length) {
              delete netCache[keys.shift()];
              body = JSON.stringify(netCache);
            }
          }
          localStorage.setItem(LS_NET, body);
        } catch {}
      }, 800);
    }
    const netFresh = (k) => netCache[k] && (Date.now() - netCache[k].t) < NET_TTL;
    const inflight = new Map();
    async function netGet(key, url, pick, waitMs) {
      if (netFresh(key)) return netCache[key].v;
      if (!netState.enabled) return netCache[key] ? netCache[key].v : null;   // 切ってあるときは貯めたぶんだけ
      if (inflight.has(key)) return inflight.get(key);
      const run = (async () => {
        netState.busy++; netState.tried++;
        try {
          const ctrl = new AbortController();
          /* 無料の地図・経路サービスは混むことがあるので、少し長めに待つ。
             ただし待たせすぎると入力が止まるので、呼ぶ側で短くもできる */
          const timer = setTimeout(() => ctrl.abort(), waitMs || 14000);
          const res = await fetch(url, { signal: ctrl.signal, headers: { 'Accept': 'application/json' } });
          clearTimeout(timer);
          if (!res.ok) { const err = new Error('HTTP ' + res.status); err.httpStatus = res.status; throw err; }
          const v = pick(await res.json());
          netCache[key] = { t: Date.now(), v };
          netSave();
          netState.online = true;
          return v;
        } catch (e) {
          netState.failed++; netState.lastError = String((e && e.message) || e);
          if (netState.failed >= 2 && netState.failed >= netState.tried * 0.5) netState.online = false;
          if (netCache[key]) return netCache[key].v;           // 古くても、あるものは使う
          /* 「無理な問い合わせ」と断られたときだけ覚えておく。
             混雑・切断で失敗しただけなら、次にまた試す */
          const st = e && e.httpStatus;
          if (st && st >= 400 && st < 500 && st !== 429) {
            netCache[key] = { t: Date.now() - (NET_TTL - 12 * 3600 * 1000), v: null };
            netSave();
          }
          return null;
        } finally { netState.busy--; inflight.delete(key); }
      })();
      inflight.set(key, run);
      return run;
    }

    const netCount = computed(() => { netState.tried; return Object.keys(netCache).length; });
    function clearNetCache() {
      Object.keys(netCache).forEach(k => { delete netCache[k]; });
      Object.keys(railIdx.station).forEach(k => { delete railIdx.station[k]; });
      Object.keys(railIdx.line).forEach(k => { delete railIdx.line[k]; });
      Object.keys(railIdx.geo).forEach(k => { delete railIdx.geo[k]; });
      Object.keys(railIdx.place).forEach(k => { delete railIdx.place[k]; });
      try { localStorage.removeItem(LS_NET); } catch {}
      netState.tried = 0; netState.failed = 0; netState.lastError = '';
      flash('保存していた駅・地点のデータを消しました', 'fa-broom');
      refreshRailData();
    }

    /* ---- 路線名の名寄せ ----
       「京浜東北線」と「JR京浜東北線」、「京急本線」と「京浜急行本線」を同じとみなす。
       ふだん使う略称と、データ側の正式名を、どちらも同じ短い形に寄せる */
    const LINE_ALIASES = [
      [/京浜急行/g, '京急'], [/東京急行/g, '東急'], [/相模鉄道/g, '相鉄'],
      [/名古屋鉄道/g, '名鉄'], [/近畿日本/g, '近鉄'], [/京阪電気/g, '京阪'],
      [/阪神電気/g, '阪神'], [/南海電気/g, '南海'], [/西日本鉄道/g, '西鉄'],
      [/東京都交通局/g, '都営'], [/東京地下鉄|営団/g, '東京メトロ'],
      [/大阪市高速電気軌道|大阪市営|osaka ?metro/gi, '大阪メトロ'],
      [/東京臨海高速/g, ''], [/首都圏新都市/g, ''], [/横浜高速/g, '横浜'],
      [/北大阪急行/g, '北急'], [/新京成/g, '新京成'],
      [/市営/g, '市'],                     // 横浜市営地下鉄 ＝ 横浜市ブルーライン
    ];
    function lineKey(v) {
      let t = String(v || '')
        .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/\s/g, '')
        .replace(/^(JR|ＪＲ)(東日本|西日本|東海|九州|北海道|四国)?/i, '');
      LINE_ALIASES.forEach(([re, to]) => { t = t.replace(re, to); });
      return t
        .replace(/(株式会社|電鉄|鉄道|電車|地下鉄|線|ライン)/g, '')
        .toLowerCase();
    }
    /* ユーザーが書いた路線名に、いちばん近いAPIの路線名を返す */
    function matchLine(input, candidates) {
      const list = (candidates || []).filter(Boolean);
      if (!input || !list.length) return '';
      const parts = String(input).split(/[・,、\/]/).map(t => lineKey(t)).filter(Boolean);
      if (!parts.length) return '';
      for (const c of list) {
        const ck = lineKey(c);
        if (parts.some(p => p && ck && (p === ck || ck.includes(p) || p.includes(ck)))) return c;
      }
      return '';
    }

    /* ---- 引いてきたデータの置き場（画面はここを見るだけ） ---- */
    const railIdx = reactive({ station: {}, line: {}, geo: {}, place: {}, weak: {} });
    const stationInfo = (name) => railIdx.station[placeKey(name)] || null;

    async function loadStation(name) {
      const t = String(name || '').trim();
      if (t.length < 2) return null;
      const k = placeKey(t);
      if (railIdx.station[k]) return railIdx.station[k];
      const ask = (q) => netGet('st:' + q, RAIL_API + '?method=getStations&name=' + encodeURIComponent(q),
        (j) => (j && j.response && Array.isArray(j.response.station)) ? j.response.station : []);
      let rows = (await ask(t)) || [];
      /* 「東京駅」のように「駅」を付けて書く人が多いので、外して引き直す */
      if (!rows.length && /[駅station]$/i.test(t)) rows = (await ask(t.replace(/駅$/, ''))) || [];
      const info = {
        found: rows.length > 0,
        lines: [...new Set(rows.map(r => r.line))],
        /* 同じ駅名が全国にあるので、路線ごとの位置も持っておく */
        rows: rows.map(r => ({ line: r.line, prefecture: r.prefecture, x: Number(r.x), y: Number(r.y) })),
        pos: rows.length ? { x: Number(rows[0].x), y: Number(rows[0].y) } : null,
        prefectures: [...new Set(rows.map(r => r.prefecture))],
        name: rows.length ? rows[0].name : t,
      };
      railIdx.station[k] = info;
      return info;
    }
    async function loadLine(apiLine) {
      const t = String(apiLine || '').trim();
      if (!t) return null;
      if (railIdx.line[t]) return railIdx.line[t];
      const v = await netGet('ln:' + t, RAIL_API + '?method=getStations&line=' + encodeURIComponent(t),
        (j) => (j && j.response && Array.isArray(j.response.station)) ? j.response.station.map(r => r.name) : []);
      railIdx.line[t] = v || [];
      return railIdx.line[t];
    }
    /* 地点の座標（駅ならHeartRails、それ以外は地名検索から） */
    /* 「自宅」「ホテル」のような一般名詞は、地図で引いても意味がないので引かない */
    const VAGUE_PLACES = ['自宅', '家', '実家', 'うち', 'ホテル', '宿', '旅館', '民宿', '会場', '現地',
                          '駅', '空港', '港', '未定', 'どこか', '車内', '機内', '船内'];
    async function loadPlace(name, hint) {
      const t = String(name || '').trim();
      if (t.length < 2) return null;
      const k = placeKey(t);
      /* 手がかりつきで探し直すときは、いちど引いていてもやり直す
         （最初は全国から拾ってしまい、遠い同名地点になっていることがある） */
      if (!hint && (k in railIdx.place)) return railIdx.place[k];
      if (!(k in railIdx.place)) railIdx.place[k] = null;   // 二重に引かない
      if (VAGUE_PLACES.includes(t) || VAGUE_PLACES.includes(k)) return null;
      const st = await loadStation(t);
      if (st && st.found && st.pos) { railIdx.place[k] = st.pos; return st.pos; }
      /* 「◯◯ 物販列」のような書き足しは外して引き直す */
      const tries = [t];
      /* ふだんの呼び名で書かれていたら、正式名でも引く（徳島空港＝徳島阿波おどり空港） */
      const formal = PLACE_ALIASES[t.replace(/\s|　/g, '')];
      if (formal && formal !== t) tries.unshift(formal);
      const cut = t.replace(/(物販列|待機列|物販|列|会場|前|周辺|付近|口|内|ロビー|受付|ブース|広場)$/, '').trim();
      if (cut && cut !== t && cut.length >= 2 && !tries.includes(cut)) tries.push(cut);
      /* 「鳥貴族 横浜南幸店」のようなお店は、店名では地図に載っていないことが多い。
         支店についている土地の名前（横浜南幸）で引けば、少なくとも同じ町に落ちる */
      const branch = (t.match(/([^\s\u3000]{2,})店$/) || [])[1] || '';
      if (branch && branch !== t && branch.length >= 2 && !tries.includes(branch)) tries.push(branch);
      /* チェーン名だけの引き当ては、まったく別の土地の店に当たる。
         いちばん最後に試し、当たっても「あてにならない位置」として印をつける */
      const head = t.split(/[\s\u3000]+/)[0];
      const weakTries = [];
      if (head && head !== t && head.length >= 2 && !tries.includes(head)) { tries.push(head); weakTries.push(head); }
      for (const q of tries) {
        if (VAGUE_PLACES.includes(q)) continue;
        const hits = await loadGeo(q, hint);
        const named = (hits || []).filter(h => sameNamed(h.name, q));
        if (!named.length) continue;
        /* 手がかりがあるなら、いちばん近いものを採る */
        let hit = named[0];
        if (hint) {
          let bd = Infinity;
          named.forEach(h => { const d = distKm(hint, h); if (d !== null && d < bd) { bd = d; hit = h; } });
        }
        railIdx.place[k] = { x: hit.x, y: hit.y };
        railIdx.weak[k] = weakTries.includes(q) && !hint;
        return railIdx.place[k];
      }
      return null;
    }
    /* 書いた名前と、地図側の名前が同じものを指しているか。
       「徳島空港」と「徳島阿波おどり空港」のような呼び名違いもここで吸収する */
    function sameNamed(a, b) {
      const norm = (v) => {
        let t = String(v || '').replace(/\s|　/g, '');
        t = PLACE_ALIASES[t] || t;
        return placeKey(t);
      };
      const x = norm(a), y = norm(b);
      if (!x || !y) return false;
      if (x === y) return true;
      if (x.length < 2 || y.length < 2) return false;
      if (!(x.includes(y) || y.includes(x))) return false;
      /* 片方がもう片方を含んでいても、長さが違いすぎるなら別のもの。
         「医学部前」と「香川大学医学部附属病院」を同じ場所にしないため */
      const shortLen = Math.min(x.length, y.length), longLen = Math.max(x.length, y.length);
      return shortLen / longLen >= 0.5;
    }

    /* 名前 → その停留所（同じ名前が県内に複数あることもある） */
    let tbIdx = null;

    /* 打ちかけの名前から、徳島のバス停をさがす（「医学部」→「医学部前」） */

    const BUS_OPERATORS = { 'Toei': '都営バス', 'TokyoMetro': '東京メトロ' };
    /* 500m 以内の候補は同じ場所とみなして、ひとつに減らす。

       そのまま並べると選びにくい */
    function dedupePos(list) {
      const out = [];
      (list || []).forEach(c => {
        const near = out.find(o => { const d = distKm(o, c); return d !== null && d < 0.5; });
        if (near) { if (!near.sub && c.sub) near.sub = c.sub; return; }

    function posCandidates(name) {
      const t = String(name || '').trim();

      const rows = (info && info.found && Array.isArray(info.rows))

      /* 「新町」のように、駅にもバス停にも同じ名前があることがある。
         どちらか一方で打ち切らず、両方を候補に並べる */
      const stationCands = rows.map(r => ({ x: num(r.x), y: num(r.y), sub: r.prefecture || r.line || '', solid: true }));

      /* バス停は時刻表データ側にも位置がある */
      const poles = (ttIdx.name['bus:' + t] || [])
        .filter(x => isFinite(num(x.lon)) && isFinite(num(x.lat)))
        .map(x => {
          const op = idTail(x.operator || '');
          return { x: num(x.lon), y: num(x.lat), sub: BUS_OPERATORS[op] || (op ? op + 'バス' : 'バス停'), solid: true };
        });
      const formal = PLACE_ALIASES[t.replace(/\s|　/g, '')];
      const geo = (railIdx.geo['geo:' + t] || []).concat(formal ? (railIdx.geo['geo:' + formal] || []) : []);
      const hits = geo.filter(h => isFinite(num(h.x)) && isFinite(num(h.y)) && sameNamed(h.name, t));

      const solid = dedupePos(stationCands.concat(tb, poles));

      return p ? [{ x: p.x, y: p.y, sub: '' }] : [];
    }
    /* この旅程で「どれか」を決めてあるか */
    const pinnedPos = (name) => {
      const p = state.pins && state.pins[placeKey(name)];
      return (p && isFinite(p.x) && isFinite(p.y)) ? { x: p.x, y: p.y } : null;
    };
    function pinPlace(name, cand) {
      const k = placeKey(name);
      if (!k || !cand) return;
      if (!state.pins) state.pins = {};
      snapshot('場所を決める');
      state.pins[k] = { x: cand.x, y: cand.y, sub: cand.sub || '' };
      flash(`「${name}」は ${cand.sub || 'この場所'} として扱います`, 'fa-map-pin', { label: '元に戻す', fn: undo });
    }
    function unpinPlace(name) {
      const k = placeKey(name);
      if (state.pins && k in state.pins) { snapshot('場所の指定を外す'); delete state.pins[k]; }
    }
    /* 目印（hint）にいちばん近い候補を返す */
    function posNear(name, hint) {
      const pin = pinnedPos(name);
      if (pin) return pin;
      const cands = posCandidates(name);
      if (!cands.length) return null;
      if (!hint || cands.length === 1) return { x: cands[0].x, y: cands[0].y };
      let best = cands[0], bd = Infinity;
      cands.forEach(c => {

    const spreadOut = (list) => (list || []).length >= 2
      && list.some(x => { const d = distKm(list[0], x); return d !== null && d > 20; });
    /* 同じ名前が何か所にもあるか（案内の言い回しに使う） */
    const ambiguousPlace = (name) => spreadOut(posCandidates(name));
    /* その名前の位置を、どれくらい信じてよいか。
         ・この旅程で決めてある（指定ずみ）
         ・駅データに載っている
         ・時刻表のバス停として載っている
       のいずれかなら信じてよい。
       地図で引いただけで、しかも候補が各地に散らばっているときは決め手が無いので、
       距離をもとにした指摘（「短すぎる」「約◯km」）には使わない。

    function posConfident(name) {

      if (railIdx.weak[placeKey(t)] && geoOnly(t)) return false;
      const c = posCandidates(t);
      if (!c.length) return false;
      /* 出どころのはっきりした候補（駅データ・バス停データ）がひとつだけなら、それを信じる。

      const solid = c.filter(x => x.solid);
      if (solid.length === 1) return true;
      /* はっきりした候補が各地に散らばっているなら（「新町」は駅にも停留所にもある）、

      if (solid.length > 1) return !spreadOut(solid);

    }
    /* 位置の出どころが「地図で名前を引いただけ」か。
       駅データ・時刻表のバス停・この旅程で決めた場所は、その土地のものだと分かっているが、
       地図の名前引きは、よその土地の同名を拾っていることがある */
    function geoOnly(name) {
      const t = String(name || '').trim();
      if (!t) return true;
      if (pinnedPos(t)) return false;
      const info = stationInfo(t);
      if (info && info.found) return false;

    }
    /* いま実際に使っている位置（決めてあればそれ、無ければ候補の先頭） */
    const posInUse = (name) => pinnedPos(name) || posNear(name, null);
    const samePos = (a, b) => !!(a && b) && Math.abs(a.x - b.x) < 0.001 && Math.abs(a.y - b.y) < 0.001;
    /* 編集中の経路で、いちばん近い「場所がはっきりしている地点」。
       地図に載っていない停留所（徳島の「医学部前」など）を、
       せめて「◯◯の近く」として置けるようにするため */
    function nearAnchor(si) {
      const stops = (editing.value && editing.value.route) || [];
      const st = stops[si];
      if (!st || !st.name) return null;
      for (let d = 1; d < stops.length; d++) {
        for (const j of [si - d, si + d]) {
          const o = stops[j];
          if (!o || !o.name || o.name === st.name) continue;
          if (!posConfident(o.name)) continue;

    }
    function pinNear(si) {

    function pairPos(a, b) {

      return distKm(pa, pb);
    }
    /* 経路ぜんぶの位置を、となり合う駅を手がかりに決める（前から一度、後ろから一度） */
    function routePositions(stops, seed) {

    function geoBox(hint, deg = 0.45) {

    async function loadGeo(q, hint) {
      const t = String(q || '').trim();
      if (t.length < 2) return [];
      const k = 'geo:' + t;

      const ck = box ? (k + '@' + box) : k;
      if (!box && railIdx.geo[k]) return railIdx.geo[k];

      const wait = Math.max(0, 1100 - (Date.now() - geoAt));

    function geoWhere(displayName) {

    function mergeGeo(k, rows) {
      const cur = railIdx.geo[k] || [];
      const out = cur.slice();
      (rows || []).forEach(r => {
        if (out.some(x => Math.abs(x.x - r.x) < 0.0005 && Math.abs(x.y - r.y) < 0.0005)) return;

    /* 同じ駅名でも土地が違えば別の駅。基準の位置があればその近くだけ、
       無ければ「路線がいちばん多く集まっている場所」を採る */
    function linesNear(info, refPos, km = 40) {
      if (!info || !info.rows || !info.rows.length) return (info && info.lines) || [];
      if (refPos) {
        const near = info.rows.filter(r => {
          const d = distKm(refPos, { x: r.x, y: r.y });
          return d === null || d <= km;

        if (near.length) return [...new Set(near.map(r => r.line))];
      }
      const groups = {};
      info.rows.forEach(r => {

    const odptLineIdx = reactive({});          // 駅名 → 路線名の配列
    function linesAt(name, hint) {
      const t = String(name || '').trim();
      if (!t) return [];
      const out = [];
      const add = (l) => { if (l && !out.some(x => lineKey(x) === lineKey(l))) out.push(l); };
      const info = stationInfo(t);
      if (info && info.found && info.rows && info.rows.length) {

        const near = pos ? info.rows.filter(r => {
