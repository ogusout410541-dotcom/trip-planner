      <!-- ---------- 旅程がひとつも無いとき（Cookie を消した直後など）---------- -->
      <div v-if="showRestoreHint" class="no-print mb-3 rounded-2xl border-2 px-3.5 py-3 flex items-start gap-2.5 flex-wrap"
           :class="isDark ? 'border-indigo-500/40 bg-indigo-950/30' : 'border-indigo-200 bg-indigo-50'" data-restore>
        <i class="fa-solid fa-cloud-arrow-down mt-0.5" :class="isDark ? 'text-indigo-300' : 'text-indigo-600'"></i>
        <div class="flex-1 min-w-[14rem]">
          <div class="text-sm font-black text-ink">前に作った旅程を戻せます</div>
          <div class="text-xs text-slate-600 mt-0.5 leading-relaxed">クラウドに保存していたなら合言葉を入れるだけで、バックアップのファイルがあればそのファイルから戻せます。</div>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button @click="openCloudRestore()"
                  class="tap px-3 py-2 rounded-xl text-xs font-bold text-white shadow" style="background:linear-gradient(135deg,#6366f1,#a855f7)">クラウドから戻す</button>
          <label class="tap px-3 py-2 rounded-xl text-xs font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 cursor-pointer">
            ファイルから戻す<input type="file" accept="application/json,.json" class="hidden" @change="onImportFile"></label>
        </div>
      </div>

      <!-- ---------- 保存まわりの知らせ ---------- -->
      <div v-if="saveError || draftFound || otherTab" class="no-print space-y-2 mb-3">
        <!-- ① 置き場に書けていない -->
        <div v-if="saveError" class="rounded-2xl border-2 px-3.5 py-3 flex items-start gap-2.5 flex-wrap"
             :class="isDark ? 'border-rose-500/40 bg-rose-950/30' : 'border-rose-300 bg-rose-50'">
          <i class="fa-solid fa-triangle-exclamation mt-0.5" :class="isDark ? 'text-rose-300' : 'text-rose-500'"></i>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-black" :class="isDark ? 'text-rose-200' : 'text-rose-700'">保存できていません</div>
            <div class="text-[11px] font-bold mt-0.5 leading-relaxed" :class="isDark ? 'text-rose-200/80' : 'text-rose-600'">
              ブラウザの保存場所がいっぱいです。このまま閉じると、書いたものが戻らないことがあります。
              「通信の控えを消す」で空けられます（駅や時刻表は次に開いたときに引き直します）
            </div>
          </div>
          <button @click="clearNetCache(); persistCurrent()" class="tap px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm shrink-0"
                  style="background:linear-gradient(135deg,#e11d48,#f43f5e)">
            <i class="fa-solid fa-broom mr-1"></i>通信の控えを消す
          </button>
          <button @click="downloadJson()" class="tap px-3 py-2 rounded-xl text-xs font-black border shrink-0"
                  :class="isDark ? 'border-slate-600 text-slate-200' : 'border-slate-300 text-slate-600'">
            <i class="fa-solid fa-download mr-1"></i>控えを書き出す
          </button>
        </div>
        <!-- ② 前回の書きかけ -->
        <div v-if="draftFound" class="rounded-2xl border-2 px-3.5 py-3 flex items-start gap-2.5 flex-wrap"
             :class="isDark ? 'border-indigo-500/40 bg-indigo-950/30' : 'border-indigo-200 bg-indigo-50'">
          <i class="fa-solid fa-pen-to-square mt-0.5 text-indigo-400"></i>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-black" :class="isDark ? 'text-indigo-200' : 'text-indigo-700'">書きかけが残っています</div>
            <div class="text-[11px] font-bold mt-0.5" :class="isDark ? 'text-indigo-200/80' : 'text-indigo-600'">
              「{{ draftFound.title || 'タイトルなし' }}」を編集の途中で閉じたようです
            </div>
          </div>
          <button @click="restoreDraft()" class="tap px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm shrink-0"
                  style="background:linear-gradient(135deg,#6366f1,#a855f7)">
            <i class="fa-solid fa-rotate-left mr-1"></i>続きから書く
          </button>
          <button @click="dropDraft()" class="tap px-3 py-2 rounded-xl text-xs font-bold text-slate-400 hover:underline shrink-0">捨てる</button>
        </div>
        <!-- ③ 別のタブで書き換えられた -->
        <div v-if="otherTab" class="rounded-2xl border-2 px-3.5 py-3 flex items-start gap-2.5 flex-wrap"
             :class="isDark ? 'border-amber-500/40 bg-amber-950/30' : 'border-amber-300 bg-amber-50'">
          <i class="fa-solid fa-clone mt-0.5 text-amber-500"></i>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-black" :class="isDark ? 'text-amber-200' : 'text-amber-800'">別のタブで同じ旅程が変わりました</div>
            <div class="text-[11px] font-bold mt-0.5" :class="isDark ? 'text-amber-200/80' : 'text-amber-700'">
              このまま続けると、あちらの変更は消えます（読み込み直すと、あちらの内容になります）
            </div>
          </div>
          <button @click="reloadFromStore()" class="tap px-3 py-2 rounded-xl text-xs font-black text-white shadow-sm shrink-0"
                  style="background:linear-gradient(135deg,#d97706,#f59e0b)">
            <i class="fa-solid fa-rotate mr-1"></i>読み込み直す
          </button>
          <button @click="otherTab = false; persistCurrent()" class="tap px-3 py-2 rounded-xl text-xs font-bold text-slate-400 hover:underline shrink-0">この画面を残す</button>
        </div>
      </div>

      <!-- ---------- PREVIEW ---------- -->
      <section class="print-full print-area">
        <!-- day tabs -->
        <div class="no-print flex items-center gap-2 mb-4 overflow-x-auto scroll-thin pb-1">
          <button v-for="(d, i) in state.days" :key="'tab'+i" @click="activeDay = i"
            class="tap tab-btn shrink-0 nowrap px-3 sm:px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 border"
            :class="activeDay === i ? 'bg-ink text-white border-ink shadow-lg' : 'bg-white/70 text-slate-500 border-transparent hover:bg-white'">
            <span class="grid place-items-center w-5 h-5 rounded-full text-[11px] shrink-0"
                  :class="activeDay === i ? 'bg-white/20' : 'bg-slate-100'">{{ d.dayNumber }}</span>
            <span class="nowrap">{{ shortDate(d.date) || 'Day'+d.dayNumber }}<span v-if="weekday(d.date)"
                  :class="activeDay === i ? 'opacity-60'
                    : (weekday(d.date)==='日' ? 'text-rose-500' : (weekday(d.date)==='土' ? 'text-blue-500' : 'opacity-60'))">（{{ weekday(d.date) }}）</span></span>
            <span class="text-[10px] font-bold shrink-0" :class="activeDay === i ? 'opacity-60' : 'text-slate-400'">{{ d.events.length }}</span>
            <span v-if="warnsOf(i).length"
                  :title="warnsOf(i).filter(w => w.level === 'error').length
                    ? warnsOf(i).filter(w => w.level === 'error').length + '件の要修正'
                    : warnsOf(i).length + '件の注意'"
                  class="w-4 h-4 rounded-full grid place-items-center text-[9px] font-black text-white shrink-0"
                  :class="warnsOf(i).some(w => w.level === 'error') ? 'bg-rose-600' : 'bg-amber-700'">!</span>
          </button>
          <button @click="addDay" title="日程を追加（D）"
            class="tap shrink-0 nowrap px-3 py-2 rounded-xl text-sm font-bold text-indigo-500 border-2 border-dashed border-indigo-200 hover:bg-indigo-50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i>日程追加
          </button>
        </div>

        <!-- days (画面のみ) -->
        <div v-for="(day, di) in state.days" :key="'day'+di+'-'+(activeDay === di ? dayTick : 0)"
             v-show="activeDay === di"
             class="no-print" :class="activeDay === di ? 'day-in' : ''">
          <!-- day header -->
          <div class="glass rounded-2xl p-3 sm:p-4 mb-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl grid place-items-center text-white font-black shadow-lg shrink-0"
                   style="background:linear-gradient(135deg,#1f2433,#3a425c)">
                <div class="text-center leading-none">
                  <div class="text-[9px] font-bold opacity-60">DAY</div>
                  <div class="text-lg">{{ day.dayNumber }}</div>
                </div>
              </div>
              <div class="mr-auto min-w-0">
                <!-- 日付を直接編集できる -->
                <div class="flex items-center gap-2 flex-wrap">
                  <input type="date" :value="day.date" :min="DATE_MIN" :max="DATE_MAX" @change="setDayDate(di, $event.target.value)"
                         :aria-label="'Day ' + day.dayNumber + ' の日付'"
                         class="rounded-lg border border-slate-200 px-2 py-1 text-sm font-bold focus:border-indigo-400 outline-none" />
                  <span v-if="weekday(day.date)" class="text-sm font-black"
                        :class="weekday(day.date)==='日' ? 'text-rose-500' : (weekday(day.date)==='土' ? 'text-blue-500' : 'text-slate-400')">
                    （{{ weekday(day.date) }}）
                  </span>
                  <span v-else class="text-[10px] text-slate-400 font-bold">日付を設定すると曜日が出ます</span>
                </div>
              </div>
              <div class="flex items-center shrink-0 rounded-xl shadow-md overflow-hidden" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <button @click="openAdd(di)" title="この日の最後に予定を追加（N）"
                  class="tap px-3 py-2 text-sm font-bold text-white hover:bg-black/10 transition flex items-center gap-1.5">
                  <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">予定を追加</span>
                </button>
                <span class="w-px self-stretch bg-white/30"></span>
                <button @click="openAddMenu(di)" aria-label="出発地点・到着地点・移動・よく使う予定から選ぶ"
                  title="出発地点・到着地点・移動・よく使う予定から選ぶ"
                  class="tap px-2 py-2 text-sm font-bold text-white hover:bg-black/10 transition">
                  <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
              </div>
            </div>

            <!-- 1日のサマリー -->
            <div class="flex items-center gap-x-3 gap-y-1 flex-wrap mt-3 pt-3 border-t text-[11px] font-bold"
                 :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <span class="text-slate-500"><i class="fa-solid fa-list-check mr-1 text-slate-400"></i>{{ dayStats(day).count }}件</span>
              <span v-if="dayStats(day).activeMins" class="text-slate-500"
                    :title="'最初の予定から最後の予定まで ' + fmtMin(dayStats(day).span)
                            + (dayStats(day).sleepMins ? '。うち就寝 ' + fmtMin(dayStats(day).sleepMins) + ' を除いています' : '')">
                <i class="fa-regular fa-clock mr-1 text-slate-400"></i>行動 {{ fmtMin(dayStats(day).activeMins) }}<span
                  v-if="dayStats(day).crossesMidnight" class="text-amber-600 font-bold">（翌日まで）</span>
              </span>
              <span v-if="dayStats(day).sleepMins" class="text-slate-500"
                    :title="'行動時間からは引いています（最初の予定から最後の予定までは ' + fmtMin(dayStats(day).span) + '）'">
                <i class="fa-solid fa-moon mr-1 text-slate-400"></i>就寝 {{ fmtMin(dayStats(day).sleepMins) }}
              </span>
              <span v-if="dayStats(day).moveMins" class="text-slate-500"><i class="fa-solid fa-route mr-1 text-slate-400"></i>移動 {{ fmtMin(dayStats(day).moveMins) }}</span>
              <span class="text-ink tabular-nums ml-auto"><i class="fa-solid fa-yen-sign mr-1 text-slate-400"></i>{{ yen(dayStats(day).cost) }}</span>
            </div>
            <!-- 費用の内訳 -->
            <div v-if="dayStats(day).cost > 0" class="flex items-center gap-2 flex-wrap mt-1.5 text-[10px] font-bold">
              <span v-if="dayStats(day).moveCost" class="px-1.5 py-0.5 rounded-md" :style="{background: CATS.train.soft, color: ink(CATS.train.color, CATS.train.soft)}">移動 {{ yen(dayStats(day).moveCost) }}</span>
              <span v-if="dayStats(day).mealCost" class="px-1.5 py-0.5 rounded-md" :style="{background: CATS.meal.soft, color: ink(CATS.meal.color, CATS.meal.soft)}">食事 {{ yen(dayStats(day).mealCost) }}</span>
              <span v-if="dayStats(day).stayCost" class="px-1.5 py-0.5 rounded-md" :style="{background: CATS.accommodation.soft, color: ink(CATS.accommodation.color, CATS.accommodation.soft)}">宿泊 {{ yen(dayStats(day).stayCost) }}</span>
              <span v-if="dayStats(day).otherCost" class="px-1.5 py-0.5 rounded-md" :style="{background: CATS.activity.soft, color: ink(CATS.activity.color, CATS.activity.soft)}">その他 {{ yen(dayStats(day).otherCost) }}</span>
              <span v-if="dayStats(day).paidCost" class="px-1.5 py-0.5 rounded-md"
                    :class="isDark ? 'bg-emerald-900/40 text-emerald-300' : 'bg-emerald-50 text-emerald-700'"
                    title="出発前に払い終えているぶん">
                <i class="fa-solid fa-circle-check text-[8px] mr-0.5"></i>支払い済 {{ yen(dayStats(day).paidCost) }}
              </span>
              <span v-if="dayStats(day).paidCost && dayStats(day).unpaidCost" class="px-1.5 py-0.5 rounded-md"
                    :class="isDark ? 'bg-slate-700 text-slate-200' : 'bg-slate-100 text-slate-600'"
                    title="この日その場で払うぶん">当日 {{ yen(dayStats(day).unpaidCost) }}</span>
            </div>

            <!-- 日の操作（スマホ幅ではめったに使わないので、「この日の操作」にたたむ） -->
            <button @click="dayOpsOpen = !dayOpsOpen" :aria-expanded="dayOpsOpen ? 'true' : 'false'"
                    class="tap sm:hidden mt-3 w-full px-3 py-2 rounded-xl text-xs font-bold text-slate-500 bg-white/70 hover:bg-white transition flex items-center justify-between">
              <span><i class="fa-solid fa-sliders mr-1.5"></i>この日の操作</span>
              <i class="fa-solid" :class="dayOpsOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            </button>
            <div class="items-center gap-1.5 flex-wrap mt-3 pt-3 border-t" :class="[isDark ? 'border-slate-700' : 'border-slate-200', dayOpsOpen ? 'flex' : 'hidden sm:flex']">
              <button @click="sortDayManual(di)" title="時刻順に整列（S）"
                class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 bg-white/70 hover:bg-white transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-down-1-9"></i>時刻順に整列
              </button>
              <button @click="duplicateDay(di)"
                class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 bg-white/70 hover:bg-white transition flex items-center gap-1.5">
                <i class="fa-solid fa-copy"></i>この日を複製
              </button>
              <!-- 時刻をまとめてずらす -->
              <div class="relative">
                <button @click.stop="shiftMenuFor = (shiftMenuFor === di ? -1 : di)"
                        title="遅れた・早まったときに、この日の時刻をまとめてずらします"
                        class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-white/70 hover:bg-white transition flex items-center gap-1.5"
                        :class="shiftMenuFor === di ? 'text-indigo-500' : 'text-slate-500'">
                  <i class="fa-solid fa-clock-rotate-left"></i>時刻をずらす
                </button>
                <div v-if="shiftMenuFor === di" @click.stop
                     class="absolute left-0 top-full mt-1.5 z-30 w-56 rounded-xl shadow-2xl border p-2.5"
                     :style="isDark ? {background:'#1e293b',borderColor:'#475569'} : {background:'#fff',borderColor:'#e2e8f0'}">
                  <div class="text-[10px] font-black text-slate-400 mb-1.5">この日の全部の時刻をずらす</div>
                  <div class="grid grid-cols-5 gap-1">
                    <button v-for="m in SHIFT_STEPS" :key="'sh'+m" @click="shiftDayTimes(di, m)"
                            class="tap px-1 py-1.5 rounded-lg text-[10px] font-bold tabular-nums transition"
                            :style="m < 0
                              ? (isDark ? {background:'#0f172a', color:'#94a3b8'} : {background:'#f1f4f9', color:'#536175'})
                              : (isDark ? {background:'#1e1b4b', color:'#a5b4fc'} : {background:'#eef2ff', color:'#4f46e5'})">
                      {{ m > 0 ? '+' : '−' }}{{ Math.abs(m) }}
                    </button>
                  </div>
                  <div class="text-[10px] text-slate-400 mt-1.5 leading-relaxed">
                    単位は分。左が前倒し、右が後ろ倒しです。
                  </div>
                </div>
              </div>
              <button @click="moveDay(di,-1)" :disabled="di===0" title="前の日と入れ替え" aria-label="前の日と入れ替え"
                class="tap w-8 h-8 rounded-lg text-[11px] font-bold bg-white/70 hover:bg-white transition"
                :class="di===0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-500'">
                <i class="fa-solid fa-arrow-left"></i>
              </button>
              <button @click="moveDay(di,1)" :disabled="di===state.days.length-1" title="次の日と入れ替え" aria-label="次の日と入れ替え"
                class="tap w-8 h-8 rounded-lg text-[11px] font-bold bg-white/70 hover:bg-white transition"
                :class="di===state.days.length-1 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-500'">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
              <button @click="removeDay(di)" title="この日を削除" aria-label="この日を削除"
                class="tap ml-auto w-8 h-8 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <!-- 重なりを気にしない設定にしている日 -->
          <div v-if="day.ignoreOverlap && activeDay === di && hasOverlap(day)"
               class="rounded-2xl border px-3 py-2 mb-4 flex items-center gap-2 flex-wrap"
               :class="isDark ? 'border-slate-700 bg-slate-800/60' : 'border-slate-200 bg-slate-50'">
            <i class="fa-solid fa-bell-slash text-slate-400 text-[11px]"></i>
            <span class="text-[11px] font-bold text-slate-500">この日は時間の重なりを気にしない設定です</span>
            <button @click="toggleIgnoreOverlap(di)"
                    class="tap ml-auto px-2 py-0.5 rounded-lg text-[10px] font-bold text-indigo-500 hover:underline">
              重なりを見るように戻す
            </button>
          </div>

          <!-- 点検（入力ミス・矛盾） -->
          <transition name="soft">
          <div v-if="(activeIssues.length || ignoredCount) && activeDay === di"
               class="rounded-2xl border px-3 py-2.5 mb-4"
               :class="isDark ? 'border-slate-700 bg-slate-800/40' : 'border-slate-200 bg-white/70'">
            <div class="text-[11px] font-black flex items-center gap-2 flex-wrap" :class="[isDark ? 'text-slate-300' : 'text-slate-600', issuesOpen ? 'mb-1.5' : 'sm:mb-1.5']">
              <i class="fa-solid fa-clipboard-check text-indigo-400"></i>点検
              <span v-if="issueCounts.error" class="px-1.5 py-0.5 rounded-md text-[10px] bg-rose-100 text-rose-700">要修正 {{ issueCounts.error }}</span>
              <span v-if="issueCounts.warn" class="px-1.5 py-0.5 rounded-md text-[10px] bg-amber-100 text-amber-700">注意 {{ issueCounts.warn }}</span>
              <span v-if="issueCounts.info" class="px-1.5 py-0.5 rounded-md text-[10px]"
                    :class="isDark ? 'bg-slate-700 text-slate-200' : 'bg-slate-100 text-slate-500'">気づき {{ issueCounts.info }}</span>
              <span v-if="!activeIssues.length" class="text-emerald-600">この日は問題なし</span>
              <button v-if="activeIssues.length || ignoredCount" @click="issuesOpen = !issuesOpen" :aria-expanded="issuesOpen ? 'true' : 'false'"
                      class="tap sm:hidden ml-auto px-2.5 py-1 rounded-lg text-[11px] font-bold text-indigo-600 hover:bg-indigo-500/10">
                {{ issuesOpen ? '閉じる' : '見る' }}<i class="fa-solid ml-1" :class="issuesOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
              </button>
              <button v-if="overlapWarnsOf(di).length" @click="toggleIgnoreOverlap(di)"
                      title="フェスの被りなど、重なっていて当たり前の日はこちら"
                      class="tap ml-auto px-2 py-0.5 rounded-lg text-[10px] font-bold border transition"
                      :class="isDark ? 'border-slate-600 hover:bg-slate-700' : 'border-slate-300 hover:bg-slate-50'">
                <i class="fa-solid fa-bell-slash mr-1"></i>重なりは気にしない
              </button>
            </div>
            <ul class="space-y-1" :class="issuesOpen ? '' : 'hidden sm:block'">
              <li v-for="(iss, ii) in activeIssues" :key="'iss'+ii" class="isu" :class="'isu-' + iss.level">
                <i class="fa-solid shrink-0 text-[10px] mt-0.5 isu-msg"
                   :class="iss.level==='error' ? 'fa-circle-exclamation' : (iss.level==='warn' ? 'fa-triangle-exclamation' : 'fa-lightbulb')"></i>
                <button @click="jumpToIssue(iss)" title="その予定へ移動します" class="isu-msg text-left flex-1 min-w-0 py-1 hover:underline">
                  {{ iss.msg }}<span v-if="ignoredSet.has(iss.key)" class="opacity-60">（無視中）</span>
                </button>
                <div class="isu-acts">
                  <button v-if="fixList(iss).length === 1" @click="applyFix(iss)" class="tap isu-btn isu-msg" :title="fixList(iss)[0].label">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>{{ fixList(iss)[0].label }}
                  </button>
                  <button v-if="(iss.type === 'move' || iss.type === 'chain') && iss.move !== undefined"
                          @click="openMoveWizard(di, iss.move)" class="tap isu-btn isu-msg">
                    <i class="fa-solid fa-route mr-1"></i>移動を入れる
                  </button>
                  <button v-if="iss.ids && iss.ids.length" @click="openFixDialog(di, dayEventById(di, iss.ids[0]))"
                          class="tap isu-btn isu-msg" title="直し方を見る">直し方</button>
                  <button v-if="!ignoredSet.has(iss.key)" @click="ignoreIssue(iss.key)"
                          class="tap isu-btn isu-msg" title="この指摘を今後出しません">無視</button>
                  <button v-else @click="unignoreIssue(iss.key)" class="tap isu-btn isu-msg" title="また指摘するようにします">戻す</button>
                </div>
              </li>
            </ul>
            <div v-if="ignoredCount" class="mt-1.5 items-center gap-2 flex-wrap" :class="issuesOpen ? 'flex' : 'hidden sm:flex'">
              <button @click="showIgnored = !showIgnored" class="tap px-2 py-1.5 -ml-2 rounded-lg text-[11px] font-bold text-indigo-500 hover:underline">
                <i class="fa-solid" :class="showIgnored ? 'fa-eye-slash' : 'fa-eye'"></i>
                無視した指摘 {{ ignoredCount }}件を{{ showIgnored ? '隠す' : '表示' }}
              </button>
              <button v-if="showIgnored" @click="clearIgnored()" class="tap px-2 py-1.5 rounded-lg text-[11px] font-bold text-slate-400 hover:underline">すべて戻す</button>
            </div>
          </div>
          </transition>

          <!-- empty -->
          <div v-if="!day.events.length"
               @dragover="onDragOver($event)" @dragleave="onDragLeave" @drop="onDropDay(di, $event)"
               class="rounded-2xl border-2 border-dashed border-slate-200 py-10 px-4 text-center">
            <i class="fa-regular fa-map text-3xl text-slate-300"></i>
            <div class="text-slate-400 text-sm font-bold mt-3">この日はまだ空です</div>
            <div v-if="prevDayEnd(di)" class="text-[11px] font-bold mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                 :style="{background: isDark ? 'rgba(14,165,233,0.14)' : '#f0f9ff', color: ink(ANCHORS.start.color)}">
              <i class="fa-solid" :class="ANCHORS.start.icon"></i>前の日は「{{ prevDayEnd(di) }}」で終わっています
            </div>
            <div class="text-slate-400 text-[11px] font-medium mt-2 leading-relaxed">
              出発地点と到着地点を決めると、あいだの移動手段まで一度に作れます
            </div>
            <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
              <button @click="openRouteWizard(di)"
                class="tap px-4 py-2.5 rounded-xl text-sm font-bold text-white shadow-md hover:opacity-90 transition flex items-center gap-2"
                style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <i class="fa-solid fa-route"></i>ルートを作る
              </button>
              <button @click="openAddMenu(di)"
                class="tap px-4 py-2.5 rounded-xl text-sm font-bold text-slate-500 bg-white/70 hover:bg-white transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i>1件だけ追加
              </button>
            </div>
          </div>

          <!-- timeline -->
          <div class="relative rail pl-1" v-else
               @dragover="onDragOver($event)" @drop="onDropDay(di, $event)">

            <!-- 先頭のあいだ -->
            <div class="ins-row no-print pl-12 pb-1.5 flex items-center gap-1.5 flex-wrap"
                 :class="movingId ? 'ins-active' : ''">
              <button v-if="movingId" @click="dropAt(di, 0)"
                      class="tap relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full text-white shadow-sm"
                      style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <i class="fa-solid fa-arrow-turn-down"></i>ここへ移動
              </button>
              <template v-else>
                <span v-if="nightBefore(di)" title="前の日の終わりから、この日の起床まで"
                      class="relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full"
                      :class="isDark ? 'bg-indigo-900/40 text-indigo-300' : 'bg-indigo-50 text-indigo-600 border border-indigo-200'">
                  <i class="fa-solid fa-moon"></i>就寝時間 {{ fmtMin(nightBefore(di)) }}
                </span>
                <span v-else class="ins-dot relative z-10"><i class="fa-solid fa-plus"></i></span>
                <span class="ins-hint relative z-10 items-center gap-1">
                  <button @click="openAdd(di, '', 0)" title="ここに予定を追加"
                          class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-plus mr-0.5"></i>予定
                  </button>
                  <button @click="openMoveWizard(di, -1)" title="ここに移動を追加"
                          class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-route mr-0.5"></i>移動
                  </button>
                  <button @click="openAddMenu(di, 0)" title="ここに追加するものを選ぶ" aria-label="ここに追加するものを選ぶ"
                          class="tap px-2 py-1.5 rounded-lg text-[11px] font-bold text-slate-400 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                </span>
              </template>
            </div>

            <template v-for="(ev, ei) in day.events" :key="ev.id">
            <div :id="'ev-'+ev.id" data-evcard
                 draggable="true"
                 @dragstart="onDragStart(di, ev, $event)" @dragend="onDragEnd"
                 @dragover="onDragOver($event)" @dragleave="onDragLeave" @drop.stop="onDrop(di, ev, $event)"
                 class="relative pl-12 pb-4 group"
                 :class="movingId === ev.id ? 'ev-moving' : ''">
              <!-- node -->
              <div class="absolute left-2 top-3 w-9 h-9 rounded-full grid place-items-center text-white shadow-md ring-4 ring-white z-10"
                   :style="{ background: ev.anchor ? ink(anchorCfg(ev.anchor).color, '#ffffff') : ink(cat(ev.type).color, '#ffffff') }">
                <i class="fa-solid" :class="ev.anchor ? anchorCfg(ev.anchor).icon : cat(ev.type).icon"></i>
              </div>

              <!-- カードのどこを押しても編集が開く（スマホで鉛筆の小さなボタンを狙わなくてよいように） -->
              <div class="glass ev-card rounded-2xl p-4 transition hover:shadow-xl min-w-0 cursor-pointer" @click="onCardClick(di, ev, $event)"
                   :class="[highlightId===ev.id ? 'ev-highlight' : '', (!ev.anchor && conflictIds.has(ev.id)) ? 'ev-conflict' : '']"
                   :style="ev.anchor
                     ? { outline: '2px solid '+anchorCfg(ev.anchor).color, outlineOffset: '1px', background: isDark ? '' : '#ffffff' }
                     : (isDark ? {} : { background: cat(ev.type).soft })">
                <div class="flex items-start gap-3 min-w-0">
                  <!-- time -->
                  <div class="shrink-0 text-right min-w-[52px] pt-0.5">
                    <div v-if="ev.anchor" class="text-[9px] font-black leading-none mb-1 tracking-wider"
                         :style="{color: ink(anchorCfg(ev.anchor).color)}">{{ ANCHORS[ev.anchor].timeLabel }}</div>
                    <div class="font-black text-ink tabular-nums leading-none">{{ ev.startTime || '—' }}</div>
                    <div v-if="ev.endTime" class="text-[11px] font-bold tabular-nums mt-1"
                         :class="crossesDay(ev) ? 'text-amber-600' : 'text-slate-400'"
                         :title="crossesDay(ev) ? '翌日の時刻です' : ''">{{ nextMark(ev) }}{{ ev.endTime }}</div>
                  </div>

                  <div class="w-px self-stretch" :style="{ background: cat(ev.type).ring }"></div>

                  <!-- body -->
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span v-if="ev.anchor" class="text-[10px] font-black px-2 py-0.5 rounded-full text-white flex items-center gap-1" :style="{ background: ink(anchorCfg(ev.anchor).color, '#ffffff') }">
                        <i class="fa-solid" :class="anchorCfg(ev.anchor).icon"></i>{{ anchorCfg(ev.anchor).label }}
                      </span>
                      <span class="text-[10px] font-black px-2 py-0.5 rounded-full text-white" :style="{ background: ink(cat(ev.type).color, '#ffffff') }">
                        {{ cat(ev.type).label }}
                      </span>
                      <span v-if="duration(ev.startTime, ev.endTime)" class="text-[10px] font-bold"
                            :class="ev.anchor === 'end' ? 'text-rose-500' : 'text-slate-400'">
                        <i class="fa-regular fa-clock"></i> {{ stayLabel(ev) }}{{ stayLabel(ev) ? ' ' : '' }}{{ duration(ev.startTime, ev.endTime) }}
                      </span>
                      <button v-if="issueLevelById[ev.id] && issueLevelById[ev.id] !== 'info'"
                              @click.stop="openFixDialog(di, ev)"
                              :title="issueLevelById[ev.id] === 'error' ? '直し方を見る（入力の矛盾）' : '直し方を見る（注意）'"
                              class="tap text-[10px] font-black px-2 py-1 rounded-full flex items-center gap-1 transition hover:shadow-sm"
                              :class="issueLevelById[ev.id] === 'error'
                                ? 'bg-rose-100 text-rose-700 hover:bg-rose-200'
                                : 'bg-amber-100 text-amber-700 hover:bg-amber-200'">
                        <i class="fa-solid" :class="issueLevelById[ev.id] === 'error' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation'"></i>
                        {{ issueLevelById[ev.id] === 'error' ? '要修正' : '注意' }}
                        <i class="fa-solid fa-arrow-right text-[8px] opacity-70"></i>
                      </button>
                      <span v-if="conflictIds.has(ev.id)" title="ほかの予定と時間が重なっています"
                            class="text-[10px] font-black px-1.5 py-0.5 rounded-full bg-amber-500 text-white flex items-center gap-1">
                        <i class="fa-solid fa-triangle-exclamation text-[8px]"></i>重なり
                      </span>
                      <span v-if="ev.cost > 0" class="text-[10px] font-black ml-auto tabular-nums flex items-center gap-1"
                            :class="ev.paid ? 'text-emerald-600' : 'text-slate-500'"
                            :title="ev.paid ? '出発前に支払い済み' : '当日に支払う'">
                        <i v-if="ev.paid" class="fa-solid fa-circle-check text-[9px]"></i>{{ yen(ev.cost) }}
                      </span>
                    </div>

                    <h3 class="font-black text-ink mt-1.5 leading-snug break-words">{{ ev.title }}</h3>

                    <div v-if="ev.location && !redundantLocation(ev)" class="text-xs text-slate-500 font-medium mt-1 flex items-start gap-1.5 break-words">
                      <i class="fa-solid mt-0.5 shrink-0" :class="isRouteText(ev.location) ? 'fa-route' : 'fa-location-dot'" :style="{ color: ink(cat(ev.type).color) }"></i>
                      <span class="min-w-0 break-words">{{ ev.location }}</span>
                    </div>
                    <p v-if="ev.notes" class="text-xs text-slate-500 mt-1.5 whitespace-pre-wrap leading-relaxed break-words">{{ ev.notes }}</p>

                    <!-- 電車/バス：乗換チェーン（優先）or 旧フィールド -->
                    <template v-if="['train','bus'].includes(ev.type)">
                      <div v-if="routeStops(ev).length" class="rt">
                        <template v-for="(st, si) in routeStops(ev)" :key="si">
                          <!-- 駅（着・乗換の猶予・発を1行に） -->
                          <div class="rt-stop"
                               :class="isTransferStop(routeStops(ev), si)
                                 ? (tightTransfer(routeStops(ev), si) ? 'rt-stop-tr rt-stop-tight' : 'rt-stop-tr')
                                 : (isThroughStop(routeStops(ev), si) ? 'rt-stop-th' : '')"
                               :style="{'--sc': segColor(ev, si > 0 ? routeStops(ev)[si-1] : st)}">
                            <span class="rt-dot"></span>
                            <span class="rt-name text-ink">{{ st.name || '—' }}</span>
                            <span v-if="si > 0 && (st.arrTime || st.arrPlatform)" class="rt-grp">
                              <span v-if="st.arrTime" class="rt-t">{{ st.arrTime }}着</span>
                              <span v-if="st.arrPlatform && !st.through" class="rt-pf rt-pf-arr">{{ st.arrPlatform }}</span>
                            </span>
                            <span v-if="isTransferStop(routeStops(ev), si) && transferMins(routeStops(ev), si) !== null"
                                  class="rt-tr" :class="tightTransfer(routeStops(ev), si) ? 'rt-tr-tight' : ''"
                                  :title="quickStop(routeStops(ev), si) ? '向かいのホームで乗り換えられます（対面乗換）'
                                    : (tightTransfer(routeStops(ev), si) ? '乗換時間が短めです' : 'ここで降りて乗り換えます')">
                              <i class="fa-solid text-[8px] mr-0.5" :class="quickStop(routeStops(ev), si) ? 'fa-right-left' : 'fa-arrows-rotate'"></i>{{ (quickStop(routeStops(ev), si) ? '対面乗換 ' : '乗換 ') + fmtMin(transferMins(routeStops(ev), si)) }}
                            </span>
                            <span v-else-if="isThroughStop(routeStops(ev), si)" class="rt-th"
                                  title="降りません。同じ列車のまま先へ進みます">
                              <i class="fa-solid fa-arrow-right-long text-[8px] mr-0.5"></i>直通<span
                                v-if="transferMins(routeStops(ev), si)">{{ '・停車' + fmtMin(transferMins(routeStops(ev), si)) }}</span>
                            </span>
                            <span v-if="hasDepInfo(routeStops(ev), si) && (st.depTime || st.depPlatform)" class="rt-grp">
                              <span v-if="st.depTime" class="rt-t">{{ st.depTime }}発</span>
                              <span v-if="st.depPlatform && !st.through" class="rt-pf">{{ st.depPlatform }}</span>
                            </span>
                          </div>
                          <!-- ここから乗る列車 -->
                          <div v-if="showSeg(routeStops(ev), si)" class="rt-seg" :style="{'--sc': segColor(ev, st)}">
                            <template v-for="(ln, li) in segLines(routeStops(ev), si)" :key="'sl'+si+li">
                              <span v-if="li" class="rt-thru" title="ここで路線が変わりますが、同じ列車のまま進みます">直通</span>
                              <span class="rt-line" :style="{background: lineColor(ln) || segColor(ev, st), color: onColor(lineColor(ln) || segColor(ev, st))}">{{ ln }}</span>
                            </template>
                            <span v-if="!segLines(routeStops(ev), si).length" class="rt-meta">{{ cat(ev.type).label }}</span>
                            <span v-for="(kd, ki) in segKinds(routeStops(ev), si)" :key="'sk'+si+ki"
                                  class="rt-kind" :style="{'--kc': segColor(ev, st)}">{{ kd }}</span>
                            <span v-if="segDest(routeStops(ev), si)" class="rt-dest">{{ segDest(routeStops(ev), si) }}</span>
                            <span v-if="segStations(routeStops(ev), si)" class="rt-meta">{{ segStations(routeStops(ev), si) }}</span>
                          </div>
                        </template>
                      </div>
                      <div v-else-if="ev.type !== 'plane' && (ev.platform || ev.direction || ev.stations)"
                           class="text-xs text-slate-500 mt-1.5 flex flex-wrap gap-x-2.5 gap-y-0.5 font-medium min-w-0">
                        <span v-if="ev.platform" class="break-all"><i class="fa-solid fa-signs-post mr-0.5"></i>{{ ev.platform }}</span>
                        <span v-if="ev.direction" class="break-all">→ {{ ev.direction }}</span>
                        <span v-if="ev.stations" class="break-all"><i class="fa-solid fa-circle-dot mr-0.5"></i>{{ ev.stations }}</span>
                      </div>
                    </template>
                    <!-- 飛行機固有情報 -->
                    <div v-if="ev.type === 'plane' && (ev.flightNo || ev.direction)"
                         class="text-xs text-slate-500 mt-1.5 flex flex-wrap gap-x-2.5 gap-y-0.5 font-medium min-w-0">
                      <span v-if="ev.flightNo" class="break-all"><i class="fa-solid fa-plane mr-0.5"></i>{{ ev.flightNo }}</span>
                      <span v-if="ev.direction" class="break-all">→ {{ ev.direction }}</span>
                    </div>

                    <!-- 座席（電車・バス・飛行機・イベント共通） -->
                    <div v-if="ev.seat" class="text-xs mt-1.5 font-bold break-all inline-flex items-center gap-1.5 px-2 py-1 rounded-lg"
                         :style="isDark ? {background:'#1e293b', color: ink(cat(ev.type).color)} : {background: cat(ev.type).soft, color: ink(cat(ev.type).color, cat(ev.type).soft)}">
                      <i class="fa-solid fa-couch text-[10px]"></i>{{ ev.seat }}
                    </div>

                    <div class="flex items-center gap-2 mt-2.5 flex-wrap">
                      <button v-if="ei === day.events.length - 1 && placeOf(ev, 'end')"
                              @click="openNextWizard(di, ei)"
                              title="ここでの滞在を決めて、次の行き先へ続けます"
                              class="tap no-print nowrap shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg text-white shadow-sm hover:opacity-90 transition inline-flex items-center gap-1.5"
                              style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                        ここから次へ<i class="fa-solid fa-arrow-right text-[9px]"></i>
                      </button>
                      <a v-if="ev.location" :href="mapUrl(ev.location)" target="_blank" rel="noopener"
                         :title="isRouteText(ev.location) ? 'Googleマップで経路を開く' : 'Googleマップで場所を開く'"
                         class="tap no-print nowrap shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white/80 text-blue-600 hover:bg-white transition inline-flex items-center gap-1.5">
                        <i class="fa-solid" :class="isRouteText(ev.location) ? 'fa-diamond-turn-right' : 'fa-map-location-dot'"></i>{{ isRouteText(ev.location) ? '経路' : '地図' }}
                      </a>
                      <a v-if="safeUrl(ev.url)" :href="safeUrl(ev.url)" target="_blank" rel="noopener noreferrer"
                         class="tap no-print nowrap shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white/80 text-slate-600 hover:bg-white transition inline-flex items-center gap-1.5">
                        <i class="fa-solid fa-link"></i>リンク
                      </a>
                      <div class="ev-actions no-print ml-auto flex items-center gap-0.5 opacity-40 group-hover:opacity-100 focus-within:opacity-100 transition">
                        <button @click="startMoving(di, ev)" aria-label="並べ替える"
                                title="ドラッグ、または押して位置を選んで移動"
                                class="tap w-8 h-8 rounded-lg text-slate-400 hover:bg-white hover:text-indigo-500 transition cursor-grab">
                          <i class="fa-solid fa-grip-vertical"></i>
                        </button>
                        <button @click="moveEvent(di, ev, -1)" :disabled="ei===0" title="1つ上へ" aria-label="1つ上へ"
                          class="tap w-8 h-8 rounded-lg transition" :class="ei===0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-500 hover:bg-white hover:text-indigo-500'">
                          <i class="fa-solid fa-chevron-up text-xs"></i>
                        </button>
                        <button @click="moveEvent(di, ev, 1)" :disabled="ei===day.events.length-1" title="1つ下へ" aria-label="1つ下へ"
                          class="tap w-8 h-8 rounded-lg transition" :class="ei===day.events.length-1 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-500 hover:bg-white hover:text-indigo-500'">
                          <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                        <button @click="openEdit(di, ev)" title="編集" aria-label="編集" class="tap w-8 h-8 rounded-lg text-slate-500 hover:bg-white hover:text-indigo-500 transition"><i class="fa-solid fa-pen"></i></button>
                        <!-- ⋯ メニュー -->
                        <div class="relative">
                          <button @click.stop="menuFor = (menuFor===ev.id ? '' : ev.id)" title="その他" aria-label="その他の操作"
                                  class="tap w-8 h-8 rounded-lg text-slate-500 hover:bg-white hover:text-indigo-500 transition"><i class="fa-solid fa-ellipsis"></i></button>
                          <div v-if="menuFor===ev.id" @click.stop
                               class="absolute right-0 bottom-full mb-1.5 z-30 w-52 rounded-xl shadow-2xl border py-1.5 text-left"
                               :style="isDark ? {background:'#1e293b',borderColor:'#475569'} : {background:'#fff',borderColor:'#e2e8f0'}">
                            <button @click="toggleAnchor(di, ev, 'end')"
                                    class="w-full text-left px-3 py-2 text-xs font-bold hover:bg-slate-100 flex items-center gap-2"
                                    :style="ev.anchor === 'end' ? {color: ink(ANCHORS.end.color)} : {}"
                                    :class="ev.anchor === 'end' ? '' : 'text-slate-600'">
                              <i class="fa-solid w-4" :class="ANCHORS.end.icon"
                                 :style="ev.anchor === 'end' ? {color: ink(ANCHORS.end.color)} : {color:'#94a3b8'}"></i>
                              {{ ev.anchor === 'end' ? '1日の終わりをやめる' : '1日の終わりにする' }}
                            </button>
                            <button @click="toggleAnchor(di, ev, 'start')"
                                    class="w-full text-left px-3 py-2 text-xs font-bold hover:bg-slate-100 flex items-center gap-2"
                                    :style="ev.anchor === 'start' ? {color: ink(ANCHORS.start.color)} : {}"
                                    :class="ev.anchor === 'start' ? '' : 'text-slate-600'">
                              <i class="fa-solid w-4" :class="ANCHORS.start.icon"
                                 :style="ev.anchor === 'start' ? {color: ink(ANCHORS.start.color)} : {color:'#94a3b8'}"></i>
                              {{ ev.anchor === 'start' ? '1日の始まりをやめる' : '1日の始まりにする' }}
                            </button>
                            <div class="h-px my-1" :class="isDark ? 'bg-slate-700' : 'bg-slate-100'"></div>
                            <!-- 遅れ・押しに合わせて、ここから後ろをまとめて動かす -->
                            <button @click="rippleFor = (rippleFor === ev.id ? '' : ev.id)"
                                    class="w-full text-left px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2">
                              <i class="fa-solid fa-clock-rotate-left w-4 text-slate-400"></i>ここから後ろをずらす
                              <i class="fa-solid fa-chevron-down text-[8px] ml-auto opacity-50" :class="rippleFor === ev.id ? 'fa-rotate-180' : ''"></i>
                            </button>
                            <div v-if="rippleFor === ev.id" class="px-2 pb-1.5">
                              <div class="text-[10px] font-bold text-slate-400 px-1 pb-1">この予定と、これより後ろぜんぶ</div>
                              <div class="grid grid-cols-4 gap-1">
                                <button v-for="mm in SHIFT_STEPS" :key="'rf'+ev.id+mm" @click="shiftFrom(di, ev, mm)"
                                        class="tap py-1.5 rounded-lg text-[11px] font-black transition"
                                        :class="mm > 0
                                          ? (isDark ? 'bg-slate-700 text-amber-300 hover:bg-slate-600' : 'bg-amber-50 text-amber-700 hover:bg-amber-100')
                                          : (isDark ? 'bg-slate-700 text-sky-300 hover:bg-slate-600' : 'bg-sky-50 text-sky-700 hover:bg-sky-100')">
                                  {{ mm > 0 ? '+' : '−' }}{{ Math.abs(mm) }}
                                </button>
                              </div>
                            </div>
                            <button @click="duplicateEvent(di, ev)" class="w-full text-left px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2">
                              <i class="fa-solid fa-copy w-4 text-slate-400"></i>この予定を複製
                            </button>
                            <button @click="deleteEvent(di, ev)" class="w-full text-left px-3 py-2 text-xs font-bold text-rose-500 hover:bg-rose-50 flex items-center gap-2">
                              <i class="fa-solid fa-trash-can w-4"></i>削除する
                            </button>
                            <div v-if="state.days.length > 1" class="mt-1 pt-1 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
                              <div class="px-3 py-1 text-[10px] font-black text-slate-400">別の日へ移動</div>
                              <div class="max-h-40 overflow-y-auto scroll-thin">
                                <button v-for="(d2, j) in state.days" :key="'mv'+ev.id+j" v-show="j !== di"
                                        @click="moveEventToDay(di, ev, j)"
                                        class="w-full text-left px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2">
                                  <i class="fa-solid fa-arrow-right-long w-4 shrink-0 text-slate-400"></i><span class="nowrap">Day {{ d2.dayNumber }}</span><span class="nowrap text-slate-400 font-medium">{{ shortDate(d2.date) }}</span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 予定と予定のあいだ：空き時間・移動の抜け・ここに追加 / ここへ移動 -->
            <div class="ins-row no-print pl-12 -mt-2.5 pb-2.5 flex items-center gap-1.5 flex-wrap"
                 :class="movingId ? 'ins-active' : ''">
              <button v-if="movingId" @click="dropAt(di, ei + 1)"
                      class="tap relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full text-white shadow-sm"
                      style="background:linear-gradient(135deg,#6366f1,#a855f7)">
                <i class="fa-solid fa-arrow-turn-down"></i>ここへ移動
              </button>
              <template v-else>
                <span v-if="insGap(day, ei + 1) && insSleep(day, ei + 1)"
                      title="就寝から起床までの時間"
                      class="relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full"
                      :class="isDark ? 'bg-indigo-900/40 text-indigo-300' : 'bg-indigo-50 text-indigo-600 border border-indigo-200'">
                  <i class="fa-solid fa-moon"></i>就寝時間 {{ fmtMin(insGap(day, ei + 1)) }}
                </span>
                <span v-else-if="insGap(day, ei + 1)"
                      class="relative z-10 inline-flex items-center gap-1.5 text-[10px] font-bold text-slate-400 px-2.5 py-1 rounded-full border border-dashed border-slate-300 bg-white/70">
                  <i class="fa-regular fa-hourglass-half"></i>空き {{ fmtMin(insGap(day, ei + 1)) }}
                </span>
                <button v-if="insNeedsMove(day, ei + 1)" @click="openMoveWizard(di, ei)"
                        :title="placeOf(day.events[ei],'end') + ' から ' + placeOf(day.events[ei+1],'start') + ' への移動を追加'"
                        class="tap relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition max-w-full min-w-0">
                  <i class="fa-solid fa-location-arrow shrink-0"></i>
                  <span class="truncate">{{ placeOf(day.events[ei],'end') }} → {{ placeOf(day.events[ei+1],'start') }}</span>
                  <span class="shrink-0">の移動を追加</span>
                </button>
                <span v-if="insTight(day, ei + 1) && !insNeedsMove(day, ei + 1)"
                      class="relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full"
                      :class="isDark ? 'bg-teal-900/40 text-teal-300' : 'bg-teal-50 text-teal-700 border border-teal-200'"
                      title="着いてすぐ次へ移ります（待ち時間なし）">
                  <i class="fa-solid fa-forward"></i>そのまま移動
                </span>
                <button v-if="insChain(day, ei + 1) && !insNeedsMove(day, ei + 1)" @click="openEdit(di, day.events[ei + 1])"
                        :title="'「' + shortName(day.events[ei].title) + '」は ' + insChain(day, ei + 1).from + ' で終わり、次は ' + insChain(day, ei + 1).to + ' から始まります。押すと次の予定を開きます'"
                        class="tap relative z-10 inline-flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 transition max-w-full min-w-0">
                  <i class="fa-solid fa-link-slash shrink-0"></i>
                  <span class="truncate">{{ insChain(day, ei + 1).from }} → {{ insChain(day, ei + 1).to }}</span>
                  <span class="shrink-0">が食い違い</span>
                </button>
                <span v-if="!insGap(day, ei + 1) && !insNeedsMove(day, ei + 1) && !insTight(day, ei + 1) && !insChain(day, ei + 1)" class="ins-dot relative z-10"><i class="fa-solid fa-plus"></i></span>
                <span class="ins-hint relative z-10 items-center gap-1">
                  <button @click="openAdd(di, '', ei + 1)" title="ここに予定を追加"
                          class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-plus mr-0.5"></i>予定
                  </button>
                  <!-- 抜けを知らせるボタンが出ているときは、同じ入口を2つ並べない -->
                  <button v-if="!insNeedsMove(day, ei + 1)" @click="openMoveWizard(di, ei)" title="ここに移動を追加"
                          class="tap px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-500 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-route mr-0.5"></i>移動
                  </button>
                  <button @click="openAddMenu(di, ei + 1)" title="ここに追加するものを選ぶ" aria-label="ここに追加するものを選ぶ"
                          class="tap px-2 py-1.5 rounded-lg text-[11px] font-bold text-slate-400 hover:text-indigo-500 hover:bg-white/70 transition">
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                </span>
              </template>
            </div>
            </template>
          </div>
        </div>

        <!-- PRINT-ONLY: 3カラム縦フロー タイムライン -->
        <div class="print-only">
        <div v-for="(pg, pgi) in printPages" :key="'pg'+pgi" class="ptl-page">

          <!-- ヘッダー（1枚目だけ） -->
          <div v-if="pgi === 0" class="ph-wrap">
            <div>
              <div class="ph-label">TRIP ITINERARY</div>
              <div class="ph-title">{{ state.title }}</div>
              <div class="ph-meta">
                <span v-if="state.startDate">{{ state.startDate }} 〜 {{ state.endDate }} ／ </span>{{ state.days.length }}日間 ／ {{ eventCount }}件の予定
              </div>
            </div>
            <div>
              <div class="ph-budget-label">合計実績 ／ 予算</div>
              <div class="ph-budget-val">{{ yen(totalActual) }} <span style="color:#cbd5e1;font-weight:400">/</span> {{ yen(state.totalBudget) }}</div>
              <div v-if="totalPaid > 0" class="ph-budget-label" style="margin-top:1px;color:#047857;font-weight:700">
                支払い済 {{ yen(totalPaid) }} ／ 当日 {{ yen(totalUnpaid) }}
              </div>
              <div v-if="members > 1" class="ph-budget-label" style="margin-top:1px">1人あたり {{ yen(perPerson) }}（{{ members }}人）</div>
            </div>
          </div>

          <!-- 段に詰めたタイムライン -->
          <div class="ptl-grid" :style="{'--pcols': pg.k}">
            <div v-for="(col, ci) in pg.cols" :key="'pc'+pgi+'_'+ci" class="ptl-col">
            <template v-for="(blk, bi) in col" :key="'pb'+pgi+'_'+ci+'_'+bi">

              <!-- 日の見出し -->
              <div v-if="blk.t === 'day'" class="ptl-blk" :data-blk="blk.key">
                <div class="ptl-day-hd">
                  <span class="ptl-day-when">Day {{ blkDay(blk).dayNumber }}<span v-if="shortDate(blkDay(blk).date)">&ensp;{{ shortDate(blkDay(blk).date) }}<span v-if="weekday(blkDay(blk).date)">（{{ weekday(blkDay(blk).date) }}）</span></span><span v-if="blk.cont" class="ptl-cont">つづき</span></span>
                  <span v-if="!blk.cont" class="ptl-day-cost">{{ yen(dayTotal(blkDay(blk))) }}</span>
                </div>
                <div v-if="!blk.cont" class="ptl-day-sub">
                  {{ blkDay(blk).events.length }}件<span v-if="dayStats(blkDay(blk)).activeMins"> ／ 行動 {{ fmtMin(dayStats(blkDay(blk)).activeMins) }}<span v-if="dayStats(blkDay(blk)).crossesMidnight">（翌日まで）</span></span><span v-if="dayStats(blkDay(blk)).sleepMins"> ／ 就寝 {{ fmtMin(dayStats(blkDay(blk)).sleepMins) }}</span><span v-if="dayStats(blkDay(blk)).moveMins"> ／ 移動 {{ fmtMin(dayStats(blkDay(blk)).moveMins) }}</span>
                </div>
              </div>

              <!-- 予定ひとつ -->
              <div v-else-if="blkEv(blk)" class="ptl-blk" :data-blk="blk.key">
              <template v-for="ev in [blkEv(blk)]" :key="'pe'+blk.key">
                <div class="ptl-ev" :class="{'ptl-ev-anchor': ev.anchor}"
                     :style="ev.anchor ? {'--ac': anchorCfg(ev.anchor).color} : {}">
                  <!-- カラーレール（最後以外） -->
                  <div v-if="!blk.last" class="ptl-ev-rail"></div>
                  <!-- ドット -->
                  <div class="ptl-ev-dot" :style="{background: ev.anchor ? anchorCfg(ev.anchor).color : cat(ev.type).color}"></div>

                  <!-- 時刻 -->
                  <div v-if="ev.anchor" class="ptl-ev-tlabel" :style="{color: ink(anchorCfg(ev.anchor).color, '#ffffff')}">{{ ANCHORS[ev.anchor].timeLabel }}</div>
                  <div class="ptl-ev-time">
                    {{ ev.startTime || '—' }}<span v-if="ev.endTime"> 〜 {{ nextMark(ev) }}{{ ev.endTime }}</span>
                  </div>

                  <!-- タイトル行 -->
                  <div class="ptl-ev-name">
                    <span v-if="ev.anchor" class="ptl-anchor-badge" :style="{background: anchorCfg(ev.anchor).color}">{{ anchorCfg(ev.anchor).label }}</span>
                    <span class="ptl-ev-badge" :style="{background: cat(ev.type).soft, color: ink(cat(ev.type).color, cat(ev.type).soft)}">{{ cat(ev.type).label }}</span>{{ ev.title }}
                  </div>

                  <!-- 場所 -->
                  <div v-if="ev.location && !redundantLocation(ev)" class="ptl-ev-loc">▸ {{ ev.location }}</div>

                  <!-- メモ -->
                  <div v-if="printOpts.notes && ev.notes" class="ptl-ev-note">{{ ev.notes }}</div>
                  <!-- URL -->
                  <div v-if="printOpts.url && safeUrl(ev.url)" class="ptl-ev-note">{{ safeUrl(ev.url) }}</div>

                  <!-- 移動手段固有情報（印刷） -->
                  <template v-if="['train','bus'].includes(ev.type)">
                    <!-- 乗換チェーン -->
                    <div v-if="printOpts.conn && routeStops(ev).length" class="ptl-conn">
                      <template v-for="(st, si) in routeStops(ev)" :key="si">
                        <div class="ptl-rt-stop" :class="isTransferStop(routeStops(ev), si) ? 'ptl-rt-stop-tr' : (isThroughStop(routeStops(ev), si) ? 'ptl-rt-stop-th' : '')"
                             :style="{'--sc': segColor(ev, si > 0 ? routeStops(ev)[si-1] : st)}">
                          <span class="ptl-rt-dot"></span><span class="ptl-rt-name">{{ st.name || '—' }}</span><span
                            v-if="si > 0 && (st.arrTime || st.arrPlatform)" class="ptl-rt-grp"><span
                              v-if="st.arrTime" class="ptl-rt-t">{{ st.arrTime }}着</span><span
                              v-if="st.arrPlatform && !st.through" class="ptl-rt-meta">［{{ st.arrPlatform }}］</span></span><span
                            v-if="isTransferStop(routeStops(ev), si) && transferMins(routeStops(ev), si) !== null" class="ptl-rt-tr"
                            :style="tightTransfer(routeStops(ev), si) ? {color:'#b91c1c'} : {}">{{ (quickStop(routeStops(ev), si) ? '⇄対面乗換 ' : '⇄乗換 ') + fmtMin(transferMins(routeStops(ev), si)) }}</span><span
                            v-else-if="isThroughStop(routeStops(ev), si)" class="ptl-rt-th">{{ '→直通' + (transferMins(routeStops(ev), si) ? '・停車' + fmtMin(transferMins(routeStops(ev), si)) : '') }}</span><span
                            v-if="hasDepInfo(routeStops(ev), si) && (st.depTime || st.depPlatform)" class="ptl-rt-grp"><span
                              v-if="st.depTime" class="ptl-rt-t">{{ st.depTime }}発</span><span
                              v-if="st.depPlatform && !st.through" class="ptl-rt-meta">［{{ st.depPlatform }}］</span></span>
                        </div>
                        <div v-if="showSeg(routeStops(ev), si)" class="ptl-rt-seg" :style="{'--sc': segColor(ev, st)}">
                          <template v-for="(ln, li) in segLines(routeStops(ev), si)" :key="'psl'+si+li">
                            <span v-if="li" class="ptl-rt-thru">直通</span>
                            <span class="ptl-rt-line"
                                  :style="{background: lineColor(ln) || segColor(ev, st), color: onColor(lineColor(ln) || segColor(ev, st))}">{{ ln }}</span>
                          </template>
                          <span v-for="(kd, ki) in segKinds(routeStops(ev), si)" :key="'psk'+si+ki" class="ptl-rt-kind">{{ kd }}</span>
                          <span v-if="segDest(routeStops(ev), si)" class="ptl-rt-dest">{{ segDest(routeStops(ev), si) }}</span>
                          <span v-if="segStations(routeStops(ev), si)" class="ptl-rt-meta">{{ segStations(routeStops(ev), si) }}</span>
                        </div>
                      </template>
                    </div>
                    <div v-else-if="printOpts.conn && ev.type !== 'plane' && (ev.platform || ev.direction || ev.stations)" class="ptl-ev-note">
                      <span v-if="ev.direction" class="ptl-rt-dest">{{ ev.direction }}</span>
                      <span v-if="ev.platform">{{ (ev.direction ? '  ' : '') + ev.platform }}</span>
                      <span v-if="ev.stations">{{ '  ' + ev.stations }}</span>
                    </div>
                  </template>
                  <div v-if="ev.type==='plane' && (ev.flightNo || ev.direction)" style="margin-top:1.5px">
                    <span v-if="ev.flightNo" class="ptl-code"><span class="ptl-code-lbl">便</span>{{ ev.flightNo }}</span>
                    <span v-if="ev.direction" class="ptl-rt-dest">{{ ev.direction }}</span>
                  </div>
                  <div v-if="ev.seat" style="margin-top:1.5px">
                    <span class="ptl-code"><span class="ptl-code-lbl">席</span>{{ ev.seat }}</span>
                  </div>

                  <!-- 費用 -->
                  <div v-if="ev.cost > 0" class="ptl-ev-cost">{{ yen(ev.cost) }}<span v-if="ev.paid" class="ptl-paid">支払い済</span></div>
                </div>

                <!-- 矢印（最後のイベント以外） -->
                <div v-if="!blk.last" class="ptl-arrow">↓<span v-if="blkSleep(blk)" class="ptl-sleep">就寝 {{ fmtMin(blkSleep(blk)) }}</span></div>
              </template>
              </div>

            </template>
            </div>
          </div>

          <!-- フッター（最後の紙だけ） -->
          <div v-if="pgi === printPages.length - 1" class="ptl-foot">
            <span>合計実績：{{ yen(totalActual) }}<span v-if="totalPaid > 0">（支払い済 {{ yen(totalPaid) }}／当日 {{ yen(totalUnpaid) }}）</span>　／　予算：{{ yen(state.totalBudget) }}<span v-if="members > 1">　／　1人あたり：{{ yen(perPerson) }}</span></span>
            <!-- ページ番号は1枚のときも幅だけ取っておく（測ったときと刷るときで行の高さを変えないため） -->
            <span class="ptl-foot-time">出力：{{ printTime }}<span :style="printPages.length > 1 ? null : { visibility: 'hidden' }">　（{{ pgi + 1 }}/{{ printPages.length }}）</span></span>
          </div>
        </div>
        </div>
      </section>
    </main>

    <!-- ============ 設定モーダル ============ -->
    <transition name="fade">
      <div v-if="showSettings" data-modal="settings" role="dialog" aria-modal="true" aria-label="旅程の設定" class="no-print fixed inset-0 z-50 grid place-items-center p-4"
           style="background:rgba(31,36,51,.45)" @click.self="showSettings=false">
        <div class="glass modal-inner rounded-3xl w-full max-w-md p-5 sm:p-6 max-h-[90dvh] overflow-y-auto scroll-thin" tabindex="-1"
             :style="isDark ? {background:'rgba(15,23,42,0.97)'} : {background:'#ffffff'}">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-9 h-9 rounded-xl grid place-items-center text-white shrink-0"
                 style="background:linear-gradient(135deg,#6366f1,#a855f7)">
              <i class="fa-solid fa-sliders"></i>
            </div>
            <h2 class="font-black text-ink text-lg">旅程の設定</h2>
            <button @click="showSettings=false" aria-label="閉じる" class="ml-auto w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="space-y-3">
            <label class="block">
              <span class="text-[11px] font-bold text-slate-500">タイトル</span>
              <input v-model="state.title" data-focus-first class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 outline-none" />
            </label>
            <div class="grid grid-cols-2 gap-2">
              <label class="block">
                <span class="text-[11px] font-bold text-slate-500">出発日</span>
                <input type="date" :value="state.startDate" :min="DATE_MIN" :max="DATE_MAX" @change="setStartDate($event.target.value)"
                       class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
              <label class="block">
                <span class="text-[11px] font-bold text-slate-500">帰着日</span>
                <input type="date" :value="state.endDate" :min="DATE_MIN" :max="DATE_MAX" @change="setEndDate($event.target.value)"
                       class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
            </div>
            <!-- 自宅（旅程をまたいで覚えておく） -->
            <div class="mt-3 rounded-xl border px-3 py-2.5" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <div class="text-[11px] font-black text-slate-500 mb-1.5 flex items-center gap-1.5">
                <i class="fa-solid fa-house text-indigo-400"></i>自宅（すべての旅程で使いまわします）
              </div>
              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="text-[10px] font-bold text-slate-500">呼び方・場所</span>
                  <input v-model="home.place" placeholder="例：自宅 / 徳島市の自宅"
                         class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
                </label>
                <label class="block">
                  <span class="text-[10px] font-bold text-slate-500">最寄り駅・バス停（任意）</span>
                  <input v-model="home.station" list="dl-station" placeholder="例：蔵本"
                         class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none" />
                </label>
              </div>
              <div class="text-[10px] text-slate-400 mt-1.5 leading-relaxed">
                「出発地点を追加」や「ルートを作る」の起点に、ここが入ります
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3">
              <label class="block">
                <span class="text-[11px] font-bold text-slate-500">総予算（円）</span>
                <input type="number" v-model.number="state.totalBudget" min="0" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
              <label class="block">
                <span class="text-[11px] font-bold text-slate-500">人数</span>
                <input type="number" v-model.number="state.members" min="1" max="99" placeholder="1"
                       class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 outline-none" />
              </label>
            </div>
            <p v-if="members > 1" class="text-[10px] text-slate-400 leading-relaxed">
              費用は人数ぶんの合計で入れてください（2人以上なら「1人あたり」も出ます）。
            </p>
          </div>

          <!-- 日付の一括操作 -->
          <div class="mt-5 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="text-[11px] font-black text-slate-500 mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-calendar-days text-slate-400"></i>日付の一括操作
            </div>
            <div class="grid grid-cols-1 gap-2">
              <button @click="applyDatesFromStart()"
                class="w-full py-2.5 rounded-xl text-xs font-bold text-slate-600 bg-white/70 hover:bg-white transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>出発日から{{ state.days.length }}日分の日付を採番
              </button>
              <button @click="fitDaysToRange()" title="期間より後ろの日程は削除されます"
                class="w-full py-2.5 rounded-xl text-xs font-bold text-amber-700 border border-amber-200 bg-amber-50 hover:bg-amber-100 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-left-right-to-line"></i>出発日〜帰着日に合わせて日数を調整
              </button>
            </div>
            <p class="text-[10px] text-slate-400 mt-1.5 leading-relaxed">
              どちらも各日の日付を出発日からの連番に振り直します。日数の調整では期間より後ろの日程が削除されます（元に戻すで復元できます）。
            </p>
          </div>

          <!-- オンライン照会 -->
          <div class="mt-4 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="text-[11px] font-black text-slate-500 mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-globe text-slate-400"></i>駅・地点の照会
            </div>
            <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 cursor-pointer">
              <input type="checkbox" v-model="netState.enabled" class="w-4 h-4 accent-indigo-500" />
              インターネットで駅名・路線・地点を確かめる
            </label>
            <div class="text-[10px] mt-1.5 leading-relaxed" :class="isDark ? 'text-slate-400' : 'text-slate-500'">
              <span v-if="!netState.enabled">切ってあります。これまでの入力だけで候補を出します</span>
              <span v-else-if="netState.online" class="text-emerald-600">
                <i class="fa-solid fa-circle-check mr-0.5"></i>つながっています（{{ netCount }}件を端末に保存済み）
              </span>
              <span v-else class="text-amber-600">
                <i class="fa-solid fa-plug-circle-xmark mr-0.5"></i>いまは応答がありません。保存済みのデータで動いています
              </span>
              <div class="mt-1" :class="isDark ? 'text-slate-400' : 'text-slate-500'">
                駅・路線は HeartRails Express、地点は OpenStreetMap を使います。旅程の中身は送信しません（調べたい駅名・地点名だけ）。<br>
                徳島県のバス停（位置・系統）は端末内に持っています（出典：国土数値情報「バス停留所データ」／国土交通省）。通信はしません
              </div>
            </div>
            <button @click="clearNetCache()" class="tap mt-2 text-[11px] font-bold px-2.5 py-1.5 rounded-lg border transition"
                    :class="isDark ? 'border-slate-600 text-slate-300 hover:bg-slate-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'">
              <i class="fa-solid fa-broom mr-1"></i>保存したデータを消す
            </button>

            <!-- 時刻表（ODPT） -->
            <div class="mt-3 pt-3 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
              <div class="text-[11px] font-black text-slate-500 mb-1.5 flex items-center gap-1.5">
                <i class="fa-solid fa-clock text-slate-400"></i>時刻表（公共交通オープンデータ）
              </div>
              <div class="text-[10px] leading-relaxed mb-2" :class="isDark ? 'text-slate-400' : 'text-slate-500'">
                トークン無しでも<b>都営地下鉄</b>の時刻表が使えます（CC BY・登録不要）。
                <a href="https://developer.odpt.org/" target="_blank" rel="noopener"
                   class="font-bold underline inline-block px-1 py-1 rounded"
                   :class="isDark ? 'text-indigo-300 hover:bg-indigo-500/10' : 'text-indigo-700 hover:bg-indigo-500/10'">developer.odpt.org</a>
                で無料のトークンを取ってここに貼ると、<b>東京メトロ・つくばエクスプレス・ゆりかもめ・りんかい線・多摩都市モノレール・横浜市営</b>の時刻表が加わります（基本ライセンス／取り直しは不要）。
                <span class="block mt-1">
                  <b>JR東日本と大手私鉄</b>（東急・京王・京急・小田急・東武・西武・相鉄）の時刻表は
                  「公共交通オープンデータ<b>チャレンジ限定</b>ライセンス」で、
                  <b>チャレンジ開催期間中・作品応募を前提</b>とした提供です。
                  ふだんの旅程づくりでは、これらの時刻は手で入れてください（駅・路線・駅数は自動で入ります）。
                </span>
              </div>
              <div class="flex items-center gap-2">
                <input v-model.trim="ttState.token" type="password" placeholder="アクセストークン（任意）" autocomplete="off"
                       class="flex-1 min-w-0 rounded-lg border border-slate-200 px-2 py-1.5 text-xs focus:border-indigo-400 outline-none" />
                <button @click="ttCheck()" class="tap text-[11px] font-bold px-2.5 py-1.5 rounded-lg border shrink-0 transition"
                        :class="isDark ? 'border-slate-600 text-slate-300 hover:bg-slate-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'">
                  <i class="fa-solid fa-plug mr-1"></i>つながるか試す
                </button>
              </div>
              <div v-if="ttState.lastCheck" class="text-[10px] font-bold mt-1.5"
                   :class="ttState.ok ? 'text-emerald-600' : 'text-amber-600'">
                <i class="fa-solid" :class="ttState.ok ? 'fa-circle-check' : 'fa-triangle-exclamation'"></i>
                {{ ttState.lastCheck }}
              </div>
            </div>
          </div>

          <!-- 印刷オプション -->
          <div class="mt-4 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'">
            <div class="text-[11px] font-black text-slate-500 mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-print text-slate-400"></i>印刷 / PDF の設定
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <label class="block">
                <span class="text-[10px] font-bold text-slate-500">段の数</span>
                <select v-model="printOpts.cols" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none">
                  <option value="auto">自動（日数に合わせる）</option>
                  <option value="1">1段</option>
                  <option value="2">2段</option>
                  <option value="3">3段</option>
                  <option value="4">4段</option>
                </select>
              </label>
              <label class="block">
                <span class="text-[10px] font-bold text-slate-500">用紙の向き</span>
                <select v-model="printOpts.orient" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm focus:border-indigo-400 outline-none">
                  <option value="landscape">A4 横</option>
                  <option value="portrait">A4 縦</option>
                </select>
              </label>
            </div>
            <div class="flex flex-wrap gap-x-4 gap-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 cursor-pointer">
                <input type="checkbox" v-model="printOpts.notes" class="w-4 h-4 accent-indigo-500" />メモを印刷
              </label>
              <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 cursor-pointer">
                <input type="checkbox" v-model="printOpts.conn" class="w-4 h-4 accent-indigo-500" />乗換の詳細を印刷
              </label>
              <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 cursor-pointer">
                <input type="checkbox" v-model="printOpts.url" class="w-4 h-4 accent-indigo-500" />URLを印刷
              </label>
            </div>
            <div class="text-[10px] text-slate-400 mt-2 leading-relaxed">
              「自動」は、紙がいちばん少なくなる段数を選びます（2枚以上になるときは1枚を3〜4段に）。
              文字の大きさは変えず、予定が紙の途中で切れることもありません
            </div>
            <!-- 刷る前に、何枚になるかの見当をつけられるように -->
            <div class="mt-2 flex items-center gap-2 flex-wrap">
              <button @click="planPrint()" class="tap text-[11px] font-bold px-2.5 py-1.5 rounded-lg border transition"
                      :class="isDark ? 'border-slate-600 text-slate-300 hover:bg-slate-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'">
                <i class="fa-solid fa-ruler-combined mr-1"></i>仕上がりを確かめる
              </button>
              <span v-if="printPlan.measured" class="text-[11px] font-bold" :class="isDark ? 'text-slate-300' : 'text-slate-500'">
                A4{{ printOpts.orient === 'portrait' ? '縦' : '横' }}
                <span class="text-indigo-500">{{ printPlan.pages }}枚</span>
                <span class="text-slate-400">／1枚 {{ printPlan.cols }}段</span>
                <span class="text-slate-400">（等倍）</span>
              </span>
            </div>
          </div>

          <!-- クラウドに保存（Cookie を消しても旅程が残るように） -->
          <div class="mt-5 pt-4 border-t" :class="isDark ? 'border-slate-700' : 'border-slate-200'" data-cloud>
            <div class="text-xs font-black text-ink flex items-center gap-1.5 mb-1">
              <i class="fa-solid fa-cloud text-indigo-400"></i>クラウドに保存（自分の Google ドライブ）
            </div>
            <p class="text-[11px] text-slate-500 leading-relaxed">
              直すたびに、自分の Google ドライブにも保存します。Cookie やサイトデータを消しても、合言葉を入れれば戻せます。ドライブには1日1つ、30日ぶんの過去の版も残ります。
            </p>
            <template v-if="cloudOn && !cloud.form">
              <div class="mt-2.5 rounded-xl px-3 py-2.5 text-xs font-bold flex items-center gap-2 flex-wrap"
                   :class="cloud.status === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200' : (cloud.status === 'offline' || cloud.status === 'ask' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200')">
                <i class="fa-solid" :class="cloud.busy ? 'fa-spinner fa-spin' : (cloud.status === 'error' ? 'fa-triangle-exclamation' : 'fa-cloud')"></i>
                <span class="flex-1 min-w-[12rem]">
                  <template v-if="cloud.busy">保存しています</template>
                  <template v-else-if="cloud.status === 'error'">保存できていません：{{ cloud.error }}</template>
                  <template v-else-if="cloud.status === 'offline'">圏外です。つながったら保存します</template>
                  <template v-else-if="cloud.status === 'ask'">この端末とクラウドの両方に旅程があります。どうするか選んでください</template>
                  <template v-else-if="cloud.status === 'pending'">まもなく保存します</template>
                  <template v-else>保存済み{{ cloud.lastAt ? '（' + new Date(cloud.lastAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '）' : '' }}</template>
                </span>
              </div>
              <div class="text-[11px] text-slate-500 mt-1.5">確認コード <b class="text-ink tracking-widest">{{ cloud.code }}</b>（ほかの端末と同じなら、同じ置き場です）</div>
              <div class="grid grid-cols-2 gap-2 mt-2">
                <button @click="cloudSync({ manual: true })" :disabled="cloud.busy" class="py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2 disabled:opacity-50">
                  <i class="fa-solid fa-rotate"></i>今すぐ保存</button>
                <button @click="showSettings = false; shareCloudConf()" class="py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-white/70 hover:bg-white border border-slate-200 transition flex items-center justify-center gap-2">
                  <i class="fa-solid fa-mobile-screen-button"></i>スマホにも設定</button>
              </div>
              <div class="flex gap-3 mt-1.5">
                <button @click="openCloudForm()" class="tap text-[11px] font-bold text-slate-500 hover:underline px-1 py-1">URL・合言葉を変える</button>
                <button @click="disconnectCloud()" class="tap text-[11px] font-bold text-slate-500 hover:underline px-1 py-1">クラウド保存をやめる</button>
              </div>
            </template>
            <template v-else>
              <template v-if="cloud.form || !cloudOn">
                <label class="block mt-2.5">
                  <span class="text-[11px] font-bold text-slate-500">GAS のウェブアプリの URL（…/exec）</span>
                  <input v-model="cloud.formUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"
                         class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-mono" data-cloud-url>
                </label>
                <label class="block mt-2">
                  <span class="text-[11px] font-bold text-slate-500">合言葉（8文字以上。忘れないようにメモしてください）</span>
                  <div class="mt-1 flex gap-1.5">
                    <input v-model="cloud.formPhrase" :type="cloud.formShow ? 'text' : 'password'" autocomplete="off" autocapitalize="off" spellcheck="false"
                           class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-200 text-sm" data-cloud-phrase @keydown.enter="connectCloud()">
                    <button @click="cloud.formShow = !cloud.formShow" class="tap px-3 rounded-xl border border-slate-200 text-slate-500 text-xs font-bold" :aria-label="cloud.formShow ? '合言葉を隠す' : '合言葉を見る'">
                      <i class="fa-solid" :class="cloud.formShow ? 'fa-eye-slash' : 'fa-eye'"></i></button>
                  </div>
                </label>
                <button @click="connectCloud()" :disabled="cloud.testing" class="mt-2.5 w-full py-2.5 rounded-xl text-white text-sm font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2 disabled:opacity-60"
